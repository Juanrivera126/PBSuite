encia de un algoritmo   105  3.3.2 Velocidad de convergencia   106  3.4 Método de la bisección   110  3.5 Método del punto fijo   116  3.6 Método de Newton   125  3.6.1 Convergencia   128  3.6.2 Test de parada   130  3.6.3 Método de Newton combinado con bisección   132  3.7 Método de la secante   140  3.7.1 Convergencia   142  3.7.2 Método de la secante combinado con bisección   143  3.8 Raíces de un polinomio   160  3.9 Autoevaluación   168  3.10 Ejercicios   169  4. Aproximación de funciones por polinomios   181  4.1 Introducción   181  4.2 Interpolación de Lagrange   182  4.2.1 Error en la interpolación   189  4.2.2 Nodos de Chebyshev   193 \nv  4.2.3 Diferencias divididas de Newton   198  4.3 Interpolación de Hermite   200  4.3.1 Error de interpolación   204  4.4 Mínimos cuadrados   207  4.4.1 Formulación algebraica del problema   210  4.4.2 Resolución del problema mediante la factorización QR   214  4.5 Autoevaluación   219  4.6 Ejercicios   220  5. Integración numérica   229  5.1 Introducción   229  5.2 Fórmulas de cuadratura interpolatorias   233  5.2.1 Grado de exactitud   238  5.3 Fórmulas de cuadratura de Newton-Cotes   240  5.3.2 Error en la fórmula de cuadratura de Newton-Cotes   249  5.4 Fórmulas compuestas   257  5.4.1 Regla del trapecio compuesta   257  5.4.2 Regla de Simpson compuesta   262  5.5 Métodos adaptativos   274  5.5.1 Cuadratura adaptativa trapecios   274  5.5.2 Cuadratura adaptativa Simpson   283  5.5.3 Método adaptativo general   291  5.6 Cálculo de Integrales impropias   297  5.6.1 Integrales impropias de primera especie   297  5.6.2 Integrales impropias de segunda especie   301  5.7 Autoevaluación   303  5.8 Ejercicios   304 \nvi  6. Integración numérica de ecuaciones diferenciales   313  6.1 Introducción   313  6.2 Formulación del problema de valor inicial   316  6.3 Existencia y unicidad   319  6.4 Métodos de Runge-Kutta   320  6.4.1 Método de Euler   322  6.4.2 Método de Heun   334  6.4.3 Método general de Runge Kutta   340  6.4.3.1 Algunos métodos de Runge-Kutta   349  6.4.4 Error de los métodos de Runge-Kutta   360  6.5 Métodos de Runge Kutta encajados   361  6.6 Problemas de contorno. Método de tiro   380  6.7 Autoevaluación   389  6.8 Ejercicios   390  Bibliografía   397 \n\n\nPrefacio  Los  métodos  numéricos  son  una  herramienta  esencial  para  quienes  ejercen la ingeniería, ya que permiten resolver problemas complejos  que a menudo no tienen una solución analítica simple. Estas técnicas  posibilitan  abordar  situaciones  reales  mediante  aproximaciones,  convirtiéndose en un recurso indispensable en la práctica profesional.  Este libro está diseñado para quienes deseen adquirir una comprensión  de los métodos numéricos para el cálculo de raíces de funciones no  lineales,  la  aproximación  de  funciones  mediante  polinomios,  la  integración  numérica  y  la  resolución  de  ecuaciones  diferenciales  ordinarias.  Este libro ofrece:  Explicaciones detalladas que conectan la teoría con la práctica,  facilitando  la  comprensión  de  cómo  y  por  qué  funcionan  los  algoritmos.  230 ejemplos y ejercicios resueltos  paso a paso, que muestran  cómo aplicar las técnicas numéricas en situaciones concretas.  38 herramientas interactivas  , gráficas y visuales que refuerzan  las  explicaciones  y  ayudan  a  entender  mejor  los  conceptos  abstractos.  Una    introducción    progresiva    a    herramientas    como  Matlab/Octave, para que los lectores puedan implementar las  soluciones y verificar sus propios resultados. Se incluye además  una  herramienta para poder ejecutar código Octave online , sin  necesidad de instalar ningún programa que se complementa con  un  asistente guiado por Inteligencia Artificial  para consultar  sobre comandos y programación en Octave o Matlab. El acceso  a esta herramienta se realiza desde el segundo icono que se  muestra en el lateral derecho de cada página.  9 \nLa orientación de este libro no solo pretende facilitar el aprendizaje,  sino también despertar el interés por profundizar en el estudio de los  métodos numéricos. La idea es acompañar al lector a través de una  exposición clara y ordenada, donde cada contenido ayude a construir  una base sólida que conecte los conceptos teóricos con su aplicación  práctica.  Este  libro  toma  como  punto  de  partida  los  apuntes  del  profesor  Eduardo Casas Rentería de la Universidad de Cantabria    . Su enfoque  teórico ha servido de guía para estructurar los contenidos que aquí se  presentan. El objetivo de este material es ofrecer una visión práctica,  combinando  explicaciones  teóricas  con  ejemplos  y  ejercicios  que  ayuden a entender y dominar los conceptos básicos. Para apoyar los  cálculos  y  facilitar  el  desarrollo  de  los  ejemplos,  se  utiliza  la  programación en Matlab/Octave.  La estructura del libro se organiza en seis temas, que van desde los  conceptos básicos hasta aplicaciones más avanzadas. El primer tema  introduce los métodos numéricos y el uso de Matlab/Octave, sentando  las bases para el aprendizaje y la implementación computacional. El  segundo  aborda  la  aritmética  computacional  básica,  destacando  los  principios  fundamentales  para  trabajar  en  un  entorno  digital.  En  el  tercer  tema  se  estudia  la  resolución  aproximada  de  ecuaciones  no  lineales,  explorando  distintos  métodos  para  encontrar  raíces  de  funciones. El cuarto tema se centra en la aproximación de funciones  mediante polinomios, una herramienta esencial en el análisis numérico.  El quinto capítulo trata la integración numérica, presentando técnicas  para calcular integrales de forma aproximada. Finalmente, se introduce  la  resolución  de  ecuaciones  diferenciales  ordinarias,  ofreciendo  métodos numéricos para su aproximación.  [6]  10 \nSoy  consciente  de  que  este  libro  puede  contener  algunas  erratas  o  inconsistencias por lo que se anima a los lectores a compartir cualquier  observación o corrección que consideren necesaria. Sus aportaciones  serán de gran ayuda para mejorar futuras ediciones y asegurar que este  recurso sea cada vez más útil.  Finalmente, quiero agradecer a la Red Educativa Digital Descartes y, de  manera  especial,  a  Juan  Guillermo  Rivera  Berrío  por  compartir  generosamente su conocimiento. Su experiencia y su compromiso con  la educación han sido fundamentales para enriquecer este trabajo.  11 \n\n\n\n1.1 Los métodos numéricos  El análisis numérico es una rama de las matemáticas que se ocupa de  estudiar métodos y algoritmos para encontrar soluciones aproximadas  a  problemas  que  no  pueden  resolverse  de  manera  exacta  mediante  técnicas analíticas tradicionales. Algunos de estos problemas incluyen  la resolución de ecuaciones algebraicas y diferenciales, el cálculo de  integrales o el tratamiento de sistemas de ecuaciones, tanto lineales  como no lineales.  Al  estudiar  métodos  numéricos,  es  importante  considerar  los  siguientes aspectos:  Desarrollo de métodos.  El diseño y análisis de algoritmos que  sean capaces de proporcionar soluciones aproximadas que sean  lo suficientemente precisas para aplicarse a problemas reales.  Estimación  y  control  del  error.   Dado  que  las  soluciones  numéricas  son  aproximadas,  resulta  fundamental  estudiar  y  medir los errores que se generan. Estos pueden deberse tanto a  las limitaciones del propio método como a factores prácticos,  como los errores de redondeo y truncamiento que aparecen al  trabajar con la representación numérica en los computadores.  Convergencia  de  los  métodos.    Para  cada  algoritmo,  se  debe  analizar cómo se aproxima a la solución exacta a medida que  aumenta el número de iteraciones o cálculos.  Capítulo Capítulo  Introducción a los Métodos Introducción a los Métodos  Numéricos y Matlab Numéricos y Matlab  15 \nEstabilidad  y  rendimiento.    Un  algoritmo  numérico  debe  ser  estable, lo que significa que pequeñas variaciones en los datos  de  entrada  no  deberían  producir  grandes  diferencias  en  los  resultados. Además, los métodos deben ser eficientes, es decir,  ofrecer  buenos  tiempos  de  cálculo  y  utilizar  los  recursos  computacionales  de  manera  adecuada,  algo  especialmente  importante cuando se enfrentan a problemas de gran tamaño o  alta complejidad.  1.2 Ejemplo de introducción  Para  ilustrar  la  aplicación  de  los  métodos  numéricos  en  problemas  reales, se considera el caso de un sistema de baterías conectado a un  panel solar que genera electricidad a lo largo del día. Se quiere modelar  cómo la batería se carga con el tiempo, sabiendo que:  La potencia solar     varía a lo largo del día, dependiendo  de la luz solar.  La batería tiene una capacidad máxima de almacenamiento.  La  velocidad  de  carga  disminuye  a  medida  que  la  batería  se  acerca a su capacidad máxima (comportamiento típico de una  batería).  La ecuación que podría modelizar cómo se almacena la energía en la  batería podría ser la siguiente ecuación diferencial ordinaria (EDO):  donde:  :  Energía almacenada en la batería (kWh).  :  Potencia solar disponible en función del tiempo (kW).  P     ( t ) so l a r      = d t  d E   P     ( t ) − so l a r   k E ( t )  E ( t )  P     ( t ) so l a r  16 \n:  Coeficiente de ineficiencia de la batería.  :  Tiempo en horas.  Se recurre a técnicas numéricas para obtener una solución aproximada  considerando los siguientes  datos y parámetros :  Capacidad máxima de la batería: 100 kWh.  Coeficiente de ineficiencia (k): 0.05  Tiempo de simulación: 24 horas.  La potencia solar varía a lo largo del día considerando     el  momento en el que sale el sol y tomando como valor máximo 50  kW a partir del cual disminuye siguiendo la función senoidal:  La  gráfica  de  la  Figura  1.1  muestra  la  evolución  de  la  energía  almacenada en la batería en un día (24 horas) en función de la potencia  solar disponible, utilizando como método de resolución el método de  Euler que se analizará en detalle en segundo,  acabó  generando un error apreciable    .  La explosión del cohete Ariane  El  Programa  Ariane  comenzó  en  1973  como  una  iniciativa  europea  para  desarrollar  un  lanzador  propio  que  asegurara  su  acceso  independiente al espacio. El proyecto se llevó a cabo bajo la supervisión  de la Agencia Espacial Europea (ESA, por sus siglas en inglés). Hasta  mayo  de  2003,  el  contratista  principal  fue  el  Centro  Nacional  de  Estudios  Espaciales  (CNES)  de  Francia,  momento  en  el  que  esta  responsabilidad  pasó  al  consorcio  europeo  EADS  (European  Aeronautic Defence and Space Company).    .  [1]  [1]  [2]  22 \nLa gestión comercial del lanzador Ariane estuvo a cargo de la sociedad  Arianespace,  creada  en  1980,  y  en  su  desarrollo  y  construcción  participaron  alrededor  de  40  compañías  europeas.  Todos  los  lanzamientos se realizaban desde el centro espacial de Kourou, en la  Guayana Francesa, que disponía de varias plataformas de despegue y  contaba con varios cientos de trabajadores de forma permanente.  El 4 de junio de 1996, el cohete Ariane 5 Flight 501, de la Agencia  Espacial Europea (ESA), explotó apenas 40 segundos después de su  despegue,  a  una  altitud  de  3,7  km,  tras  desviarse  de  la  trayectoria  prevista.  Figura 1.3 . Cohete Ariane   El vuelo del Ariane 5 Flight 501 era su primer lanzamiento tras una  década  de  desarrollo,  que  había  supuesto  una  inversión  de  más  de  7000  millones  de  euros.  Tanto  el  cohete  como  su  carga  estaban  valorados en más de 500 millones de euros. La explosión fue provocada  por  un  fallo  en  el  sistema  de  guiado  de  la  trayectoria,  ocurrido  37  segundos después del despegue. La causa del error se localizó en el  software encargado de controlar el sistema de referencia inercial (SRI).  [2]  23 \nEn concreto, el fallo se produjo por una excepción al intentar convertir  un número en punto flotante de 64 bits —relacionado con la velocidad  horizontal del cohete respecto a la plataforma de lanzamiento— en un  entero  con  signo  de  16  bits.  El  problema  fue  que  el  valor  que  se  intentaba almacenar superaba el máximo que puede representarse en  16 bits con signo, que es 32.767.  Para más información, se puede consultar    .  El hundimiento de la plataforma petrolífera Sleipner A  El  23  de  agosto  de  1991,  la  plataforma  petrolífera  Sleipner  A,  propiedad de la empresa noruega Statoil, se hundió en el mar del Norte  a 82 metros de profundidad. El accidente se debió a un error en el  modelado numérico de la estructura mediante elementos finitos, que  provocó una fuga de agua en uno de los 24 tanques de aire de 12  metros de diámetro, esenciales para la flotabilidad. La plataforma, que  soportaba  57.000  toneladas  de  peso,  más  200  personas  y  40.000  toneladas  de  equipamiento,  no  pudo  ser  salvada  debido  a  la  incapacidad  de  las  bombas  de  achique  para  evacuar  el  agua.  El  hundimiento supuso un coste estimado de 700 millones de euros    .  Para  modelar  los  tanques  de  la  plataforma  se  utilizó  el  programa  NASTRAN, basado en el método de elementos finitos, aplicando una  aproximación mediante un modelo elástico lineal. Sin embargo, esta  aproximación resultó inadecuada y subestimó en un 47 % los esfuerzos  que debían soportar las paredes de los tanques. Como consecuencia,  algunas paredes fueron diseñadas con un grosor insuficiente.  Un análisis posterior al accidente, realizado mediante el método de  elementos finitos de forma más precisa, demostró que el diseño de la  plataforma  provocaría  fugas  en  algunos  de  los  tanques  cuando  estuviera sobre una lámina de agua de 62 metros de profundidad. La  fuga  real  se  produjo  cuando  la  plataforma  se  encontraba  sobre  65  metros de agua, lo que confirmó la causa del fallo.  [12]  [3]  24 \nFigura 1.4 . Plataforma petrolífera   1.4 Introducción a Matlab/Octave  Para desarrollar y resolver los ejercicios y ejemplos propuestos en este  libro, se utilizará como herramienta principal de cálculo el programa  Matlab.  Su  interfaz  intuitiva  y  su  amplia  biblioteca  de  funciones  lo  convierten  en  una  herramienta  ideal  para  ilustrar  conceptos  matemáticos, realizar simulaciones y aplicar métodos computacionales  en un entorno práctico.  Matlab es un acrónimo de \"Matrix Laboratory\", lo que refleja su origen  como  una  herramienta  diseñada  para  trabajar  principalmente  con  matrices. Con el tiempo, el programa ha evolucionado para convertirse  en  un  entorno  de  programación  de  alto  nivel  que  permite  realizar  cálculos  numéricos,  análisis  de  datos,  simulaciones,  desarrollo  de  algoritmos y visualizar información.  Aunque Matlab es un software de pago, también se puede utilizar el software libre  y gratuito Octave, que es compatible en muchos de sus comandos. Para facilitar la  ejecución del código propuesto en los ejemplos y ejercicios, se pueden utilizar los  siguientes enlaces sin necesidad de realizar ninguna instalación:  octave online  myCompiler  [3]  25 \nA  continuación,  se  resumen  las  principales  características  de  Matlab/Octave necesarias para seguir y comprender los ejemplos de  los  próximos  capítulos.  Para  una  explicación  más  detallada,  se  recomienda  consultar  la  documentación  oficial  o  la  bibliografía  recomendada    .  Entorno de trabajo  La  ventana de Matlab  muestra un escritorio dividido en varias partes:  Las órdenes se escriben en la ventana de comandos,  Command  Window .  La  ventana    Workspace   proporciona  información  sobre  las  variables utilizadas y permite explorar datos que cree o importe  de archivos.  Current  Folder es  la  carpeta  actual  donde  se  ejecutan  los  archivos.  Figura 1.5 . Ventana Matlab  [8]  26 \nDirectorio de trabajo  Cuando  se  guarda  el  código  en  un  archivo  y  se  quiere  utilizar  más  adelante, es necesario indicar al programa su ubicación. Matlab tiene  preconfigurada la ruta donde almacena sus funciones nativas y las de  los paquetes incluidos. Sin embargo, si se trabaja con archivos propios,  se  debe  asegurar  que  el  programa  pueda  acceder  a  ellos  correctamente.  Matlab busca funciones y scripts en los directorios especificados por el  comando  path . El primero de ellos es siempre el especificado en el  diálogo  Current Directory .  En la figura aparece marcado en rojo el directorio actual. Tecleando el  comando    path   en  la  ventana  de  comandos  puede  ver  el  listado  de  directorios activos.  Figura 1.6 . Directorio de trabajo  27 \nAyuda de Matlab  Desde la ventana de comandos, se puede utilizar  help.  para obtener  ayuda sobre la sintásis de un determinado comando.  help nombreDelComando  Ejemplo:  >>help plot  Además,  desde  el  menú  help,  se  puede  acceder  a  la  ayuda  de  MathWorks en el caso de Matlab.  Creación de variables  En Matlab/Octave, es sencillo crear variables, basta asignar un valor al  nombre de la variable. Las variables se almacenan en la memoria y  pueden contener números, matrices, cadenas de texto, entre otros. El  contenido de una variable se puede recuperar y modificar a lo largo de  una sesión de trabajo.  Se detallan a continuación algunas reglas a tener en cuenta a la hora de  definir los  nombres de las variables :  El  nombre  de  una  variable  puede  tener  letras,  números  y  el  guion de subrayar.  El  primer  carácter  tiene  que  ser  una  letra,    modulo2   es  un  nombre válido, pero no lo es  2modulo .  Las  mayúsculas  y  las  minúsculas  tienen  valor  distinto.  La  variable  Modulo  es distinta de la variable  modulo .  En  el  nombre  de  una  variable  no  puede  haber  espacios  en  blanco,  modulo1  es un nombre de variable válido, pero no lo es  modulo 1 .  28 \nExisten nombres que deben evitarse porque tienen significado  propio en Matlab:  ans, pi, Inf, i, j, ...  . Para obtener  una lista de palabras reservadas teclea en la venta de comando r último la suma y la resta (con igual  prioridad  entre  ellas).  Para  alterar  este  orden  se  deben  introducir  adecuadamente paréntesis. Por ejemplo,  x =   2 + 3 ^ 4 / 2 ;   % x toma el valor 2+81/2  B  = 2 + 3 ^ ( 4 / 2 ) ;   % B toma el valor 11=2+3^2  A  continuación  se  presentan  ejemplos  para  practicar  operaciones  aritméticas y comprender la jerarquía de operadores.  Ejemplo 1.3 . Utiliza Matlab/Octave como calculadora para obtener el  valor de  Solución  Ejemplo 1.4 . Calcula el valor de  Solución  Ejemplo 1.5 . Un proyecto cuesta     euros y genera un  beneficio anual neto de     euros durante     años.  Calcula el retorno de inversión (   ) con una tasa de descuento de   . Las fórmulas del beneficio total y retorno de la inversión son:  Solución     1 + 3 2      + 4   2 (   2  π   )   3 + 2 2      + 3  3      91  27           − 4  2   4  3      91  27          2  1   5  3      91  27  C       = inst   10 000  B       = anual   2 000   N   =   5  RO I   r   =  4%  B       = total           RO I   =  t = 1  ∑  N  ( 1 + r ) t  B      anual       ⋅ C      inst  B       − C      total   inst   100  31 \nScripts o guiones  Un    script   es  un  archivo  que  contiene  un  conjunto  de  comandos  de  Matlab/Octave que se ejecutan en orden. El nombre del archivo, por  ejemplo  nombre.m  , debe tener una secuencia de caracteres válidos sin  espacios y extensión  .m .  También se puede crear un guión desde el editor de Matlab/Octave  eligiendo el menú  New Script.  Figura 1.7 . Menú New Script  Funciones anónimas  Algunas funciones sencillas pueden definirse con una única instrucción  en  la  ventana  de  comandos  mediante  lo  que  se  llaman  funciones  anónimas.  Basta  establecer  su  nombre,  los  argumentos  de  los  que  dependen separados por comas y los comandos que permiten definirla.  nombre_Funcion=@(argumentos) expresion_Funcion  Por ejemplo, para definir la función que calcula el área de un rectángulo  a partir de su base y altura, habrá neradas a partir de condiciones.  A  =   [ 1   2   3 ;   4   5   6 ;   7   8   9 ] ;  elementos_mayores_a_5  =   A ( A > 5 ) ;  % Resultado: elementos_mayores_a_5 = [6 7 8 9]  Operaciones con vectores y matrices  Matlab/Octave  está  diseñado  para  trabajar  de  manera  óptima  con  matrices,  permitiendo  realizar  operaciones  como  la  trasposición,  productos matriciales y otras manipulaciones comunes.  Operaciones matriciales básicas.  A  =   [ 1   2 ;   3   4 ] ; B  =   [ 5   6 ;   7   8 ] ;  C  =  A + B ;   % Suma de las matrices A y B  D  =  A * B ;   % Producto de las matrices A y B  X  =  A \\ B ;   % X es la matriz que cumple A*X=B  X  =  A / B ;   % X es la matriz que cumple X*A=B  X  =  A ^ 2 ;   % X es A*A  37 \nMultiplicación, división, exponenciación elemento a elemento.  A  =   [ 1   2   3 ;   3   4   5 ] ; B  =   [ 6   7   8 ;   9   10   11 ] ;  C  =  A .* B ;   % Multiplicación elemento a elemento  D  =  A ./ B ;   % División elemento a elemento  D  =  A .^ 3 ;   % Potencia elemento a elemento  Traspuesta de una matriz.  A  =   [ 1   2   3 ;   3   4   5 ] ;   % A es 2x3  A '    % Matriz traspuesta de A de orden 3x2  A continuación, se practicará la creación de vectores y matrices y el  acceso a sus elementos en varios ejemplos.  Ejemplo 1.8 . Dados los vectores fila     y el  número    , realiza las siguientes operaciones componente a  componente.  Solución  Ejemplo 1.9 . Define una matriz A de orden 4 cualquiera y obtén los dos  primeros elementos de la fila tercera.       Solución  Ejemplo 1.10 . Crea un vector que comience en 1 el valor máximo sea 22 y  con salto 5. Crea otro vector con el mismo número de elementos que el  anterior de forma que la suma de los dos vectores tenga todas sus  componentes iguales.      Solución  x   =   4 , 6 , 2   ,   y   = (   )   3 , − 2 , 4 (   )  k   =   3  y   − k   ;   k y   ;       ; 2 x   − k  x   y   x   + 2   y   ;       ;      2     3   x  3  y 4  1 + x  38 \nEjemplo 1.11 . Genera una matriz de números  Incluir un título de un gráfico:  title .  Generar  una  matriz  de  gráficos  en  una  misma  gráfica:  subplot(m,n,p)   divide  la  ventana  de  gráficos  en  una  cuadrícula de mxn gráficas y selecciona la subgráfica p.  43 \nEjemplo 1.14 . Muestra en distintas gráficas los datos de temperatura de  dos ciudades dadas en dos vectores.  % Datos de ejemplo de temperaturas a lo largo del día  horas  =   0 : 1 : 23 ;   % Horas de 0 a 23  temp_ciudad1  =   [ 15 ,   14 ,   13 ,   13 ,   12 ,   12 ,   13 ,   15 ,   18 ,   22 ,    25 ,   27 ,   29 ,   30 ,   28 ,   26 ,   24 ,   22 ,   20 ,   18 ,  17 ,   16 ,   15 ,   14 ] ;  temp_ciudad2  =   [ 10 ,   9 ,   9 ,   8 ,   8 ,   7 ,   8 ,   10 ,   13 ,   18 ,   20 ,    23 ,   25 ,   26 ,   24 ,   23 ,   21 ,   19 ,   17 ,   15 ,   13 ,  12 ,   11 ,   10 ] ;  % Gráfico de temperatura para la Ciudad 1  % Gráfico en azul  plot ( horas ,  temp_ciudad1 ,   'b' ,   'LineWidth' ,   1.5 ) ;  hold on ;   % Mantiene la gráfica para añadir la segunda  % Gráfico de temperatura para la Ciudad 2  % Gráfico en rojo con línea discontinua  plot ( horas ,  temp_ciudad2 ,   'r--' ,   'LineWidth' ,   1.5 ) ;  % Etiquetas y leyenda  xlabel ( 'Hora del día' ) ;  ylabel ( 'Temperatura (°C)' ) ;  title ( 'Temperatura promedio durante el día en dos    ciudades' ) ;  legend ( 'Ciudad 1' ,   'Ciudad 2' ) ;  % Mostrar la cuadrícula para facilitar la lectura  grid on ;  % Desactivar hold para futuras gráficas  hold off ;  Ejemplo 1.15 . Una compañía eléctrica tiene la siguiente tarifa. Los  primeros 100Kwh se pagarán a 2€ el Kwh, para los siguientes 200 Kwh  costará 3 € y 6 de allí en adelante. Expresa el valor de la factura como una  función de la cantidad de Kwh consumida al mes y representa la función.  Solución  44 \nFundamentos sobre programación en Matlab/Octave  Matlab y Octave van más allá de simples calculadoras, incorporan un  lenguaje propio de programación con el que se puede crear scripts y  funciones, automatizar procesos, manejar bucles y condicionales entre  otras  posibilidades.  A  continuación,  se  presentan  los  fundamentos  básicos del lenguaje de programación.  Funciones  Las  funciones  en Matlab/Octave permiten encapsular un conjunto de  operaciones dentro de un bloque de código que puede ser reutilizado.  Se definen en un archivo separado, también con la extensión  .m . y con  el mismo nombre que la función. En el siguiente ejemplo se muestra la  función    cuadrado   que  calcula,  a  partir  de  un  valor  de  entrada,  su  cuadrado.  function  resultado  =   cuadrado ( x )  resultado  =  x ^ 2 ;  end  El  fichero  que  tiene  esta  función  deberá  llamarse    cuadrado.m .  La  función se invoca de la misma forma que las funciones predefinidas  propias de Matlab/Octave desde la ventana de comandos o desde otro  script.  a = cuadrado ( 2 ) + 1  % Resultado: a=5;.  Para que Matlab pueda utilizar un script o función que hayas creado, el  archivo debe guardarse en el directorio de trabajo. Este es el lugar  donde  Matlab  busca  por  defecto  los  archivos  cuando  ejecutas  comandos. Puedes ver o cambiar el directorio de trabajo en la barra  superior del entorno de Matlab, o usar el comando  cd  desde la ventana  de comandos.   45 \nCondicionales  Matlab/Octave admite la estructura de control condicional  if-else ,  que se usa para ejecutar bloques de código en función de si se cumple o  no una condición booleana.  En el ejemplo siguiente, si el valor de x es positivo se escribe el texto \"x  es positivo\", en caso contrario, cuando es menor que cero, se escribe  por pantalla \"x es negativo\" y, en otro caso, se escribe \"x es cero\".  if  x  >   0  disp ( 'x es positivo' ) ;  elseif  x  < 0  disp ( 'x es negativo' ) ;  else  disp ( 'x es cero' ) ;  end  Bucles  Matlab/Octave ofrecen dos tipos de estructuras de control para iterar:  el bucle  for  y el bucle  while , ambos permiten ejecutar un bloque de  código repetidamente bajo distintas condiciones.  46 \nLa instrucción  break  fuerza la salida del bucle, de modo que cualquier  código restante dentro de esa iteración y las siguientes no se ejecutará.  Por su parte,  continue  interrumpe únicamente la iteración actual.  Ciclo  for . Repite un conjunto de instrucciones cuando varía el  índice en un conjunto de valores.  Con el siguiente código se imprime por pantalla el valor de i cuando va  tomando los valores 1, 2, 3, ... ,10.  for   i   =   1 : 10  disp ( i ) ;  end  Se muestra cómo sumar los cuadrados de los primeros 20 números  naturales.  suma  =   0 ;   % Inicialización de la suma  for   i = 1 : 20  % Agrega el siguiente número a la suma  suma  =  suma  +   i ^ 2 ;  end  Este cálculo se puede hacer también sin utilizar bucles operando con  vectores.  vec = 1 : 20 ;  sum ( vec .^ 2 )  47 \nBucle  while . Repite un conjunto de instrucciones mientras una  condición es verdadera.  Como ejemplo, se verá cómo sumar los primeros números naturales  hasta que la suma sea mayor o igual a 300.  suma  =   0 ;   % Inicialización de la suma  n  =   1 ;   % Número  while  suma  <   300.  % Agrega el siguiente número a la suma  suma  =  suma  +  n ;  % Incrementa el contador  n  =  n  +   1 ;  end  Se muestra ahora cómo se calcula la suma de los números pares desde  2 hasta 10 utilizando un ciclo  while .  n  =   2 ;   % Número inicial  suma  =   0 ;   % Variable para almacenar la suma  % Bucle while  while  n  <=   10  %Sumar el valor de n a la variable suma  suma  =  suma  + n ;  n  =  n  +   2 ;   % Incrementar n en 2  end  suma  % Mostrar el resultado: 30  48 \nEste cálculo se puede hacer también incluyendo los números en un  vector y, a continuación, aplicar la función  sum , que devuelve la suma de  sus elementos.  sum ( 2 : 2 : 10 )  Manejo de archivos y datos  Se  incluyen  algunos  comandos  para  la  lectura  y  manejo  de  datos  almacenados en ficheros.  Abrir y leer dados de un archivo de texto:  fopen ,  fscanf .  % Lee todos los números de archivo.txt  fileID  =   fopen ( 'datos.txt' ,   Errores históricos relevantes.  Casos  como el fallo de los misiles Patriot en  1991, donde un error en la  representación del tiempo provocó un  cálculo incorrecto, y la explosión del  cohete Ariane 5 en 1996, causada por  un fallo en la conversión de datos  numéricos, son ejemplos clave que  muestran cómo errores  aparentemente pequeños pueden  llevar a consecuencias catastróficas en  sistemas críticos.  Para facilitar la resolución de problemas  numéricos y la visualización de resultados, se  ha introducido la herramienta computacional  Matlab/Octave. Los contenidos que se han  repasado son los siguientes:  2.    Entorno de trabajo, directorio de  trabajo y ayuda de matlab.  El  programa incluye una interfaz intuitiva  para gestionar variables, explorar el  directorio de trabajo y acceder a ayuda  interactiva para funciones y comandos  56 \n3.    Creación  de  variables  y  operadores  numéricos.    Las  variables  se  crean  automáticamente al asignarles un valor, y se pueden manipular mediante  operadores aritméticos, de comparación y lógicos.  4.    Scripts y guiones.  Son conjuntos de comandos almacenados en archivos .m  que    permiten    automatizar    cálculos    y    organizar    programas  estructuradamente.  5.    Vectores y matrices.  El programa  está diseñado para trabajar con  vectores y matrices como  estructuras de datos principales,  permitiendo cálculos algebraicos y  vectoriales de forma óptima.  6.    Funciones nativas.  Incluye un  conjunto extenso de funciones  nativas para realizar cálculos,  facilitando las tareas numéricas  comunes.  7.    Gráficas 2D.  Permite crear gráficas  2D para representar datos,  incluyendo opciones para  personalizar títulos, etiquetas y  leyenda  8.    Introducción a la programacón.  La  programación se basa en el uso de  scripts, funciones definidas por el  usuario y control de flujo  (condicionales y bucles).  57 \n\n\n\n2.1 Introducción  Este tema tiene como objetivo mostrar la importancia de la aritmética  tema  son:  1.    Introducción a los errores en cálculo  numérico.  Los errores en los sistemas  computacionales son inevitables  debido a la naturaleza finita con la que  se representan números reales y se  realizan operaciones matemáticas en  el ordenador. Esta limitación se debe al  uso de representaciones en punto  flotante, que introducen imprecisiones  al redondear o truncar los valores.  Entender estas limitaciones es  esencial para abordar problemas  numéricos con precisión.  94 \n2.    Clasificación  de  los  errores .  Los  errores  numéricos  se  clasifican  principalmente  en  dos  tipos:  errores  de  redondeo  y  errores  de  truncamiento. Los errores de redondeo ocurren al ajustar un número real a  la  precisión  limitada  del  ordenador,  mientras  que  los  errores  de  truncamiento surgen al aproximar funciones o procesos matemáticos, como  por ejemplo cuando se utilizan aproximaciones por series para representar  funciones. Además, los errores de los algoritmos aparecen también cuando  éstos no convergen convenientemente hacia la solución deseada.  3.    Minimización de errores . Reducir el  impacto de los errores numéricos  requiere el desarrollo de algoritmos  y estrategias específicas, como el  control de precisión, el análisis de  estabilidad de los métodos y la  elección de representaciones  numéricas adecuadas. Estas  herramientas permiten minimizar la  propagación de errores a lo largo de  los cálculos y garantizar la validez de  los resultados, especialmente en  aplicaciones como la ingeniería, la  física y las finanzas.  95 \n96 \n\n\n3.1 Introducción  El  propósito  de  los  métodos  numéricos  para  resolver  ecuaciones  no  lineales  es  encontrar  raíces  aproximadas,  ya  que  la  mayoría  de  las  ecuaciones    no    tienen    soluciones    exactas    o    estas    no    son  computacionalmente    viables.    Mediante    métodos    iterativos    se    va  consiguiendo  aproximar  la  solución  dentro  de  un  margen  de  error  considerado    .  Entre las aplicaciones más importantes de los métodos numéricos está  la  resolución  de  ecuaciones  no  lineales,  una  tarea  esencial  en  disciplinas como física, ingeniería, economía y muchas otras áreas de la  ciencia. Estas ecuaciones, donde la variable aparece de forma no lineal  son  clave  para  modelar  fenómenos  reales,  desde  el  diseño  de  estructuras hasta la dinámica de sistemas físicos. Sin embargo, muchas  veces  estas  ecuaciones  no  tienen  soluciones  exactas  en  términos  algebraicos, por lo que se buscan soluciones aproximadas.  Se considera por ejemplo la siguiente ecuación obtenida a partir de la  segunda ley de Newton para calcular la velocidad de un paracaidista,  donde la velocidad     depende de la variable independiente tiempo,    ,   es la constante de gravitación,     el coeficiente de resistencia y     es la  masa del paracaidista.  Capítulo Capítulo  Resolución aproximada de Resolución aproximada de  ecuaciones no lineales ecuaciones no lineales  [7]  v   =       1 − e c  g   ⋅ m   (   −       t m  c  )  v   t   g  c   m  99 \nMasa (kg):     70  Constante de Resistencia (Ns/m):     25  Tiempo máximo (s):     60  Figura 3.1 . Simulador de la velocidad de un paracaidista  Si se quisiera obtener el coeficiente de resistencia del paracaidista con  una  masa  dada,  ¿cómo  se  obtendría  este  valor  para  alcanzar  una  velocidad  determinada  en  un  periodo  establecido?  La  respuesta  se  obtendría calculando     que hace cero a la siguiente función  esto es, habría que calcular el valor de     tal que    .  Cuando  ocurre  como  en  este  caso,  y  no  es  posible  encontrar  analíticamente el cero de la función o pudiendo encontrarlo su cálculo  es complicado, se utilizan algoritmos que determinan, en un número  finito de pasos, un valor aproximado de la raíz buscada. Estos métodos  de  aproximación  generalmente  son  iterativos  y  conducen  a  una  solución  a  través  de  una  sucesión      que  converge ritánico, considerado uno de los  padres de la computación moderna. Desarrolló el concepto de la máquina de  Turing,  base  teórica  de  los  algoritmos,  y  desempeñó  un  papel  crucial  en  la  Segunda Guerra Mundial al descifrar los códigos nazis de la máquina Enigma. Su  trabajo sentó las bases de la inteligencia artificial y la informática teórica..  John  von  Neumann  (1903-1957)  fue  un  matemático,  físico  y  pionero  de  la  computación húngaro-estadounidense. Contribuyó al desarrollo de la teoría de  juegos, la mecánica cuántica y los métodos numéricos en computación científica.  Fue clave en la creación de las primeras computadoras y en la formulación de la  arquitectura de Von Neumann, base de los sistemas computacionales modernos.  1  2  3  4 \nEn  el  siguiente  video  se  da  una  visión  rápida  de  los  métodos  más  importantes que se tratan en este capítulo.  Video 3.1 . Métodos de resolución de ecuaciones no lineales  Se comenzará con el método de bisección, una técnica basada en el  teorema  de  Bolzano,  que  garantiza  la  existencia  de  raíces  en  un  intervalo  y  ofrece  una  convergencia  segura  aunque  lenta.  Luego  se  estudiará el método del punto fijo, que transforma la ecuación en una  forma iterativa y permite analizar la convergencia local y global de la  solución. Posteriormente, se explorará el método de Newton-Raphson,  que emplea la derivada de la función para obtener una convergencia  rápida, aunque con ciertas limitaciones respecto a su punto de inicio.  Finalmente, se analizará el método de la secante, que evita el cálculo de  derivadas.  A  la  vez  que  se  van  mostrando  los  distintos  métodos,  se  irán  presentado ejemplos prácticos para ilustrar el comportamiento de cada  uno  de  ellos,  comparando  sus  ventajas  y  limitaciones  en  diferentes  situaciones. Para más información, se puede consultar     y    .  0:00  [10]   [6]  102 \n3.2 Raíz o cero de una función  A cualquier solución de la ecuación     se n métodos iterativos para encontrar soluciones de ecuaciones de  la forma    , destacando técnicas como el método de bisección, el método de  Newton-Raphson y el método de la secante.  También  se  analiza  la  convergencia  de  estos  métodos,  la  rapidez  con  la  que  se  aproximan a la solución y las condiciones necesarias para su aplicación.  f ( x )   =   0  Además, se discuten estrategias para la  localización y separación de raíces, haciendo  hincapié en la importancia de una elección  adecuada del intervalo inicial y de las  aproximaciones iniciales para garantizar la  precisión en la obtención de soluciones  numéricas.  Los aspectos clave en el estudio de los  métodos numéricos de este tema son:  1.    Introducción . Se plantea la necesidad  de resolver ecuaciones no lineales de  la forma     que, en muchos  casos, no admiten soluciones analíticas  exactas, lo que motiva el uso de  métodos numéricos para obtener  soluciones aproximadas.  2.    Generalidades . Se definen conceptos  fundamentales como raíces o ceros de  una función, multiplicidad de una raíz y  las fases del proceso de resolución:  localización, separación y  aproximación de raíces.  f ( x )   =   0  176 \n3.    Método  del  punto  fijo .  El  método  de  punto  fijo  es  un  procedimiento  iterativo que, partiendo de una aproximación inicial, aplica repetidamente  una función     para encontrar un valor     que satisfaga    .  4.    Método de la bisección . Se presenta este método como una técnica que,  partiendo  de  un  intervalo  donde  la  función  cambia  de  signo,  divide  repetidamente  el  intervalo  en  mitades  para  aproximar  la  raíz  con  una  precisión deseada.  g   x   g ( x )   =   x  5.    Método de Newton-Raphson  Se  introduce este método iterativo que  utiliza la derivada de la función para  aproximar la raíz, ofreciendo una  convergencia rápida bajo  condiciones adecuadas, pero que  requiere una buena estimación  inicial y que la derivada no sea nula  en las proximidades de la raíz.  6.    Método de la secante . Se describe  este método que no requiere el  cálculo explícito de la derivada, sino  que aproxima la pendiente mediante  la cuerda que une dos puntos. Este  método es útil cuando la derivada de  la función cuyos ceros se quieren  obtener es difícil de calcular.  7.    Convergencia de los métodos . Se  analizan las condiciones bajo las  cuales los métodos iterativos  convergen a una solución, la  velocidad de convergencia y cómo la  elección de las aproximaciones  iniciales influye en el proceso.  177 \n\n\n\n4.1 Introducción  El  ajuste  por  polinomios,  en  el  contexto  de  los  métodos  numéricos,  consiste en determinar un polinomio de grado adecuado que reproduzca  con  el  menor  error  posible  un  conjunto  de  datos,  ya  sea  obtenido  mediante  muestreo,  experimentación  o  proveniente  de  una  función  analítica. Al expresar la información mediante una fórmula polinómica,  se  facilitan  operaciones  como  el  cálculo  de  valores  intermedios,  la  interpolación y la predicción de comportamientos futuros.  Se supone por ejemplo que se tiene una tabla que relaciona la viscosidad  dinámica del agua con la temperatura  T ºC   0   5   10   20  1.787   1.519   1.307   1.002  ¿Cómo estimar la viscosidad a una temperatura de 7.5º? Una opción es  encontrar un polinomio que pase por los puntos de la tabla y estimar  después el valor de 7.5 con él.  En este capítulo se presentarán dos técnicas para aproximar una función  mediante un polinomio: la interpolación, que ajusta el polinomio pasando  exactamente por los datos, y la aproximación por mínimos cuadrados,  que busca minimizar el error global cuando no es posible (o deseable)  que el polinomio pase por todos los puntos. Para más información, se  puede consultar     y    .  Capítulo Capítulo  Aproximación de funciones Aproximación de funciones  por polinomios por polinomios  μ      o  [9]   [6]   181 \nFigura 4.1 . Comparación interpolación vs. regresión  4.2 I ación.   Se  analizan  los  errores  asociados  a  la  interpolación  polinómica,  incluyendo  el  fenómeno  de  Runge,  que  ilustra  cómo, aumentar el número de nodos, no siempre mejora la aproximación  pudiendo empeorarla en algunos casos.  5.    Nodos de Chebyshev. Se discute la  elección óptima de nodos para la  interpolación, destacando que los  nodos de Chebyshev minimizan el  error de interpolación.  6.    Aplicaciones prácticas.  Se  proporcionan ejemplos y ejercicios  propuestos que ilustran la aplicación  de las técnicas de interpolación y  aproximación por mínimos  cuadrados.  225 \n\n\n\n5.1 Introducción  Los métodos numéricos de integración sirven para aproximar el valor  de  una  integral  definida  de  una  función  en  un  intervalo  con  una  precisión  dada  cuando  no  es  posible  resolverla  de  forma  exacta  o  analítica.  El  interés  de  estas  técnicas  puede  venir  motivado  por  distintas razones.  1.    La posibilidad de aplicar  la Regla de Barrow se restringe a una  pequeña  parte  de  funciones   que  tienen  primitivas  que  se  puedan  escribir  a  partir  de  operaciones  algebraicas  de  funciones  elementales.  Muchas  funciones,  aún  siendo  continuas, no tienen primitivas elementales como, por ejemplo,  , utilizada en la distribución normal o    , en procesos de  decaimiento y teoría de colas.  2.    Aunque existiera un procedimiento para encontrar la primitiva,  obtenerla puede resultar en muchos casos muy complicado . Se  puede  pensar  por  ejemplo  en  las  funciones  racionales  o  en  aquellas que requieren de cambios de variable más o menos  ingeniosos.  3.    Por otro lado,  en muchas aplicaciones sólo se tiene una tabla de  valores de la función  o la posibilidad de obtener su valor en un  número finito de puntos. En estos casos, el cálculo aproximado  permite  estimar  magnitudes  que  se  expresan  mediante  integrales definidas.  Capítulo Capítulo  Integración numérica Integración numérica  e − x 2     x  e − x s  numéricos  y  se  evalúa  su  precisión.  Además,  se  estudian  métodos  específicos  para  tratar  integrales  impropias  y  se  analizan los errores asociados a estas aproximaciones.  Los principales aspectos tratados en este tema  son los siguientes.  1.    Fórmulas de cuadratura  interpolatorias  Se muestran las fórmulas de  cuadratura que aproximan la integral  de una función en un intervalo  mediante la interpolación polinómica  en un número de nodos.  2.    Fórmulas de Newton-Cotes  En particular, se analizan las fórmulas  de Newton-Cotes donde los puntos se  consideran equidistantes y se incluyen  los extremos del intervalo. Se incluyen  ejemplos donde se muestra su utilidad  y se analizan los errores asociados.  308 \n3.    Fórmulas compuestas  Se extienden las fórmulas de Newton-Cotes a subintervalos más pequeños,  mejorando la precisión para integrales de funciones complejas. Además, se  introducen métodos adaptativos que ajustan dinámicamente los intervalos  según la función.  4.    Cálculo de integrales impropias  Se  presentan  métodos  para  evaluar  integrales  impropias  diferenciando  entre las de primera y segunda especie. En el primer caso el intervalo de  integración  no  es  acotado  y  en  el  segundo  la  función  presenta  una  singularidad dentro del intervalo de integración.  5.    Ejercicios y autoevaluaciones  El capítulo incluye ejemplos  prácticos y ejercicios para aplicar y  comprender los conceptos, así como  autoevaluaciones para reforzar el  aprendizaje.  309 \n\n\n\n6.1 Introducción  En  Ingeniería,  el  comportamiento  de  un  sistema  suele  describirse  mediante ecuaciones que relacionan la tasa de cambio de una magnitud  con la propia magnitud y otras variables asociadas. De hecho, muchas  leyes físicas se establecen en términos de razones de cambio, como  ocurre  en  fenómenos  relacionados  con  la  caída  de  un  cuerpo  o  la  variación  de  la  temperatura,  entre  otros.  Estas  relaciones  se  representan    comúnmente    mediante    ecuaciones    diferenciales  ordinarias (EDOs), unas ecuaciones que vinculan una función de una  única  variable  independiente  con  sus  derivadas,  describiendo  formalmente cómo cambia dicha función respecto de esa variable.  Dado que las EDOs suelen ser complejas y a menudo no tienen solución  explícita o resulta difícil de obtener, se necesita recurrir a métodos  numéricos para aproximarlas.  En  este  capítulo  se  estudiará  la  resolución  numérica  de  dos  problemas asociados a las ecuaciones diferenciales ordinarias:  1.    el problema de Cauchy o problema de valor inicial.  2.    el problema de contorno.  En un problema de valor inicial las condiciones se establecen sobre  el instante inicial y en un problema de contorno, las condiciones se  imponen tanto en el extremo inicial como en el final de un intervalo.  Para más información, se puede consultar     y    .  Capítulo Capítulo  Integración numérica de Integración numérica de  ecuaciones diferenciales ecuaciones diferenciales  [9]   [6]  313 \nComo ejemplo de ecuación diferencial, se muestra en el interactivo 6.1  un ejemplo de aplicación para el análisis de un sistema masa-resorte.  Este sistema está compuesto por una masa     unida a un resorte que  ejerce  una  fuerza  proporcional  al  desplazamiento,  según  la  ley  de  Hooke.  Si  además  se  considera  una  fuerza  de  amortiguamiento  proporcional a la velocidad, se obtiene la siguiente ecuación diferencial  de segundo orden:  donde:   es el desplazamiento de la masa en función del tiempo,   es la masa,   es el coeficiente de amortiguamiento,   es la constante del resorte.  Interactivo 6.1 . Sistema muelle-resorte. Escena tomada de  Red Digital Descartes  Autora:  Elena E. Álvarez.  m  m       + d t 2  d   x 2  c       + d t  d x   k x   =   0  x ( t )  m  c  k  314 \nEn  el  siguiente  ejemplo,  las  ecuaciones  diferenciales  modelizan  al  vaciado de un tanque. Asumiendo que el flujo de salida obedece la ley  de Torrice   conocida  como  el  \"teorema  de  Kutta-Joukowski\".  Fue  profesor  en  la  Universidad Técnica de Stuttgart.  9  10 \nSu idea principal es aproximar la solución mediante una combinación  ponderada  de  evaluaciones  de  la  función  derivada  en  puntos  intermedios  dentro  de  un  intervalo.  Estas  evaluaciones  permiten  calcular  el  siguiente  valor  de  la  solución  con  más  exactitud,  sin  necesidad de derivadas superiores.  6.4.1 Método de Euler  El método de Euler 11  es el procedimiento más sencillo para aproximar  la solución de un problema de valor inicial. Se analiza cómo obtener a  partir de     el valor    . Dado que,  se puede usar la fórmula de cuadratura con un nodo para obtener un  valor aproximado de la integral de la forma siguiente  La idea básica por tanto consiste en avanzar desde un valor conocido  paso  a  paso,  utilizando  la  pendiente  de  la  función  para  estimar  el  siguiente valor.  En la siguiente figura se muestra gráficamente cómo obtener para un  paso constante     el punto     a partir de     y     a  partir de     conocidas las derivadas en estos dos puntos.  y ( t     )   ≈ n   y      n   y      n + 1  y ( t     )   = n + 1   y ( t     ) + n       f   t , y   t   d t  t      n  ∫  t      n + 1  (   (   ) )  y ( t     )   ≈ n + 1   y       = n + 1   y       + n   h     f   t     , y      n   (   n   n )  h   =   1   ( t     , y     ) 1   1   ( t     , y     ) 0   0   ( t     , y     ) 2   2  ( t     , y     ) 1   1  322  Leonhard Euler (1707–1783), nacido en Basilea, Suiza, es considerado uno de los  matemáticos  más  influyentes  de  la  historia.  Sus  aportaciones  en  cálculo  infinitesimal, análisis matemático, teoría de números y mecánica sentaron las  bases para el desarrollo de múltiples disciplinas científicas.  11 \nFigura 6.2 . Primeros pasos del método de Euler.  Video 6.1 . Método de Euler  Ejemplo 6.4 . Considera el problema de valor inicial siguiente  Encuentra la solución aproximada por el método de ados en evaluaciones de la  pendiente  intermedia,  destacando  el  método  de  cuarto  orden  como  estándar debido a su equilibrio entre precisión y esfuerzo computacional.  6.    Error en los métodos de Runge-  Kutta  Se detalla cómo se evalúan y  minimizan los errores locales y  globales en los métodos Runge-  Kutta, incluyendo estrategias para  ajustar el tamaño del paso.  7.    Métodos de Runge-Kutta  encajados  Introducción a los métodos  adaptativos que ajustan  dinámicamente el tamaño del paso  en función de una estimación del  error, optimizando la eficiencia y  precisión del cálculo.  8.    Problemas de contorno y método  de tiro  Este apartado aborda problemas de  contorno, en los cuales las  condiciones iniciales y finales están  especificadas. Se introduce el  método de tiro como técnica para  aproximar soluciones.  395 \n\nBibliografía  [1]   Arnold,  D.  N.  (2000).  The  Patriot  Missile  Failure.  Institute  for  Mathematics    and    its    Applications.    Recuperado    de  http://www.ima.umn.edu/~arnold/disasters/patriot.html  [2]   Arnold, D. N. (2000). The Explosion of the Ariane 5 Rocket. Institute  for    Mathematics    and    its    Applications.    Recuperado    de  http://www.ima.umn.edu/~arnold/disasters/ariane.html  [3]   Arnold,  D.  N.  (2000).  The  sinking  of  the  Sleipner  A  offshore  platform.  Institute  for  Mathematics  and  its  Applications.  Recuperado    de  http://www.ima.umn.edu/~arnold/disasters/sleipner.html  [4]   Aubanell, A., Benseny, A., & Delshams, A. (1993). Útiles básicos de  cálculo numérico. Barcelona: Editorial Labor, S.A.  [5]   Burden, R. L., & Faires, J. D. (2015). Numerical analysis (10ª ed.).  Cengage Learning.  [6]   Casas  Rentería,  Eduardo  (2024).  Métodos  Matemáticos  para  la  Ingeniería.    Cálculo    Numérico.    Recuperado    de:  https://personales.unican.es/casase/MMI/pdfs/Apuntes.pdf  [7]   Faires,  J.  D.,  &  Burden,  R.  L.  (2012).  Numerical  methods,  4th.  Cengage Learning.  [8]     function extractTextFromBackendResponse(raw) {
        if (raw == null) return '';
        const s = String(raw).trim();
        if (!s) return '';
        try {
            const j = JSON.parse(s);
            if (Array.isArray(j)) return JSON.stringify(j);
            if (j && typeof j === 'object') {
                const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
                if (typeof c === 'string') return c.trim();
                if (typeof j.content === 'string') return j.content.trim();
                if (typeof j.text === 'string') return j.text.trim();
            }
            if (typeof j === 'string') return j;
        } catch (e) {}
        return s;
    }
    async function postBackendText(payload) {
        const body = { model: payload.model || 'openai-fast', prompt: payload.prompt };
        if (payload.system) body.system = payload.system;
        if (payload.json) body.json = true;
        const res = await fetch(BACKEND_BASE + '/api/ia/text', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const raw = await res.text();
        if (!res.ok) throw new Error('Error de API: ' + res.status + ' ' + res.statusText + '. ' + raw.substring(0, 200));
        return extractTextFromBackendResponse(raw);
    }

        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }
    function escapeHtml(s) {
        if (s === undefined || s === null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getSessionHTML() {
        const clone = chatDisplay.cloneNode(true);
        const exportStyles =
            'body{font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;line-height:1.65;padding:28px;color:#333;max-width:880px;margin:0 auto;background:#fafafa;}' +
            'h1{color:#007bff;font-size:1.45em;margin-bottom:6px;}' +
            '.meta{color:#444;margin:6px 0;font-size:.95em;}' +
            'hr{border:none;border-top:1px solid #dee2e6;margin:22px 0;}' +
            '.chat-export{padding:4px 0;}' +
            '.chat-export .user-message,.chat-export .bot-message,.chat-export .system-message{margin-bottom:18px;}' +
            '.chat-export .system-message{text-align:center;color:#555;font-style:italic;padding:10px 14px;background:#fff3cd;border-radius:10px;border:1px solid #ffeaa7;}' +
            '.chat-export .system-message.error{background:#f8d7da;color:#721c24;border-color:#f5c6cb;}' +
            '.chat-export .message{display:flex;align-items:flex-end;gap:12px;}' +
            '.chat-export .message.user-message{flex-direction:row-reverse;}' +
            '.chat-export .avatar-img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid #e0e0e0;}' +
            '.chat-export .message-bubble{padding:12px 16px;border-radius:18px;max-width:78%;box-shadow:0 1px 2px rgba(0,0,0,.06);}' +
            '.chat-export .user-bubble{background:#007bff;color:#fff;}' +
            '.chat-export .bot-bubble{background:#e9ecef;color:#212529;}' +
            '.chat-export .bot-bubble strong{color:#007bff;}' +
            '.chat-export .bot-bubble p{margin:0 0 10px;}.chat-export .bot-bubble p:last-child{margin:0;}' +
            '.chat-export pre{background:#2d2d2d;color:#f8f8f2;padding:12px;border-radius:8px;overflow-x:auto;font-size:.9em;}' +
            '.chat-export code{background:#eee;padding:2px 6px;border-radius:4px;font-size:.9em;}' +
            '.chat-export ul,.chat-export ol{margin:8px 0;padding-left:22px;}';
        return '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sesión de chat</title><style>' + exportStyles + '</style></head><body>' +
            '<h1>Sesión de chat</h1>' +
            '<p class="meta"><strong>Documento:</strong> ' + escapeHtml(PDF_NAME) + '</p>' +
            '<p class="meta"><strong>Tema del chatbot:</strong> ' + escapeHtml(CHATBOT_THEME) + '</p>' +
            '<p class="meta"><strong>Modelo:</strong> ' + escapeHtml(MODEL) + '</p>' +
            '<hr><div class="chat-export">' + clone.innerHTML + '</div></body></html>';
    }

    function downloadSessionHtml() {
        const blob = new Blob([getSessionHTML()], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Sesion_Chat_' + Date.now() + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
