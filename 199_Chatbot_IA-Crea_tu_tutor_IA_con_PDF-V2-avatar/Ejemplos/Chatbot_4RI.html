    <style>
        :root{--primary:#007bff;--secondary:#6c757d;--light:#f8f9fa;--dark:#343a40;--success:#28a745;--danger:#dc3545;--warning:orange;--radius:8px;--font:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;--bg:var(--light);--text:var(--dark);--card:#fff;--border:#ddd;--input:#fff;--iborder:#ccc;--bot-bg:#e9ecef;--bot-text:var(--dark);--user-bg:var(--primary);--user-text:#fff;--sys-bg:#fff3cd;--sys-text:#856404;}
        body.dark-mode{--bg:#212529;--text:#f8f9fa;--card:#343a40;--border:#495057;--input:#495057;--iborder:#6c757d;--bot-bg:#495057;--bot-text:#f8f9fa;--sys-bg:#332701;--sys-text:#ffeb8f;}
        body{font-family:var(--font);margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s;}

        header p{margin:5px 0 0;font-size:.9em;color:var(--secondary);}
        .toolbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;}

        button:hover{background:#0056b3;}
        button:disabled{background:var(--secondary)!important;opacity:.65;cursor:not-allowed;}
        #theme-btn{background:var(--secondary);}
        .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
        .btn-export{background:var(--primary);color:#fff;border:none;padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-size:.85em;transition:background .2s;}
        .btn-export:hover{background:#0056b3;}
        .pdf2-section{padding:10px;border:1px dashed var(--border);border-radius:var(--radius);}

        .chat-display .user-message,.chat-display .bot-message{background:transparent;color:inherit;padding:0;border-radius:0;max-width:100%;text-align:inherit;margin-left:0;}
        .message{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px;max-width:100%;}
        .message.user-message{flex-direction:row-reverse;justify-content:flex-start;}
        .avatar-img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #eee;background-color:#f0f0f0;}

        .message-bubble{padding:10px 15px;border-radius:18px;max-width:85%;word-wrap:break-word;line-height:1.5;display:flex;flex-direction:column;}
        .user-message .message-bubble.user-bubble{background:var(--user-bg);color:var(--user-text);border-bottom-right-radius:5px;margin-left:auto;}
        .bot-message .message-bubble.bot-bubble{background:var(--bot-bg);color:var(--bot-text);border-bottom-left-radius:5px;margin-right:auto;}

        .loader{border:3px solid #f3f3f3;border-top:3px solid var(--primary);border-radius:50%;width:16px;height:16px;animation:spin 1s linear infinite;display:none;}

        @media(max-width:600px){.input-area{flex-direction:column;}#send-button{width:100%;padding:12px;}}

storia de la RA   64  2.3.2 Herramientas de desarrollo   66  2.3.3 Pantallas de RA   68  2.3.4 Software para crear contenidos de RA   70 \niv  2.3.5 Aplicaciones para el uso de contenidos de RA   72  2.4 El Metaverso   76  2.4.1 El avatar   80  2.4.2 Los metaversos   83  2.4.3 Landian el metaverso hecho en Medellín   85  3. Seguridad en la Nube para el Big Data y el Blockchain   93  3.1 Computación en la Nube   94  3.1.1 Modelos de computación en la nube   97  3.1.2 Tipos de Nube   98  3.1.3 Ventajas y desventajas de la Nube   100  3.2 Big Data   102  3.2.1 Las 5V del Big Data   104  3.2.2 El Big Data en la Nube   106  3.3 Blockchain   112  3.3.1 Definiciones   114  3.3.2 Orígenes del blockchain   117  3.3.3 Tipos de tecnologías blockchain   119  3.4 Ciberseguridad   126  3.4.1 Introducción   126  3.4.2 ¿Qué es la ciberseguridad?   129  3.4.3 ¿Cuáles son las amenazas a la información?   132  3.4.4 ¿Cómo me protejo de las ciberamenazas?   137  4. Inteligencia artificial entre nanobots y cobots   143  4.1 Robótica   144  4.1.1 Introducción   144 \nv  4.1.2 La robótica   146  4.1.3 Historia de la robótica   148  4.1.4 Tipos de robots   150  4.2 Inteligencia artificial   158  4.2.1 Definiciones   161  4.2.2 Historia de la Inteligencia Artificial   165  4.2.3 La inteligencia artificial DALL   E 2 ⋅ 167  4.2.4 La inteligencia artificial LaMBDA de Google   168  4.3 Fabricación aditiva   172  4.3.1 Definiendo la fabricación aditiva   174  4.3.2 Historia de la Fabricación Aditiva   175  4.3.3 Etapas del Proceso de Fabricación Aditiva   176  4.3.4 Tecnologías de impresión 3D   177  4.3.5 Aplicaciones de las Fabricación Aditiva   180  4.4 Smart Factories   182  4.4.1 Introducción   184  4.4.2 La Industria 4.0 y los sistemas Ciberfísicos   186  4.4.3 La Industria 4.0 y el blockchain   187  4.4.4 Simulación y gemelos digitales en la Industria 4.0   191  Bibliografía   194  Créditos imágenes   203  Tabla de videos   206  Tabla de objetos interactivos   208 \nPrefacio  En los albores del siglo XXI, estamos viviendo  un acelerado desarrollo tecnológico, con una  rápida  evolución  de  los  sistemas  de  información  y  una  mayor  penetración  de  la  Internet.  Es  común  escuchar  o  leer  noticias  acerca de los avances en la inteligencia artificial  (IA),  el  internet  de  las  cosas  (IoT),  la  automatización    y    la    robótica.    Nos  sorprendemos  con  los  metaversos  como  el  Sandbox o el Landian hecho en Medellín, con  los  robots  domiciliarios  de  Amazon,  las  impresoras 3D y de muchas otras aplicaciones  tecnológicas que emergen en la llamada “cuarta  revolución industrial” – 4RI -, aplicaciones que  han  dado  respuesta,  en  parte,  a  eventos  no  deseados como la pandemia de 2020, el cambio  climático y los conflictos entre las potencias  occidentales y orientales.  Este nuevo mundo en el que vivimos, cada vez  más digital o, mejor, más tecnológico, nos obliga  a  comprenderlo,  para  no  quedar  aislados  y  perder grandes oportunidades que día a día se  están presentando; es por ello, que este libro lo  hemos  diseñado  para  que  conozcas  los  fundamentos de la 4RI y, en un futuro cercano,  profundices  o  te  especialices  en  algunas  de  estas nuevas tecnologías; por ejemplo, puedes  aspirar  a  ser  un  experto  en  robótica,  en  ciberseguridad o en internet de las cosas.  6 \n7 \n8 \nCapítulo I Capítulo I  Industria 4.0 Industria 4.0 \n1.1 Introducción  En los albores del siglo XXI estamos viviendo  un acelerado desarrollo tecnológico, con una  \"rápida  evolución  de  los  computadores  y  el  mayor alcance de la Internet, impulsados por el  progreso  de  la  inteligencia  artificial  (IA),  el  internet de las cosas (IoT) y la automatización\"    . Eventos no deseados como la pandemia de  2020, el cambio climático y los conflictos entre  las  potencias  occidentales  y  orientales,  han  obligado a nuevos cambios tecnológicos.  Las innovaciones emergentes contemporáneas,  originadas  por  el  cambio  tecnológico,  dan  origen  a  lo  que  se  ha  llamado  \"cuarta  revolución industrial\" - 4RI -.  Las revoluciones se han producido a lo largo de  la historia cuando nuevas tecnologías y formas  novedosas de percibir el mundo desencadenan  un cambio profundo en los sistemas económicos  y las estructuras sociales (      , p. 10).  Pero,  ¿cuáles  fueron  las  otras  revoluciones  industriales? La respuesta a esta pregunta, nos  permite  comprender  porqué  la  4RI  se  diferencia significativamente de las anteriores,  especialmente por los impactos generados en  la  sociedad.  En  la    figura  1.1   del  siguiente  apartado,    describimos    los    hitos    más  importantes en cada una de las revoluciones  industriales.  [1]  [2]  10 \n11 \n1.2 Las revoluciones industriales  Cada  revolución  industrial  se  caracteriza  por  los  cambios  o  consecuencias  sociales,  económicas,  culturales,  políticas  o  tecnológicas que traen consigo. Tratar de establecer una línea de  tiempo en cada una de ellas es complejo, pues son muchos los hechos  que contribuyen al cambio (algunos de ellos se muestran en la  figura  1.1 ) y, también, son muchas las innovaciones que, quizá, no podamos  delimitar temporalmente.  Figura 1.1 . Hitos destacados en la revoluciones industriales.  1.2.1 Primera revolución industrial  He aquí un primer ejemplo de una revolución que presenta falta de  consenso en su delimitación temporal, Schwab      la delimita entre  1760 y 1840, Srisukwang      entre 1784 - 1869,  Galbati  habla de una  primera fase entre 1750 y 1820. Más allá de las fechas, destacaremos  aquellos  cambios  tecnológicos  que  dan  origen  a  la  llamada  Revolución  industrial   o,  si  se  prefiere,  la  Primera  Revolución  Industrial.  [2]  [4]  12 \nMáquina de vapor . Este es el hito más representativo de la primera  revolución  industrial,  cuya  invención  erróneamente  algunos  atribuyen a James Watt. La primera máquina de vapor fue la  eolípila  inventada en el siglo I por Herón de Alejandría. A principios del siglo  XVIII,  Thomas  Newcomen  creó  una  máquina  de  vapor  con  propósitos, inicialmente, mineros. Durante varias décadas anteriores  a la máquina de Watt, el \"desarrollo tecnológico\" de Newcomen fue  usado, con ligeras mejoras, en distritos mineros de Gran Bretaña y en  industrias  de  fundición  de  hierro  como  la  pionera    Coalbrookdale  Company .  Figura 1.2 . Coalbrookdale de noche, pintura al óleo de James de Loutherbourg.  Coalbrookdale (Inglaterra) es considerado una de las cunas de la Revolución Industrial.  Obviamente, James Watt tiene una gran relevancia en esta historia,  pues introduce grandes mejoras a la máquina de vapor, prototipo que  patenta en 1769. El trabajo manual y artesanal es sustituido por las  máquinas  o  motores  a  vapor,  dando  surgimiento  a  la  fabricación  industrial.  13 \nLa industria textil . El sistema de fábricas industriales o  factory system  tiene  su  origen  en  la  industria  textil.  A  partir  del  invento  de  la  lanzadera  volante,  patentada  en  1733  por  John  Kay,  surgen  innovaciones  tecnológicas  como  la  máquina  de  hilar  mediante  rodillos de Lewis Paul que fue posteriormente mejorada por Richard  Arkwright con su Water frame (1769) y por Samuel Crompton con su  Spinning mule (1779), el cardador de lana de Paul y Bourn en 1748, la  hiladora Jenny inventada por James Hargreaves en 1764, la máquina  de hilar ( Water frame ) inventada por Richard Arkwright y patentada  en 1769 1  Vídeo Vídeo  Video 1.1 Video 1.1 . Máquinas textiles Mule spinning en Quarry Bank Mill (Cheshire, . Máquinas textiles Mule spinning en Quarry Bank Mill (Cheshire,  Reino Unido), utilizadas para hilar algodón y otras fibras (crédito:  Reino Unido), utilizadas para hilar algodón y otras fibras (crédito:  Wikimedia Wikimedia  Commons Commons ). ).  Véase una información más amplia en  Wikipedia 1  14 \nEl ferrocarril . La mayor producción generada por las emergentes  fábricas industriales, obligó a crear nuevos sistemas de transporte,  uno de ellos fue el ferrocarril, un gran hito de la  Primera Revolución  Industrial, que comienza en 1814 cuando George Stephenson usa la  máquina de vapor como medio de transporte.  Vídeo Interactivo Vídeo Interactivo  Video 1.2 Video 1.2 . HUMANIDAD, LA HISTORIA DE TODOS NOSOTROS – La era . HUMANIDAD, LA HISTORIA DE TODOS NOSOTROS – La era  industrial (video del canal  industrial (video del canal  History Latinoamérica History Latinoamérica   ). ).  La Revolución Industrial es un concepto y un desarrollo que ha cambiado  fundamentalmente nuestra sociedad y economía. El término “desarrollo”  puede  parecer  que  indica  cierta  tardanza  en  el  contexto  de  una  “revolución”,  lo  que  en  realidad  significa  es  un  cambio  rápido  y  fundamental. Surgieron industrias que reemplazaron a los pequeños  talleres  artesanales.  Las  fábricas  textiles  y  de  cerámica  fueron  las  15 \nprimeras en reconocer el nuevo amanecer, y una nueva infraestructura  de canales y vías férreas permitió una distribución eficiente      .  1.2.2 Segunda revolución industrial  En la  figura 1.1  destacamos la producción en masa y la electricidad  como los hitos más importantes de esta revolución.  La  segunda  revolución  industrial  se  desarrolló  con  la  llegada  de  la  electricidad y la producción en masa, teorizada por Smith y Taylor e  implementada  por  Henry  Ford  en  su  fábrica  de  Detroit  para  la  producción del Modelo T      .  Estos dos hechos importantes marcan el inicio de esta revolución  industrial en la década de 1870, pues el ingeniero alemán Nikolaus  Otto  patenta  el  primer  motor  de  combustión  interna  de  cuatro  tiempos en 1876 y en 1879 Edison inventa la bombilla eléctrica.  Interactivo 1.1 . Thomas Alva Edison (Crédito: Louis Bachrach, Bachrach Studios,  restaurado por Michel Vuijlsteke, Dominio público,  Wikimedia Commons ).  [5]  [6]  16 \nSin embargo, fueron muchas las innovaciones radicales que surgieron  en el periodo entre 1860 y principios del siglo XX; entre ellas: la  dinamita de Alfred Nobel 1867, el teléfono eléctrico de Graham Bell  y Grey, el automóvil movido por gasolina de Daimler y Benz en 1885,  el aparato cinematográfico de los hermanos Lumière en 1895, el  descubrimiento de los rayos X por el físico alemán Wilhelm Rontgen  en  1895,  Henri  Becquerel  descubre  la  radiactividad  en  1896,  Guglielmo Marconi crea las primeras estaciones de radio en 1896,  para transmitir y recibir el código Morse, el descubrimiento del radio  se da por el matrimonio Curie en 1897, en 1903 los hermanos Wright  construyeron y volaron el primer avión.  Algunos inventos parten de la creatividad de sus autores, como el  kinetoscopio  atribuido  a  Edison,  pero  son  los  hermanos  Lumière  quienes  crearon  un  cinematógrafo  similar  que,  para  algunos  historiadores,  fue  la  máquina  que  permitió  presentar  la  primera  película  de  la  historia,  a  finales  de  1895,  a  33  espectadores.  La  película  titulada  \" La  sortie  des  ouvriers  des  usines  Lumière  à  Lyon \"  muestra, en 26 segundos, la salida de obreros de una fábrica en Lyon,  Francia (      , p. 53).  El ingenio de los  Lumière fue crear una ilusión de movimiento con  imágenes secuenciales sobre una fuente de luz. Aquí la bombilla de  Edison  y,  obviamente,  la  electricidad,  fueron  fundamentales  para  generar un estándar para futuras proyecciones cinematográficas.  En  el  siguiente  objeto  interactivo,  diseñado  por  Juan  Guillermo  Rivera, se usaron, en la primera escena, 16 imágenes para emular el  kinetoscopio, en la segunda escena se usaron 12 imágenes y, en la  tercera, nueve fotogramas de la película  Mickey's Magical World  de  1988 y archivada en  https://archive.org/ .  [7]  17 \nInteractivo 1.2 . Objeto interactivo con escenas emulando un kinetoscopio.  Si bien, en la Primera Revolución Industrial, Inglaterra se convirtió en la  primera potencia económica, durante la Segunda Revolución Industrial  esta  situación  cambió  radicalmente  con  la  emergencia  de  nuevas  potencias: Alemania, que a partir de su unificación tuvo un destacado  desarrollo económico e industrial, así como los Estados Unidos y Japón.  Para  principios  del  siglo  xx,  Japón  había  logrado  consolidar  un  importante  crecimiento  industrial  y  despuntado  como  potencia  económica ( https://es.wikipedia.org/ ).  En el siguiente objeto interactivo, se muestran algunas diapositivas  con los principales inventos de esta era, al final hay un video con  información similar.  18 \nInteractivo 1.3 . Presentación de diapositivas sobre la segunda revolución industrial.  Hoy en día conocemos los vehículos Tesla de Elon Musk, pero ¿quién  era Tesla? Al igual que los Lumière, Nikola Tesla fue opacado, en sus  inicios, por el poder económico de Edison. Pero la historia le da sus  créditos, tal como lo hizo la Corte Suprema de los Estados Unidos en  1947, que lo reconoció como el inventor de la radio. A continuación,  hacemos un recuento de los aportes de este genio a la segunda  revolución industrial.  19 \n1888 - Diseño y construcción del primer motor de inducción  de corriente alterna.  Algunos inventos y descubrimientos    Transferencia inalámbrica de energía eléctrica    Bombilla sin filamento o lámpara fluorescente    Turbina sin paletas    Bobina de Tesla    Control remoto  Bujía para encendido de motores de explosión    Lámpara de arco eléctrica    Conmutador para generadores de electricidad  20 \n“Todas las personas en todas partes deberían tener fuentes  de energía gratuitas. La energía eléctrica está presente en  todas partes en cantidades ilimitadas y puede impulsar la  maquinaria del mundo sin necesidad de carbón, petróleo o  gas”.    Nikola Tesla  21 \n1.2.3 Tercera revolución industrial  En términos generales, cabe afirmar que en la segunda mitad del siglo xx  se ha producido una gran revolución tecnocientífica que ha afectado  ante todo a las prácticas científicas, transformándolas radicalmente. Las  tecnologías  de  la  información  y  la  comunicación  y  los  programas  semióticos que las implementan se convirtieron a finales de la ciencia en  el principal lenguaje de las tecnociencias. Asimismo, surgió una nueva  metodología: las simulaciones informáticas, que permitieron abordar  problemas  no  resolubles  mediante  el  análisis  matemático  y  la  estadística. La informática se ha introducido en todos los contextos de la  actividad científica (investigación, evaluación, aplicación y enseñanza),  así como en la administración, comunicación y gestión del conocimiento  y de la I+D. Por otra parte, las actividades tecnocientíficas están cada  vez  más  marcadas  por  el  imperativo  de  generar  innovaciones  que  puedan ser rentables económica, social o políticamente, sin olvidar las  aplicaciones militares, que muchas veces han estado a la vanguardia de  la investigación tecnocientífica (      , p. 73).  Como lo indicamos en la  figura 1.1 , los principales hitos de la 3RI  fueron  la  informática  y  la  automatización;  sin  embargo,  como  lo  expresan  Echeverría  y  Almendros,  no  es  sólo  una  revolución  industrial la que se genera a partir de la segunda mitad del siglo XX,  sino  toda  una  revolución  tecnocientífica  que  afectó  todos  los  sectores de la sociedad; entre ellas, la revolución agrícola con la  implementación  de  los  transgénicos,  \"la  digitalización  de  las  imágenes que ha supuesto una auténtica revolución tecnocientífica  en el mundo visual\" (      ,  p.  122),  la  ingeniería  genética  es  una  revolución  tecnológica  en  biología,  la  revolución  en  torno  a  la  investigación  aeroespacial;  la  revolución  económica  a  través  de  nuevos modelos de mercado, bancarios y financieros.  No  obstante,  estos  cambios  revolucionarios  han  tenido  como  motores de desarrollo la informática y ésta, a su vez, es consecuencia  del  desarrollo  de  la  microelectrónica,  la  cual  \"fue  posible  por  el  [8]  [8]  22 \ndescubrimiento de los semiconductores en la década de 1950, la  construcción de chips de silicio en los primeros años del sesenta y de  la memoria basada en circuitos de integración amplia en 1972\" (      ,  p. 12).  Figura 1.3 . Tarjeta de circuito impreso (crédito: C J Cowie, CC BY-SA 3.0,  Wikimedia  Commons ).  La informática .  Otra  gran  revolución  fue  la  digital,  que  se  logra  gracias  a  los  avances  tecnológicos  de  la  electrónica,  desde  los  transistores a los chips de silicio. Las tecnologías emergentes en el  campo de la informática, cambió por completo nuestra cultura, el  mundo  del  empleo,  las  relaciones  sociales  y  otros  efectos,  que  discutiremos en el apartado de impactos de la hoy llamada \"cuarta  revolución industrial\". Como ejercicio de lectura o, mejor, de historia,  te recomendamos leer el siguiente texto preparado por  Tawanna  Hakkinen Oliveira .  [9]  23 \nLectura 1.1 . Historia de los computadores.  Ver en  ventana ampliada  24 \nBiotecnología .  Además  de  la  informática  y  la  automatización,  la  revolución biotecnológica, con el uso de la ingeniería genética, ha  contribuido a cambiar los procesos de producción de alimentos a  través de los organismos genéticamente modificados (OGM) 2  y el  desarrollo farmacéutico, en especial en la producción de vacunas, tal  como se ocurrió para combatir la Covid-19.  En  el  caso  de  los  OGM  ha  existido  mucha  discusión,  en  especial  por  los  posibles  efectos    para    el    medio  ambiente y para la salud; por  ejemplo, la controversia de la  mariposa    monarca    ha  cuestionado el uso de plantas  modificadas genéticamente en  la    agricultura    comercial,  molestia generada por  dos informes publicados en los que se afirma  que el polen del maíz transgénico Bt causa un daño significativo a las  poblaciones de mariposas monarca 3 . Pese a las polémicas, el objetivo  principal  de  los  OGM  es  acabar  con  el  hambre  en  el  mundo,  intencionalidad que obviamente no tiene discusión.  Nuevos  sistemas  de  generación  energética .  La  3RI  o  tercera  revolución tecnológica desplaza a la 2RI, sustituyendo los sistemas  energéticos dependientes en el consumo de combustibles fósiles, por  un nuevo sistema en el que \"la tecnología de Internet y las energías  Los OGM pueden definirse como organismos en los cuales el material genético (ADN) ha  sido modificado de un modo artificial  Véase      (p. 101), sobre polémica generada en la comunidad científica por la publicación  de un artículo en la revista Nature del científico mexicano Ignacio Chapela y su estudiante  David Quist sobre los efectos del maíz transgénico en México y la combinación de genes  por medio del insecticida transgénico Bt en el maíz nativo  2  3   [10]  25 \nrenovables  comienzan  a  fusionarse  para  crear  una  nueva  infraestructura para una Tercera Revolución Industrial   que cambiará  la forma en que se distribuye la energía en el siglo XXI\" ( Rifkin ).  “Cada vez está más claro que la Segunda Revolución  Industrial está muriendo. Lo que necesitamos ahora es  una nueva y audaz narrativa económica que pueda  llevarnos a un futuro post-carbono sostenible”    Jeremy Rifkin  Figura 1.4 . Diagrama mostrando los 5 pilares de la Tercera Revolución Industrial. El  futuro escenario planteado por el llamado Negavatio utilizará un almacenamiento  intermedio de energía a través de metano inyectado en depósitos subterráneos, así  como a través de energía aportada a la propia red. Así mismo, será posible enriquecer  el gas inyectado como reserva con algo de hidrógeno puro (crédito: Marinero  Vakulinchuk, CC BY-SA 4.0,  Wikimedia Commons  ).  26 \nSon muchos los desarrollos tecnológicos ocurridos durante la 3RI, la  mayoría  de  ellos  gracias  a  los  avances  de  la  electrónica  y  la  informática,  que  hoy  en  día  denominamos  \"tecnologías  de  la  información y la comunicación\". Pero, como lo defiende el sociólogo  Jeremy  Rifkin,  la  apuesta  esencial  es  el  desarrollo  de  energías  renovables.  \"La tecnología de Internet y las energías renovables  comienzan a fusionarse para crear una nueva  infraestructura para una Tercera Revolución Industrial  (3RI)   que cambiará la forma en que se distribuye la  energía en el siglo XXI\"    Jeremy Rifkin  Esta frase de Jeremy Rifkin es un reflejo de su preocupación por los  efectos de las tres primeras revoluciones industriales en nuestro  planeta. En 2019, el periodista Maxime Biosse Duplan de  euronews  entrevistó a Rifkin, quien le preguntó sobre su propuesta de una  tercera revolución industial guiada por cinco pilares, a lo que Rifkin  contestó:  Pilar número uno: La UE se ha comprometido a que el 20% de la energía  que produce sea renovable en 2020. Esto es una directiva y por lo tanto  todos los países deben cumplirla.    Pilar número dos: ¿cómo recabamos lo que son esencialmente energías  dispersas que se encuentran por todas partes?    A través de nuestros edificios. ¡Tenemos más de 191 millones de edificios  en  la  UE!  Casas,  oficinas,  fábricas...  El  objetivo  es  transformar  cada  inmueble existente en la UE en nuestra propia mini-central de energía  renovable .  27 \nPilar número tres: tenemos que almacenar la energía porque hay días en  los que el sol no sale, a veces el viento sopla por la noche y ocurre que  necesitamos la energía de día... .  Pero, que sea Rifkin el que nos hable sobre estos pilares:  Vídeo YouTube Vídeo YouTube  Video 1.3 Video 1.3 . Entrevista de euronews interview a Jeremy Rifkin: \"Debemos . Entrevista de euronews interview a Jeremy Rifkin: \"Debemos  transformar cada casa en una central de energía renovable\". transformar cada casa en una central de energía renovable\".  A continuación, te ofrecemos una actividad lúdica con el famoso  juego \"El Ahorcado\", cuyas palabras están relacionadas con lo que  hemos  visto  en  este  apartado.  Finalmente,  como  introducción  al  último  apartado  de  este  capítulo,  observa  un  objeto  interactivo  diseñado por Srisukwang      , que describe los hitos más importantes  de las cuatro revoluciones industriales; para ello, debes hacer clic  sobre la imagen del objeto interactivo 1.5 de la siguiente página.  [4]  28 \nInteractivo 1.4 . Juego El Ahorcado sobre la tercera revolución industrial.  Interactivo 1.5 . Las revoluciones industriales.  29 \n1.3 Cuarta revolución industrial  De  los  muchos  desafíos  diversos  y  fascinantes  que  enfrentamos hoy, el más intenso e importante es cómo  entender y dar forma a la nueva revolución tecnológica,  que  implica  nada  menos  que  una  transformación  de  la  humanidad. Estamos al comienzo de una revolución que  está  cambiando  fundamentalmente  la  forma  en  que  vivimos, trabajamos y nos relacionamos unos con otros. En  su escala, alcance y complejidad, lo que considero la cuarta  revolución industrial no se parece a nada que la humanidad  haya experimentado antes (      , p.7).  Klaus Schwab, fundador del Foro Económico  Mundial,    acuña    el    término    \"Cuarta  Revolución Industrial\" en 2016, destacando  los avances tecnológicos como la inteligencia  artificial, la robótica, el internet de las cosas,  los vehículos autónomos, la impresión 3D, la  nanotecnología, la biotecnología, la ciencia de  los  materiales  y  la  computación  cuántica.  Schwab presenta tres razones para justificar  la puesta en marcha de la 4RI:  Velocidad . Evolución exponencial como resultado de un  mundo  interconectado .  Amplitud y profundidad . Basada en la revolución digital  que  está  generando  cambios  sin  precedentes  en  la  economía, los negocios, la sociedad y las personas. \"No solo  está cambiando el 'qué' y el 'cómo' hacer las cosas, sino el  'quienes somos'\" (Ibid, p.15).  [2]  30 \nImpacto en los sistemas . Transformación de sistemas complejos  entre países, empresas, industrias y la sociedad en general.  Industria 4.0 . El término Industria 4.0 es adoptado en Alemania  en la  Feria de Hannover de 2011, entendido como  \"la  completa  digitalización  de  las  cadenas  de  valor  a  través  de  la  integración  de  tecnologías  de  procesamiento  de  datos,  software  inteligente y sensores; desde los proveedores hasta los clientes para  poder predecir, controlar, planear y producir de forma inteligente, lo que  genera mayor valor a toda la cadena\" ( Disruptive Angels ).  En la que se destacan cuatro componentes principales:  los sistemas  Ciber-Físicos (CPS), El Internet de las cosas (IOT), El Internet de  Servicios(IOS), las fábricas inteligentes y la manufactura aditiva.  La 4RI, entonces, se fundamenta en los conceptos de Internet de las  cosas  (IoT)  e  Internet  de  los  Servicios    (IoS)  usados  en  fábricas  inteligentes  con  sistemas  de  producción  integrados  vertical  y  horizontalmente o también llamados Sistemas Ciberfísicos (SCF).  La  4RI  comprende  un  cambio  de  paradigma  de  la  fabricación  automatizada hacia un concepto de fabricación inteligente. Los mundos  físico  y  virtual  crecen  juntos,  la  implementación  de  la  fabricación  inteligente hará uso de conceptos como IoT para facilitar este cambio (    , p.6).  No obstante esta delimitación, existen desarrollos tecnológicos que  soportan  los  sistemas  anteriores,  entre  ellos  Basco    et  al    identifican 10 que llaman \"pilares tecnológicos de la Industria 4.0\",  los  cuales  presentamos  en  el    interactivo  1.4   diseñado  por  Juan  Guillermo Rivera, tales como la robótica, la computación en la nube,  el Big Data, la fabricación aditiva, la inteligencia artificial, los sistemas  de integración y la ciberseguridad.  [11]  [12]  31 \nLa Cuarta Revolución Industrial, entonces, es una etapa en la que la  digitalización  penetra  disruptivamente  el  sector  industrial  con  tecnologías como las que se muestran en el siguiente interactivo.  Interactivo 1.6 . Pilares tecnológicos de la Industria :  Interactivo 2.1 . Historia del IoT.  42 \nY en este otro objeto interactivo, puedes identificar los hitos más  importantes en la historia del IoT:  Interactivo 2.2 . Infografía de la historia del IoT.  Pero, ¿Qué es realmente la Inteligencia Artificial de las Cosas? En  principio, es el mismo concepto de IoT, pero aquí el ser humano es  reemplazado por una máquina (hardware) que con una combinación  de algoritmos (software) se conectan con las cosas (dispositivos). Más  43 \nadelante,  veremos  algunas  aplicaciones  que  usan  Inteligencia  Artificial con estos propósitos.  Retomando  la  historia,  no  podemos  dejar  a  un  lado  a  quien  acuñó  el  término    Internet  of  Things  (IoT) ,  se  trata  del  tecnólogo  británico    Kevin  Ashton. A principios de la década del  90 trabajaba para la empresa Procter  and Gamble (P&G) y estaba tratando  de  convencer  a  sus  jefes  de  implementar    las    etiquetas    de  identificación  de  radiofrecuencia  ( RFID )  y  otros  sensores  en  los  productos de la cadena de suministro  de la empresa      . Mientras pensaba  en  qué  nombre  darle  a  una  presentación  en  PowerPoint  para  P&G, se le ocurrió:  Sabía que quería incluir la palabra 'internet', porque entonces podría  obtener algo de aceptación. Todos estos viejos tipos de CEO de tipo  blanco estaban muy entusiasmados con internet, pero en ese momento  todavía era solo la revolución punto .com... Estaba hablando de que la  cadena de suministro es una 'Red de cosas' y que Internet es una 'Red de  bits', y de cómo la tecnología de sensores fusionaría los dos. Entonces  pensé en un \"Internet de las Cosas\" y pensé: \"Eso servirá, o tal vez  incluso  mejor\".  Tenía  un  timbre.  Se  convirtió  en  el  título  de  la  presentación (Ibid).  Según Ashton, \"si todos los objetos de la vida cotidiana estuvieran  equipados  con  identificadores  y  conectividad  inalámbrica,  estos  podrían comunicarse entre sí y ser gestionados por las computadoras  [13]  [14]  44 \n2.1.2 IoT en el hogar  Iniciamos este apartado, mostrando cómo algunas cosas de nuestro  hogar las podíamos controlar con sensores u órdenes desde Internet.  En la siguiente infografía, puedes observar otros dispositivos (cosas)  que también podemos conectar.  Interactivo 2.3 . Infografía del IoT en el hogar.  45 \nHabrás notado que algunos de los dispositivos tienen el calificativo  de \"inteligentes\" (smart en inglés): smart TV, smart plug y la misma  casa u \"hogar inteligente\". Pues, vete acostumbrando porque en la  4RI parece ser que algunas \"cosas\" son inteligentes.  En  nuestro  hogar  inteligente,  ahora  contamos  con  muchas  cosas  inteligentes: cámaras y sensores de movimiento para la seguridad de  nuestra familia y nuestros enseres (algunos  también inteligentes y  costosos), dispositivos para monitorear la salud de la familia, consolas  para  el  entretenimiento,  refrigeradores  que  advierten  cuando  un  producto se está acabando, sensores de humo que activan rociadores  cuando se inicia un incendio, sistemas de aire acondicionado que  funcionan según los datos de temperatura y humedad del ambiente,  contribuyendo al ahorro energético y algunas otras mostradas en la  Figura 2.1.  Figura 2.1 . Internet de la Cosas en el hogar (crédito: Imagen por macrovector en  Freepik ).  46 \n2.1.3 Elementos del IoT  Este libro lo hemos denominado de tipo \"interactivo\", pues permite la  interacción sujeto - objeto de conocimiento, pero en el mundo del IoT,  como lo dijimos al inicio, es posible la interacción objeto (Internet) -  objeto (cosa), dispositivo - dispositivo, máquina - máquina.  Han sido dos tendencias las que nos han permitido llegar a este punto (la  interconexión): primero, el creciente uso del teléfono inteligente para  hacer pagos y transferencias por la red, así como el uso de las tabletas;  segundo,  el  diseño  y  creación  de  dispositivos  inteligentes  como  las  etiquetas  RFID  (Identificación  por  Radiofrecuencia)  y  los  sensores  electrónicos, más potentes, rápidos y pequeños      .  Los elementos que constituyen el IoT se suele llamar \"Arquitectura  IoT\", la cual se puede dividir en siete, cuatro o tres capas. El modelo  simplificado de tres capas es el siguiente (ver  Figura 2.2 ):  Capa  de    Percepción   o  detección  de  objetos  ( Sensores  y  Actuadores ).  Incorpora  sensores  para  detectar  y  recopilar  información sobre el entorno como la temperatura, la humedad,  la presencia de humo, la presencia de seres vivos (cosas) e,  incluso, la presencia de otros objetos inteligentes. Por su parte,  los  actuadores  realizan  correcciones  en  tiempo  real,  como  ajustar el nivel del aire acondicionado.  Capa  de    Red .  Es  la  responsable  de  recoger  los  datos  suministrados por los sensores y convertirlos en un formato  digital, permitiendo el procesamiento e intercambio de datos a  través de una pasarela de Internet bien sea por una WAN 6  inalámbrica (Wi-Fi o celular) o una WAN cableada.  Capa de  Aplicación . Servicios de IoT para hogares inteligentes,  ciudades inteligentes o fábricas inteligentes.  [15]  WAN (Wide Area Network): Red de Área Amplia 6  47 \nFigura 2.2 . Arquitectura IoT, modelo de tres capas (imagen adaptada de      ).  \"La capa de aplicación garantiza la autenticidad,  integridad y confidencialidad de los datos. En esta capa  se logra el propósito de IoT que es la creación de  entornos inteligentes\"      .  En  el  objeto  interactivo  de  la  siguiente  página,  presentamos  una  infografía de los elementos IoT. Incluimos los sistemas embebidos,  pues son sistemas diseñados para cubrir necesidades muy específicas  en  tiempo  real.  Los  sistemas  embebidos  son  productos  que  empleamos  a  diario,  por  ejemplo  en  los  hornos  microondas,  tostadoras y lavadoras.  [16]  [16]  48 \nInteractivo 2.4 . Infografía de los elementos IoT.  2.1.4 Ventajas y desventajas del IoT  Como lo hemos visto, son muchas las ventajas que ofrece el IoT; ent nsaciones.  Por su parte, Olguín  et al       afirman que,  Realidad Virtual (RV) es la simulación de un ambiente real imaginario  que puede ser experimentado en tres dimensiones, proporcionando una  experiencia interactiva completa en tiempo real con video, sonido e  incluso retroalimentación táctil.  Para  evitar  confusiones  y,  quizá,  discusiones  sobre  la  mejor  definición, se ha optado por hablar de diferentes tipos de Realidad  Virtual,  tales  como  RV  inmersiva,  RV  semi  inmersiva,  Realidad  Aumentada (que veremos en el siguiente apartado) y Realidad Mixta.  La primera debe garantizar la no presencia del mundo real; para ello,  se debe contar, al menos, con gafas o un casco. Por su parte, la semi  inmersiva, permite la presencia de objetos físicos del mundo real, por  ejemplo los juegos 3D en el ordenador y algunos multiversos como el  Roblox.  [17]  [18]  52 \n2.2.1 Historia de la Realidad virtual  En el siguiente objeto interactivo se presentan los principales hitos  históricos  de  la  Realidad  Virtual,  tanto  inmersiva  como  semi  inmersiva.  Interactivo 2.6 . Historia de la Realidad Virtual.  Obviamente, la discusión sobre lo inmersivo no está agotada, pues es  evidente la desconexión total del mundo físico de algunos  gamers , con  sólo usar audífonos.  53 \nAguirre Romero, citado por García      ,  identifica  una  auténtica  paradoja al juntar las dos palabras 'Realidad Virtual',  ya que realidad,  es aquello que tiene existencia verdadera y efectiva, mientras que virtual  puede ser definido como aquello que tiene virtud para producir un efecto,  aunque no lo produce de presente . Realidad virtual, entonces,  se refiere a  todo aquello que es y que no es  o, de otra forma,  aquello que tiene  existencia aparente y no real .  Inmersivo o no, un aspecto común en las definiciones es la simulación  de un entorno virtual en 3D; por ejemplo, pasa el ratón (mouse) sobre  el siguiente laberinto, diseñado por  Hunts :  Interactivo 2.7 . Simulación de un entorno virtual en 3D.  [18]  54 \nUn segundo aspecto común es la interactividad, condición necesaria  para  que  se  logre  una  inmersión  total,  tal  como  ocurre  con  los  actuales metaversos y, desde la década del 90, en los videojuegos con  entornos 3D, como el caso del juego Wolfenstein 3D, programado en  1992 por John Carmack para la empresa ID Software: adaptación a  3D de \"uno de los juegos favoritos del estudio: 'Castle Wolfenstein'.  Vendido por Muse Software como «el juego más interactivo jamás  creado»\"  ( Rivera, p. 277 ).  Carmack,  defensor  del  software  libre,  lanzó  el  código  fuente  de  Wolfenstein 3D en 1995, a partir del cual se crearon algunos clones,  como el realizado por el danés  Jacob Seidelin  para HTML5. Haz clic  en la siguiente imagen para acceder al juego 7 .  Figura 2.3 . Clone del juego Wolfenstein 3D.  El juego original para DOS se puede acceder en el repositorio de  https://archive.org/ 7  55 \nLa inclusión de los entornos virtuales 3D, cambió por completo la  industria de los videojuegos usando, inicialmente, realidad virtual no  inmersiva 8 . Ahora, en 2022, los gamer se sumergen en una realidad  virtual  totalmente  inmersiva,  empresas  como  Bethesda,  Ubisoft,  Sony o Nintendo nos ofrecen juegos donde la realidad virtual se  confunde con la realidad del mundo físico, apoyados por el hardware  de última generación de Valve, PlayStation (Sony), Oculus (Meta) y  HTC.  A continuación, puedes ver algunos de esos juegos.  Interactivo 2.8 . Presentación de juegos VR vendidos en 2022 9 .  Veamos algunos de los dispositivos más utilizados en RV.  En el libro  Juegos Retro , se puede consultar acerca del \"boom\" 3D en los años 90.  En  Vida Extra , se presenta una excelente selección de juegos VR.  8  9  56 \n2.2.2 Los dispositivos IoT de la Realidad Virtual  Los periféricos que usamos en la  RV  son  tecnología  IoT,  tales  como  los  sensores  (dispositivos  que obtienen información para el  sistema)  y  los  actuadores  (dispositivos que envían órdenes  al  sistema).  Jaron  Lanier,  el  inventor de la expresión realidad  virtual  y  uno  de  los  grandes  artistas  digitales  contempo-  ráneos        ,  y  Thomas  G.  Zimmerman  dejaron  Atari  en  1985 para fundar VPL Research,  Inc., la primera compañía que vendió gafas y guantes de realidad  virtual ( Wikipedia ).  Hay  cierto  consenso  sobre  una  mejor  inmersión  sensorial  en  los  entornos virtuales, cuando se usan dispositivos dedicados al sentido  de la vista, pues es el que permite percibir una mayor cantidad de  información y, en consecuencia, una mejor desconexión  del mundo  real. No obstante, es posible que otros dispositivos generen un mayor  impacto; por ejemplo, las plataformas móviles en simuladores de  vuelo o simuladores de terremotos o los guantes que permiten crear  la sensación de tacto.  El dispositivo RV más vendido es el \"casco RV\" o las gafas, ambos de  tipo HMD ( Head Mounted Display , por sus siglas en inglés), bien sea  con pantalla, tales como:  Oculus Rift, PlayStation VR, HoloLens de  Microsoft, Vive, VivePro, StarVR, FOVE VR, Pimax 4k, Pimax 8k, o los  HMD  sin  pantalla  como  Gear  VR,  Daydream  View,  Google  Cardboard, Zeiss VR One y Durovis      .  [18]  [20]  57 \nEn el siguiente objeto interactivo, puedes observar algunos cascos y  gafas VR.  Interactivo 2.9 . Presentación de cascos y gafas VR.  En las imágenes, se aprecian dispositivos para inmersión total y otros  usados  con  teléfonos  móviles,  la  mayoría  de  ello  de  visión  estereoscópica (3D), que incluyen un giroscopio para mostrar las  imágenes de acuerdo con la orientación espacial del usuario, pero  que sea  Alicia Cañelas   , quien nos explique estas diferencias en el  siguiente video 10 .  El video hace parte del MOOC \"Realidad Virtual en Educación\" del Instituto Nacional de  Tecnología Educativas y de Formación del Profesorado - INTEF -  de España, el cual tiene  licencia creative commons.  10  58 \nVideo 2.1 . Dispositivos RV.  2.2.3 Aplicaciones de la Realidad Virtual  Como has podido advertir, la industria que genera grandes ventas y  ganancias  con  la  Realidad  Virtual  es  la  de  los  videojuegos;  sin  embargo,  existen  otros  sectores  que  se  han  beneficiado  de  esta  tecnología, entre ellos:  La arquitectura. Revisión y mejora de los diseños realizados en  3D, además de permitir mostrar a los clientes una forma más  exacta de la obra.  Simuladores. Especialmente los de vuelo, vehículos, sistemas  físicos, militares y otros de tipo industrial como las grúas.  Medicina. Operaciones remotas.  Educación.  Entornos  virtuales  de  aprendizaje  en  diferentes  áreas del conocimiento.  59 \nLas aplicaciones anteriores evidencian los grandes beneficios de la  RV pero, como ya lo hemos dicho, toda nueva tecnología presenta,  también, riesgos, entre ellos: adicción, náuseas, mareos, ansiedad,  desorientación.  Obviamente,  la  materialización  de  estos  riesgos,  dependen de cada persona.  Figura 2.4 . La Realidad Virtual y la Adicción (crédito: imagen creada por  Eran Fowler  en Devian Art, la modelo es la hermana de Eran).  60 \nPara  terminar  este  apartado,  realiza  la  siguiente  evaluación  formativa:  Interactivo 2.10 . Dispositivos RV.  61 \n2.3 Realidad aumentada  ¿Qué es Realidad Aumentada?  \"La Realidad Aumentada (RA) es una tecnología que  permite visualizar objetos virtuales o información en  general en un espacio físico\"      . En una explicación  simple,  es  el  mundo  real  (físico),  al  que  se  le  incorporan objetos virtuales; es decir se  aumentan  los objetos que percibimos en nuestro entorno físico.  [21]  62 \nInicios de la RA  El desarrollo de la RA comenzó en la Universidad de Harvard en  1968. Ivan Sutherland creó un sistema de visualización  montado en la cabeza que recibió el sobrenombre de \"La espada  de Damocles\". Un dispositivo masivo, tenía que estar anclado al  techo y el usuario necesitaba estar amarrado, lo que podía ser  muy incómodo. Uno de los primeros usos más visibles de la  realidad aumentada fue de la NFL, la línea amarilla significa  primer intento. Entre 2011 y 2013, empresas como Coca-Cola,  Disney y National Geographic adoptaron la realidad aumentada  para realizar campañas en grandes eventos. Luego, en 2014,  Google lanzó Google Glass, el primer dispositivo AR portátil  producido en masa ( Tedd Davidson ).  63 \n2.3.1 Historia de la RA  La historia de la RA no se reduce a lo anteriormente descrito, pues se  han presentado grandes acontecimientos, que puedes explorar en la  siguiente infografía.  Interactivo 2.11 . Infografía de la historia de la RA    Créditos textos:  Edu Trends - Tecnológico de Monterrey  - CC BY-NC-SA 4.0    Iconos:  Freepik  / Creative Commons CC BY 3.0.  64 \nObserva  el  siguiente  video,  en  el  que  podrás  apreciar  los  objetos  virtuales que  aumentan  los elementos presentes en el mundo físico.  Aplicaciones de la Realidad Aumentada Aplicaciones de la Realidad Aumentada  Video 2.2 Video 2.2 . Compilación de aplicaciones de la realidad aumentada. . Compilación de aplicaciones de la realidad aumentada.  En  los  videos,  se  evidencia  cómo  la  RA  modifica  el  entorno  real,  mezclando lo real con lo virtual con una especie de hologramas. Sin  embargo, es posible que el entorno virtual sea modificado con objetos  reales,  generando  lo  que  Milgram  et  al.        denominan  como  Virtualidad Aumentada:  El caso a la izquierda del continuo en la Figura 2.5 define cualquier entorno  que consiste únicamente en objetos reales, ... El caso de la derecha define  entornos que consisten únicamente en objetos virtuales... Dentro de este  marco, es sencillo definir un entorno genérico de realidad mixta (RM) como  uno en el que los objetos del mundo real y del mundo virtual se presentan  juntos en una sola pantalla, es decir, en cualquier lugar entre los extremos  del continuo RV.  [22]  65 \nFigura 2.5 . Representación simplificada de un Continuo RV      .  Un término que trata de cubrir las tres realidades que hemos tratado  hasta el momento (RV, RA y RM), es la  Realidad Extendida (RE) 11 .  La realidad extendida, un concepto que abarca la realidad virtual, la  realidad aumentada y la realidad mixta, ha experimentado un notable  progreso  en  los  últimos  años  y  ha  tenido  un  gran  impacto  en  la  comprensión  de  la  educación.  La  investigación  sobre  la  realidad  extendida ha aportado beneficios en la mejora de la enseñanza y el  aprendizaje, a partir de dos conceptos clave: el grado de inmersión y la  sensación de presencia      .  Pero, para no confundirnos con más \"realidades\", dejaremos el uso de  este término para el siguiente apartado \"El metaverso\".  2.3.2 Herramientas de desarrollo  El propósito de este libro es describir los fundamentos de la 4RI, por  lo que los aspectos técnicos son objeto de cursos específicos sobre  RA.  No  obstante,  describimos  las  siguientes  herramientas  de  desarrollo en la RA.  [22]  [23]  El  concepto  de  Realidad  extendida  (RE,  o  en  su  terminología  anglosajona,  eXtended  Reality, también Cross Reality, XR): hace referencia a un elemento paraguas, que agrupa la  combinación de todos los entornos reales y virtuales   11  [20]  66 \nLa tecnología RA tiene como elementos básicos: el  procesador , la  aplicación   o  herramienta  de  desarrollo  de  software  (SDK 12 ),  el  display  (encargado de mostrar los entornos virtuales al usuario), los  sensores  y los  actuadores .  En cuanto a la  aplicación , las más usadas son:  ARKit . Plataforma de desarrollo AR lanzada por Apple en 2017,  que permite crear aplicaciones (app) de realidad aumentada  para iPhone y iPad.  ARCore  Plataforma de desarrollo de Google, similar a ARKit de  Apple, con aprovechamiento de la \"computación en la nube\"  ( cloud computing ) y el IoT.  Vuforia  El SDK más popular, compatible con iOS, Android y  Windows. Algunos SDKs de Vuforia son Android Studio, Xcode,  Visual Studio y Unity.  SDK  de  Wikitude .  Usa  tecnologías  de  reconocimiento  y  seguimiento de imágenes y geolocalización, la representación  de  modelos  3D,  la  superposición  de  video  y  la  realidad  aumentada basada en la ubicación      .  DuMix  AR  3.0  de  Baidu .  \"Brinda  a  los  desarrolladores  de  tecnología  capacidades  técnicas  innovadoras,  que  incluyen  percepción  inteligente,  representación  virtual,  interacción  hombre-computadora y métodos de desarrollo de ingeniería  eficientes y flexibles\"      .  Pero, como lo dijimos antes, es sólo una descripción, pues su análisis e  implementación  es  más  del  campo  de  conocimiento  de  los  desarrolladores de software.  [24]  [24]  SDK es el acrónimo de “Software Development Kit” (Kit de desarrollo de software). 12  67 \nFigura 2.6 . Herramientas de desarrollo RA.  2.3.3 Pantallas de RA  Existen  dos  tipos  de  pantallas  RA  ( display ),  las  pantallas  transparentes montadas en la cabeza y los que están basados en  monitores      . Luque      , hace la siguiente clasificación:  HMD  ( Head  Mounted  display ).  Con  6  grados  de  libertad,  y  seguimiento del movimiento de cabeza.  HUD  ( Head  Up  Display ).  Display  transparente  que  presenta  datos sin que el usuario tenga que apartar la vista.  Lentillas biónicas. Con procesador y comunicación inalámbrica.  Dispositivos  de  mano.  Pequeñas  pantallas/activadores  en  la  palma de la mano.  Dispositivos de retina (VRD,  Virtual Retinal Display ). Proyección  directa en la retina del ojo.  Dispositivos  espaciales  (SAR,  Spatial  AR).  Proyección  de  imágenes en objetos físicos.  [24]   [20]  68 \nPero, ¿qué información reciben las  pantallas del mundo virtual? La  respuesta es sencilla, una pantalla de  RA nos recibirá y nos mostrará  elementos del mundo virtual o, si se  prefiere, digital, tales como imágenes  (2D o 3D), textos, videos, gráficos,  etc.    Es necesario, entonces, disponer de  un computador con webcam, o una  Tablet, o un Smartphone o, lo más  popular, un  Wearable 13  con cámara  (relojes, gafas, etc.)    Pero, debe existir un activador de  esta información, llamado también  como  disparador o “ trigger ”, que  puede ser una imagen, un  marcador,  un código QR (muy usado en los  restaurantes en época de pandemia),  o cualquier objeto del mundo real  que reconozca el  software  \"encargado de hacer las  transformaciones necesarias para  facilitar la información adicional o  aumentada\"      . [25]  La tecnología wearable o vestible son todos aquellos elementos diseñados para el cuerpo  humano, como auriculares, relojes, pulseras o gafas que interactúan con otros IoT para  transmitir o recibir datos.  13  69 \n2.3.4 Software para crear contenidos de RA  Este  software  nos  permite  crear  objetos  virtuales  destinados  a  dispositivos como tabletas, teléfonos móviles, auriculares, etc., los  cuales  cuentan  con    sensores,  proyectores  digitales  y  el  software  apropiado para que los objetos generados se proyecten en el mundo  real o, como lo hemos dicho,  aumenten  los objetos del mundo físico.  El software más utilizado es el que permite desarrollar contenidos  digitales que se puedan identificar con marcadores gráficos como  códigos QR, imágenes u otro tipo de gráficos. Sin embargo, existen  otras aplicaciones basadas en GPS, giroscopios, acelerómetro, etc.  Existen aplicaciones que van de las más sencillas de usar, que no  demandan  conocimiento  en  programación,  como  el    Creator   de  Aumentaty,  hasta  las  más  complejas  que  exigen  buenos  conocimientos  del  lenguaje  de  programación  requerido  por  la  aplicación.  La  RA,  por  ser  una  tecnología  emergente,  ha  propiciado  el  surgimiento  de  muchas  empresas  dedicadas  a  la  creación  de  contenidos; por ello, es normal que algunas de ellas no tengan el éxito  suficiente para subsistir, especialmente las de bajo costo o gratuitas  como HP Reveal (Aurasma) que desaparece en 2019.  A  continuación,  presentamos  10  aplicaciones  con  sus  enlaces  y  descripciones. Si quieres incursionar en la creación de contenidos  para  RA  y  no  eres  experto  en  programación,  te  recomendamos  Aumentaty , que es un desarrollo español 14 .  Para el uso de Aumentaty es necesario la instalación en el computador del programa  gratuito  Creator , y la instalación en la Tablet o en el Smartphone de la aplicación gratuita  Scope  (Android o IOS).  14  70 \nInteractivo 2.12 . Algunas aplicaciones de creación de contenido RA.  Veamos, a continuación, algunas aplicaciones que permiten el uso de  contenidos  digitales,  bien  sea  con  visores  tipo  wearable  o  directamente  con  nuestros  dispositivos  móviles,  entre  las  que  incluimos aplicaciones muy populares como el Google Lens o los  filtros de Instagram para añadir elementos digitales a nuestro rostro.  71 \n2.3.5 Aplicaciones para el uso de contenidos de RA  Ya es cotidiano que alguien nos recomiende una app (aplicación) para  nuestro celular. Lo que poco o nada nos informan, es que se trata de  una aplicación de RA. Por ejemplo, Waze es una popular aplicación  social basada en GPS, que nos entrega información de tránsito  en  tiempo real, los elementos digitales que  aumentan  nuestro entorno  físico son una imagen y un audio. Esta aplicación tuvo tanto éxito, que  Google la compró en 2013.  El mismo Google nos ofrece aplicaciones nunca antes imaginadas. El  Google Translate  nos permite traducir mensajes que encontramos en  algún  recorrido  que  estemos  realizando,  el    Google  Lens   nos  da  información de algún objeto físico (cosa, animal, planta, etc.), con  Google Assistant  contamos con un asistente personal que nada tiene  que envidiarle a Siri o a Alexa 15 .  No sólo Google nos ofrece apps de alta tecnología, las redes sociales  han avanzado significativamente, ofreciendo efectos especiales que  combinan los entornos real y virtual; Instagram y Snapchat, con sus  novedosos filtros, permiten que modifiquemos o mejoremos nuestra  imagen  o  las  fotografías  que  enviamos  a  nuestros  contactos.  Obviamente, la industria de los video juegos no se quedan atrás,  siendo Pokémon Go y Angry Birds dos juegos de RA que están en el  top de las ventas.  En la infografía de la página siguiente, hemos seleccionado 10 apps,  en las que incluimos descripción de la app y un video. Recomendamos  verla en pantalla ampliada, incluimos un video viral en la aplicación de  Google Maps.  Alexa es un asistente digital de Amazon, lanzado en 2014. Siri es el asistente digital de  Apple, con lanzamiento en 2011 y solo disponible en dispositivos Apple.  15  72 \nInteractivo 2.13 . Aplicaciones populares de RA    Créditos textos:  Tekrevol    Iconos: tomados de la aplicación.    Videos: YouTube con licencia creative commons  Terminamos,  este  apartado,  con  dos  actividades  interactivas,  una  evaluativa y otra de tipo lúdico.  73 \nEn el siguiente objeto interactivo hay cinco imágenes relacionadas  con la Realidad Aumentada. Para verlas, debes armar el puzle. Te  recomendamos que amplíes la escena para una mejor interacción.  Interactivo 2.14 . Actividad lúdica sobre Realidad Aumentada  74 \nLa  siguiente  evaluación  interactiva,  presenta  ocho  afirmaciones  ¿serán verdaderas?  Interactivo 2.15 . Actividad evaluable sobre Realidad Aumentada  75 \n2.4 El Metaverso  76 \nRéplica del centro de estudios localizado en el Réplica del centro de estudios localizado en el  principal  campus  universitario  de  Saint  Leo, principal  campus  universitario  de  Saint  Leo,  Florida, realizada en Second Life, un ejemplo del Florida, realizada en Second Life, un ejemplo del  metaverso ( metaverso ( Wikipedia Wikipedia ). ).  77 \nEl Metaverso es un universo post-realidad, un entorno multiusuario  perpetuo y persistente que fusiona la realidad física con la realidad  virtual.  Se  encuentra  basado  en  la  convergencia  de  tecnologías  que  permiten interacciones multisensoriales en entornos virtuales, objetos  digitales  y  personas,  como  la  realidad  virtual  (VR)  y  la  realidad  aumentada (AR). Por tanto, El Metaverso es una red interconectada de  entornos  inmersivos  en  red  sociales  y  plataformas  multiusuario  persistentes      .  En la novela  Snow Crash  publicada por Neal Stephenson en 1992  surge el término  metaverso , en el contexto de un entorno virtual. A  continuación, puedes conocer la historia del metaverso, a través de  una infografía que incluye algunas imágenes  ampliables con la rueda  del ratón o con los dedos si usas un móvil.  Interactivo 2.16 . Línea de tiempo de la historia del metaverso.  [26]  78 \nSi revisamos la palabra \"Metaverso\", observamos que está compuesta  del término \"Meta\" que en griego significa post, después o más allá y  \"verso\" que es universo. En conclusión, Metaverso es un universo  post-realidad, \"un entorno multiusuario perpetuo y persistente que  fusiona la realidad física con la realidad virtual\"      .  Este tipo de fusión fue recreado por Ernest  Cline en su novela de ciencia ficción \" Ready  Player One  de 2011, en la que el protagonista  Wade Watts, en su búsqueda de un huevo de  Pascua, entra en un video juego de realidad  virtual  mundial,  llamado  OASIS...  todo  un  metaverso. En 2018, la novela es llevada al cine  por Steven Spielberg y es nominada al Óscar a  Los Mejores Efectos Visuales.    A  continuación,  presentamos  el  tráiler  de  la  película, que nos da una idea del mundo virtual  del video juego OASIS:  Video 2.3 . Tráiler de la película Ready Player One.  [26]  79 \nMystakidis        describe  cuatro  dimensiones  principales  del  Metaverso, que incluye las tecnologías inmersivas de RV y RA.  Figura 2.7 . Tecnologías, principios, posibilidades y desafíos del metaverso..  Por su parte, Dionisio et. al.      dicen que el Metaverso se basa en el  progreso en cuatro áreas: realismo inmersivo, ubicuidad de acceso e  identidad,  interoperabilidad  y  escalabilidad.  Ambas  propuestas  reiteran la inmersión y la identidad, para esta última se recurre al  avatar como nuestra representación en el mundo virtual.  2.4.1 El avatar  Dalgarno y Lee, citados por      , \"argumentan  que la inmersión con interacción en mundos  virtuales 3D conduce a posibilidades  adicionales de construcción de identidad,  presencia y co-presencia. La construcción de  una identidad en línea se logra principalmente  a través de la representación digitalmente  encarnada del yo en mundos virtuales, el  avatar \".  [26]  [27]  [26]  80 \nAvatar es una palabra en sánscrito  que  señala  la  manifestación  de  una  deidad  en  forma  humana.  Análogamente, en el metaverso el  usuario  se  materializa  como  un  avatar,  personalizado  por  el  usuario,  bien  sea  en  forma  humana  o  como  una  figura  fantástica.  En  algunos  blogs  era  común  usar  un  avatar  como  la  imagen de la derecha, que al pasar  el  mouse  sobre  ella,  los  ojos  se  movían  según  el  movimiento  del  mouse (pruébalo). Los primeros diseños de avatares, era algo similar  a cómo se muestra en el siguiente objeto interactivo:  Interactivo 2.17 . Diseñando un avatar (crédito:  Akemi Sakura ).  81 \nEn  los  metaversos  actuales,  los  avatares  tienen  diseños  más  complejos o, si se prefiere, con una representación más humana.  Figura 2.8 . Los avatares del metaverso  Con estos nuevos avatares, los usuarios pueden interactuar en  espacios físicos o virtuales. Durante la pandemia ocasionada por     la Covid-19, esta tecnología emergente aceleró su desarrollo,     en procura de generar \"reuniones e interacciones multipla-    taforma y multitecnología, donde algunos usuarios están     en RV y otros en entornos RA\"      , demandando una  interoperabilidad de la personalización de avatares.  Esta inmersión interactiva permite la construcción de     identidad y presencia, lograda a través de la     representación digital...  el avatar  (Ibid).  [26]  82 \n2.4.2 Los metaversos  El haber visto películas de ficción como  Matrix  o  Ready Player One , nos  permite  comprender  conceptos  de  inmersión,  identidad,  avatar,  presencia  e  interactividad    en  los  mundos  virtuales.  A  2022,  son  muchos los metaversos que se ofrecen y están en continuas mejoras;  entre ellos:  Sandbox . Metaverso de juegos NFT descentralizado basado en  Ethereum, que permite crear, vender, comprar y monetizar NFT  de realidad virtual.  Axie Infinity .  Según  su  página,  es  un  nuevo  tipo  de  juego,  parcialmente propiedad de sus jugadores y operado por ellos,  incluye  robots  voladores,  mutantes  con  martillos,  bestias  voladoras y otros seres.  Bloktopia . Incluye bloques de bienes raíces virtuales. Según su  página, Bloktopia es un Rascacielos compuesto por 21 niveles  para  pagar  reconocimiento  a  21  millones  de  Bitcoin.  Los  titulares de fichas se conocerán como Bloktopians.  Decentraland .  Plataforma  de  realidad  virtual  descentralizada  3D  que  consiste  en  90.601  parcelas  de  tierra.  La  propiedad  virtual  en  Decentraland son los NFT que se pueden comprar  por medio de la criptomoneda MANA, que está  basada en la Blockchain de Ethereum (Wikipedia).  Roblox . Plataforma de videojuegos en línea dónde  los  usuarios  pueden  crear  sus  propios  mundos  virtuales  con  el  sistema  de  creación  de  juegos  llamado  Roblox  Studio,  desarrollado  por  Osu  y  disponible  en  solo  en  ordenadores  personales  (Ibid).  83 \nStar Atlas . Metaverso de juegos que surge de la confluencia de  blockchain, gráficos en tiempo real, videojuegos multijugador y  tecnologías financieras descentralizadas.  En la siguiente infografía, puedes ver algunos clips de video de los  anteriores metaversos y algunos más.  Interactivo 2.18 . Metaversos que mueven más dinero.  84 \n2.4.3 Landian el metaverso hecho en Medellín  Al mundo de los metaversos llegó uno nuevo y es de origen colombiano.  Esta propuesta se llama Landian y es un metaverso (mundo virtual) muy  similar a los ya conocidos como Decentraland, Roblox y The Sandbox  ( Periódico El Colombiano ).  Hemos dejado un apartado especial para esta iniciativa colombiana,  en la que participan más de 150 profesionales de diferentes ciudades  de Colombia (diseñadores 3D, expertos en mercadeo e inteligencia  artificial, científicos de datos, entre otros) ¿Te imaginas estudiar en  una ciudadela universitaria en el metaverso?... Observa:  Estudiando en la Universidad de Landian Estudiando en la Universidad de Landian  Video 2.4 Video 2.4 . Ciudadela Universitaria en Landian (crédito: cortesía de Landian). . Ciudadela Universitaria en Landian (crédito: cortesía de Landian).  En las siguientes páginas, presentamos información más amplia de  este metaverso colombiano.  85 \n¡Impresionante! ¿no? Un campus con escenarios imposibles en  el mundo físico, como la escultura en el patio central, edificios  de  aulas  que  cualquier  arquitecto  se  soñaría,  clases  magistrales  apoyadas  por  hologramas  y  cualquier  otro  escenario  en  los  que  profesores  y  estudiantes  quieran  construir y recrear el conocimiento.  El Metaverso es una realidad que desafía los  escenarios educativos... Mundos virtuales donde  los usuarios tienen un avatar controlado por el  tiempo que pasan en el sistema. Pueden  interactuar con amigos y otros avatares de todo  el mundo. También es posible crear sus propias  escenas, juegos y simulaciones en 3D ( Juan  Domingo Farnós Miró ).  86 \nLandian  existe  para  que  las  personas,  las  empresas,  las  organizaciones  y  las  culturas  puedan  participar  en  el  Metaverso sin trabas y sin limitaciones.  Además, es donde  convertirse  en  alguien  o  algo  está  limitado  solo  por  la  imaginación.  La  capacidad  de  uno  para  evolucionar  y  prosperar  está  determinada  por  el  nivel  de  esfuerzo  ( https://www.landian.io/ )  Figura 2.9 . Un avatar de Landia  Por  ser  colombiano,  podríamos  pensar  que  la  calidad  del  metaverso estaría lejos de metaversos como Decentraland,  Roblox  o  el  Meta  de  Zuckerberg,  pero  qué  equivocada  percepción  tendríamos,  pues  Landian  utiliza,  entre  otras  tecnologías,  Amazon  Web  Services  (AWS),  la  mejor  red  centralizada de su clase para servicios de transmisión como  Netflix;  el  mejor  motor  gráfico  tridimensional  de  juegos  Unreal, utilizado por Fortnite™ y Gears of War™; blockchain,  redes  sociales,  programación,  criptomonedas  e  inteligencia  artificial de última generación.  87 \nPero, que sea el libro blanco el que nos aporte más información:  Figura 2.10 . El libro blanco de Landian (convertido a HTML5 con  idrsolutions ).  88 \nMucho  se  ha  hablado  de  la  inmersión  total que producen los mundos virtuales  del metaverso, bien sea usando las gafas  Oculus Rift de Meta o las Gear VR de  Samsung; pero, mundos virtuales como el  campus universitario anterior, permiten  una  inmersión  con  sólo  verlo  en  la  pantalla  de  un  computador,  tal  como  ocurre con los gamers, quienes se aíslan  por  completo  del  mundo  físico,  sumergiéndose  en  su  video  juego  preferido.    Observa, a continuación, otro video de  Landian. Si lo deseas, puedes ampliarlo a  pantalla completa.  Otros mundos virtuales Otros mundos virtuales  de Landian de Landian  Video 2.5 Video 2.5 . Mundos virtuales Landian . Mundos virtuales Landian  (crédito: cortesía de Landian). (crédito: cortesía de Landian).  89 \nTerminamos  este  apartado,  mostrando  una  pequeña  muestra  de  cómo  Landian  crea  sus  avatares,  a  través  de  la  producción  volumétrica,  la  cual  consiste  en  el  uso  de  un  grupo  de  cámaras  alrededor de una persona o un animal, grabando todos los ángulos  posibles.  En el siguiente video, puedes apreciar una actividad de Landian en la  creación de un avatar.  Creando un avatar en Landian Creando un avatar en Landian  Video 2.6 Video 2.6 . Producción volumétrica de un avatar  . Producción volumétrica de un avatar  (crédito: cortesía de Landian). (crédito: cortesía de Landian). \n2.5 Evaluación del capítulo  A  continuación,  responde  10  preguntas  de  selección  múltiple.  La  evaluación es de tipo formativa, puedes realizarla varias veces.  Interactivo 2.19 . Evaluación capítulo 2. \n92 \nCapítulo III Capítulo III  Seguridad en la Nube para el Seguridad en la Nube para el  Big Data y el Blockchain Big Data y el Blockchain \n3.1 Computación en la Nube  ¿Qué es una nube?  La  nube  (cloud  en  inglés)  es  la  forma  abreviada  de  \"computación en la nube\" (cloud computing), son todas las  cosas a las que puedes acceder de forma remota a través de  Internet.  Cuando  algo  está  en  la  nube,  significa  que  está  almacenado en servidores de Internet en lugar del disco duro  de tu computadora.  ¿Qué es la computación en la nube?  Según el NIST ( National Institute of     Standards and Technology ), es un modelo     para permitir el acceso de red ubicuo 16 ,     conveniente y bajo demanda a un grupo compartido de  recursos informáticos configurables (por ejemplo, redes,  servidores, almacenamiento, aplicaciones y servicios) que se  pueden aprovisionar y liberar rápidamente con un mínimo  esfuerzo de administración o interacción con el proveedor de  servicios ( NIST ).  Ubicuo: que está presente en todas partes al mismo tiempo 16  94 \nEstoy seguro que eres un usuario de la nube pues, al menos, tienes  una cuenta de correo electrónico ¿dónde crees que se guardan tus  mensajes?... ¡en la nube! Ahora, es posible que ya estés usando algún  servicio  de  almacenamiento  ¿identificas  alguno    en  la  siguiente  nube 17 ?  Animación interactiva diseñada por  Asmit . 17  95 \nEl  origen  del  término  \"computación  en  la  nube\"  no  es  claro;  sin  embargo, fue  popularizado en la primera década del siglo XXI a través  de las primeras ofertas de servicios de computación remota como  Salesforce y Amazon Web Services (aws). Estos servicios remotos se  hicieron más populares con la incursión de grandes empresas como  Apple,  Microsoft,  IBM,  HP,  Google  y  Rackspace,  reforzando  el  concepto  de  la  computación  en  la  nube  como  proveedores  de  servicios de Internet a gran escala.  Interactivo 3.1 . Servicios en la Nube    Créditos textos: Wikipedia.  96 \n3.1.1 Modelos de computación en la nube  Como pudiste observar en la infografía anterior, existen diferentes  tipos de servicios, esto ocurre porque \"la computación en la nube  basa  su  arquitectura  haciendo  una  separación  entre  hardware,  plataforma y aplicaciones quedando las siguientes capas\"      :  Software  como  Servicio .  Simplificada  como    SaaS   ( Software  as  a  Service ).  Está  en  la  capa  más  alta  (Ver    figura  3.1 ),  consiste  en  la  entrega de aplicaciones completas (software)  como un servicio, con  una distribución del tipo \"uno a muchos\", por ejemplo el servicio de  correo electrónico o el Office 365 de Microsoft.  Plataforma como Servicio . Simplificada como  PaaS  ( Platform  as  a  Service ). Es un servicio de plataforma con todo lo necesario para dar  soporte al desarrollo y puesta en marcha de aplicaciones y servicios  web; es decir, es útil para desarrolladores  para gestionar, distribuir y  testear sus aplicaciones de software.  Ejemplos  de  este  modelo  son  Google  App  Engine,  SAP  Cloud  Platform,  Heroku  de  Salesforce,  Oracle  Cloud  Platform  o  AWS  Lambda.  Infraestructura como Servicio . Simplificada como  IaaS  ( Infrastructure  as a Service ). Es la capa más baja. \"La idea básica es la de hacer uso  externo  de  servidores  para  espacio  en  disco,  base  de  datos,  ruteadores,  swtiches  así  como  tiempo  de  cómputo  evitando  un  servidor local y toda su infraestructura\" (Ibid), es útil para desplegar  aplicaciones  web,  operar  un  CRM,  realizar  análisis  de  Big  Data,  backups, etc.  Ejemplos de IaaS son el Apache Cloudstack, Amazon Web Service y  Google Cloud.  [28]  97 \nFigura 3.1 . Computación en la nube (crédito: Imagen de  Sam Johnston , CC BY-SA 3.0).  3.1.2 Tipos de Nube  Según el modelo de implementación, se tienen los siguientes tipos de  Nube:  Nube pública .  Es  aquella  que  puede  ser  utilizada  por  diferentes  clientes que necesitan reunirse en servidores, y estos son propiedad  y administrados por los proveedores, \"El presente modelo de servicio  es entendido como un servicio bajo demanda e inmediato, donde los  usuarios  acceden  a  él  a  través  de  Internet  o  de  redes  privadas  virtuales (VPN).\" Microsoft Azure y Google App Engine son ejemplos    ,      . [29]   [30]  98 \nNube privada . Se fundamenta en la demanda de clientes individuales,  proporcionando  propiedad  sobre  los  datos,  su  seguridad  y  está  dedicada al cliente. Es seguro y costoso en comparación con una nube  pública, \"los recursos ofrecidos pasan a ser propiedad de una sola  institución, manteniendo la infraestructura en una red privada de  uso, y llegando incluso a ofrecer la posibilidad de alojar los servicios  en  las  propias  instalaciones  del  cliente\".  Eucalyptus  System  es  el  mejor ejemplo de una nube privada (Ibid).  Nube híbrida . Es la composición de los modelos anteriores. \"Ambas  nubes,  tanto  pública  como  privada,  componen  dos  entidades  independientes,  pero  mantienen  una  interrelación  basada  en  principios de comunicación y portabilidad de aplicaciones y datos\"    . Amazon Web Services es un ejemplo de una nube híbrida.  Nube  Comunitaria .  Diseñada  para  una  comunidad  específica  de  consumidores de diferentes organizaciones. Puede ser de propiedad,  administrado y operado por una o más empresas de la comunidad.  Útil en el sector educativo. Facebook es un ejemplo de una nube  comunitaria.  Edge computing .  No  se  trata  de  un  nuevo  tipo  de  Nube,  lo  que  permite  es  acercar  ( edge )  \"físicamente\"  la  nube  al  usuario,  permitiendo servicios más rápidos y confiables,  Edge computing permite que los datos producidos por  los dispositivos de la internet de las cosas se procesen  más cerca de donde se crearon en lugar de enviarlos a  través de largas recorridos para que lleguen a centros de  datos y nubes de computación ( Javier Pastor ).  [30]  99 \n3.1.3 Ventajas y desventajas de la Nube  Es obvio que son muchas las ventajas que ofrecen los servicios de la  Nube, tales como:  Capacidad  de  procesar  y  almacenar  grandes  volúmenes  de  información (Big Data).  Alta disponibilidad, escalabilidad, flexibilidad, eficiencia.      .  El  ahorro,  tanto  en  licencias  como  en  la  administración  del  servicio y en los equipos      .  Implementación rápida y baja en riesgos.  Actualizaciones automáticas (Ibid.).  Ahorro energético.  Copias de seguridad.  Trabajo colaborativo.  Ofrece la posibilidad de hacer un trabajo  conjunto de empleados, estudiantes, investigadores, etc. que se  encuentran en puntos geográficos distantes.  En cuanto a las desventajas, se podrían reducir a dos que son de gran  impacto:  Fallos en la prestación del servicio. Esto puedo ocurrir por fallas  en los servidores, algo que ya ha ocurrido con los servicios de  Google.  Amenaza de seguridad. \"Tratamiento de la información fuera de  los límites manejados por el usuario\"      . Situación que aún  genera desconfianza en algunos usuarios, en especial por la  pérdida  de  privacidad,  pese  a  las  nuevas  tecnologías  de  ciberseguridad.  [30]  [30]  [29]  100 \nA  continuación,  responde  5  preguntas  de  selección  múltiple.  La  evaluación es de tipo formativa, puedes realizarla varias veces.  Interactivo 3.2 . Evaluación formativa - Cloud Computing.  101 \n3.2 Big Data  En principio, el término Big Data se asocia a una colección  de datos que son tan grandes y complejos que ninguna de  las aplicaciones tradicionales de gestión de datos puede  almacenarlos o procesarlos de manera adecuada. Sin  embargo, no hay un consenso sobre una definición del Big  Data, el diccionario de Oxford dice que el Big Data son  \"datos de tamaño muy grande, típicamente hasta el  extremo de que su gestión presenta retos logísticos  significativos\", la  Escuela de Información de Berkeley , por  su parte, dice que el Big Data es un problema a resolver,  pues no se puede definir solo por el volumen o tamaño de  datos, sino que se deben incluir otras variables como la  calidad de esos datos. Una definición que podemos acoger  es la de la empresa consultora Gartner en 2012: \"Big Data  son activos de información caracterizados por su  V olumen  elevado,  V elocidad  elevada y alta  V ariedad , que  demandan soluciones innovadoras y eficientes de  procesado para la mejora del conocimiento y la toma de  decisiones en las organizaciones”    , que da origen a las  primeras tres “ V ” del Big Data.    Algunos ejemplos de Big Data  son las Redes sociales como  el Facebook, pues diariamente se generan e introducen  cientos de terabytes de datos nuevos que incluyen,  principalmente, fotos y videos (1 terabyte es un millón de  megabytes). Otros ejemplos son los repositorios de  artículos científicos, los datos generados por sensores de la  Internet de las Cosas como los capturados de las cámaras  de vigilancia de una ciudad, las transacciones comerciales,  los datos de miles de usuarios de un metaverso, etc.  [31]  102 \n103 \n3.2.1 Las 5V del Big Data  Además de las tres características que Gartner define para el Big  Data, otros autores proponen una cuarta. Pérez      incluye \"el valor  de los datos\",  El-Seoud et al.      y Sánchez      \"la veracidad de los  datos\", cada uno habla de la 4V del Big Data. Sin embargo, es más  común encontrar  las 5V del Big Data , que recoge las dos anteriores    18 .  Antes  de  describir  estas  cinco  características,  es  importante  comprender los tres tipos de Big Data, que dependen del tipo de  datos:  Datos  estructurados.  Son  los  datos  que  pueden  procesarse,  almacenarse y recuperarse en un formato fijo, algo así como un  almacén de datos, en el que los datos se etiquetan y clasifican  (Ibid.).  Datos no estructurados. Datos que carecen de estructura y se  almacenan tal cual, son aleatorios y difíciles de analizar, por lo  que requieren mucho tiempo para su análisis. Entre ellos se  incluyen los mensajes de correo electrónico y los de las redes  sociales.  Datos semiestructurados. Es una combinación de los dos tipos  anteriores de macrodatos. También se conoce como Big Data  híbrido.  En la siguiente infografía, se muestran los significados de cada una de  estas características; para ello, pasa el puntero del mouse sobre cada  una de ellas.  [32]  [35]   [33]  [34]  Otros autores incluyen dos características adicionales: la Viabilidad  y la Visualización  ( Dynamic ,  IIC ). Por su parte, Muniswamaiah et al. hablan de las 10 V del Big Data,  incluyendo la vulnerabilidad, volatilidad y la variabilidad   18  [36]  104 \nInteractivo 3.3 . Las 5V del Big Data (textos: Jasim y Hameed      , y  Srinath  Siddamsetty ).  Ya te habrás dado cuenta que estas características indican que el Big  Data y el  análisis  van de la mano para la toma de decisiones, pues con  \"el análisis se trata de examinar datos para derivar tendencias y  patrones interesantes y relevantes, que se pueden usar para informar  decisiones, optimizar procesos e incluso impulsar nuevos modelos  comerciales\"      .  [34]  [35]  105 \n3.2.2 El Big Data en la Nube  Como lo vimos en el apartado \"Computación en la Nube\", existe una  gran preocupación con respecto a los problemas de privacidad y  seguridad al pasar información a la Nube, que son las principales  causas de por qué algunas empresas y otras organizaciones no se  trasladan a la nube. Sin embargo, la computación en la nube es una  buena  opción  para  almacenar  grandes  cantidades  de  datos  en  diferentes formas y procesarlos a velocidades muy altas.  La computación en la nube es un paradigma  extremadamente exitoso de la computación orientada a  servicios y ha revolucionado la forma en que se abstrae y  utiliza la infraestructura informática. Los tres paradigmas  de nube más populares incluyen: infraestructura como  servicio (IaaS), plataforma como servicio (PaaS) y software  como servicio (SaaS). Sin embargo, el concepto también  puede extenderse a Base de datos como servicio o  Almacenamiento como servicio      .  Esta buena opción se justifica porque en la Nube se eliminan los  costos  de  infraestructura  asociados  al  hardware,  instalaciones  y  servicios públicos y, mejor aún, se facilita el acceso, la gestión, el  análisis y el cómputo de grandes cantidades de datos      .  El-Seoud et al. muestran una estructura común de análisis de Big  Data  de  cuatro  capas  (Figura  3.2),  que  incluye  los  siguientes  componentes  Un sistema de archivos para el almacenamiento de Big Data, es  decir, una gran cantidad de archivos de gran tamaño (fuentes de  datos). Esta capa se implementa dentro del nivel de IaaS.  [35]  [36]  106 \nUn sistema de administración de bases de datos (DBMS) para  organizar los datos y acceder a ellos de manera eficiente. Se  puede ver entre IaaS y PaaS. Los desarrolladores lo usan para  acceder a los datos, pero su implementación se encuentra a  nivel de hardware.  Una  herramienta  de  ejecución  para  distribuir  la  carga  computacional entre las computadoras de la nube. Esta capa  está claramente relacionada con PaaS, ya que es una especie de  'API de software' para la codificación de las aplicaciones Big  Data.  Un sistema de consulta para la extracción de conocimiento e  información  requerida  por  los  usuarios  del  sistema,  que  se  encuentra entre las capas PaaS y SaaS.  Figura 3.2 . Estructura Big Data (Adaptación de la figura 3 de El-Seoud et al.      ).  En  conclusión,  el  Big  data  y  la  computación  en  la  nube  están  estrechamente relacionados. En el Big data se trata más de extraer  [35]  107 \nvalor, mientras que la computación en la nube se enfoca en modelos  de autoservicio escala
