1.3 Creando un chatbot con Di-D   474 \nPrefacio  La inteligencia artificial (IA) está  transformando    prácticamente  todos  los  aspectos  de  nuestras  vidas,  y  el  diseño  de  contenidos  digitales  no  es  una  excepción.  Este  libro  explora  cómo  las  herramientas  y  técnicas  de  IA  pueden  mejorar  y  agilizar  el  proceso  de  creación  de  libros  interactivos,  enriqueciendo  la  experiencia    del    lector    con  contenido    cautivador    y  visualmente    atractivo;    por  ejemplo, la imagen de la portada  es  obra  de  la  IA    Ideogram ,  respondiendo a una indicación de  uno de los autores de este libro.  Tal  como  lo  indica  la  imagen  de  esta página, también diseñada por  Ideogram ,  el  libro  interactivo  se  ha diseñado  sin afanes  ya que,  tal  como  lo  indica  el  refrán  homónimo, fue necesario mucho trabajo para conseguir algo bueno.  A lo largo de estas páginas, descubrirás cómo aplicar la IA generativa  para  generar  estilos  CSS  sofisticados,  mejorar  imágenes,  videos  y  audios, crear presentaciones multimedia impactantes y desarrollar  juegos interactivos cautivadores. Aprenderás a aprovechar el poder  de la síntesis de voz y los efectos de sonido generados por IA para  agregar una nueva dimensión auditiva a tus creaciones.  11 \nTambién, explorarás cómo la IA puede facilitar tareas académicas,  como la generación de cuestionarios y el análisis de documentos de  investigación.  Este  libro  es  el  resultado  de  la  colaboración  entre  académicos  apasionados  por  la  innovación  educativa  y  la  integración  de  las  últimas  tecnologías.  Nuestro  objetivo  es  equiparte  con  las  habilidades  y  conocimientos  necesarios  para  diseñar  libros  interactivos verdaderamente cautivadores, aprovechando al máximo  el potencial de la IA.  Además  de  libros  interactivos,  los  contenidos  aquí  desarrollados  pueden ser útiles para la elaboración de cualquier material o recurso  digital:  páginas  web,  presentaciones,  diseño  digital,  producciones  audiovisuales,  programación  web,  ofimática,  generación  de  contenidos y materiales, etc.  Otro aspecto a destacar de esta obra es que cada parte de la misma  es  útil  por  si  sola  y  ofrece  un  aprendizaje  específico  directa  y  sencillamente  aplicable.  Desde  el  principio  hasta  el  final  todo  es  directamente  aplicable  de  forma  independiente  o  combinada  con  otros recursos.  Cierto es que existen muchos más recursos de los aquí presentados, y  que el avance de la tecnología es vertiginoso e imparable, por ello,  pretendemos sentar una buena base sobre la que construir e integrar  toda  esa  cantidad  y  variedad  de  recursos  que  tanto  nos  pueden  ayudar y que tan útiles pueden llegar a ser.  Ya sea que seas un educador, diseñador, desarrollador o simplemente  un entusiasta de la tecnología, este libro te guiará a través de un  emocionante  viaje  por  el  mundo  de  la  IA  aplicada  al  diseño  de  contenidos  digitales.  Prepárate  para  descubrir  nuevas  formas  de  crear, innovar y cautivar a tus lectores en la era digital.  12 \n\n\nCapítulo I Capítulo I  Estilos CSS con Estilos CSS con  inteligencia artificial inteligencia artificial \n\n1.1 Introducción  Uno de los puntos fuertes de las inteligencias artificiales generativas  es  su  capacidad  para  generar  código  de  programación.  En  este  capítulo  nos  centraremos  en  la  alta  capacidad  que  tienen  estas  herramientas para generar códigos CSS (Hojas de Estilo en Cascada),  que es un lenguaje utilizado para definir el aspecto y la presentación  de un documento HTML o XML. Permite a los desarrolladores web  controlar la apariencia de sus páginas web, incluyendo el diseño, los  colores,  las  fuentes  y  otros  aspectos  visuales.  CSS  funciona  separando el contenido de un documento HTML de su presentación  visual,  lo  que  facilita  la  creación  de  sitios  web  con  un  diseño  coherente y fácil de mantener.  Pasos para obtener y utilizar CSS en un libro interactivo  Tenemos  una  página  a  la  que  queremos  incorporar  determinados  estilos CSS utilizando IA. Realizamos los siguientes pasos:  1.  Accedemos  a  un  chatbot  que  tenga  esta  capacidad,  como  ChatGPT,  Gemini,  Perplexity,  Copilot,  Gemma,  Claude,  entre  otros.  2.  Escribimos  un  prompt  con  instrucciones  claras  y  detalladas  relativas al código que deseamos obtener.  3.  Copiamos el código generado en la hoja de estilos o fichero CSS,  asociado a nuestras páginas del libro.  4.  En nuestras páginas, asociamos los estilos CSS que queremos  aplicar a los correspondientes elementos.  Normalmente, en la mayoría de los casos, la información ofrecida por  las diferentes inteligencias artificiales suele ser bastante completa,  incluyendo:  17 \nCódigo CSS solicitado, en ocasiones con mejoras.  Comentarios de las distintas partes del código.  Explicación de los estilos generados.  Etiquetas para la inserción del código generado en la página  web.  Si se le solicita, también puede generar las etiquetas HTML con  los estilos incorporados.  Además,  los  diferentes  chatbots  permiten  introducir  mejoras  y  modificaciones  en  los  elementos  generados,  de  manera  que,  si  el  resultado obtenido no se ajusta a lo que queremos, podemos pedir  que  se  realicen  los  cambios  y  ajustes  necesarios  hasta  alcanzar  nuestro objetivo.  En los siguientes apartados presentaremos ejemplos concretos de  generación y aplicación de códigos CSS.  18 \n1.2 Diseño de contenedores  En el  archivo mis_estilos.css  hemos iniciado con tres tipos de  estilo. El primero corresponde al estilo de las tablas que usaremos en  el  libro;  un  segundo  estilo,  corresponde  a  las  clases    flota_d   y  flota_i , útil para poner imágenes flotantes en párrafos; el tercer  estilo es la clase  sin_boton , para ocultar (tenuemente) el botón de  videos y objetos interactivos.  En  este  apartado,  presentamos  varios  estilos  de  contenedor,  diseñados por los autores del libro con ayuda de IA. Inicialmente,  explicamos 1   qué  es  un  contenedor  y  cómo  se  puede  diseñar  un  contenedor sencillo.  1.2.1 Contenedores simples  En  CSS,  un  \"contenedor\"  se  refiere  a  un  elemento  HTML  que  se  utiliza para envolver uno o más elementos dentro de una página web  (página  del  libro,  en  nuestro  caso),  con  el  propósito  de  aplicarles  estilos o realizar alguna manipulación específica con ellos. Aunque no  hay  un  elemento  específico  en  HTML  llamado  \"contenedor\",  cualquier elemento puede actuar como tal dependiendo del diseño y  estructura que se desee crear.  Por ejemplo, un  <div>  es frecuentemente usado como contenedor  debido a su naturaleza de bloque y su neutralidad en cuanto a estilo y  semántica. Otros elementos como  <section> ,  <article> ,  <aside> ,  <header> ,  <footer> , y hasta elementos más simples como  <span>  para  contenido  en  línea,  también  pueden  funcionar  como  contenedores.  Para ser honestos, es ChatGPT 3.5 quien hace la explicación, con ayuda humana :-). 1  19 \nSupongamos que queremos crear un contenedor centrado y con un  fondo específico. Podríamos estructurarlo de la siguiente manera:  <div class=\"caja_simple\">     <h1>Título</h1>     Este es un párrafo de ejemplo para ilustrar un     contenedor sencillo en CSS, en el que hemos usado      estilos para el ancho del contenedor, márgenes      externos e internos, color de fondo y sombra      alrededor del contenedor.  </div>  Obviamente, en  mis_estilos.css , debemos establecer los estilos  para este contenedor, que hemos puesto, así:   .caja_simple {  width: 80%; /* Define el ancho del contenedor */   margin: 0 auto; /* Centra el contenedor */  background-color: #f4f4f4;  /* Color de fondo */  padding: 20px; /* Márgenes interiores */  box-shadow: 0 0 10px rgba(0,0,0,0.1); /* Sombra */   }  Obteniendo:  Contenedor simple  Este es un ejemplo de un contenedor sencillo en  CSS, en el que hemos usado estilos para el ancho  del  contenedor,  márgenes  externas  e  internas,  color  de  fondo  y  sombra  alrededor  del  contenedor.  20 \nAlgo importante a tener en cuenta, en el diseño de nuestro libro, es el  modo oscuro. El contenedor anterior, no se verá bien en este modo;  por ello, usamos un estilo, con la siguiente clase:     body.dark .caja_simple {     background-color: #222;    color: #cccccc;    }  En  el  que  ponemos  el  fondo  gris  oscuro  (puedes  probar  con  otro  color) y texto en color blanco:  ¿Cómo nos puede ayudar una IA, para diseñar un contenedor?  Para aquellos que tienen poca práctica con los estilos CSS, es normal  que  no  recuerden  algunos  estilos  útiles  para  el  diseño  de  contenedores, lo que demanda algo de tiempo en la consulta de los  estilos  que  se  ajusten  al  diseño  deseado.  Es  aquí  donde  las  IA  generativas de texto, nos dan una gran ayuda, pues sólo tenemos que  pedirle el código CSS,  indicando  los atributos de nuestro contenedor.  Algunos modelos de lenguaje grande (LLM), se han diseñado para  generar código en diferentes lenguajes, tales como  CodeGemma-7B ,  Code  Llama   y    Mistral   entre  otros;  sin  embargo,  chatbots  como  ChatGPT ,  Gemini  y  Claude , generan código bastante confiable.  21 \n1.2.2 Contenedores complejos  Seguramente,  en  algún  momento,  se  nos  habrá  ocurrido  un  contenedor  con  atributos  no  tan  simples  como  el  anterior.  Por  ejemplo, supongamos que se nos ocurre diseñar un contenedor con  las siguientes características: ancho del 70% de la página, centrado  horizontalmente, márgenes internas de 20 pixeles, fondo degradado  de amarillo a turquesa, bordes suavemente curvos, con una sombra  degradada a la derecha y hacia abajo y, finalmente, el título en negrilla  de 20 pixeles centrado.  Esta ocurrencia, podemos  indicársela  a una de nuestras IA. Lo hemos  hecho  en    Gemini ,  iniciando  con  \"Dame  el  código  css  para  un  contenedor de ancho del...\" y luego el resto de nuestra ocurrencia.  Este fue el código generado:  Sólo hemos cambiado el nombre del contenedor por  caja_compleja  y lo hemos puesto en nuestra hoja de estilos.  22 \nEste es el resultado obtenido:  Título  Este es un párrafo de ejemplo para ilustrar  un contenedor complejo en CSS, en el que  hemos  usado  estilos  para  el  ancho  del  contenedor, márgenes externas e internas,  color de fondo degradado, bordes curvos,  sombra alrededor del contenedor y título  centrado.  Quizá, parte del resultado no nos guste, insatisfacción que podemos  solucionar sin ayuda de la IA, pues basta con modificar algún atributo,  como  reducir  el  ancho  de  la  sombra  o  aumentar  el  ancho  del  contenedor.  Otro ejemplo, es pedirle a uno de los chatbots citados que nos genere  un contenedor para introducir dicho texto con unas determinadas  características.  Prompt:   Genera  un  código  CSS,  tipo  clase,  para  un  contenedor  que  tenga las siguientes características: que sea una caja centrada con fondo  semitransparente al 70%. Color degradado de fondo del arco iris con  forma circular, con borde marrón de 10 px, esquinas redondeadas con  15px, con sombra hacia la derecha y hacia abajo de 10 px, varios colores  de letras de texto, el título principal en verde claro, que tenga un título  principal y uno secundario en amarillo, el texto que no es título en gris  claro. El texto debe aparecer en el centro con un tamaño de letra de 36  px para el título principal, de 32 px para el título secundario y de 28 px  para el texto y tener márgenes internos y externos. El ancho de la caja  debe ser del 90 %.  23 \nTítulo principal  Título secundario  Línea de texto  Código CSS   .contenedor {    width: 90%;     margin: 0 auto;    background-color: rgba(255, 0, 0, 0.7);    background-image: conic-gradient(red, orange,    yellow, green, blue, indigo, violet);     border: 10px solid brown; /* Borde marrón de 10 px */    border-radius: 15px;     box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.5);      text-align: center;    padding: 10px;  }  .contenedor h1 {     font-size: 36px; color: lightgreen;  }  .contenedor h2 {    font-size: 32px; color: yellow;   }  .contenedor p {    font-size: 28px; color: lightgray;  }      24 \nE  M  1.3 Textos especiales  Existe  la  posibilidad  de  introducir  diferentes  estilos  en  textos  mediante  CSS  generados  por  IA.  A  continuación,  presentamos  algunos ejemplos.  1.3.1 Primera letra de un párrafo en tamaño grande  Le pedimos a ChatGPT el código CSS para que la letra inicial de un  párrafo tuviera un tamaño 60px, este fue el estilo obtenido:  p.letra1:first-letter {  font-size: 60px;   display: block;  float: left;  line-height: 0.5;  margin: 15px 15px 10px 0;  }  El cual aplicamos a los siguientes párrafos:  l  uso  de  la  primera  letra  del  párrafo  en  tamaño  grande,  conocida  como  \"capitular\"  o  \"letra  capital\",  es  una  técnica  estilística  empleada  en  varios  estilos  de  escritura  y  diseño.  Aquí te menciono algunos contextos en los que se utiliza:  anuscritos  Iluminados  Medievales,  Libros  Antiguos  y  Clásicos, Diseño Editorial Moderno (revistas, periódicos y  libros  actuales,  las  letras  capitulares  son  una  técnica  de  diseño común para añadir un toque de elegancia y atraer la atención  del lector al inicio de un artículo o capítulo), Libros de Cuentos y  Literatura  Infantil,  Textos  Religiosos  y  Ceremoniales  y  Diseño  Tipográfico y Caligrafía Artística.  25 \n1.3.2 Texto en 3D  TEXTO    EN    3D    con TEXTO    EN    3D    con TEXTO    EN    3D    con TEXTO    EN    3D    con TEXTO    EN    3D    con TEXTO    EN    3D    con TEXTO    EN    3D    con TEXTO    EN    3D    con TEXTO    EN    3D    con  Claude Claude Claude Claude Claude Claude Claude Claude Claude  TEXTO EN 3D con TEXTO EN 3D con TEXTO EN 3D con TEXTO EN 3D con TEXTO EN 3D con  ChatGPT 3.5 ChatGPT 3.5 ChatGPT 3.5 ChatGPT 3.5 ChatGPT 3.5  1.3.3 Textos animados  ¡Texto con Efecto \"Chulo\"! ¡Texto con Efecto \"Chulo\"!  Texto a  ¡Texto  que  se  achica,  crece  y  gira!  26 \n1.4 Efectos en contenedores de texto  CSS  ofrece  una  amplia  gama  de  posibilidades  para  crear  efectos  impactantes en textos, contenedores y elementos complementarios.  Las    herramientas    de    inteligencia    artificial    han    facilitado  enormemente la generación de estos efectos.  A continuación, presentaremos un ejemplo que ilustra varios casos  de generación de efectos mediante estilos CSS. Le proporcionamos a  ChatGPT las siguientes instrucciones:  Prompt:  Crea una página web con un contenedor de texto responsivo  que incluya varios efectos de hover. Cada efecto debe aplicarse a una  caja  con  texto.  Los  efectos  deben  ser  variados,  incluyendo  desplazamiento y cambio de color, zoom y sombra con efecto de \"blur\",  fondo  semi-transparente  con  animación  de  movimiento,  rotación  y  cambio  de  opacidad,  borde  animado,  cambio  de  tamaño,  fondo  con  degradado animado, texto deslizante al pasar el ratón, sombras internas,  texto subrayado al pasar el ratón, vibración y oscilación. Asegúrate de  que los efectos sean coherentes en estilo y que sean visibles al pasar el  ratón sobre las cajas. La página debe ser completamente responsiva,  ajustándose correctamente en pantallas pequeñas.  Asegúrate de utilizar HTML y CSS para crear la estructura y estilos de la  página respectivamente. Define clases CSS para cada efecto y aplica  estas clases a las cajas de texto correspondientes en el HTML.  Asegúrate de que los efectos se activen al pasar el ratón sobre las cajas  de texto y que vuelvan a su estado original al retirar el ratón. Además,  implementa  las  animaciones  y  transiciones  de  manera  suave  y  coherente.  Una  vez  que  hayas  completado  la  página,  comprueba  su  funcionamiento en diferentes tamaños de pantalla para garantizar que  los efectos y la disposición del contenido se ajusten correctamente en  todos los dispositivos.  El código HTML completo generado se recoge en el siguiente  enlace .  27 \n28 \nIncluso podemos hacer que la acción sea interactiva. Pondremos un  ejemplo.  Hemos  pedido  que  se  nos  genere  un  contenedor  que  podamos cambiar de color al pulsar un botón con el nombre del color  correspondiente.  Además,  hemos  solicitado  que  el  citado  control  también se ilumine de dicho color al ser activado. El resultado que  nos dio ChatGPT fue el siguiente.  El código HTML5 obtenido se puede ver en el siguiente  enlace .  Cabe  mencionar  que  una  vez  obtenido  el  código,  éste  puede  ser  fácilmente retocado si así lo deseamos, cambiando simplemente el  valor del parámetro que queramos modificar.  29 \n1.5 Tablas con estilo  Vamos a comenzar con una tabla de cuatro filas y tres columnas con  el estilo que tenga por defecto.  Dato 1.1   Dato 1.2   Dato 1.3  Dato 2.1   Dato 2.2   Dato 2.3  Dato 3.1   Dato 3.2   Dato 3.3  Dato 4.1   Dato 4.2   Dato 4.3  Prompt:  Crear estilos CSS mediante clases para una tabla HTML que  haga lo siguiente: al pasar el ratón por cada una de las celdas de la tabla  cambiar el color de fondo a azul, de borde a rojo y de letra a gris cambie  de la celda de forma independiente. También se debe cambiar al pasar el  ratón por cada celda y de forma independiente el tamaño de letra al  doble y el grosor del borde de la celda al cuádruple. Los cambios deben  producirse con un retardo de 0.5 s.  Dato 1.1   Dato 1.2   Dato 1.3  Dato 2.1   Dato 2.2   Dato 2.3  Dato 3.1   Dato 3.2   Dato 3.3  Dato 4.1   Dato 4.2   Dato 4.3  Este es el  código CSS .  Código HTML  <table class=\"content-table\">  30 \n1.6 Efectos en imágenes  A  una  imagen,  podemos  aplicarle  efectos  visuales  mediante  CSS  generado por IA; por ejemplo, usando el siguiente prompt:  Prompt:  Estilo CSS para un contenedor con una imagen que, al pasar el  cursor por el contenedor, aparece otra imagen. La imagen debe de estar  centrada, con borde de grosor 10px y esquinas redondeadas. Al pasar el  cursor también debe cambiar el color y el ancho del borde al doble. El  cambio debe llevar un retardo de 1s.  Obteniendo:  código CSS .  código HTML .  31 \n1.7 Reemplazo de texto  Supongamos  que  queremos  diseñar  una  página  de  preguntas  y  respuestas,  pero  sólo  queremos  que  se  muestren  las  respuestas  correctas  cuando  se  pase  el  cursor  por  el  enunciado  de  la  correspondiente pregunta. Además, cada respuesta se debe mostrar  en diferente color y tamaño respecto de su pregunta. Presentamos  un pequeño ejemplo:  Pregunta: ¿Cuál es la capital de Francia?  Prompt:  Genera un estilo CSS para un contenedor con un texto, con  color de fondo que, al pasar el cursor por el contenedor, aparece otro  texto  debajo  del  primero  (estilo  pregunta-respuesta).  El  nuevo  texto  debe  tener  tamaño  doble  y  color  verde  oscuro.  El  color  de  fondo  también debe cambiar. El cambio debe llevarse con cierto retardo. El  contenedor debe estar centrado en la página.  código CSS .  código HTML .  Otro  caso  puede  ser  pedir  que  un  texto  se  reemplace  por  otro  diferente al pasar el cursor sobre él.  Prompt:  Genera un estilo CSS en el que haya un texto con un color y  tamaño. Al pasar el cursor por dicho texto, este debe ser cambiado por  otro texto diferente que además tenga distinto tamaño y color. Ambos  textos deben aparecer en la misma posición, centrados en una línea.  ¿Cuál es la capital de Francia?  32 \n¡Pon a volar tu  imaginación y  encuentra otros  estilos con ayuda  de una IA!  Texto Original  33 \n\nCapítulo II Capítulo II  Imágenes con ayuda de IA Imágenes con ayuda de IA \nEn este capítulo, nos ocuparemos del diseño  de un libro con la incorporación de imágenes,  pero  más  allá  de  obtenerlas  con  IA  generativas    de    imagen,    que    podemos  consultar en \" IAS generativas 2024 \", nuestro  propósito  es  usar  la  IA,  para  que  estas  imágenes decoren, a nuestro gusto, el libro y,  además, mejorar o transformar la imagen.  2.1 Contenedores de imágenes  Un  primer  ejercicio  es  usar  contenedores  o  cajas, cuyo fondo es una imagen; por ejemplo,  es común en algunos libros y revistas poner  un banner horizontal o vertical como lo hemos  hecho en estas dos primeras páginas. Veamos,  ahora, cómo una IA nos ayudó con ello.  Usando  la  IA    GPT-4o ,  recién  lanzada  al  público (mayo de 2024), le dimos la siguiente  indicación:  Tengo  una  página  de  640x825  pixeles  ¿cuál  es  el  código  CSS,  para  un  contenedor    de    300x825    pixeles  posicionado  al  lado  derecho  de  la  página?, el fondo del contenedor debe  ser una imagen  La  IA  nos  generó  la  clase    .contenedor-  derecha , la cual incluye nueve estilos:  1.  position: absolute;  36 \n2.  top: 0;  3.  right: 0;  4.  width: 300px;  5.  height: 825px;  6.  background-image:    url('tu-  imagen.jpg');  7.  background-size:    cover;    /*  Ajusta  la  imagen  para  cubrir  todo el contenedor */  8.  background-position: center;  /*  Centra  la  imagen  dentro  del  contenedor */  9.  background-repeat:  no-repeat;  /* Evita que la imagen se repita  */  Incluimos  esta  clase  en  nuestra  hoja de estilos, con la imagen que  se  observa  en  esta  página.  Una  vez  comprendimos  la  clase,  diseñamos  el  banner  vertical  izquierdo,  cambiando    right:0;  por    left:0; ,    width:  300px;  por  width: 200px;  y la imagen.  Obviamente,    cada    vez    que  invoquemos  estas    clases ,  nos  pondrá las mismas imágenes; sin  embargo,    en    el    HTML    la  podemos cambiar, así:  37 \n<div class=\"contenedor-derecha\"   style=\"background-image:  url('images/cap2/21.png');\"></div>  Tal  como  lo  hemos  hecho  con  el  banner  de  esta página.  2.2 Eliminación de fondos  En algunas ocasiones, se nos ocurre presentar  una  imagen  sin  fondo.  Existen  varias  herramientas  de  IA  que  nos  pueden  dar  la  mano, una de ellas es  removal.ai , con la cual  hemos  hecho  el  ejercicio  mostrado  en  el  control  deslizante  de  la  siguiente  página.  Otras opciones son  remove bg ,  PIXLR ,  Canva ,  Hotpot ,  Adobe  y  PIXELCUT .  La  remoción  de  fondos,  no  necesariamente  requiere de una IA generativa, pues algunas  herramientas de dibujo como Gimp, Adobe y  PowerPoint ofrecen esta opción para fondos  homogéneos; sin embargo, en fondos menos  simples,    se    requiere    una    herramienta  impulsada  por  IA  que  use  algoritmos  avanzados  de  visión  por  computadora  para  detectar el píxel de primer plano y separar el  fondo de ese primer plano.  Algunas de las herramientas anteriores, dan  como  resultado  imágenes  de  más  baja  resolución, algo que podremos solucionar más  adelante.  38 \n39 \n2.3 Uso de viñetas  Por Édgar Herrera Morales  Un ejemplo de la necesidad de remover un  fondo,  lo  presentamos  en  la  viñeta  que  aparece  en  la  esquina  superior  izquierda  de esta página, fondo que removimos y presentamos en la esquina  inferior derecha.  En el contexto del diseño de libros, la palabra \"viñeta\" también es  adecuada  y  comúnmente  utilizada  para  referirse  a  los  adornos  decorativos en las esquinas o en otras partes de la página. Las viñetas  pueden ser ilustraciones o adornos ornamentales que embellecen el  diseño del libro.  Estas imágenes que se colocan en las esquinas de una página para  embellecer el diseño se conocen también como \"adornos de esquina\"  o  \"esquinas  decorativas\".  Estos  elementos  decorativos  pueden  ser  utilizados para añadir un toque estético y sofisticado a las páginas de  un libro, enmarcando el contenido de manera atractiva.  Estos adornos pueden tener diversas formas y estilos, desde simples  elementos geométricos hasta diseños más elaborados y detallados,  como filigranas, motivos florales o patrones artísticos. En inglés, se  les puede llamar \"corner ornaments\" o \"corner decorations\".  Algunos repositorios como  https://www.pngwing.com/ , ofrecen una  extensa variedad de  corner ornament  o  vignette\" .  En  la  siguiente  página  hemos  usado  una  viñeta  descargada  de  pngwing . Pero, ¿cómo se colocan estas viñetas?  40 \nRecurrimos a ChatGPT, con el siguiente prompt:  Tengo  una  página  de  640x825  pixeles,  ¿qué  estilo  CSS  me  recomendarías  para  poner  dos  viñetas  en  las  esquinas  superior  izquierda e inferior derecha?  Respuesta . Para colocar viñetas en las esquinas superior izquierda e  inferior  derecha  de  una  página  de  640x825  píxeles  usando  CSS,  puedes usar la propiedad  position  para posicionar  absolutamente  las  imágenes de las viñetas. Aquí te dejo un ejemplo de cómo hacerlo:  Asegúrate de que las viñetas estén en formato de imagen (como PNG  o SVG) y que tengan un tamaño adecuado para las esquinas. Usa las  siguientes  reglas  CSS  para  posicionar  las  viñetas  en  las  esquinas  superior izquierda e inferior derecha:    <style>   .vignette {          position: absolute;         .top-left {             top: 0;              left: 0;         }         .bottom-right {             bottom: 0;              right: 0;         }   </style>  Algo similar hicimos con las viñetas de esta página, usando \"top: 0px;  right:0px\"  y  \"left:0px;  bottom:0px\".  Usando  una  sola  imagen,  la  rotamos   para  ponerla  en  la  parte  inferior  de  la  página  \"left:0px;  bottom:0px, rotate:180deg\".  41 \n2.4 Texto en imágenes  El  desarrollo  de  IA  generativas  de  imagen,  ha  presentado  varios  retos, uno de ellos es la aparición de deformidades en un cuerpo  humano (tres brazos o piernas, manos de más de cinco dedos, caras  deformes, entre otros), reto que ha sido superado por muchas IA. Un  segundo reto es lograr incorporar un texto dentro de la imagen, de tal  forma que no sea una simple superposición, tal como se muestra en el  siguiente objeto interactivo:  Las imágenes anteriores fueron obtenidas con la IA Ideogram con la  versión anterior a la actualización de abril de 2024. La imagen de la  siguiente página la generamos con la versión actual (mayo de 2024).  42 \n43 \n2.4.1 Prompt mágico de Ideogram  La imagen anterior, la obtuvimos con esta indicación: \"La fruta de una  piña al lado de un cóctel de piña, al fondo hay una playa y algunas  palmeras, incluye un letrero que dice 'Piña colada'\".  Ideogram   nos  generó  cuatro  imágenes  y,  además,  una  sugerencia  para cambiar la indicación, que denomina \"prompt mágico\", este es el  propuesto:  A vibrant tropical scene featuring a fresh pineapple and a piña colada  cocktail  on  a  wooden  table.  The  pineapple  is  adorned  with  a  small  umbrella  and  a  cocktail  straw.  Behind  the  table,  a  pristine  beach  stretches out, with gentle waves lapping at the shore. Palm trees sway in  the  background,  providing  shade  to  sunbathers  and  beachgoers.  A  handmade sign reading \"Piña Colada\" hangs above the table, adding a  touch of beachside charm to the scene.  Nótese que está en inglés que, como se observa en el anterior objeto  interactivo, permite obtener mejores resultados:  44 \n2.4.2 El designer de Copilot con tecnología DALL·E 3  Tanto el prompt inicial (en español) como el mágico de Ideogram (en  inglés),  lo  usamos  con  la  herramienta    Designer   de  Copilot,  obteniendo excelentes imágenes, pero sin lograr que pusiera la letra  Ñ  en el letrero. He aquí algunas imágenes obtenidas:  Las  tres  primeras  imágenes  fueron  obtenidas  con  el  prompt  en  español.  45 \n2.5 Imágenes escaladas y mejoradas (ESRGAN)  En  algunas  ocasiones  nos  encontramos  con  una  imagen  de  dimensiones pequeñas, que al usar la función  image_expand  del libro,  aparece  muy  borrosa,  por  lo  que  recomendamos  eliminar  esta  función en la etiqueta  <img> ; sin embargo, podemos usar algunas  herramientas de inteligencia artificial, para ampliar el tamaño de la  imagen sin pérdida de resolución y, en otros casos, mejorar la imagen.  En este último caso, se suele usar la  Red Adversaria Generativa de  Superresolución (SRGAN)  En el portal  github.com , nos dan la siguiente descripción del SRGAN  mejorado (ESRGAN):  En  pocas  palabras,  las  técnicas  de  superresolución  de  imágenes  (SR)  reconstruyen una imagen o secuencia de mayor resolución (HR) a partir  de  imágenes  observadas  de  menor  resolución  (LR),  por  ejemplo,  ampliación de una imagen de 720p a 1080p.  Uno de los enfoques comunes para resolver esta tarea es utilizar redes  neuronales convolucionales profundas capaces de recuperar imágenes  HR a partir de imágenes LR. Y ESRGAN (SRGAN mejorado) es uno de  ellos.  Puntos clave de ESRGAN:  Arquitectura basada en SRResNet con bloques residuales  Mezcla de pérdidas contextuales, perceptivas y adversarias. Las  pérdidas de contexto y de percepción se utilizan para mejorar la  imagen  de  forma  adecuada,  mientras  que  la  pérdida  adversa  empuja  la  red  neuronal  a  la  variedad  de  imágenes  naturales  utilizando  una  red  discriminadora  que  está  entrenada  para  diferenciar  entre  las  imágenes  súper  resueltas  y  las  imágenes  fotorrealistas originales.  46 \nHemos usado las siguientes herramientas de IA:  KREA ,  Leonardo ,  ai  Nero ,  Hugging Face  y  real-esrgan , para ampliar y mejorar la imagen  de  la  piña  colada  generada  por  Ideogram.  En  el  siguiente  objeto  interactivo, se presentan los resultados obtenidos:  47 \n2.6 Presentadores de imágenes  En  páginas  anteriores,  hemos  usado  diferentes  tipos  de  presentadores  de  imágenes;  por  ejemplo,  en  la    página  42  presentamos ocho imágenes, haciendo clic sobre un botón, o en la  página  45 ,  haciendo  clic  sobre  las  imágenes,  presentamos  cinco  relacionadas con la \"piña colada\".  Nos hemos hecho la siguiente pregunta ¿será que las IA generativas  de  código,  que  hemos  estado  usando,  pueden  generar  un  código  HTML para un presentador de imágenes? pues... la respuesta es ¡Sí!  2.6.1 Presentación tipo slide  Recurrimos  a  ChatGPT  con  el  siguiente  prompt:  \"Dame  el  código  HTML para una presentación tipo slide de 5 imágenes de tamaño  540x540  pixeles\",  nos  sorprendió  con  un  código  completamente  funcional; sin embargo, observamos que no era responsivo, por lo que  le pedimos:  Dame el mismo código anterior pero que sea responsivo.  Su respuesta fue el siguiente  código .  Puedes observar que incluye estilos CSS, puestos en una etiqueta  <style> . Solo cambiamos el nombre de las imágenes y el color de  fondo de los botones de desplazamiento.  Usamos  las  mismas  imágenes  de  la  piña  colada  ( página  42 ),  obteniendo el presentador que se observa en la siguiente página, en  el que las diapositivas (slides) se desplazan con un movimiento suave  de derecha a izquierda.  48 \nAlgo curioso observamos al volver a pedir el código a ChatGPT, pues  nos dio una presentación tipo \"slide\", pero con los siguientes cambios  significativos: los botones de desplazamiento muestran su color de  fondo solo al poner el puntero del ratón sobre ellos, el cambio de las  diapositivas ya no es con el desplazamiento horizontal y, además,  incluye un menú inferior para seleccionar las diapositivas. Este nuevo  modelo se puede observar  aquí .  49 \n2.6.2 Presentación tipo slide con clic sobre la imagen  Le pedimos a Claude que nos diera el código para una presentación  similar a la de la  página 45 , con el siguiente prompt: \"Dame el código  HTML para una presentación donde al hacer clic sobre la diapositiva  actual  aparece  la  siguiente  diapositiva  con  un  zoom  creciente,  la  presentación es de 5 imágenes de tamaño 540x540 pixeles, debe ser  responsive\".  El  código  obtenido  se  puede  ver    aquí ,  y  esta  es  la  presentación obtenida:  No todo es color de rosa, pues lo de \"responsivo\" parece que Claude  lo  entiende  mal  y  menos  lo  del  zoom;  sin  embargo,  al  ampliar  la  presentación  se  elimina  la  distorsión.  Con  el  mismo  prompt,  recurrimos  a  ChatGPT,  obteniendo  este    código   y  la  siguiente  presentación:  50 \nAhora si se muestra el zoom al hacer clic sobre una imagen, no como  lo queríamos, pero el efecto le da mayor impacto a la presentación.  A continuación, hemos puesto otros resultados, en los que hemos  pedido una presentación 3D tipo cubo (va bien en pantalla ampliada)  y  otra  en  forma  de  acordeón;  obviamente,  habrá  que  mejorar  las  indicaciones, para que las IA nos den mejores resultados.  51 \n2.6.3 Presentación 3D tipo cubo  En este ejercicio, le dimos la siguiente indicación a ChatGPT: \"Dame  el código HTML para una presentación diapositivas de 5 imágenes de  tamaño 540x540 pixeles con una transición entre diapositivas 3D  tipo  cube,  debe  ser  responsive  y  tener  los  botones  para  pasar  diapositivas\".  Obteniendo  este    código  HTML   y  la  siguiente  presentación:  52 \n2.6.4 Otros tipos de presentaciones  53 \n2.7 Imagen con lupa  Dame  un  archivo  HTML  que  contenga  una  imagen  de  540x540  pixeles e incluya una lupa circular de radio 80px que en su interior  aumente la imagen observada en 3x, la lupa debe poder desplazarse  con el mouse, el archivo es responsivo  ¡Bien por  Copilot !  54 \nLe dimos el código generado por Copilot de Microsoft a ChatGPT,  para que pusiera cuatro botones que permitiera cambiar el zoom de  la lupa, obteniendo este  código  y esta presentación:  55 \n2.8  Comparación  de  imágenes  con  control  deslizante  En  la    página  47   presentamos  una  escena  interactiva  que  usa  el  control deslizante, para comparar dos imágenes.  Hicimos  un  ejercicio  con  diferentes  herramientas  de  inteligencia  artificial, para tratar de obtener un código que ejecutará una escena  similar, usando la siguiente indicación:  Dame el código HTML que muestre en el mismo recuadro dos imágenes  superpuestas de 540x540 pixeles en la mitad izquierda se muestra la  primera imagen y en la mitad derecha la segunda imagen, en el medio  hay  un  control  tipo  deslizante  que  al  desplazarlo  a  la  derecha  va  mostrando el resto de la primera imagen y si se desplaza a la izquierda va  mostrando la segunda imagen.  Iniciamos con ChatGPT, que nos generó este  código . Pero, si bien  cumple con el prompt, se genera una sombra azul al mover el control,  tal como se muestra en la siguiente imagen:  56 \nFue Gemini 1.5 Pro la IA que nos generó la escena interactiva, sin  problema alguno, la cual mostramos, a continuación, de acuerdo al  código  dado por Gemini:  Sin embargo, la línea horizontal no nos gustó, por lo que subimos el  código  de  Gemini  a  la  IA  Claude  y  le  pedimos:  \"Quita  la  línea  horizontal y pon una vertical sobre el control deslizante\".  57 \nAlgo  inesperado  se  presentó,  pues  Claude  hizo  el  cambio  que  solicitamos, dándonos este  código . Lo inesperado es que el control ya  se mueve verticalmente:  Como lo que queríamos era eliminar la línea horizontal, le pedimos a  Claude: \"Conserva la línea horizontal, pero con fondo transparente,  dejando la imagen del control\", para lo cual nos dio este  código .  58 \nLas imágenes que hemos usado en este apartado es la misma de la  portada  de  este  libro,  pero  modificada  con  la  herramienta  de  IA  Stylar  El escalado de las últimas escenas interactivas, lo hemos hecho con el  editor  DescartesJS,  en  solo  dos  pasos,  que  describimos  a  continuación.  59 \nPaso 1 en DescartesJS  Creamos  una  escena  de  540x540  y  con  la  opción    escalar   en  expandir escena  Paso 2 en DescartesJS  Creamos  un  espacio  tipo    HTMLIframe   que  cargue  el  archivo  del  control deslizante, guardamos con el nombre que queramos y... eso es  todo.  60 \n2.9 Retornando a las imágenes con texto  La generación de imágenes a través de la inteligencia artificial ha  experimentado un avance sorprendente en muy poco tiempo, tanto  en calidad como en variedad. Un aspecto que hasta ahora se había  resistido era la integración de textos en imágenes. Las principales  causas  de  ello  han  radicado  en  la  necesidad  de  comprender  y  combinar  de  manera  efectiva  aspectos  visuales  y  lingüísticos,  manteniendo la legibilidad, coherencia y estética del texto integrado.  También ha habido desafíos técnicos y cuestiones relacionadas con la  creatividad y la originalidad.  Sin  embargo,  la  evolución  en  este  aspecto  también  está  siendo  significativa  y  muy  probablemente,  más  pronto  que  tarde,  las  imágenes generadas con IA podrán contener textos a la medida de la  petición de sus usuarios.  En este apartado se pretende realizar una revisión del estado actual  de esta temática en una serie relativamente amplia de inteligencias  artificiales  con  acceso  gratuito  para  la  generación  de  imágenes.  Dentro de un tiempo no muy lejano este texto podrá servir como  referencia comparativa de la evolución experimentada en este campo  de las inteligencias artificiales generativas. Actualmente, hay algunas  IA que integran bastante bien texto en imágenes.  Ideogram  Actualmente es la mejor inteligencia artificial que hemos encontrado  para  la  integración  de  texto  en  imágenes.  Incluye  los  textos  con  independencia del idioma, bien acoplados en el contexto de la imagen  y con muy buena calidad. Además, dispone de una opción de mejora  de prompt llamada \"prompt magic\", que enriquece las instrucciones  permitiendo mejorar la calidad y los resultados.  61 \nEn ocasiones no incluye el texto o comete algún error en el mismo,  pero  normalmente,  con  varios  intentos  se  consigue  el  resultado  deseado.  Además  de  la  buena  integración  de  textos  en  imágenes,  cabe  destacar la calidad de las ilustraciones generadas y la fidelidad a las  instrucciones dadas.  Incluimos diferentes pruebas para la realización de una portada para  el  libro  \"Gamificando  con  juegos  AJDA\".  Aunque  con  algunas  variaciones, el prompt utilizado fue el siguiente. Además, se adjunta  el magic prompt que genera la propia IA.  Prompt:  Una portada atractiva y realista para el libro \"Gamificando con  juegos AJDA\" de \"Jesús M. Muñoz Calle\" (las letras del autor deben ir en  el mismo color). La primera parte presenta una imponente carabela del  siglo XVII navegando en alta mar, capturando la sensación de aventura y  exploración. La segunda parte muestra un mapa futurista del mundo  dividido  en  cuatro  países,  reflejando  una  visión  innovadora  y  progresista. La tercera parte incluye un trofeo de un torneo deportivo  de  conocimientos,  simbolizando  la  competencia  y  el  desafío  en  el  aprendizaje. El diseño completo es cautivante y atractivo para aquellos  interesados en juegos y aprendizaje.  Magic prompt:  An eye-catching and realistic cover design for the book  \"Gamificando  con  juegos  AJDA\"  by  Jesús  M.  Muñoz  Calle.  The  first  section features a magnificent 17th-century caravel sailing across the  open sea, capturing the sense of adventure and exploration. The second  section showcases a futuristic world map divided into four countries,  reflecting  an  innovative  and  progressive  vision.  The  third  section  includes  a  trophy  from  a  sports  knowledge  tournament,  symbolizing  competition and challenge in learning. The overall design is captivating  and appealing for those interested in games and learning.  Se utiliza una galería de imágenes programada con IA para presentar  las diferentes ilustraciones generadas. Pulsando sobre una imagen se  pasa a la siguiente o cada 5 segundos se produce la transición de  forma automática.  62 \n63 \nPresentamos  también  una  galería  de  imágenes  realizada  con  Ideogram para el diseño de un recuerdo del IES Joaquín Turina. Se  utiliza una transición suave para pasar las diapositivas a intervalos de  3 segundos.  Prompt:  Imagen de estilo muy realista. Trofeo de metacrilato con una  base en ancha rectangular. En la base debe haber una placa ancha con la  inscripción \"El IES Joaquín Turina en agradecimiento por tu labor\". El  metacrilato debe tener referencia al \"IES Joaquín Turina\".  64 \nDesigner de Copilot  Es  la  segunda  mejor  aplicación  encontrada.  Es  capaz  de  escribir  textos en español, en alguna ocasión, incluso incorpora la letra \"ñ\",  pero normalmente incluye algún error tipográfico. Sin embargo, en  inglés  comete  menos  errores  al  integrar  los  textos,  aunque  sigue  siendo  frecuente  su  aparición.  Realizando  suficientes  intentos  se  puede  conseguir  obtener  el  resultado  deseado.  Esto  también  depende de la longitud y la complejidad de los textos.  A partir de ahora trabajaremos con cuatro sencillos prompts para  analizar  la  introducción  de  textos  en  imágenes  por  las  diferentes  inteligencias  artificiales.  Dos  en  lengua  española  y  dos  en  lengua  inglesa. El motivo de utilizar instrucciones sencillas es para que prime  la integración de los textos en las imágenes, más que el diseño de las  ilustraciones  en  sí  mismas.  A  partir  de  los  mismos  realizaremos  baterías  de  prueba  y  seleccionaremos  los  resultados  más  significativos.  Prompt:   Genera  una  imagen  en  la  que  aparezca  en  español  el  texto  \"Bienvenidos a la Tierra\"  Prompt:   Genera  una  imagen  en  la  que  aparezca  en  español  el  texto  \"Feliz año 2025\"  Prompt:   Generate  an  image  in  which  the  text  \"Welcome  to  Earth\"  appears in English  Prompt:  Generate an image in which the text \"Happy New Year 2025\"  appears in English  En  la  siguiente  galería  de  imágenes  se  presenta  la  selección  de  imágenes con texto generadas por  Designer  de  Copilot . En ellas se  pueden  observar  unos  muy  buenos  resultados  para  los  textos  en  inglés y resultados aceptables para los escritos en español.  65 \n66 \nLeonardo AI  Hasta  junio  de  2024,  admitía  algunos  textos  en  inglés,  no  así  en  español, con resultados poco satisfactorios.  Sin embargo, en junio de 2024, Leonardo AI saca su estilo  Leonardo  Phoenix ,  obteniendo  unos  magníficos  resultados,  tanto  en  español  como en inglés.  67 \nEn los siguientes ejemplos se puede ver el resultado de los prompts  en español. Las imágenes se obtuvieron correctamente en el primer  intento.  Es  significativo  que  incluso  la  virgulilla  de  la  letra  ñ  es  representada correctamente.  68 \nIncluso,  planteamos  realizar  la  portada  de  este  libro  interactivo  utilizando  este  estilo,  en  la  cual  debería  incluirse  su  título.  Salvo  pequeños fallos en el texto, los resultados fueron muy buenos.  69 \nTambién generó una buena imagen y en el primer intento de nuestra  \"piña colada\", virgulilla incluida. Una vez generada se puede mejorar,  cambiar de tamaño, animarla, quitarle el fondo...  70 \nRecraft  Se obtienen muy buenos resultados con textos en inglés. En español  los resultados son bastante deficientes.  71 \nAdobe Firefly  Buenos resultados en inglés. Prácticamente nulos en español.  72 \nNightCafé  Permite introducir textos en inglés y crea animaciones cortas de las  imágenes creadas. Debe utilizarse el modelo DALL-E3 que se ofrece  de forma limitada. No siempre realiza las creaciones correctamente,  pero  si  se  realizan  varios  intentos  se  suele  conseguir  con  textos  cortos. Si se pone en español otro idioma la creación es bastante  deficiente.  73 \n74 \nPlayground  Buenos resultados en inglés. Malos resultados en español.  75 \nOpenArt  Buenos resultados en inglés. Muy deficientes en español.  76 \nLexica  Se obtienen ciertos resultados en inglés. No así en español.  77 \nMagic Studio  Se obtienen ciertos resultados en inglés. No así en español.  78 \nProme AI  Se obtienen algunos textos en inglés, no para el caso del español.  79 \nStable Diffusion  Introduce algunos textos en inglés, pero no en español.  80 \nOtras IA que se han analizado  Se  ha  probado  la  introducción  de  textos  en  la  relación  que  se  presenta a continuación, habiendo obtenido resultados positivos ni  en español ni en inglés.  PicFinder  PixAI.Art  Mage.space  Enterpix  Hotpot  SeaArt  TensorArt  Getimg.ai  Pixlr  Dream by Wombo  Ai Gallery  Graiyon  ImagineArt  You.imagine  DreamStudio  Lumenor  Shakker  SDXL Turbo  YouCam  Krea  Neural.love  Akool  Stylar  PicWish  Deep dream generator  Free AI Image Generator  81 \n2.10 Contenedores móviles para imágenes  En este apartado vamos a incluir contenedores con imágenes que  presenten algún tipo de movimiento o efecto, todo ello programado  con ayuda de IA.  Prompt:  Tengo una página de 560x650 pixeles. Necesito un código CSS  para crear un contenedor cuyo fondo debe ser una imagen. Al pulsar  sobre la imagen debe cambiar su posición sobre la página.  82 \nPrompt:  Necesito un código CSS para que cuando se pase el ratón sobre  una imagen, ésta realice un círculo completo.  Prompt:  Necesito un código CSS una imagen que oscile de lado a lado y  parpadee.  Además,  debe  pararse  cuando  el  cursor  pase  sobre  ella  y  moverse cuando no lo haga.  83 \nPrompt:    Necesito  el  HTML  de  un  contenedor  para  una  imagen  que  realice movimientos y efectos en 3D. El contenedor debe moverse al  pulsar un botón y pararse al volver a pulsar. El botón debe tener color  azul con degradado y letras con estilo  84 \nPrompt:  Haz otro contenedor con otra imagen, que haga un efecto 3D  diferente  al  anterior.  También  debe  incluir  botón  de  activación  y  desactivación.  85 \n2.11 Modificación de imágenes  Otro aspecto muy interesante es la modificación que las IA pueden  realizar de las imágenes con mucha calidad, precisión y velocidad.  Algunas de ellas son:  Cutout pro ,  YouCam ,  Magic Studio ,  PicWish ,  Stylar ,  Artbreeder ,  ClipDrop ,  Picsart ,  AI Nero ,  Leonardo AI ,  OpenArt ,  Simplified ,  Krea ,  Adobe Firefly ,  Hugging Face ,  Hotpot ,  Akool ,  PicaAI ...  2.11.1 Borrado mágico  Podemos  tener  imágenes  en  las  que  queremos  eliminar  textos,  elementos,  objetos,  personas,  etc.  Con  IA  podemos  hacerlo  simplemente marcando con un pincel el área a eliminar y la aplicación  hace el resto. A continuación, se presenta la eliminación de texto de  una imagen con  Magic Studio .  86 \nPresentamos otro ejemplo realizado con la IA  Cutout pro .  87 \n2.11.2 Dibujo mágico o relleno generativo  En otras ocasiones, deseamos añadir nuevos elementos a nuestras  imágenes.  Para  ello,  seleccionamos  la  zona  en  la  que  queremos  añadirlos  y  mediante  un  prompt  introducimos  lo  que  queremos  insertar.  A  continuación,  mostramos  un  caso  realizado  con  la  inteligencia  artificial  Magic Studio .  88 \n2.11.3 Mejora de imágenes  Algunas IA permiten mejorar imágenes, no sólo en su resolución, sino  añadiendo  detalles,  introduciendo  elementos  que  no  existían  y  corrigiendo y mejorando otros. Incluimos un caso realizado con  Krea .  89 \n2.11.4 Extensión de imágenes  Hay  veces  que  podemos  necesitar  expandir  imágenes,  es  decir,  extender  la  imagen  por  sus  bordes  creando  una  imagen  mayor,  coherente con la parte inicial.  En el siguiente ejemplo, la primera fila de personajes se corresponde  con las imágenes iniciales. Necesitábamos mostrar mayor parte del  cuerpo de los personajes. Mediante la herramienta de expansión de  imagen  Stylar  obtuvimos el resultado de la segunda fila.  90 \nPara realizar la extensión de una imagen, debemos indicar a la IA la  zona  que  queremos  expandir.  Normalmente  generará  varias  propuestas  y  seleccionaremos  la  que  más  nos  guste.  Repetiremos  esto sucesivamente hasta terminar la expansión de la imagen.  2.11.5 Introducción o sustitución de fondos  Hay veces, que podemos querer introducir o cambiar el fondo de una  imagen. Con IA se puede subir la imagen y reemplazar el fondo actual  por otro que elijamos. Este ejemplo ha sido realizado con  YouCam .  91 \n2.11.6 Intercambio de caras  Otra aplicación muy utilizada es el reemplazo de una cara por otra.  Para ello simplemente se introduce la imagen cuya cara queremos  cambiar y otra con la cara destino del cambio. El siguiente modelo se  ha generado con  PicaAI .  Actualmente el intercambio de caras funciona correctamente cuando  se utilizan caras humanas. Si las caras tienen un aspecto humanoide  aceptable también se obtienen ciertos resultados.  92 \nUtilizando la IA  SeartArt , hemos probado partiendo de una imagen  plenamente humana y de otra que lo es parcialmente. La primera  imagen es la base a la que se quiere cambiar el rostro, la segunda la  nueva cara que se introducirá y la tercera es el resultado.  Imagen de base   Cara a introducir   Resultado  Se puede apreciar que los resultados son diferentes dependiendo de  cuál sea la base de partida y la cara a intercambiar.  Hemos realizado pruebas con caras no humanas y no hemos obtenido  resultado satisfactorio alguno. Cuanto mayores han sido los rasgos  humanos mejor ha funcionado la experiencia.  En  el  siguiente  interactivo  mostramos  uno  de  los  intercambios  realizados.   93 \nCon el objetivo de mejorar los resultados se ha utilizado la IA  Krea  para obtener un mejor resultado de la imagen final.  Otra posibilidad es la realización de un intercambio múltiple de caras.  A  continuación  presentamos  un  ejemplo  de  ello  realizado  con  Remaker . Para ello, simplemente se introduce la imagen que contiene  más de una cara y la propia IA detecta las caras existentes y solicita  una imagen por cada uno de los rostros que se quieran reemplazar.  94 \n95 \nExisten muchas más aplicaciones relacionadas con la modificación de  imágenes. En este apartado hemos pretendido recoger algunas de las  más extendidas y utilizadas.  Finalmente  incluimos  otra  utilidad,  mediante  la  cual  se  puede  cambiar la ropa y otras características de un personaje. Presentamos  un  ejemplo  realizado  con    InstantID  de  Hugging  Face ,  al  que  introdujimos el siguiente sencillo prompt en inglés:  Reina vestida con ropa del siglo XXI.  Queen dressed in 21st century clothing.  96 \n2.11.7 Generación de caricaturas  Otra herramienta para imágenes es la creación de caricaturas, como  por ejemplo  Media.io . Mostramos un par de ejemplos de caricaturas  de la reina.  97 \n2.11.8 Calculadora de belleza  Una curiosa aplicación de  Vidnoz  es su calculadora de belleza, la cual  además de darnos un valor de esta cualidad en porcentaje, nos da una  pequeña valoración de su actitud y nos ofrece una estimación de  hasta seis parámetros diferentes.  La foto de \"nuestra reina\" obtiene un nivel de belleza de 84, una  estimación de edad de 25 y sus cualidades mejor valoradas son la  cercanía,  diversión  y  confianza,  mientras  que  las  que  menos  puntuación obtienen son el atractivo, la inteligencia y la confiabilidad,  aunque en todas supera el aprobado.  98 \nProbamos  ahora  con  el  Amo  del  Calabozo  y  sorprendentemente,  obtiene un mayor nivel de belleza que la reina, con una estimación de  edad de 30 años y alcanzando en inteligencia la calificación máxima.  2.11.9 Fotos para currículum  Vidnoz  nos trae otra propuesta interesante, consistente en obtener  fotos de estilo CV a partir de una fotografía cualquiera de la persona  o personaje.  Probamos  de  nuevo  con  las  imágenes  de  la  reina  y  del  Amo  del  Calabozo y estos han sido los resultados obtenidos:  99 \n100 \n2.11.10 Cambio de género  AILab  es un \"laboratorio fotográfico\" que da la posibilidad de cambiar  el género de la fotografía de una persona. Sería algo así como crear  un hermano gemelo del sexo opuesto.  101 \nEn los ejemplos presentados realizamos la transformación de género  en los dos sentidos, es decir, partiendo de la imagen de una chica  obtenemos  la  de  su  gemelo  masculino  y  viceversa.  Como  puede  observarse,  hemos  partido  de  las  fotos  obtenidas  en  el  apartado  anterior.  102 \n2.11.11 Cambio de edad  Otra utilidad de  AILab  es la de cambiar la apariencia de edad de una  persona. Teóricamente permite un cambio de edad entre 1 y 85 años.  En general, realiza mucho mejor el proceso de envejecimiento que el  de rejuvenecimiento.  En el siguiente ejemplo partimos de la reina, cuya edad se estima de  25 años y procedemos a aumentar hasta los 60 años  103 \n2.11.12 Modificación de peinado  AILab  da la posibilidad de cambiar el estilo de peinado y el color del  cabello  de  la  foto  tanto  de  un  hombre  como  de  una  mujer,  permitiendo elegir entre múltiples opciones.  Probamos a modificar el peinado del Amo del Calabozo, necesitado  de  una  buena  regeneración  capilar  y  el  resultado  se  muestra  a  continuación:  104 \nA continuación, mostramos a la reina con dos peinados diferentes.  Podemos  ver  que,  a  pesar  de  llevar  la  corona  puesta,  realiza  correctamente el cambio de peinado.  La aplicación ofrece dos categorías de modificación de peinado, una  básica  y  otra  avanzada.  En  ambas  ofrece  múltiples  opciones  para  cambiar el peinado, tanto para un estilo masculino como femenino.  Algunas opciones son gratuitas.  105 \n2.11.13 Coloreador labial  Con  AILab  podemos cambiar el color de labios de una persona en una  fotografía.  Ofrece una amplia gama de colores para aplicar el cambio, incluso la  posibilidad de utilizar un color personalizado.  Mostramos a la reina con dos colores de labios diferentes.  106 \n2.11.14 Cambio de maquillaje  Otra  posibilidad  que  presenta    AILab   consiste  en  la  posibilidad  de  aplicar  diferentes  tipos  de  maquillaje  facial  a  las  imágenes.  La  intensidad de aplicación del maquillaje es regulable.  También  ofrece  la  posibilidad  de  aplicar  tratamientos  de  la  piel  y  mejorar diferentes aspectos de la belleza facial.  Mostramos un ejemplo con dos tipos de maquillaje diferentes.  107 \n2.11.15 Cambio de expresiones faciales  Con  AILab  se puede cambiar la expresión de la cara de una imagen.  Permite  el  uso  de  múltiples  facciones,  pero  sólo  algunas  son  gratuitas.  Presentamos a la reina, a la que en primer lugar hemos cambiado su  expresión a una cara alegre y en segundo lugar a una cara triste,  siendo el resultado el siguiente:  108 \n2.11.16 Adelgazamiento facial  AILab  ofrece la posibilidad de adelgazar el rostro de la imagen de una  persona de forma regulable. También permite la aplicación del efecto  contrario, ensanchando la cara.  En  el  siguiente  interactivo  se  muestra  como  se  ha  adelgazado  de  forma considerable la imagen de la reina.  109 \n2.11.17 Eliminación de niebla  AILab  elimina la niebla de las fotos de una forma fácil y sencilla.  2.11.18 Coloreador de fotos  MyHeritage  da color a tus fotos.  110 \n2.11.19 Conversión a dibujo  AILab  convierte una imagen en un dibujo que puede ser de diferentes  estilos.  También  puede  realizar  un  avatar  de  la  imagen.  Puede  centrarse sólo en la cara o en la imagen completa.  111 \n2.11.20 Imágenes con pose  NightCafé  permite crear imágenes en una pose determinada, la cual  puede ser extraída de una foto o ser utilizada de una plantilla. Los  pasos  para  obtener  una  imagen  de  una  persona  en  una  pose  determinada son los siguientes:  En primer lugar, seleccionamos la pose que queremos. En este caso  utilizaremos una de la biblioteca.  112 \nEn segundo lugar, introducimos un prompt de texto describiendo la  imagen que deseamos. Podemos usar un prompt avanzado como el  siguiente:  Una hermosa princesa medieval By artist \"anime\", 3d anime art, inspired  by  WLOP,  Artstation,  #genshinimpact  pixiv,  extremely  detailed,  aesthetic, concept art, ultrafine detail, breathtaking, 8k resolution, vray  tracing.  En  tercer  lugar,  realizamos  los  ajustes  del  modelo,  número  de  imágenes estilo, etc. y le damos a generar.  113 \nIncluso después podemos realizar mejoras en la imagen tales como:  escalar,  mejoras  creativas,  realizar  una  edición  selectiva,  mejorar  caras, animar, quitar fondo, borrar objetos, cambiar la relación de  tamaño, etc.  Incluimos  otro  ejemplo,  con  otra  pose  y  estilo,  con  el  siguiente  prompt:  Poderoso mago medieval utilizando su magia.  114 \n115 \n2.11.21 Inserción de imágenes en plantillas  Con    Photofunia ,  podemos  insertar  unas  imágenes  en  otras  que  actúan  como  plantillas  y  que  las  introducen  en  un  determinado  contexto. Cuenta con cientos de plantillas diferentes, algunas de ellas  animadas.  Photofunia no utiliza IA, es una aplicación que se basa en algoritmos y  plantillas, siendo una buena herramienta de apoyo.  116 \n2.11.22 Inserción de textos en plantillas  Photofunia , ofrece plantillas de fotos en las que podemos incrustar  textos con IA.  En el globo de la imagen introducimos el texto  Proyecto Descartes .  117 \n2.11.23 Fusión de imágenes  Otra posibilidad que ofrecen las IA es la fusión y combinación de  imágenes. En el siguiente ejemplo realizado con  Vidnoz , fusionamos  las siguientes cuatro imágenes:  118 \nEl resultado de dicha fusión se muestra en la siguiente imagen:  2.12 Editores de imágenes  Los  editores  de  imágenes  on-line,  permiten  modificar  múltiples  aspectos  de  las  mismas,  en  muchas  ocasiones  utilizando  la  IA.  Comentaremos algunas de ellas:  119 \nMyEdit  MyEdit  es un editor de fotos que permite la realización de múltiples  modificaciones e introducir muchos efectos diferentes.  120 \nPhotopea  Photopea  es un editor de fotos on-line, similar a Photoshop. Es una  potente herramienta de modificación de fotos.  121 \nPixlr  Pixlr  es otro editor que permite muchas posibilidades de tratamiento  de imágenes.  122 \nCanva  Canva  es mucho más que un editor de imágenes. Integra multitud de  herramientas de IA y permite realizar presentaciones, trabajar con  videos y muchas cosas más.  123 \nBefunky  Befunky   es  un  potente  editor  de  imágenes  que  también  incluye  herramientas de IA.  124 \nAILabTools Editor  AILabTools  Editor   muy  sencillo  de  usar  que  presenta  muchas  herramientas de inteligencia artificial para aplicar a imágenes.  125 \n2.13 Entrenando modelos  Los modelos personalizados de IA generativa de imágenes se crean  para  satisfacer  necesidades  específicas.  Esto  puede  ser  útil  para  aplicaciones en las que se necesita un control más preciso sobre el  aspecto o el contenido de las imágenes generadas. La creación de  modelos  personalizados  en  algunas  IA  generativas  de  imagen,  la  describimos en el siguiente video:  Como lo indica el video, la calidad de las imágenes dependen del  número de fotos subidas y la calidad de las mismas; por ejemplo, en  Leonardo subimos 40 fotos de la modelo Daniela (hija de uno de los  autores de este libro), cuyos resultados mostramos, en parte, en la  siguiente presentación.  Por otra parte, las  selfies  que se indican en el video, fueron subidas a  LensGo.ai, obteniendo mejores resultados, tal como se muestra en la  presentación.  126 \nLas imágenes de las brujas, fueron generadas por NightCafé. Otros  resultados  y  enlaces  a  las  herramientas  IA,  que  permiten  crear  modelos,  se  pueden  consultar  en  el  libro  \" Inteligencias  artificiales  generativas 2024 \".  127 \n2.14 Introducción de textos  Hemos visto en apartados anteriores, como generar imágenes que  contengan  texto  en  dicha  generación.  Ahora  vamos  a  ver  la  alternativa  de  incluir  el  texto  que  deseemos  en  las  imágenes  con  ayuda de IA. Para ello, utilizaremos  Adobe Firefly  y expondremos  algunos ejemplos.  Podemos crear textos con fuentes, tamaños, formas y estilos muy  diferentes, hasta aquí no hay novedad, sin embargo, la IA nos permite  incluir efectos en el texto. Estos efectos pueden obtenerse de las  plantillas o ser generados mediante un prompt. Por ejemplo, se le  puede  pedir  un  estilo  \"alegre  y  fresco\",  un  estilo  \"tecnológico  y  sofisticado\" o \"un estilo \"que recuerde a la naturaleza\".  En la siguiente imagen mostramos el título de este libro interactivo  con diferentes efectos, los cuales se han seleccionado de entre las  distintas plantillas que ofrece la aplicación\". La forma y composición  se puede realizar libremente.  128 \nOtra opción que ofrece es la traducción a una amplia variedad de  idiomas, conservando el estilo, formas, efectos... Mostramos el título  del libro traducido al inglés y al francés.  129 \nEn la traducción al francés hemos introducido además un fondo y un  elemento adicional.  Otra interesante opción consiste en realizar composiciones de textos  con estilos y efectos, incluyendo imágenes y fondos.  En la siguiente imagen presentamos una composición de textos con  los nombres de los autores de esta obra. Para definir los efectos de  los textos se introdujeron los siguientes prompts:  Inteligente y brillante.  Constante y tecnológico.  Además,  se  introdujo  una  imagen  dada  por  la  biblioteca  de  la  aplicación a la que se recortó y dio forma circular y a la que se aplicó  un 40% de transparencia. También se tomó parte de dicha imagen  para ser utilizada como fondo.  También se pueden introducir textos en videos con sonido.  130 \nSe  pueden  incluir  junto  con  el  texto  múltiples  elementos  simultáneamente. El siguiente ejemplo contiene: texto, video, audio,  imágenes, elementos, etc. Además, a las imágenes se les ha quitado el  fondo y se ha aplicado relleno generativo.  131 \n\nCapítulo III Capítulo III  Videos con ayuda de IA Videos con ayuda de IA \n\n3.1 Introducción  En nuestra sociedad actual, la transmisión de información a través de  medios  audiovisuales  se  ha  vuelto  cada  vez  más  común,  especialmente  entre  las  nuevas  generaciones.  El  video  se  ha  convertido en una herramienta prácticamente imprescindible, y su  incorporación  en  los  libros  interactivos  ofrece  un  valor  añadido  significativo, en comparación con los libros tradicionales.  Podemos  crear  videos  de  manera  tradicional,  editándolos  y  montándolos con editores de video. También podemos utilizar videos  ya  creados  de  uso  libre  o  con  los  permisos  correspondientes.  Sin  embargo,  gracias  a  las  inteligencias  artificiales  generativas,  ahora  disponemos de nuevas formas de crear nuestros videos, entre las  cuales destacamos las siguientes:  Creación  de  video  a  través  de  un  prompt.   Mediante  instrucciones de texto, indicamos a la IA el video que queremos  que    genere,    obteniendo    resultados    específicos    y  personalizados.  Generación de videos a partir de una imagen.  Se introduce una  imagen, acompañada de instrucciones de texto, y la IA genera la  correspondiente animación, creando contenido visual dinámico  a partir de una base estática.  Modificaciones  de  videos  existentes.   A  partir  de  un  video  existente, se realizan los cambios deseados, incluyendo mejoras,  efectos especiales y ajustes para mejorar la calidad y el impacto  del contenido.  Realización  de  presentaciones  tipo  video.   Las  IA  montan  el  video final a partir de una serie de escenas, o incluso a partir de  documentos  escritos,  blogs  o  páginas  web,  transformando  contenido estático en presentaciones visuales atractivas.  135 \nvideos  con  avatares  parlantes.   Aplicaciones  especializadas  crean  avatares  de  todo  tipo  con  capacidad  para  realizar  presentaciones orales, añadiendo una dimensión interactiva y  humana al contenido.  Edición  de  videos  mediante  IA.   Herramientas  avanzadas  integran  inteligencia  artificial  en  el  proceso  de  montaje  y  edición de videos, facilitando la creación de contenido pulido y  profesional de manera eficiente.  Creación  de  videos  interactivos.   Utilizando  IA,  se  pueden  generar  videos  interactivos  donde  los  espectadores  pueden  tomar  decisiones  que  afecten  el  desarrollo  del  contenido,  aumentando la interactividad y el compromiso.  Traducción  y  subtitulación  automática.   La  IA  puede  añadir  subtítulos en diferentes idiomas y traducir el audio del video,  haciendo el contenido accesible a una audiencia global.  3.2 Texto a video ( txt2video )  Aún  por  mejorar  ostensiblemente,  se  están  presentando  IA  generativas de video a partir de un texto suministrado por el usuario  (prompt),  la  principal  dificultad  se  encuentra  cuando  la  función  principal es crear un  video nuevo  que recree el escenario dado por el  usario 2 . Por ejemplo, en el libro  IA generativas 2024 , con un prompt  simple como \"Cinco gatos jugando con pelotas, uno de ellos es de  color  verde\"  se  obtuvieron  videos  con  algunas  IA  generativas  de  video.  Sin embargo, los resultados no son buenos, tanto por la calidad del  video como por la correcta interpretación del prompt.  Esta dificultad parece ser superada con la nueva IA como  Sora , que puede crear videos  realistas e imaginativos a partir de instrucciones de texto.  2  136 \nA continuación, presentamos cuatro de los videos obtenidos (pasa el  puntero del mouse sobre cada imagen, para ver el video):  Chromox   Genmo  Pika   Gen-2  Como se puede observar, no todos los videos presentan  cinco gatos ,  en algunos se pinta de verde la o las pelotas y no a un gato, además de  generaciones  extrañas  de  los  gatos.  También  se  pueden  observar  movimientos extraños en las pelotas.  137 \nDado que los resultados no han sido satisfactorios, hemos realizado  otra búsqueda de IA generativas de texto a video, utilizando el mismo  prompt, obteniendo los productos que mostramos a continuación:  LensGO.Ai   Pixverse  Fusion Brain   Novita.ai  Podemos ver que los resultados son similares. El número de gatos es  inferior al solicitado. Sólo en algunos casos representa a un gato de  color verde, aunque las pelotas si las dibuja de este color. En algún  caso hay apariciones extrañas de gatos y en general la calidad no  suele  ser  lo  suficientemente  buena.  El  margen  de  mejora  en  este  campo es todavía muy grande y se esperan grandes avances en este  terreno.   138 \nGenerar videos a partir de texto (txt2video) es un proceso que puede  variar en complejidad dependiendo de los objetivos y herramientas  disponibles. A continuación, con la ayuda de  GTP-4o , presentamos  algunas  recomendaciones  generales  y  consejos  para  redactar  indicaciones.  Recomendaciones Generales  Definir el Propósito del Video:  Establece  claramente  el  objetivo  del  video.  ¿Es  educativo,  promocional, informativo o de entretenimiento?  Identifica el público objetivo para adaptar el contenido y estilo  del video.  Describe de manera precisa cada escena o segmento del video:  Incluye  detalles  sobre  el  entorno,  personajes,  acciones,  y  cualquier otro elemento visual relevante.  Utiliza un lenguaje claro y específico para evitar ambigüedades.  Consejos para redactar indicaciones  Claridad y Precisión: Especifica cada elemento con detalle: \"Mostrar  un gráfico de barras que ilustre el crecimiento de las ventas en el  último trimestre\".  Evita palabras vagas y generalizaciones.  Proporciona detalles sobre el estilo visual: \"Usa colores corporativos  en las gráficas,\" o \"Emplea una fuente sans-serif para todo el texto.\"  139 \nPero, todo depende de la complejidad de la  imagen  que  se  describa  en  el  prompt;  por  ejemplo,  hemos  usado  la  indicación  \"Un  escritor pintando una imagen sobre la página  de un libro\", que DALL-E 3 nos ha dibujado,  como se muestra en la imagen de la derecha.  Sin embargo, obtener un buen video a partir  de este prompt no es algo sencillo para las IA  que tienen la herramienta txt2video.  Lo  hemos  intentado  con    Chromox ,    Gen-2 ,  Pika labs  y  Genmo , con resultados variados y  no muy buenos.  De Genmo, obtuvimos el siguiente video de  tres segundos:  140 \n141 \nCon  Haiper  generamos cuatro videos, de dos segundos cada uno, en  los estilos Ghibli, acuarela, impresionista y en cine blanco y negro  (pasa el puntero del mouse por cada imagen, para ver el video o, si lo  prefieres, haz clic en el botón superior izquierdo de cada imagen, para  ver el video en pantalla completa):  142 \nLuma  es una nueva IA capaz de crear videos a partir de texto. Se ha  probado el prompt de los gatos anterior y el siguiente nuevo prompt,  todos en español e inglés:  Muestra  cinco  gatos.  Un  gato  debe  ser  verde.  Los  gatos  juegan  con  pelotas.  143 \nEn la anterior galería de videos puede verse que la calidad de los  videos es bastante buena, ofreciendo producciones de 5 segundos,  aunque no se ajustan del todo a las instrucciones dadas. También hay  que  decir  que  no  tardan  mucho  en  generarse.  Tampoco  parece  afectar mucho el idioma.  Dado que la calidad fue bastante buena y que parece que tanto gato  junto y de colores raros despista un poco a las IA, utilizamos cinco  sencillos y diferentes prompts para probar el alcance de la aplicación.  Joven reina del siglo XVII montada a caballo.  El ejército romano se enfrenta a las tropas griegas de Esparta en el siglo  II antes de Cristo.  Chica anime lanzando una bola de fuego.  Un coche de carreras sale en llamas.  Un rey medieval corona a su hija la princesa como nueva reina.  En la siguiente galería de videos mostramos el excelente resultado  conseguido. En ella se puede apreciar lo siguiente:  Los  videos  se  ajustan  bien  a  los  prompts  pedidos.  Además,  cuenta con un mejorador de prompts.  La calidad de los videos es bastante buena.  No se observan grandes alucinaciones.  La  duración  de  los  videos  es  algo  mayor  que  la  de  otras  aplicaciones.  Su velocidad de generación es relativamente alta.  Es capaz de realizar videos en diferentes estilos. En la muestra  puede verse que se ha pedido que se realice uno en formato  anime.  144 \nFinalmente  comentar  que  Luma  nace  con  la  vocación  de  ser  una  alternativa competitiva con Sora de OpenAI o EMO de Alibaba y de  momento parece estar a la altura. En el apartado siguiente veremos  que también realiza videos partiendo de una imagen.  145 \n3.3 Imagen a video (img2video)  Una mejor alternativa, para obtener mejores videos, es generar una  imagen con IA como DALL-E 3, Fire fly de Adobe o Leonardo y luego  usar  una  herramienta  que  las  anime;  por  ejemplo,  con  Haiper  generamos un video de la imagen generada por DALL-E 3:  En la siguiente página, presentamos seis videos generados a partir de  la  imagen  de  DALL-E  3,  con  las  herramientas    Genmo ,    Krea ,    Pika ,  PixVerse ,  Stable Video  y  Leonardo.Ai . En esta última, sólo se permite  generar videos con imágenes generadas por Leonardo.  146 \n147 \nSi  se  quiere  crear  un  video  a  partir  de  una  imagen  utilizando  Leonardo.Ai, el proceso es sencillo. Primero, se selecciona la imagen  que se desea animar y se solicita a Leonardo.Ai que se genere una  versión  mejorada  de  la  misma,  manteniendo  la  esencia  original  al  máximo.  Una  vez  obtenida  esta  nueva  imagen,  se  puede  pedir  a  Leonardo.Ai que la anime según las preferencias que se deseen.  148 \nComo  puede  verse  en  la  galería  de  videos,  hemos  introducido  5  videos realizados con Leonardo.Ai con diferentes características y  resultados.  Aprovechamos  la  ocasión  para  comentar  como  se  ha  realizado  dicha  galería  a  través  de  IA,  en  la  que  hemos  incluido  controles de audio pese a que estos videos no tienen sonido, pero la  idea es que esta galería, variaciones de la misma u otras similares  puedan  ser  utilizadas  cuando  sean  necesarias,  realizando  las  adaptaciones oportunas.  Mediante el siguiente prompt introducido en ChatGPT-4o y algunos  pequeños  retoques  y  ajustes  posteriores  obtuvimos  el  siguiente  código .  Deseo  diseñar  una  galería  de  videos  responsive  en  HTML5,  para  5  videos que están en la misma carpeta y sus nombres son: video334.html.  video335.html.  video336.html.  video337.html  yvideo338.html.  El  tamaño  de  los  videos  es  de  540x540  px.  La  pantalla  debe  quedar  enmarcada con un marco de bordes redondeados. La galería de videos  debe  llevar  en  su  parte  inferior  los  siguientes  elegantes  controles:  controles  de  navegación  entre  videos,  control  de  activar  desactivar  volumen, deslizador para subir y bajar el volumen, deslizador de avance  del video, botón play video y botón pause video. Los botones deben ser  indicados  mediante  iconos  adecuados  y  diferentes  colores  pero  bien  conjuntados.  Antes  de  empezar  la  reproducción  de  los  videos,  debe  mostrarse la imagen de portada p330.png que está en la misma carpeta.  Incluye  en  el  sitio  que  veas  más  adecuado  el  número  del  video  que  estamos reproduciendo.  Para terminar el apartado vamos a crear otra nueva galería de videos  en la cual hemos incluido la misma prueba de animación de la misma  imagen  con  las  siguientes  IA:    Cutout.pro ,    Creautus  ai ,    Genmo ,  Grandline  y  Immersity .  En  la  parte  superior  de  la  galería  se  puede  ver  el  nombre  de  las  diferentes IA utilizadas para cada uno de los videos.  149 \nTal y como hicimos en el apartado anterior vamos a realizar algunas  pruebas  con    Luma ,  en  este  caso  partiendo  de  una  imagen  (la  del  autor)  e  introduciendo  diferentes  prompts,  los  cuales  indicarán  la  forma de animar dicha imagen.  150 \nSe ha dado el mismo prompt inicial que el resto de las IA. Después se  han  introducido  prompts  como:  el  hombre  levanta  una  mano,  el  hombre se quita las gafas, el hombre se desabrocha un botón y el  hombre se toca el pelo. Se aprecia que, aunque los resultados son  buenos, hay algunos fallos y no siempre sigue los prompts dados.  151 \nHemos probado con la imagen de la reina y hemos pedido a Luma que  realice varios videos en diferentes situaciones: hablando, cantando,  girando la cabeza, quitándose la corona, movimientos de cámara, etc.  Los resultados superan ampliamente al obtenido con el resto de las  IA presentadas.  152 \n3.4 FaceSwap video  FaceSwap es una aplicación que utiliza la tecnología de inteligencia  artificial para intercambiar rostros en videos y fotos. Es conocida por  su capacidad de crear  deepfakes , que son videos o imágenes donde  los  rostros  de  las  personas  han  sido  cambiados  de  manera  convincente y realista.  Figura 3.1 . Intercambio de caras en  Magic Hour .  La aplicación permite a los usuarios seleccionar un video o imagen  fuente  y  un  rostro  objetivo  para  realizar  el  intercambio.  Utiliza  algoritmos  avanzados  para  analizar  y  mapear  las  características  faciales, asegurando que el resultado final sea fluido y natural. Los  usuarios pueden crear videos divertidos, memes, o incluso utilizarlo  para proyectos más serios como películas o publicidad.  153 \nFigura 3.2 . Tres pasos para un deepfake  en MioCreate.  FaceSwap  es  accesible  para  principiantes,  con  tutoriales  y  una  comunidad activa que ayuda a los nuevos usuarios a familiarizarse  con  el  proceso.  Es  importante  mencionar  que,  aunque  FaceSwap  puede ser una herramienta poderosa y entretenida, también plantea  cuestiones  éticas  y  legales  relacionadas  con  la  privacidad  y  el  consentimiento.  Por  lo  tanto,  se  recomienda  usarla  de  manera  responsable  y  con  respeto  a  los  derechos  de  las  personas  involucradas.  MioCreate  MioCreate  es una herramienta en  línea fácil de usar diseñada para  intercambiar caras en videos sin  esfuerzo  (100%  gratis  y  sin  suscripción).  MioCreate    cuenta    con    una  interfaz  sencilla,  lo  que  la  hace  accesible  para  todos  los  niveles,  emplea  tecnología  avanzada  de  detección    de    rostros    para  identificar rostros en videos con  precisión.  Los  usuarios  pueden  obtener una vista previa y editar  los  intercambios  de  caras  en  tiempo  real,  lo  que  garantiza  resultados fluidos y perfectos.  Como lo indica la imagen, bastan tres sencillos pasos para cambiar la  cara en un video, ejercicio que hicimos con un clip de video de la  película \"Oblivion\", protagonizada por Tom Cruise, cambiando su cara  por la de uno de los autores de este libro.  154 \nAcudimos a la inteligencia artificial GPT-4o para generar un control  deslizante,  con  el  fin  de  poder  comparar  el  video  original  con  el  generado por MioCreate.  El prompt que usamos fue el siguiente:  Dame el código HTML que muestre en el mismo recuadro dos videos  superpuestos de 569x326 pixeles, en la mitad izquierda se muestra el  primer video y en la mitad derecha el segundo video, en el medio hay un  control tipo deslizante que al desplazarlo a la derecha va mostrando el  resto de la primera imagen y si se desplaza a la izquierda va mostrando la  segunda imagen, incluye controles de pausa y reproducción.  Este es el resultado:  El control \"Pause\" es bastante útil para hacer mejor la comparación  entre los dos videos. Es recomendable ver el objeto interactivo en  pantalla completa.  155 \nAkool  Akool  es una herramienta que permite el intercambio de caras como  parte de una animación o fotografías en movimiento, el intercambio  de caras de grupo y, para este apartado, el intercambio de cara en un  video. Hicimos el ejercicio, cambiando la cara de Angelina Jolie por la  de una modelo (ver siguiente figura).  Obteniendo (El control deslizante lo generamos con Claude):  156 \nMagic Hour  Con  Magic Hour , cambiamos la cara de Keanu Reeves en un clip de  video de la película Matrix, por la cara de uno de los autores de este  libro.  Obteniendo:  157 \nCon Magic Hour, también, hemos cambiado la cara de Tom Cruise  como lo indica la siguiente figura:  Obteniendo:  Otra herramienta gratuita, similar a MioCreate, es  Viwud .  158 \nSeartArt  Tal  y  como  hicimos  en  el  intercambio  de  cara  en  imágenes  para  rostros no totalmente humanos, lo haremos para el caso de cambio  de cara en videos, empleando  SeartArt .  159 \n160 \nEn el ejemplo realizado se puede observar que tanto si la imagen  como  si  el  video  posee  ciertos  rasgos  no  humanos  la  aplicación  funciona, pero si se utilizan imágenes de animales o con pocos rasgos  humanos, o no se obtienen resultados o estos no son adecuados.  El campo de las caras no humanas es otro en el que la inteligencia  artificial tiene bastante potencial para desarrollarse.  Intercambios múltiples de caras  Abordamos ahora el intercambio de más de un rostro en un video.  Presentamos en primer lugar, el video sobre el que realizaremos los  intercambios de rostros. Se trata de un fragmento de un Flashmob de  la Nochevieja de 2014 emitida por TVE protagonizada por José Mota  y Rut Lorenzo.  Ahora exponemos las imágenes cuyas caras serán introducidas en los  videos.  161 \nEn  un  primer  intento  utilizamos  Magic  Hour.  Esta  IA  permite  intercambiar varias caras del video original, pero sólo por una cara, es  decir, cambia todas las caras protagonistas del video por una misma  imagen dada.  En un segundo intento utilizamos Akool, que si nos ofreció resultados  satisfactorios.  162 \nComentamos los pasos que hay que realizar en esta aplicación:  En  primer  lugar,  se  introduce  el  video  sobre  el  que  quieren  realizarse los cambios.  A continuación, la IA analiza dicho video y ofrece una relación  con  todas  las  caras  susceptibles  de  ser  intercambiadas  por  otras.  Posteriormente,  podemos  subir  las  imágenes  que  vamos  a  utilizar  para  reemplazar  en  el  video  (el  programa  también  ofrece algunas por defecto).  En un siguiente paso, debemos asociar cada una de las caras  seleccionadas por la aplicación con las de los rostros con los que  queremos realizar el intercambio.  Finalmente lanzamos el proceso.  En nuestro caso asociamos la imagen de la reina a Rut Lorenzo y la  del Amo del Calabozo a José Mota. El resultado obtenido se muestra  a continuación.  163 \n3.5 Videos con avatares  Los videos con avatares parlantes o hablantes han proliferado mucho  gracias  a  la  inteligencia  artificial.  Dichos  avatares  pueden  tener  muchas  utilidades  como,  por  ejemplo,  presentación  de
