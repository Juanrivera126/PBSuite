 mundo.  459 \n460 \nLos nubarrones se arremolinaban sobre la colina, creando un marco  inquietante para el duelo que estaba por comenzar. Vilaicus, con su  capa azul cielo ondeando al viento, observaba a su oponente con una  mirada fija y decidida. Arcenius, con su túnica negra y su barba gris,  no  apartaba  los  ojos  de  Vilaicus,  sus  dedos  tamborileando  ansiosamente sobre su bastón de roble oscuro.  El  aire  estaba  cargado  de  energía,  y  parecía  que  en  cualquier  momento el firmamento estallaría en un espectáculo de magia. \"Ha  llegado la hora\", dijo Vilaicus, su voz resonando con la autoridad de  mil tormentas. \"El artefacto mágico es demasiado poderoso para caer  en manos irresponsables\". Los labios de Arcenius se curvaron en una  sonrisa fría. \"¿Y quién decide que eres tú el guardián más digno? El  poder de este artefacto sólo responde a quien tiene la verdadera  sabiduría  para  usarlo.\"  Un  rayo  brilló  en  el  cielo,  iluminando  sus  rostros  por  un  instante  antes  de  sumergirlos  nuevamente  en  penumbra.  Arcenius  levantó  su  bastón,  y  una  esfera  de  fuego  chisporroteó en la punta. Vilaicus, no menos preparado, levantó una  mano, y una barrera translúcida emergió ante él, lista para recibir el  primer ataque. El silencio se rompió con el sonido del choque de sus  poderes.  La  esfera  de  fuego  de  Arcenius  impactó  la  barrera  de  Vilaicus, creando una explosión de luz y sonido que hizo temblar la  tierra bajo sus pies.  La determinación en sus rostros no flaqueó, y se prepararon para la  siguiente  ronda  de  hechicería.  A  medida  que  los  hechizos  se  entrelazaban  en  el  aire,  formaban  un  caleidoscopio  de  colores  y  sonidos,  cada  uno  buscando  superar  al  otro.  La  misma  naturaleza  parecía  reaccionar  a  su  conflicto,  con  los  árboles  balanceándose  violentamente y los animales huyendo en busca de refugio.  461 \nEra  evidente  que  esto  no  sería  un  duelo  simple.  Los  dos  magos,  conscientes  de  los  enormes  riesgos,  no  mostraban  signos  de  retroceder. Ambos sabían que no sólo luchaban por el artefacto, sino  por  el  futuro  de  su  mundo.  Cada  hechizo  lanzado,  cada  energía  convocada,  no  sólo  demostraba  su  destreza,  sino  también  su  disposición a sacrificarlo todo por lo que creían.  Las explosiones de energía continuaron, iluminando el cielo nocturno  de colores inimaginables. Vilaicus, con un movimiento rápido, conjuró  una ráfaga de viento que barrió el polvo y las hojas sueltas hacia el  rostro de Arcenius.  462 \nEl mago de la túnica negra cerró los ojos por un momento, pero no  vaciló; Su mano se movió ágilmente para manipular el viento a su  favor,  dispersándolo  con  un  gesto  firme.  \"¿Eso  es  lo  mejor  que  tienes?\"  burló  Arcenius,  su  voz  cargada  de  desafío.  Vilaicus  no  respondió  con  palabras.  Su  mirada  se  intensificó  y  sus  labios  se  movieron en un susurro casi imperceptible.  El suelo comenzó a temblar y de las entradas de la tierra emergieron  enredaderas espinosas, dirigiéndose con velocidad hacia Arcenius. El  mago las vio venir y, pensando rápidamente, invocó un escudo de  energía que las frenó en seco. Pero las enredaderas eran persistentes  y  pronto  comenzaron  a  rodear  la  barrera,  buscando  aperturas.  \"Bravo,  Vilaicus,  pero  veamos  cómo  te  enfrentas  a  esto\",  dijo  Arcenius, alzando ambas manos misteriosamente hacia el cielo.  Las  nubes  oscuras  respondieron  a  su  llamada  y  un  torrente  de  relámpagos descendió con furia. Vilaicus alzó su báculo, canalizando  el poder de los rayos y transformándolos en una corriente de agua  helada que intentó envolver a Arcenius. El mago de la túnica negra,  sin embargo, era igual de hábil. Con un gesto, se convirtió la corriente  en vapor humeante que se elevó y desapareció en el aire. Arcenius  sonrió  y  sus  ojos  brillaron  con  un  destello  de  determinación.  Las  fuerzas concentradas a su alrededor aumentaron, y el aire entre ellos  se hizo cada vez más pesado y opresivo.  El  conflicto  se  estaba  intensificando  y  Vilaicus  lo  sabía.  Decidí  cambiar  de  estrategia.  Usando  toda  su  concentración,  conjuró  un  portal  de  luz  detrás  de  Arcenius,  dispuesto  a  atraerlo  hacia  otra  dimensión. Pero Arcenius estaba listo y lanzó una onda expansiva de  energía  oscura  que  desintegró  el  portal  antes  de  que  pudiera  completarse.  463 \nEl  agotamiento  comenzaba  a  hacer  mella  en  ambos  magos,  pero  ninguno  estaba  dispuesto  a  ceder.  Las  reservas  de  energía  se  agotaban, y lo sabían; pronto el duelo no sería una cuestión de poder,  sino de ingenio. La siguiente movida podría ser la última, y ambos  estaban decididos a aprovechar cualquier debilidad que su oponente  mostrara. La colina estaba a punto de ser testigo del desenlace de  uno de los duelos mágicos más legendarios de la historia.  464 \nDe esta historia generamos varios videos con herramientas IA, de los  cuales presentamos dos:  Mediante  VideoGen  obtuvimos de forma rápida el siguiente video:  Con  Fliki  obtuvimos este resultado:  465 \nUtilizando fundamentalmente  Suno  y  Udio  solicitamos la creación de  diferentes partituras y canciones que presentamos en la siguiente  galería.  Hemos  introducido  canciones  con  letra  y  otras  meramente  instrumentales,  pero  todas  han  sido  totalmente  creadas  por  inteligencia artificial.  466 \nMediante IA podemos crear personajes con sus propiedades. Veamos  los personajes de nuestra historia creados con  storynest.ai .  467 \nLas IA también nos permiten introducir presentaciones sobre nuestra  actividad. Presentamos una generada con  Pictory .  Incluimos una presentación realizada con  Gamma  468 \nTambién se pueden crear cómics, con aplicaciones como  COMICAI .  Mostramos la portada generada para uno de los protagonistas.  Incluimos el juego  Duelo de magos  base para ilustrar esta historia.  469 \n6.11 ChatBots personalizados  En  la  era  digital  actual,  la  educación  está  experimentando  una  transformación significativa gracias a la integración de tecnologías  avanzadas.  Entre  estas  innovaciones,  los  chatbots  personalizados  están  emergiendo  como  herramientas  poderosas  para  mejorar  el  proceso  de  enseñanza  y  aprendizaje.  Estos  asistentes  virtuales,  impulsados  por  inteligencia  artificial,  ofrecen  una  variedad  de  beneficios que van desde la personalización del contenido educativo  hasta la facilitación de la comunicación entre estudiantes y docentes.  Al proporcionar respuestas inmediatas, adaptarse a las necesidades  individuales  y  estar  disponibles  las  24  horas  del  día,  los  chatbots  están revolucionando la manera en que los estudiantes interactúan  con el conocimiento. En este texto, exploraremos cómo los chatbots  personalizados están siendo implementados en diferentes contextos  educativos, sus ventajas y desafíos, y el futuro potencial que tienen  para transformar la educación a nivel global (ChatGPT-4o).  En  el  libro  \" Inteligencias  artificiales  generativas  2024 \",  puedes  consultar algunas aplicaciones que permiten crear estos chatbots,  tales como:  Cody ofrece, en su plan libre, 250 créditos al mes, 100 documentos y  un widget gratuito para tu sitio web.  En esta aplicación, hemos creado dos chatbots, uno de ellos sobre la  Cuarta Revolución Industrial . Una limitación, en el plan libre, es que  no deja cambiar los títulos y enunciados, los cuales quedan en inglés,  pero las preguntas y respuestas pueden ser en español.  470 \nHuggingChat permite usar, a 30 de junio de 2024, modelos como:  Mixtral 8x7B, Gemma-2-27B, LLaMA 3 70B, Nous Hermes 2, Yi 1.5 y  Phi  3,  modelos  de  lenguaje  de  código  abierto;  por  ello,  el  uso  de  HuggingChat  es  gratuito.  Con  esta  aplicación,  hemos  creado  un  chatbot sobre  Inteligencia Artificial generativa :  Por  ejemplo,  puedes  preguntar  ¿qué  es  un  modelo  GAN?  o  ¿Qué  herramientas de IA conoces para generar imágenes?  471 \n6.11.1  Uso  de  los  RAG  en  los  chatbot personalizados  ¿Recuerdas los tres artículos del apartado  6.5.3?,  los  cuales  discuten  sobre  la  generación con recuperación aumentada  (RAG, por sus siglas en inglés). Resulta que  la  clave  de  los  chatbots  personalizados  radica    en    la    llamada    base    de  conocimiento ,  la  cual  alimentamos  con  toda    la    información    que    tenemos  disponible;  por  ejemplo,  para  el  chatbot  sobre IA generativas, alimentamos la base  de  conocimiento  con  nuestro  libro  interactivo y un enlace web a Wikipedia.  Pero, veamos qué nos dice Copilot sobre  los RAG:  Los  chatbots  personalizados  pueden  utilizar  la  técnica  de  Recuperación  Aumentada  de  Generación  (RAG)  para  mejorar  la  precisión  y  relevancia  de  sus  respuestas.    Permíteme    explicarte  brevemente:  ¿Qué es RAG?  RAG combina dos enfoques: Generación  de    Lenguaje    Natural    (LLM)    y  Recuperación.  Generación  de  LLM:  Crea  respuestas  originales y contextuales.  472 \nRecuperación:  Busca respuestas en una  base de datos o corpus existente (nuestra  base de conocimiento).  Cómo funciona:  El  chatbot  primero  busca  respuestas  relevantes  en  su  base  de  datos  (recuperación).  Luego,  si  es  necesario,  genera  una  respuesta adicional utilizando técnicas de  generación    de    lenguaje    natural  (generación).  Beneficios de RAG:  Precisión:   Combina  lo  mejor  de  ambos  mundos.  Personalización:  Proporciona respuestas  específicas para cada usuario.  Contexto:   Mantiene  la  conversación  relevante.  Una de las ventajas, tal como lo indica el  primer  artículo  sobre  RAG,  es  la  reducción  de  las  alucinaciones,  pues  el  chatbot  consulta,  inicialmente,  nuestra  base  de  conocimiento;  es  decir,  las  alucinaciones  se  dan  si  alimentamos  el  RAG con información poco confiable.  473 \n6.11.2 Creando un chatbot con botpress  Esta aplicación es una de las mejores opciones en plan libre, pues  permite crear cinco chatbots con 2000 mensajes al mes y, para ser  más  atractivo,  la  posibilidad  de  pagar  según  tus  necesidades;  por  ejemplo, con 10 dólares mensuales, los mensajes aumentan a 5000.  En el siguiente video, explicamos paso a paso, cómo crear un chatbot  personalizado con botpress:  Puedes acceder al chatbot en este  enlace  y hacer solicitudes como  \"Dame un listado de IAs generativas de presentaciones\".  6.11.3 Creando un chatbot con Di-D  Antes  de  describir  este  chatbot  o  agente,  hazle  preguntas  o  solicitudes  en  la  siguiente  página;  por  ejemplo,  ¿quién  es  Juan  Guillermo? o ¡Dame un listado de IA generativas de imagen! Si deseas  hacerle las preguntas con el micrófono, hazlo en este  enlace .  474 \n475 \nEn el apartado 3.5, vimos un ejemplo de generación de video con  avatares  de  Di-D;  pero,  esta  herramienta  permite,  además,  crear  chatbots o agentes.  En el siguiente video, describimos cómo crear un chatbot con Di-D:  Figura 6.11 . Herramientas de Di-D.  D-ID  está  a  la  vanguardia  de  la  revolución  de  las  interacciones  generativas  impulsadas  por  la  IA  y  la  creación  de  contenido.  Especializada en tecnologías de Interfaz de Usuario Natural (NUI), la  plataforma D-ID transforma a la perfección imágenes, texto, videos,  audio y voz en Personas Digitales altamente atractivas, ofreciendo  una experiencia inmersiva única ( https://www.d-id.com/ ).  476 \n477 \n\n\n";

    function extractTextFromBackendResponse(raw) {

        try {
            const j = JSON.parse(s);
            if (Array.isArray(j)) return JSON.stringify(j);
            if (j && typeof j === 'object') {
                const c = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
                if (typeof c === 'string') return c.trim();
                if (typeof j.content === 'string') return j.content.trim();
                if (typeof j.text === 'string') return j.text.trim();
            }
            if (typeof j === 'string') return j;
        } catch (e) {}
        return s;
    }

        }
        pdf2Name = file.name; pdf2NameDisplay.textContent = file.name;
        pdf2StatusDisplay.textContent = 'Procesando...'; pdf2StatusDisplay.style.color = 'var(--warning)';
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(e.target.result) }).promise;
                let text = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const tc = await page.getTextContent();
                    tc.items.forEach(item => text += item.str + ' ');
                    text += '\n';
                }
                pdf2Text = text;
                pdf2StatusDisplay.textContent = '"' + pdf2Name + '" cargado.'; pdf2StatusDisplay.style.color = 'var(--success)';
                addMsg('Segundo documento "' + pdf2Name + '" listo.', 'system');
            } catch(err) { pdf2StatusDisplay.textContent = 'Error al procesar.'; pdf2StatusDisplay.style.color = 'var(--danger)'; pdf2Text = ''; }
        };
        reader.readAsArrayBuffer(file);
    });

    function dismissThinkingAsSystem(text, asError) {
        const el = document.getElementById('thinking-msg');
        if (!el) return;
        el.className = 'system-message' + (asError ? ' error' : '');
        el.textContent = text;
        el.removeAttribute('id');
    }

    function addMsg(message, sender, isThinking = false) {
        const el = document.createElement('div');
        el.classList.add(sender === 'user' ? 'user-message' : sender.includes('system') ? 'system-message' : 'bot-message');
        if (sender.includes('error')) el.classList.add('error');
        if (sender === 'bot' && !isThinking) {
            const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
            const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;">' + html + '</div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else if (sender === 'bot') {
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong> <span class="thinking-animation">' + message + '</span></div></div>';
            el.id = 'thinking-msg';
        } else if (sender === 'user') {
            const userAvatarUrl = getAvatarUrl('user');
            el.innerHTML = '<div class="message user-message"><div class="message-bubble user-bubble"></div><img class="avatar-img" src="' + userAvatarUrl + '" alt=""></div>';
            el.querySelector('.user-bubble').textContent = message;
        } else {
            el.textContent = message;
        }
        chatDisplay.appendChild(el); chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }
    function updateLastMsg(message) {
        const el = document.getElementById('thinking-msg');
        const botAvatarUrl = getAvatarUrl('bot');
        const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
        const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
        if (el) {
            el.className = 'bot-message';
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;">' + html + '</div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            el.removeAttribute('id');
            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else addMsg(message, 'bot');
        chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        let prompt = 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            prompt += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
        prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\nPregunta: ' + question + '\n\nRespuesta:';
        const systemInstructions = 'Eres un asistente que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF incrustados en esta conversación y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros materiales, programación arbitraria no vinculada al documento, etc.). ' +
            'Si la pregunta NO tiene relación con el documento ni con ese tema, responde ÚNICAMENTE una línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento.';
        try {
            const raw = (await postBackendText({
                model: MODEL,
                prompt: prompt,
                system: systemInstructions
            }) || '').trim();
            if (/^\[FUERA_DE_ALCANCE\]/.test(raw)) {
                dismissThinkingAsSystem(raw.replace(/^\[FUERA_DE_ALCANCE\]\s*/, ''), true);
            } else {
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }
    function escapeHtml(s) {
        if (s === undefined || s === null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getSessionHTML() {
        const clone = chatDisplay.cloneNode(true);
        const exportStyles =
            'body{font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;line-height:1.65;padding:28px;color:#333;max-width:880px;margin:0 auto;background:#fafafa;}' +
            'h1{color:#007bff;font-size:1.45em;margin-bottom:6px;}' +
            '.meta{color:#444;margin:6px 0;font-size:.95em;}' +
            'hr{border:none;border-top:1px solid #dee2e6;margin:22px 0;}' +
            '.chat-export{padding:4px 0;}' +
            '.chat-export .user-message,.chat-export .bot-message,.chat-export .system-message{margin-bottom:18px;}' +
            '.chat-export .system-message{text-align:center;color:#555;font-style:italic;padding:10px 14px;background:#fff3cd;border-radius:10px;border:1px solid #ffeaa7;}' +
            '.chat-export .system-message.error{background:#f8d7da;color:#721c24;border-color:#f5c6cb;}' +
            '.chat-export .message{display:flex;align-items:flex-end;gap:12px;}' +
            '.chat-export .message.user-message{flex-direction:row-reverse;}' +
            '.chat-export .avatar-img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid #e0e0e0;}' +
            '.chat-export .message-bubble{padding:12px 16px;border-radius:18px;max-width:78%;box-shadow:0 1px 2px rgba(0,0,0,.06);}' +
            '.chat-export .user-bubble{background:#007bff;color:#fff;}' +
            '.chat-export .bot-bubble{background:#e9ecef;color:#212529;}' +
            '.chat-export .bot-bubble strong{color:#007bff;}' +
            '.chat-export .bot-bubble p{margin:0 0 10px;}.chat-export .bot-bubble p:last-child{margin:0;}' +
            '.chat-export pre{background:#2d2d2d;color:#f8f8f2;padding:12px;border-radius:8px;overflow-x:auto;font-size:.9em;}' +
            '.chat-export code{background:#eee;padding:2px 6px;border-radius:4px;font-size:.9em;}' +
            '.chat-export ul,.chat-export ol{margin:8px 0;padding-left:22px;}';
        return '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sesión de chat</title><style>' + exportStyles + '</style></head><body>' +
            '<h1>Sesión de chat</h1>' +
            '<p class="meta"><strong>Documento:</strong> ' + escapeHtml(PDF_NAME) + '</p>' +
            '<p class="meta"><strong>Tema del chatbot:</strong> ' + escapeHtml(CHATBOT_THEME) + '</p>' +
            '<p class="meta"><strong>Modelo:</strong> ' + escapeHtml(MODEL) + '</p>' +
            '<hr><div class="chat-export">' + clone.innerHTML + '</div></body></html>';
    }

    function downloadSessionHtml() {
        const blob = new Blob([getSessionHTML()], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Sesion_Chat_' + Date.now() + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
