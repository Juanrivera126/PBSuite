ML.  3.  **Controlar  la  reproducción  con  JavaScript**:  Usa  JavaScript  para reproducir la música cuando comience el juego.  Funcionó la música después de poner un archivo mp3 de fondo con  nombre genérico background.mp3, pero la música no paraba era un  ciclo cerrado (loop).  Código Código        Juego Juego  Figura 5.7 . Helsinki en 2018,  Escape Room car  (foto de Eric Fischer en  Wikimedia , CC  BY 2.0).  Prompt 13  Quise  ponerle  un  botón  de  parada  para  la  música  y  propuse  el  siguiente prompt:  309 \nSe podría poner un botón de parada para la música de fondo.  La respuesta: Claro, puedes agregar un botón para detener la música  de fondo en cualquier momento. Vamos a añadir el botón en el HTML  y  a  crear  una  función  en  JavaScript  que  permita  controlar  la  reproducción de la música.  Funcionó, me dejó contento este  Código Código .  y el juego:  Objeto interactivo 5.1 . Juego Escape Room con el prompt 13.  310 \nPrompt 14  Busqué el cambio en el fondo con imágenes y propuse el siguiente  prompt:  Cada habitación tiene fondo diferente.  La  respuesta:  para  lograr  que  cada  habitación  tenga  un  fondo  diferente, podemos usar diferentes clases de CSS y cambiar estas  clases en el  div  de la habitación ( '#room' ) cada vez que el jugador  cambia de habitación.  No especifiqué que fuera con imágenes, así que solo cambió el color  de fondo de cada habitación, no fui claro.  Código Código        Juego Juego  Prompt 15  Propuse otro prompt:  No  es  fondo  del  cartel  de  las  los  puzles,  sino  el  fondo  de  toda  la  habitación.  La respuesta: entiendo, deseas que el fondo de toda la página cambie  según la habitación en la que se encuentra el jugador. Para lograr  esto,  se  puede  cambiar  la  clase  del    body   en  lugar  del    div   de  la  habitación. Aquí están los pasos necesarios para implementar esto:  1.  **CSS**:  Se  añaden  clases  para  cada  fondo  específico  de  las  habitaciones  aplicadas  al    body   ( body-room-1 ,    body-room-2 ,  etc.).  2.  **JavaScript**:  La  función    updateRoomBackground   cambia  la  clase del  body  según la habitación actual.  311 \nEn la función  updateRoom , se llama a  updateRoomBackground  para  actualizar el fondo cada vez que se cambia de habitación.  Se asegura que el fondo se restablezca al finalizar el juego o cuando el  tiempo se acaba.  Con  estos  cambios,  el  fondo  de  toda  la  página  cambiará  según  la  habitación en la que se encuentra el jugador. Asegúrate de tener las  imágenes  fondo1.jpg ,  fondo2.jpg , etc., en el mismo directorio o  ajusta las rutas según sea necesario.  Añadí  cinco  imágenes,  puse  la  misma  para  todas.  Imágenes  de  elaboración propia. Funcionó, aunque el mensaje final de ganador  dejó de ser animado.  Código Código        Juego Juego  Prompt 16  Lo  del  mensaje,  no  le  dí  importancia,  me  atreví  y  le  propuse  el  siguiente prompt:  Se puede poner imágenes para los puzles como pistas.  Respuesta: Claro, podemos agregar imágenes para las pistas de los  puzzles en cada habitación. Para hacerlo, primero necesitas tener las  imágenes correspondientes a cada pista (por ejemplo,  pista1.jpg ,  pista2.jpg ,  etc.)  y  luego  incluirlas  en  el  HTML  y  actualizar  el  JavaScript para mostrarlas.  Añadí las imágenes de  CREA , creadas por Francisco Javier Pulido, del  grupo Gseex.  Quedé satisfecho, el escape room empezaba a tomar forma ( Código Código ).  312 \nObjeto interactivo 5.2 . Juego Escape Room con el prompt 16.  313 \nPrompt 17  Quise elegir las preguntas de los puzles, c el siguiente prompt:  Escribe cinco PISTAS una para cada habitación, que conducen a cinco  libros distintos:  1.  LEANDRO FERNÁNDEZ DE MORATÍN. El sí de las niñas.  2.  VV, AA, Poesía romántica.  3.  OSCAR WILDE. El retrato de Dorian Grey.  4.  GUSTAVO ADOLFO BÉCQUER. Siete leyendas y una carta.  5.  JOSÉ ZORRILLA. Don Juan Tenorio  Respuesta:  perfecto,  aquí  tienes  cinco  pistas  que  conducen  a  los  libros seleccionados para cada habitación. He incluido estas pistas en  el juego de escape room:  1.  **El sí de las niñas de Leandro Fernández de Moratín**  - Pista: \"Busca el libro que critica los matrimonios arreglados y  defiende la libertad de las mujeres para elegir a su esposo.\"  2.  **Poesía romántica (VV.AA.)**  -  Pista:  \"En  este  libro,  encontrarás  los  sentimientos  más  profundos y oscuros de los poetas que anhelaban la libertad y el  amor, en el periodo donde la imaginación era la reina.\"  3.  **El retrato de Dorian Gray de Oscar Wilde**  - Pista: \"Este libro cuenta la historia de un joven cuya belleza  eterna esconde un oscuro secreto en un retrato que envejece  en su lugar.\"  4.  **Siete leyendas y una carta de Gustavo Adolfo Bécquer**  -  Pista:  \"Las  historias  en  este  libro  te  llevarán  a  mundos  de  misterio y fantasía, narradas por uno de los más famosos poetas  y escritores románticos españoles.\"  314 \n5.  **Don Juan Tenorio de José Zorrilla**  - Pista: \"Una obra teatral que sigue las aventuras de un famoso  seductor español que se enfrenta a su destino tras una vida de  libertinaje y engaño.\"  Y así fue, las preguntas cambiaron, todo bien, pero estaban todos los  archivos mezclados.  Código Código        Juego Juego  Prompt 18  Así que propuse otro prompt:  Los audios estarán en una carpeta llamada audios, las imágenes en una  carpeta llamada images.  Respuesta: perfecto, aquí tienes el código HTML, CSS y JavaScript  actualizado  para  asegurarte  de  que  los  audios  y  las  imágenes  se  carguen  correctamente  desde  las  carpetas  audios  e  images  respectivamente.  Obteniendo este  Código Código .  En la siguiente página se presenta el objeto interactivo.  315 \nObjeto interactivo 5.3 . Juego Escape Room con el prompt 18.  316 \nIlustración del juego Escape Room, generado por Ideogram y mejorado por KREA. \n5.7 Juegos \" Memory \"  En  1959,  el  suizo  Heinrich  Hurter  ideó  este  tipo  de  juego,  para  llevárselos a sus nietos en Londres,  se trataba de cuadrados de cartón decorados con dibujos recortados de  revistas. El hijo de Hurter, agregado militar en Londres, fascinado por el  juego, lo ofreció a la editorial Otto Maier, como se llamaba Ravensburger  en  ese  entonces.  Cuando  salió  a  la  venta  costaba  4  marcos  con  80.  Entretanto, la exitosa empresa conocida por sus rompecabezas y sus  juegos  de  mesa  ha  sacado  unas  250  versiones  del    Memory   y  en  diferentes niveles de dificultad, de 12 hasta 72 pares, de cachorros hasta  pinturas famosas ( https://www.dw.com/ ).  El popular juego de memoria,  basado en el reconocimiento  de    pares  de  tarjetas ,  surgió  en    Checoslovaquia    a  mediados  de  los  años  60,  cuando Princ trabajaba en la  Catedral  de  San  Vito  en  Praga.  El  primer  set  fue  producido en 1965 con unas  10  000  unidades.  El  Pexeso  pronto se extendió a todo el  mundo y se convirtió en uno  de los juegos más populares  de chicos y grandes al grado  que    en    la    extinta  Checoslovaquia  actualmente  República Checa se organiza  incluso    un    campeonato  nacional ( Wikipedia ).  Las  imágenes  de  las  tarjetas  pueden    ser    números,  318 \nanimales, comics, alimentos, colores, etc. Cuando el juego es digital,  estas imágenes pueden ser animadas, lo que hace más atractivo el  juego, además de poderse jugar en modo solitario.  En  el  libro    Plantillas  DescartesJS ,  presentamos  varios  modelos,  incluyendo tarjetas con videos de YouTube.  Se nos ocurrió preguntarle a GPT-4o si podía generar el código para  un juego similar. A continuación, presentamos el ejercicio.  Primer prompt  Dame el código html5 para un juego de destapar 8 parejas de imágenes,  puestas en una grilla de 16x16.  Cada  imagen  ocupa  una  cuadrícula    de    135x135  pixeles. Al iniciar el juego, las  imágenes  están  tapadas  con  una  imagen  comodín,  que  rota al hacer clic sobre ella,  descubriendo  la  imagen  que  cubre.    Solo    se    pueden  destapar dos, si se encuentra  una    pareja    permanecen  destapadas, sino se vuelven a  tapar.  GPT-4o    nos    generó    este  Código Código .    El    juego    lo  presentamos  en  la  siguiente  página, escalado con el editor  DescartesJS.  Foto por KF, 2005, en  Wikimedia , Dominio público.  319 \nObjeto interactivo 5.4 . Juego \"Memory\" con el primer prompt.  Segundo prompt  Está perfecto ¿podrías cambiar el comodín por una imagen en lugar del  interrogante?  GPT-4o  nos  generó  este    Código Código .  El  juego  lo  presentamos  en  la  siguiente página, escalado con el editor DescartesJS.  320 \nObjeto interactivo 5.5 . Juego \"Memory\" con el segundo prompt.  Tercer prompt  Finalmente,  ¿puedes  hacerlo  responsivo,  que  se  escale  a  cualquier  tamaño de pantalla?  GPT-4o nos generó este    Código Código . Con este último no tuvimos que  recurrir a DescartesJS.  321 \nEn este último juego, incluimos tarjetas con imágenes animadas y  cambiamos la imagen comodín.  Objeto interactivo 5.6 . Juego \"Memory\" con el tercer prompt.  Tras el éxito conseguido hasta el momento, intentamos realizar una  potente  mejora  en  un  único  prompt  que  mejorase  el  juego  y  aumentase su jugabilidad y atractivo.  322 \nCuarto prompt  Partiendo del juego de parejas del archivo adjunto necesito que realices  los  siguientes  cambios.  Antes  de  que  la  partida  comience,  deberá  presentarse  un  elegante  panel  de  recogida  de  datos  superpuesto  y  centro a las cartas. Las cartas no podrán utilizarse hasta que se complete  el  panel  y  se  pulse  empezar.  Dicho  panel  de  introducción  de  datos  contará con los siguientes campos: nombre del jugador, número máximo  de fallos permitidos y tiempo para resolver el panel. El panel inicial debe  tener unos valores por defecto. El tiempo mínimo debe ser 5 segundos y  el número de fallos mínimo 1, el programa no debe permitir valores  inferiores a estos datos.. Después coloca en la zona inferior del juego un  elegante marcador en el que se reflejen los siguientes datos: aciertos,  fallos, tiempo restante, máximo número de fallos permitidos y nombre  del  jugador.  En  el  marcador  inferior:  coloca  los  bordes  redondeados,  coloca dos filas una para el enunciado y otra para el valor, incluye líneas  con estilo de separación entre los diferentes campos. Al finalizar el juego  deberá  mostrarse  uno  de  los  siguientes  mensajes  con  fondo  semitransparente y tener un efecto llamativo de entrada (El efecto de  entrada de todos los mensajes debe ser aparición progresiva con zoom).  Los  mensajes  deben  ser  según  corresponda:  a)  si  consigue  terminar  correctamente  en  tiempo:  \"Felicidades  panel  completado\"  (en  color  verde). b) Si se alcanza el número máximo de fallos permitidos \"Juego  finalizado. Número máximo de fallos alcanzado\" (en color rojo). c) Si se  agota el tiempo \"Juego finalizado. Tiempo terminado\" (en color azul).  Tras  finalizar  el  juego  debe  tener  un  control  de  volver  a  jugar  que  devuelva al juego al panel inicial. El juego debe estar enmarcado con  bordes redondeados.  GPT-4o  nos  generó  este    código código ,  que  se  adapta  bien  al  prompt  utilizado. Se trata de un juego responsivo por lo que no hubo que  utilizar DescartesJS.  Cierto  es  que,  aunque  la  IA  se  acercó  desde  el  principio  a  los  requisitos solicitados, hubo que hacer muchos reintentos y mejoras  hasta  conseguir  el  resultado  deseado.  Esto  pone  de  manifiesto  la  importancia del diseño de los prompts y de la estrategia utilizada en  el proceso.  323 \nDado el buen resultado obtenido, pasamos a la siguiente y última  fase,  introducir  efectos  sonoros  al  juego.  En  este  caso,  en  primer  lugar, vamos a mostrar el resultado.  324 \nEn  segundo  lugar,  incluimos  el  código  generado  por  GPT-4o  y  retocado por Claude.  Código Código .  325 \nEn tercer lugar, incluimos el prompt utilizado y comentamos algún  retoque adicional.  Quinto prompt  Me gustaría poner efectos sonoros al juego del código adjunto. Estos  efectos  deberían  estar  y  ser  diferentes  en  los  siguientes  momentos:  Comenzar  el  juego.  Acertar  una  pareja.  Fallar  una  pareja.  Tiempo  finalizado. Fallos máximos alcanzados. Panel terminado con éxito. Dame  el  código  completo  realizando  sólo  los  cambios  para  introducir  los  efectos  sonoros.  Los  efectos  sonoros  deben  poder  desactivarse  y  activarse al inicio de la partida mediante un control deslizante.  Además,  se  añadió  que  el  juego  guardase  memoria  de  los  datos  iniciales para las sucesivas partidas.  5.8 Juego \"El Ahorcado\"  Este  juego  es  clasificado  como  un  juego  de  palabras  en  el  que  participan  dos  jugadores.  El  primer  jugador  (el  ordenador  para  nuestro  caso)  selecciona  una  palabra  que  el  otro  jugador  debe  adivinar.  Según la \"Guía de Oxford de Juegos de palabras\" el segundo jugador  pierde cuando ha realizado 11 intentos; sin embargo, para nuestro  ahorcado  hemos  definido  la  pérdida  con  cinco  errores  o  letras  equivocadas.  A  continuación,  presentamos  la  charla  (chat)  que  tuvimos  con  ChatGPT,  hasta  obtener  un  juego  que  cumpliera  con  nuestras  indicaciones o, al menos, fuera jugable según las especificaciones del  juego.  326 \n327 \nDe las tres versiones, presentamos la segunda (index2.html), en la  cual hay que ingresar cada letra y hacer clic en el botón  Adivinar . Las  palabras para adivinar son javascript, HTML, CSS, programación y  desarrollo.  Con las mismas indicaciones, Claude generó el siguiente  código código , cuya  ejecución presentamos a continuación:  328 \n329 \nFigura 5.8 . Ed Logg parado junto a un  gabinete \"Gold Asteroids\" muy raro en  Atari (foto tomada por Aaron Hightower,  Wikimedia , CC BY-SA 3.0).  5.9  Los  programadores  son  necesarios  -  Asteroids  Este título lo hemos puesto al analizar el juego  asteroides , generado  por una IA, y contrastarlo con el juego original o, al menos, con un  clon del mismo. Pero, antes del análisis, hagamos un viaje a los finales  de los años 70 del siglo pasado... bueno, que sea ChatGPT quien lo  haga:  5.9.1 El juego  Asteroids  Asteroids   es  un  juego  de  arcade  lanzado    por    Atari    Inc.    en  noviembre  de  1979.  Diseñado  por  Lyle  Rains  y  Ed  Logg,  se  ha  convertido en uno de los juegos  más icónicos y exitosos de la era  dorada de los videojuegos arcade.  Concepto y Jugabilidad  En    Asteroids ,    los    jugadores  controlan  una  pequeña  nave  espacial    en    un    campo    de  asteroides  que  está  plagado  de  asteroides y platillos voladores. El  objetivo es disparar y destruir los  asteroides  y  platillos  mientras  se  evita  colisionar  con  ellos.  Los  jugadores pueden girar la nave y usar propulsores para moverse por  330 \nla pantalla, que tiene un efecto de envolvimiento: los objetos que  salen por un borde de la pantalla reaparecen en el borde opuesto.  Desarrollo y Lanzamiento  El  desarrollo  de    Asteroids   fue  influenciado  por  juegos  anteriores  como  \"Spacewar!\"  y  \"Computer  Space\".  Lyle  Rains  inicialmente  propuso la idea de un juego basado en destruir asteroides. Ed Logg  fue  asignado  al  proyecto  y  añadió  la  característica  de  platillos  voladores para aumentar la dificultad y el interés del juego.  Impacto y Legado  Asteroids  se convirtió en un éxito comercial inmediato y se vendieron  más  de  70,000  unidades  de  arcade.  Su  popularidad  ayudó  a  consolidar  el  uso  del    vector  graphics ,  una  tecnología  que  permitía  gráficos  más  detallados  y  rápidos  en  comparación  con  los  juegos  basados en  raster . La simplicidad del diseño y la jugabilidad adictiva  hicieron de  Asteroids  un clásico que sigue siendo recordado y jugado  hoy en día.  El  juego  inspiró  numerosos  clones  y  versiones  en  diferentes  plataformas,  incluyendo  consolas  domésticas  como  el  Atari  2600.  También influyó en el diseño de muchos juegos de disparos en el  espacio que vinieron después.  Innovaciones Técnicas  Asteroids  fue uno de los primeros juegos en presentar un sistema de  puntuación  alto  que  podía  ser  guardado,  lo  que  fomentaba  la  competencia entre jugadores. La física del movimiento de la nave,  basada en inercia y aceleración, fue otra innovación clave que añadió  un nivel de realismo y desafío al juego  331 \nReferencias  Kent,  Steven  L.  The  Ultimate  History  of  Video  Games.  Prima  Publishing, 2001.  Donovan, Tristan. Replay: The History of Video Games. Yellow Ant,  2010.  Kohler,  Chris.  Power-Up:  How  Japanese  Video  Games  Gave  the  World an Extra Life. BradyGames, 2004.  Barton,  Matt.  Vintage  Games:  An  Insider  Look  at  the  History  of  Grand Theft Auto, Super Mario, and the Most Influential Games  of All Time. Focal Press, 2009.  Herman,  Leonard.  Phoenix  IV:  The  History  of  the  Videogame  Industry. Rolenta Press, 2016.  5.9.2  Asteroids  creados con ChatGPT  Para  no  extender  la  conversación  con  ChatGPT,  presentamos  las  cuatro indicaciones dadas, hasta obtener este  Código Código .  Dame el código HTML5 para un juego de naves espaciales donde debes  destruir asteroides con tu nave y evitar ser golpeado por ellos.  Agrega puntaje en el juego y destrucción de la nave si es impactado por  un asteroide.  Incluye audio para las colisiones y tres vidas para la nave.  ¿Es posible que los asteroides no sean circulares?, ¿podrías darle forma  de nube y con colores variados?  Para comprender los objetivos propuestos, es importante ver el juego  original  en  algún  canal  de  YouTube.  Uno  de  estos  canales  es    Old  Classic Retro Gaming .  332 \nCon las indicaciones anteriores, obtuvimos el siguiente juego 5 :  Lo más cercano al juego original son, quizá, los disparos. La nave no es  triangular, los asteroides en nada se parecen a los originales y... un  largo etcétera.  Obviamente, habrá que ir dando otras indicaciones a ChatGPT para  irnos  aproximando  al  juego  original;  por  ejemplo,  James  Socol,  después de seis horas obtuvo el siguiente  juego , que mostramos a  continuación:  Hicimos algunas intervenciones con el editor DescartesJS, para el inicio del juego y el  escalado.  5  333 \nAhora, el parecido con el original es mayor, aunque no muestre los  ovnis y carezca de sonido. Un comentario de Socol es el siguiente:  El  Spacewar!  original, uno de los primeros (si no el original) juego de  ordenador, tardó  200 horas  en codificar. Esto probablemente me llevó 6.  Estoy muy contento de haber superado el PDP-1 6 .  Socol hace la comparación con Spacewar! pero, estamos seguros, el  Asteroids  de 1979 demandó mucho más tiempo de programación.  Véase el libro \" Atari: la historia continúa \", para más información del ordenador PDP-1. 6  334 \nJames Socol es un ingeniero de software y, seguramente, se ayudó de  ChatGPT; es decir, la creatividad es del programador. Por contraste,  Robin Lamb  realizó la siguiente conversación con ChatGPT:  335 \nObteniendo el siguiente juego (movimientos y disparos con el ratón):  5.9.3 Los programadores y los Clones de  Asteroids  A continuación, presentamos dos clones del juego  asteroids , sin ayuda  de  IA.  El  primero,  fue  desarrollado  por  el  programador    Akimitsu  Hamamuro , el segundo por un programador ruso. Se evidencian los  mejores resultados logrados por los programadores.  336 \n337 \nFigura 5.9 . Portada de la revista número  41 dirigida por Pedro Ocón de Oro  (crédito:  https://www.todocoleccion.net/ ).  5.10 Sopas de letras  Este pasatiempo fue inventado por el español Pedro Ocón de Oro,  logrando una rápida popularización de este juego de palabras.  La sopa de letras es un juego que  consiste  en  descubrir  un  número  determinado    de    palabras  enlazando  estas  letras  de  forma  horizontal, vertical o diagonal y en  cualquier    sentido,    tanto    de  derecha  a  izquierda  como  de  izquierda a derecha (lo que implica  la  posibilidad  de  que  algunas  palabras  se  hallen  deletreadas  al  revés),  y  tanto  de  arriba  abajo,  como de abajo arriba. Las palabras  a  encontrar  se  pueden  englobar  dentro de una temática concreta.  Una variante del juego es la sopa  numérica,  en  la  cual  en  lugar  de  letras  son  números  y  consiste  en  hallar cifras en lugar de palabras.  ( https://es.wikipedia.org/ ).  A  continuación,  presentamos  un  ejercicio con tres herramientas de  IA (ChatGPT-4o, Claude 3 Sonnet  y Gemini 1.5 Pro), iniciando con  Claude 3 Sonnet, con este prompt:  Dame el código hmtl5 para una sopa de letras con 15 palabras. La sopa  de letras ocupa una grilla de 12x12. Las palabras las debe distribuir al  azar. El usuario tiene la opción de marcar las palabras haciendo clic en la  primera letra y desplazando el mouse hasta la última letra. La palabra  pintada en verde si corresponde a una de las 15 palabras dadas.  338 \nLas interacciones con estas herramientas y los códigos obtenidos, las  puedes consultar a continuación (usa el scroll vertical para ver todo el  contenido):  En las siguientes páginas, presentamos algunas sopas obtenidas.  339 \nSopa con Claude 3 Sonnet  Si seguiste la discusión de la página anterior, habrás notado un error  en las últimas sopas de Claude, pues algunas palabras no se dejan  señalar.  Pedimos ayuda a ChatGPT, dándole el código de Claude y el siguiente  prompt:  Revisa  el  código  en  sopa4.html  y  corrige  el  siguiente  error  \"algunas  palabras de la sopa no se dejan marcar, pese a que corresponden a las  dadas en la lista\". Pon un mensaje de felicitaciones cuando se señalen  todas las palabras.  340 \nSopa con ChatGPT-4o  Se puede observar que el diseño de Claude ni las palabras cambiaron  con el modelo ChatGPT, pero se logró solucionar el error.  Como último ejercicio, le dimos el código generado por ChatGPT a  Gemini 1.5 Pro, con la siguiente indicación:  Usa el código dado en gpt2.html y presenta un diseño más elegante,  incluyendo  diferentes  colores  para  las  palabras  correctamente  señaladas.  El resultado fue bueno, pero no cambió los colores en las palabras.  341 \nSopa con Gemini 1.5 Pro  Con este último diseño, se observa que se ve bien en modo oscuro y  en  ventana  ampliada.  Finalmente,  hicimos  una  intervención,  reduciendo el número de palabras a 10, cambiando las palabras y  colores, encontrando que la sopa seguía funcionando bien.  342 \nSopa Gemini modificada  343 \n5.11 Tetris  Este  juego  fue  diseñado  por  el  soviético  Alekséi  Pázhitnov  y  publicado  en  1984,  alcanzando  gran  popularidad  y  éxito  a  nivel  mundial. Su nombre deriva del prefijo numérico griego tetra- (cuatro),  ya  que  todas  las  piezas  del  juego,  conocidas  como  tetrominós,  contienen cuatro segmentos, y del tenis, el deporte favorito de su  autor  7 .  Wikipedia. https://es.wikipedia.org/wiki/Tetris 7  344 \nCuatro  décadas  después  y  con  ayuda  de  la  inteligencia  artificial  vamos a reproducir una versión de este conocido juego. Inicialmente  se pidió a ChatGPT-4o el siguiente prompt para generar el juego:  Dame el código html5 para el juego tetris, incluye puntaje y niveles.  Luego se le pidió que:  Asigna la tecla \"flecha arriba\" para la rotación de piezas.  345 \nSobre este juego se han realizado diferentes mejoras, tales como la  adición de más controles, integración de música, mejora de estilos,  instrucciones, marcadores, etc.  Para su realización se han utilizado varias inteligencias artificiales  combinadas  y  además  ha  habido  que  realizar  ciertos  ajustes  manuales. La gran cantidad de líneas de código que contiene y los  requisitos específicos que se han pedido han sido las causas de ello.  346 \n5.12 Juegos rápidos  En  este  apartado  vamos  a  presentar  algunos  juegos  que  son  rápidamente generados por la inteligencia artificial y que además son  rápidos de jugar.  Se han realizado utilizando el siguiente prompt genérico.  Necesito que me des el código HTML5 completo un pequeño y divertido  juego  educativo  que  puedas  programar.  El  juego  debe  ser  vistoso,  llamativo y debe funcionar correctamente. El juego debe llevar un título  y un objetivo. Debe tener un tiempo para realizarlo. Debe aparecer un  mensaje  cuando  se  consiga  el  objetivo  y  cuando  no.  Los  controles  y  fondos deben llevar colores degradados. Los marcadores deben estar  recuadrados. Debe ser responsive. Debe incluir un botón de comenzar y  otro con las instrucciones que debe salir en una ventana emergente.  En  el  prompt,  no  se  ha  solicitado  ningún  juego  concreto  a  la  IA,  dejando a su criterio la elección y mecánica del mismo.  Tras obtener de la IA la primera versión, después se le van pidiendo  pequeños retoques y ajustes. También se pueden realizar pequeños  ajustes manuales en la programación del código obtenido.  5.12.1 Atrapa las letras  Este juego ha sido generado en su totalidad con Claude 3.5, entre el  prompt inicial y los ajustes posteriores se necesitaron menos de 5  instrucciones,  que  son  las  que  esta  inteligencia  artificial  ofrece  seguidas de forma gratuita.  La mecánica del juego generado consiste en acertar si las letras que  van saliendo secuencialmente son vocales o consonantes. Se deberán  acertar al menos 20 letras en un tiempo de 30 segundos sin cometer  más de tres fallos. Presentamos el resultado:  347 \n5.12.2 Ordena los números  Este juego se ha generado partiendo del anterior con Claude 3.5,  utilizando  pocos  prompts.  En  el  propio  juego  se  indican  las  instrucciones.  348 \n349 \n5.12.3 Atrapa las estrellas  Este juego se ha generado a partir del prompt inicial con ChatGPT-4o,  y posteriormente ha sido modificado utilizando algunos prompts. En  el propio juego se indican las instrucciones.  350 \n5.12.4 Equilibrio cósmico  Se ha pedido a Claude 3.5 que partiendo de dos juegos anteriores  genere otro diferente. En el juego están las instrucciones.  351 \n5.12.5 Desafío cromático  Este juego se ha generado a partir del prompt inicial con Perplexity,  pero al no ser capaz de hacerlo se terminó con Claude 3.5.  352 \n5.12.6 Buscaminas  Generado, inicialmente, con ChatGPT-4o y mejorado con Claude 3.5.  353 \n5.12.7 Cazatesoros  Generado con Claude 3.5 a partir del juego buscaminas.  354 \n5.12.8 Matemáticas rápidas  Iniciado con Claude 3.5 y terminado con ChatGPT-4o.  355 \n5.12.9 Othello  Realizado conjuntamente entre Claude 3.5 y ChatGPT-4o.  356 \n5.12.10 Secuencia luminosa  Juego realizado por Claude 3.5 inspirándose en tres de los juegos  anteriores elegidos aleatoriamente.  357 \n\nCapítulo VI Capítulo VI  IA en la academia IA en la academia \n\nFigura 6.1 . Imagen generada por  Designer de Copilot.  6.1 Introducción  En  la  era  de  la  información,  la  inteligencia  artificial  (IA)  ha  emergido    como    una    fuerza  transformadora  en  una  amplia  gama de campos, y la academia no  es la excepción. Las herramientas  basadas    en    IA    están  revolucionando  la  forma  en  que  investigadores,    profesores    y  estudiantes    abordan    el  aprendizaje,  la  enseñanza  y  la  investigación.    Desde    la  generación    automática    de  presentaciones  hasta  el  análisis  profundo    de    documentos  académicos,  la  IA  está  redefiniendo  los  métodos  tradicionales  y  proporcionando  nuevas  oportunidades  para  el  avance  del  conocimiento.  Las  IA  generadoras  de  presentaciones,  como  las  que  emplean  algoritmos  de  procesamiento  de  lenguaje  natural  y  aprendizaje  automático, permiten a los académicos crear diapositivas coherentes  y visualmente atractivas en cuestión de minutos. Estas herramientas  no solo ahorran tiempo, sino que también garantizan una estructura  lógica y una narrativa clara, aspectos cruciales para la comunicación  efectiva de ideas complejas.  Por otro lado, las herramientas de IA para leer y analizar documentos  están  democratizando  el  acceso  a  la  información  y  mejorando  la  eficiencia en la investigación. Mediante técnicas avanzadas como la  minería de textos y el análisis semántico, estas herramientas pueden  361 \nescanear vastas cantidades de literatura  académica, identificar patrones, extraer  información  relevante  y  proporcionar  resúmenes precisos. Esto permite a los  investigadores mantenerse al día con los  desarrollos más recientes en sus campos,  sin verse abrumados por la cantidad de  publicaciones disponibles.  En  este  capítulo,  exploraremos  las  diversas  aplicaciones  de  la  IA  en  la  academia,    destacando    cómo    estas  tecnologías    están    cambiando    el  panorama  educativo  e  investigativo.  Analizaremos  casos  de  uso  específicos,  evaluaremos  los  beneficios  y  desafíos  asociados  con  la  adopción  de  estas  herramientas y reflexionaremos sobre el  futuro de la IA en el ámbito académico.  La  incorporación  de  la  IA  no  solo  está  optimizando procesos, sino que también  está  impulsando  una  nueva  era  de  innovación    y    colaboración  interdisciplinaria (ChatGPT).  6.2 IA generadoras de  presentaciones  La presentación efectiva de ideas es una  habilidad  fundamental  en  el  ámbito  académico    y    profesional.    Tradicio-  nalmente, la creación de presentaciones  requiere tiempo, esfuerzo y un sentido  362 \nestético  que  no  todos  poseen  de  manera  innata.  Aquí  es  donde  las  inteligencias artificiales generadoras de  presentaciones  están  marcando  una  diferencia significativa.  Las IA generadoras de presentaciones  utilizan    avanzados    algoritmos    de  procesamiento  de  lenguaje  natural  y  aprendizaje    automático    para  automatizar la creación de diapositivas.  Estas    herramientas    analizan    el  contenido    proporcionado    por    el  usuario,  como  artículos,  informes  o  simplemente  puntos  clave,  y  generan  una    estructura    de    presentación  coherente  y  visualmente  atractiva.  Al  hacerlo,  permiten  a  los  académicos  y  profesionales    concentrarse    en    el  contenido y la narrativa de su discurso,  en lugar de invertir tiempo en el diseño  y la organización de las diapositivas.  El  proceso  es  sorprendentemente  sencillo: el usuario ingresa el material  base  y  la  IA  se  encarga  del  resto,  generando  automáticamente  títulos,  subtítulos,    y    bloques    de    texto  relevantes,  además  de  seleccionar  gráficos,  imágenes  y  estilos  de  diseño  que  complementan  el  contenido.  Este  enfoque no solo optimiza el tiempo de  preparación, sino que también asegura  363 \nque las presentaciones mantengan un estándar de calidad visual y  estructural elevado.  Las aplicaciones de estas herramientas son diversas y potentes. En el  contexto  académico,  pueden  ser  utilizadas  para  preparar  clases,  seminarios, y conferencias con una eficiencia sin precedentes. Para  los  estudiantes,  estas  IA  pueden  ayudar  a  estructurar  sus  exposiciones  y  proyectos,  facilitando  una  comunicación  clara  y  persuasiva de sus ideas. Asimismo, en el ámbito de la investigación,  las IA generadoras de presentaciones permiten a los investigadores  compartir  sus  hallazgos  de  manera  efectiva  en  congresos  y  publicaciones científicas.  A medida que la tecnología continúa evolucionando, las capacidades  de  estas  herramientas  se  expanden,  incorporando  características  como  la  personalización  de  estilos,  la  integración  de  feedback  en  tiempo real y la adaptación a diferentes audiencias. Sin duda, las IA  generadoras de presentaciones están redefiniendo el panorama de la  comunicación visual en la academia, ofreciendo una combinación de  eficiencia,  creatividad  y  precisión  que  promete  transformar  la  manera en que compartimos y presentamos el conocimiento.  Para nuestro ejercicio, el tema que usaremos es \"IA generadoras de  presentaciones\".  6.2.1 Diapositivas generadas por ChatGPT  Le dimos a ChatGPT la siguiente indicación:  Voy  a  realizar  una  presentación  con  el  tema  \"IA  generadoras  de  presentaciones\", ¿me ayudas con las diapositivas?  Esta fue la respuesta:  364 \n365 \n6.2.2 Diapositivas generadas por Gamma  Gamma  es una de las mejores IA generativas de presentaciones, en la  que se destaca:  Selección de idiomas, entre ellos el español  Tres  formas  de  iniciar  la  creación  de  una  presentación  de  diapositivas  Posibilidad  de  cambiar  el  estilo  con  otra  plantilla,  luego  de  generar la presentación.  Generación de hasta 10 diapositivas en el plan libre.  Puede generar animaciones y videos en las diapositivas.  En el plan gratuito entrega, inicialmente, 400 créditos.  Permite la exportación a formato PPT/X o PDF.  Para nuestro ejercicio, iniciamos pegando el texto que nos generó  366 \nChatGPT,  en  el  apartado  anterior,  y  seleccionamos  8  tarjetas  o  diapositivas.  El resultado obtenido lo presentamos a continuación, utilizando un  presentador de imágenes del apartado 2.6 (haz clic sobre la imagen):  La posibilidad de obtener el archivo en formato PPT/X, en el plan  libre, permite que podamos modificar las diapositivas obtenidas.  Gamma IA usa la tecnología de inteligencia artificial  basada en un modelo de aprendizaje profundo y  entrenada con un conjunto de datos masivos, para  producir la información. El modelo puede comprender  la estructura de las presentaciones, el contenido de las  diapositivas y el diseño visual de las mismas. Esto  permite que la aplicación \"genere exposiciones  visualmente atractivas e informativas\"  367 \n6.2.3 Diapositivas generadas por Slidesgo  En el plan libre Slidesgo tiene varias limitaciones, entre ellas: Solo  cinco plantillas para elegir y exportación únicamente en formato PDF.  No permite crear a partir de archivos, solo acepta que se describa el  tema de la presentación, a partir del cual la IA genera la presentación  que, en general, es bastante aceptable.  Le  dijimos  a  Slidesgo  que  el  tema  era  \"IA  generativas  de  presentaciones\".  Inmediatamente  generó  ocho  diapositivas,  que  mostramos  en  el  siguiente  \"presentador  diseñado  con  el  editor  DescartesJS\":  Haz  clic  en  el  botón  de  la  esquina  superior  derecha,  para  ver  la  presentación en pantalla completa.  368 \n6.2.4 Diapositivas generadas por MagicSlides  MagicSlides   es  otra  aplicación  que,  en  su  plan  libre,  presenta  limitaciones significativas: 3 Presentaciones/mes, 1 página de pdf a  ppt, 1 página de docx a ppt, 500 palabras a ppt, 10 diapositivas por  presentación  y  solo  admite  cambio  de  idioma  en  el  plan  Pro.  Sin  embargo,  se  le  abona  que  pueda  convertir  videos  de  YouTube  o  páginas web a ppt.  Para  generar  nuestra  presentación,  le  dimos  las  diapositivas  de  ChatGPT en formato PDF, obteniendo una presentación en inglés de  11  diapositivas.  Algunas  de  ellas  las  mostramos  en  el  siguiente  \"presentador diseñado con el editor DescartesJS\":  Puedes ampliar la diapositiva a ventana completa o activar la lupa  para leer las diapositivas.  369 \nExisten otras herramientas AI, pero la mayoría de pago o con mínimas  prestaciones en el plan de prueba; por ejemplo, SlidesPilot permite  tres generaciones y sin posibilidad de descargar, Prezo tiene plan de  prueba, pero sus diapositivas no son de buena calidad y Decktopus  eliminó el plan de prueba.  Figura 6.2 . Diapositiva generada por SlidesPilot (clic en la imagen para ir al sitio).  Figura 6.3 . Diapositiva generada por Prezo (clic en la imagen para ir al sitio).  370 \n6.2.5 Video-presentaciones con Lumen5  Lumen5   es  una  de  las  herramientas  de  IA  que  más  prestaciones  ofrece en el plan libre:  Resolución de video 720p  Hasta cinco videos al mes  2 minutos de voz  En este plan, la última diapositiva viene con la marca de agua de  Lumen5, pero, para efectos académicos, ello no representa mayor  problema. En los cuatro planes de pago, el más económico es de 19  dólares mensuales.  Video 6.1 . Video-presentación de Lumen5  Lumen5 da cuatro posibilidades, para generar un video: escribir una  idea, pegar un texto, pegar una URL, por ejemplo, de una página o de  un post o subir un documento.  371 \n6.2.6 Video-presentaciones con Fliki  Fliki AI  ofrece un plan gratuito con cinco minutos de créditos por mes  y marca de agua. También hay un plan de 2160 minutos a un costo de  21 dólares por mes.  Permite crear un video a partir de un guion, el cual Fliki divide en  varias escenas, a las que le agrega imágenes o clips de video, los  cuales podemos cambiar. Admite 75 idiomas y 100 acentos. Observa  la presentación realizada sobre \"IA generadoras de diapositivas\" con  13 escenas:  Video 6.2 . Video-presentación de Fliki  Se observa que en todas las escenas aparece la marca de agua de  Fliki.  372 \n6.2.7 Video-presentaciones con invideo  InVideo AI  es otra IA generativa de videos tipo presentación pero, a  diferencia de Fliki, genera el guion, crea escenas y agrega voces en  varios idiomas. El plan gratuito otorga 10 minutos de generación de  video por semana, en el plan Plus son 50 minutos por un costo de 20  dólares mensuales. Con solo dar clic a \" Create video \", escribir la idea y  dar clic a \" Generate video \", obtuvimos el siguiente video con la idea \"IA  generadoras de diapositivas\":  Video 6.3 . Video-presentación de Fliki  6.2.8 Video-presentaciones con Wepik  Terminamos con  Wepik , una herramienta IA gratis a la fecha, en la  que  seleccionamos    AI  Presentation  Maker   en  la  opción    Features   e  incluyendo nuestra idea \"IA generadoras de diapositivas\", obteniendo  la siguiente presentación (PDF presentado en formato HTML5 con la  aplicación  IDR Solutions ):  373 \n374 \n6.3 IA usadas para generación de contenido  6.3.1 Escribiendo con ayuda de las IA  Es cierto que estas herramientas son útiles como  asistentes de escritura. La IA generativa es la mejor  herramienta para tomar notas y resumir reuniones del  mundo. Es excelente para extraer estadísticas de  informes enormes, crear listas de elementos comunes  (beneficios, desafíos, mejores prácticas) a partir de un  montón de artículos fuente y escribir metatítulos y  descripciones. También puede generar un esquema  aceptablemente bueno, aunque nunca he tenido uno que  haya resultado intocablemente perfecto ( Jacqueline  Dooley ).  En este apartado, veremos cómo usar la IA para redactar textos; sin  embargo, como advierte Dooley, \"las herramientas de IA generativa  son realmente buenas para inventar cosas y presentar estas mentiras  con confianza\"; es decir, es nuestra responsabilidad revisar y verificar  que  lo  que  escribe  la  IA  es  cierto  y,  en  ocasiones,  mejorar  su  redacción, para que parezca más humana.  Continúe y utilice IA generativa si desea crear una  publicación de blog o algo más complejo como un libro  electrónico o un informe. Pero le imploro que contrate a un  escritor para supervisar y refinar cualquier basura caliente  que surja de la herramienta de su elección impulsada por IA  ( Jacqueline Dooley ).  En las siguientes interacciones, veamos cómo nos puede ayudar una  IA para redactar una introducción a las funciones cuadráticas.  375 \n376 \nAmbas IA presentan un buen contenido sobre funciones cuadráticas,  siendo más descriptiva ChatGPT-4o. Ahora, probaremos tres IA con  esta  indicación:  \"Haz  una  introducción  a  las  IA  generativas  de  imagen, incluye referencias\"  377 \nPara evitar las llamadas \"alucinaciones\" 8  o, mejor, las mentiras de las  IA, es recomendable pedirle que acompañe su respuesta con algunas  referencias, tal como lo hicimos en el ejemplo anterior. Obtenidas las  referencias,  podemos  verificar  alguna  información  en  la  que  tengamos dudas. Algunos ejemplos de alucinaciones de las IA, son:  Información  que  no  se  basa  en  hechos ,  como  generar  URL,  bibliotecas de códigos o personas que no existen. También es común  que entreguen referencias bibliográficas inexistentes.  Datos  falsos .  Las  IA  pueden  presentar  información  ficticia  como  nombres de ciudades, especies de animales, tipos de virus, etc., que  no existen.  Las alucinaciones de la IA pueden ocurrir porque los modelos de  aprendizaje de idiomas (LLM) se centran en los patrones y la  coherencia del lenguaje, no en la precisión objetiva del  contenido que generan. Esto significa que, si bien el resultado  puede parecer plausible y gramaticalmente correcto, no  necesariamente está verificado ( Ahmed BITLAW ).  En el contexto legal, la alucinación más famosa la experimentó un  abogado del Distrito Sur de Nueva York. Como demandante en un  caso de lesiones personales, el abogado argumentó en contra de una  moción  para  desestimar  un  reclamo  citando  múltiples  casos  que  sostenían que el plazo de prescripción relevante debía suspenderse  en una determinada circunstancia. Desafortunadamente, el abogado  confió en ChatGPT para identificar y resumir estos casos. Los casos  fueron alucinaciones.  El término “alucinación de la inteligencia artificial” (también denominada confabulación o  delirio) se refiere, en este contexto, a la capacidad de los modelos de IA para generar  contenido que no se basa en datos reales, sino que es producto de la propia imaginación de  los modelos. Existe preocupación por los posibles problemas que pueden plantear las  alucinaciones de la IA, entre ellos, los de carácter ético, social y práctico ( Ahmed Banafa ).  8  378 \n6.3.2 ¿Cómo nos ayudan las IA para redactar libros?  Las IA pueden ser herramientas muy útiles para redactar libros o  capítulos de libros de varias maneras:  1.  Generación de contenido : Las IA pueden generar texto basado  en  un  conjunto  de  directrices  o  temas  proporcionados.  Esto  puede  ser  útil  para  crear  borradores  iniciales  o  incluso  para  escribir partes completas de un libro.  2.  Edición y revisión : Las IA pueden ayudar a identificar errores  gramaticales, ortográficos y de estilo, mejorando la calidad del  texto.  También  pueden  sugerir  mejoras  en  la  coherencia  y  cohesión del contenido.  3.  Investigación  y  recopilación  de  información :  Las  IA  pueden  buscar  y  compilar  información  relevante  sobre  un  tema  específico, ahorrando tiempo en la fase de investigación.  4.  Desarrollo de ideas : Las IA pueden generar ideas y temas a  partir de una breve descripción o unas pocas palabras clave,  ayudando a los escritores a superar bloqueos creativos.  5.  Optimización  del  contenido :  Las  IA  pueden  analizar  la  estructura  y  el  flujo  del  texto  para  asegurarse  de  que  el  contenido sea claro y fácil de seguir. También pueden sugerir  cambios para mejorar la legibilidad y el impacto.  6.  Generación de títulos y descripciones : Las IA pueden ayudar a  crear  títulos  atractivos  y  descripciones  concisas  para  los  capítulos o el libro completo, facilitando la comercialización y  promoción del trabajo.  Estas son sólo algunas capacidades en las que las IA son herramientas  versátiles y poderosas para autores y editores, ayudando a mejorar la  eficiencia y la calidad del proceso de escritura (ChatGPT-4o).  379 \nEl  anterior  texto  fue  generado  por  ChatGPT-4o.  Veamos  algunas  interacciones con esta herramienta de IA, en las que se evidencia  cómo nos puede ayudar para redactar un capítulo de libro:  380 \n6.3.3 IA creadoras de historias  Con ayuda de Claude, iniciemos este apartado conociendo algo del  storytelling :  381 \nLas imágenes no las generó Claude, las obtuvimos con Designer de  Copilot, Claude nos dejó las etiquetas para incluirlas.  Los  generadores  de  historias  con  inteligencia  artificial  son  herramientas  que  convierten  ideas  en  relatos  cautivadores.  Estas  herramientas  utilizan  nuestras  sugerencias  para  crear  narrativas  únicas  en  cuestión  de  segundos,  lo  que  las  hace  ideales  para  escritores, especialmente para los escritores o autores que luchan  contra el bloqueo del escritor  📖 🤖  (Copilot).  La narración de historias, o simplemente narración, es el acto de  transmitir relatos usando palabras o imágenes, habitualmente  mediante la improvisación y recurriendo a distintos adornos  estilísticos, se han compartido en todas las culturas como medio  para entretener, educar, mantener la cultura o inculcar un sistema  de valores morales.  A continuación, presentamos algunas de estas herramientas, a las  cuales les hemos pedido una historia sobre un mundo futurista en el  que los robots son los guardianes de la humanidad.  NovelistAI  novelistAI  permite crear novelas, cuentos y libros interactivos únicos,  con imágenes de portada y audiolibros personalizados.  A la fecha (25 de junio de 2024), incluye los modelos GPT-3.5, GPT-4,  LLaMa-3 y GPT-4o y más de 30 idiomas. En la versión libre otorga 20  créditos por mes, no permite la edición ni la descarga.  Le pedimos generar la historia sobre los robots guardianes, que pese  a  no  dejar  descargar  como  PDF,  si  permite  copiar  el  texto,  las  imágenes  generadas  y  los  audios,  historia  que  mostramos  a  continuación:  382 \n383 \nStory.com  En su plan libre,  Story.com , permite 3 videos/mes, 5 historias/mes,  200 créditos y sin descargas de videos.  Inicialmente, creamos una historia que Story, como le dio el nombre  \"El  Guardián  de  la  Humanidad\",  generando  25  páginas  repartidas  entre textos e imágenes. En la siguiente presentación interactiva, se  puede leer la historia generada  También, generamos el video, el cual incluye imágenes animadas y  audios. En este modelo el título de la historia fue \"Los Guardianes  Metálicos\", tal como se aprecia en la siguiente página:  384 \n385 \nOnce Upon a Bot  En  su  plan  libre,    Once  Upon  a  Bot ,  permite  crear  tres  historias  semanales con descarga en PDF, solo lo hace en idioma inglés.  Figura 6.4 . Animación mostrada por Once Upon a Bot, mientras genera la historia.  Figura 6.5 . Una de las 10 páginas generadas con nuestro prompt.  386 \n6.3.4 El bloqueo del escritor  Pero  ¿por  qué  pedirle  a  una  IA  que  nos  ayude  a  redactar  libros,  historias, ensayos y contenidos en general? La respuesta no solo tiene  que ver con los puntos descritos por ChatGPT en el apartado 6.3.2,  pues  uno  de  los  problemas  que  ayuda  a  solucionar  es  el  llamado  \"bloqueo  del  escritor\"  y  el  \"síndrome  de  la  página  en  blanco\",  términos que describen fenómenos similares que afectan a escritores  y creativos.  El bloqueo del escritor se refiere a una condición en la que un autor  experimenta  una  incapacidad  temporal  para  producir  nuevo  trabajo.  Puede manifestarse como una falta de ideas, inspiración o motivación  para escribir. Este bloqueo puede durar desde unas horas hasta meses o  incluso años en casos extremos. Por otro lado, el síndrome de la página  en blanco (o vacía) es más específico. Describe la ansiedad o el miedo  que siente un escritor al enfrentarse a una página en blanco al inicio de  un nuevo proyecto. Es ese momento intimidante cuando las ideas están  ahí, pero plasmarlas en palabras parece una tarea abrumadora.  Ambos fenómenos pueden tener varias causas:  1.  Presión por alcanzar altas expectativas  2.  Miedo al fracaso o a la crítica  3.  Perfeccionismo excesivo  4.  Agotamiento creativo  5.  Falta de confianza en las propias habilidades  Estos  obstáculos  son  comunes  y  muchos  escritores  desarrollan  estrategias para superarlos, como establecer rutinas de escritura,  hacer ejercicios de escritura libre, o simplemente aceptar que los  primeros  borradores  no  tienen  que  ser  perfectos  (Claude  3.5  Sonnet)  Veamos, a continuación, una interesante interacción con ChatGPT-  4o, sobre este tema.  387 \n388 \n6.4 IA generadoras de cuestionarios  Las  Inteligencias  Artificiales  (IA)  pueden  generar  cuestionarios,  usando algoritmos de aprendizaje automático y procesamiento del  lenguaje natural para producir preguntas relevantes y estructuradas  sobre diversos temas.  Algunas  características  son  la    generación  automática ,  creando  preguntas  y  respuestas  basadas  en  un  tema  específico;  personalización ,  para  adaptar  la  dificultad  y  el  tipo  de  preguntas  según el nivel del usuario o los resultados de aprendizaje;  variedad  de  formatos ,  tales  como  preguntas  de  opción  múltiple,  verdadero/falso,  respuesta  corta,  entre  otros;  y    análisis  de  contenido ,  extrayendo  información  clave  de  recursos  educativos  para formular preguntas pertinentes.  En el siguiente video, describimos cómo generar un cuestionario de  selección múltiple con Claude 3.5 Sonnet:  389 \nPreguntas de selección múltiple  La siguiente escena interactiva es uno de los resultados obtenidos  con Claude, en la que incluimos imágenes:  Las interacciones con Claude, las presentamos en la siguiente página,  observa que fueron cinco las interacciones hasta lograr el resultado  esperado.  El  número  de  interacciones  indica  que  no  siempre  obtendremos  un  resultado  inmediato,  que  depende  del  prompt  inicial,  mientras  mejor  sea  el  prompt,  menos  interacciones  se  requerirán  390 \n391 \nCuestionario tipo clasificación  De una forma similar, generamos una evaluación tipo  clasificación de  términos , tal como se muestra en la escena interactiva de la siguiente  página. Para lograr el resultado esperado, recurrimos a dos IA:  Claude 3.5 Sonnet  Subimos una imagen de la página 185 del libro  Plantillas  Le  dimos  la  siguiente  indicación:  \"el  código  HTML5  para  una  evaluación tipo clasificación como el que muestra la imagen, en la  cual  hay  entre  6  y  12  palabras  que  se  deben  arrastrar  a  cuatro  contenedores  (cada  contenedor  admite  hasta  seis  palabras).  Para  aprobar  la  evaluación,  el  evaluado  debe  poner  las  palabras  que  correspondan  a  cada  contenedor.  Una  vez  arrastradas,  todas  las  palabras, deben colorearse de verde las palabras correctas y de rojo  las incorrectas\"  Luego  de  varias  mejoras,  agotamos  el  número  de  mensajes  en  la  versión libre. Para no esperar tres horas, recurrimos a la segunda IA.  ChatGPT-4o  Le subimos el último código obtenido.  Le pedimos las mejoras que faltaban, entre ellas la calificación. 392 \n393 \nPreguntas Falso o Verdadero  Para  este  tipo  de  cuestionario,  dimos  a  Claude  3.5  Sonnet,  la  siguiente indicación:  Haz un cuestionario tipo falso y verdadero con un diseño similar al de la  imagen. El cuestionario debe tener 10 preguntas con 10 segundos para  responder cada una, el tiempo se mostrará en una barra vertical verde  en forma de elipse, que irá creciendo hasta los 10 segundos. La siguiente  pregunta se presenta cuando se acaba el tiempo o cuando el usuario  haya hecho clic en uno de los botones de falso o verdadero. El tema de la  evaluación  es  sobre  animales,  por  cada  respuesta  debe  aparecer  la  palabra \"Correcto\" o \"Incorrecto\", de acuerdo a la respuesta dada.  La imagen que le suministramos fue la siguiente:  El resultado obtenido se ajusta bastante bien a la indicación, pero la  barra la pone horizontal. En la siguiente escena interactiva puedes  ver  el  último  resultado  obtenido.  El  código  lo  puedes  obtener  haciendo un ejercicio similar.  394 \nLas imágenes son enlaces a Wikimedia Commons, pero es posible  incluirlas en local cambiando la dirección en el código.  395 \nReferenciando el tema de evaluación  Una vez tengamos nuestros cuestionarios, podemos pedirle a la IA  que cambie el tema de acuerdo con un enlace o un documento; por  ejemplo, en la siguiente evaluación, el tema es dado en este enlace:  robots humanoides más avanzados en 2024 .  Como ejercicio, le dimos a ChatGPT-4o el archivo del cuestionario  tipo Falso o Verdadero y el enlace, obteniendo:  396 \nLa indicación que le dimos a ChatGPT fue:  Usa  el  código  dado  y  genera  un  cuestionario  cuyas  preguntas  correspondan  al  siguiente  enlace:  https://es.wired.com/galerias/los-  robots-humanoides-mas-avanzados-en-2024  El cuestionario generado solo presenta 5 preguntas, quizá debido a lo  corto del artículo suministrado. Los enlaces a las imágenes fueron  incorrectos, por lo que las corregimos en el código.  Es posible, también, referenciar el tema directamente; por ejemplo, a  Gemini Flash le dimos el código del cuestionario de selección múltiple  y  le  pedimos  que  cambiara  el  tema  por  capitales  de  países,  obteniendo:  haz clic sobre la imagen, para abrir el cuestionario. Solo aparece la  primera imagen, las demás las puedes poner como ejercicio.  397 \nFinalmente,  como  preludio  al  próximo  apartado,  usamos  las  IA  ChatGPT y Claude, a las cuales les dimos dos archivos, el código del  cuestionario  de  selección  múltiple  y  un  archivo  sobre    plantas   en  formato PDF, que mostramos a continuación:  Con esos dos archivos, a ambas IA le indicamos:  Usa  el  mismo  código  HTML,  cambiando  el  tema  por  lo  escrito  en  el  documento plantas.  398 \nChatGPT  generó  un  cuestionario  de  5  preguntas,  centradas  en  la  primera  página  del  documento;  por  su  parte,  Claude  generó  10  preguntas  sobre  todo  el  documento,  observa  (no  se  incluyen  imágenes):  399 \nClaude 3.5 Sonnet a fondo  Para la generación de contenidos digitales, tipo cuestionario, Claude  se comportó mejor.  Claude  3.5  Sonnet  se  destaca  en  varios  puntos  de  referencia,  demostrando razonamiento de nivel de posgrado, conocimiento de nivel  de pregrado y habilidades de codificación excepcionales, es una opción  ideal  para  tareas  complejas.  Se  ha  introducido  una  nueva  función  llamada  \"Artefactos\"  en  Claude.ai.  Esta  característica  permite  a  los  usuarios  crear  vistas  previas  interactivas  con  código,  incluidos  diagramas,  juegos  y  aplicaciones  personalizadas.  Es  como  tener  un  colaborador de IA ayudándote en tiempo real, mejorando la creatividad  y la productividad. ( Yuky ).  Hicimos un ejercicio adicional, subiendo el código del  cuestionario  tipo clasificación  y el archivo  Clasificación de plantas . El  resultado es sorprendente, pues Claude nos entrega un cuestionario  que  se  adapta  perfectamente  al  código  dado  y  al  tema  sobre  las  plantas. Pero, para mayor sorpresa, elabora una base de datos con 36  preguntas que complementa con consultas en Internet (ver resultado  en la siguiente página).  Finalmente, Claude nos generó un cuestionario tipo  completación ,  que aún hay que mejorar:  400 \n401 \nMejorando el diseño  Como  sucede,  por  ejemplo,  con  la  publicidad  en  televisión,  la  presentación  visual  de  los  contenidos  juega un papel crucial en el compromiso del estudiante.  Un  diseño  atractivo  y  bien  estructurado,  con  el  uso  adecuado  de  colores,  tipografía  e  imágenes,  puede  facilitar la comprensión y retención de la información  ( iLabora ).  Para un diseño más atractivo, podemos incluir indicaciones como:  Ponle título a la evaluación y, además, mejora el tamaño y estilo de letra  para que sea más atractivo para niños.  Hicimos ese cambio de diseño con una evaluación tipo  asociación  con Claude, el cual respondió a la indicación, así:  He realizado las siguientes mejoras y cambios:  Añadí un título atractivo: \"¡Juego de Parejas Divertido!\"  Mejoré el diseño general para hacerlo más atractivo para niños.  Utilicé la fuente \"Fredoka One\" para el título, que es más divertida y  llamativa.  Aumenté el tamaño de la fuente en las cartas y en las estadísticas.  Añadí  sombras  y  efectos  de  hover  a  las  cartas  para  hacerlas  más  interactivas.  Utilicé colores más brillantes y un fondo más claro.  Ajusté  el  tamaño  de  las  cartas  para  que  se  adapten  mejor  al  nuevo  número de parejas.  Agregué una animación suave cuando se pasa el cursor sobre las cartas.  Utilicé una fuente sans-serif (Roboto) para el texto general, que es fácil  de leer para los niños.  El resultado se observa en la siguiente página:  402 \n403 \nChatGPT-4o también mejoró el diseño, así:  Se añadieron colores y estilos más llamativos y amigables para los niños.  Las  tarjetas  ahora  tienen  un  efecto  de  hover  que  las  agranda  ligeramente y cambia su color de fondo.  Los botones y textos se hicieron más grandes y coloridos.  Una  lista  de  20  pares  de  tarjetas  (pregunta-respuesta)  sobre  cultura  general.  Este fue el resultado  404 \nPor  otra  parte,  le  pedimos  a  ChatGPT  que  nos  generara  una  evaluación de construcción de frases, usando el mismo diseño. Este  fue el resultado:  El código incluye 30 frases, de las cuales se selecciona una al azar.  Para retirar una palabra del área de soltado hay que hacer doble clic.  405 \nOtros cuestionarios  Son muchos los cuestionarios que podríamos generar, todo depende  de nuestra creatividad y la ayuda de la IA. Para no extendernos más,  presentamos unos ejemplos adicionales.  Cuestionario de ortografía  406 \nCuestionario de química  Actividad relacionada con los elementos químicos (amplía la escena a  pantalla completa, para una mejor interacción).  407 \nCuestionario de fracciones  408 \nCuestionario de idiomas  409 \n6.5 Charlando con documentos  Las Inteligencias Artificiales han avanzado significativamente en la  lectura e interpretación de documentos. Quizá las herramientas más  populares  son  aquellas  que  pueden  leer,  resumir  y  explicar  documentos PDF; sin embargo, IA como ChatGPT, Gemini y Claude  permiten varios formatos.  6.5.1 Analizando archivos Excel  No se trata de pedirle ayuda a la IA con unos cuantos datos en una  hoja de Excel, pues sería subutilizarla. En nuestro ejemplo, hemos  usado  una  planilla  con  1000  filas  y  14  columnas;  es  decir,  14000  datos. Haz clic en la siguiente imagen para explorar la planilla.  Le pedimos a la IA que nos generara cinco gráficos. Claude 3.5 Sonnet  no admitió el tamaño de archivo, por lo que lo redujimos a 200 filas.  ChatGPT-4o admitió el archivo, pero solo generó dos gráficos.  Observa las interacciones con estas dos IA y los resultados obtenidos  en la siguiente página:  410 \n411 \nAhora, vamos a recurrir a las IA, para que nos hagan un análisis de las  ventas registradas en el archivo anterior. Dado que Claude Sonnet no  nos permitió subir los 14000 registros, hemos usado ChatGPT-4o y  Gemini 1.5 Flash, obteniendo:  ChatGPT-4o  Conclusiones  1.  Región:  África  es  la  región  con  mayores  ventas,  seguida  de  Europa y Asia. Norteamérica tiene las ventas más bajas.  2.  Tipo de Producto: Los productos domésticos y de material de  oficina son los más vendidos, mientras que las frutas tienen las  ventas más bajas.  3.  Canal  de  Venta:  Las  ventas  son  casi  equivalentes  entre  los  canales  online  y  offline,  con  una  ligera  ventaja  para  el  canal  offline.  4.  Prioridad:  Las  ventas  son  más  altas  para  los  pedidos  con  prioridad baja, aunque las diferencias no son extremadamente  marcadas entre las distintas prioridades.  Este análisis proporciona una visión general sobre las tendencias y  patrones en los datos de ventas.  Gemini 1.5 Flash  Conclusiones:  Los  snacks,  el  material  de  oficina  y  los  cárnicos  son  los  productos más populares.  El canal de venta offline es dominante, pero las ventas online  también son significativas.  412 \nLas  ventas  con  prioridad  crítica    son    las    más  importantes.  Europa  y  África  son  las  regiones    con    mayor  volumen de ventas.  United Kingdom y China son  los    países    con    mayor  volumen de ventas.  Recomendaciones:  Se  puede  considerar  la  posibilidad  de  aumentar  la  oferta  de  snacks, material de oficina y cárnicos.  Se  pueden  desarrollar  estrategias  para  aumentar  las  ventas  online.  Se deben considerar los clientes con prioridad crítica y alta.  Se pueden implementar estrategias para aumentar las ventas en  Europa y África.  Se  puede  considerar  la  posibilidad  de  expandirse  a  nuevos  mercados.  Nota: Este análisis se basa en los datos proporcionados y no se tiene  en cuenta el contexto o la situación específica de la empresa. Para  obtener  un  análisis  más  completo  y  preciso,  sería  necesario  considerar  información  adicional,  como  el  costo  de  las  ventas,  la  rentabilidad de cada producto, las tendencias del mercado, etc.  Para un análisis más profundo, sería útil realizar cálculos estadísticos  detallados sobre tendencias de ventas, rentabilidad por producto o  región, y patrones estacionales.  413 \n6.5.2 Leer y analizar un artículo académico  Con la aparición de herramientas de inteligencia artificial avanzadas  como ChatGPT, el análisis de artículos académicos se ha vuelto más  accesible y, si se hace correctamente, eficiente. Estas herramientas  pueden ayudar a resumir, interpretar y extraer información clave de  documentos de investigación complejos ( Vugar Ibrahimov ).  Pero ¿qué pedirle a la IA de un artículo?, Ibrahimov recomienda las  siguientes indicaciones:  Resuma los principales hallazgos de este artículo académico.  Extraiga  los  puntos  y  argumentos  clave  de  este  artículo  académico.  Identifique y describa los métodos de investigación utilizados  en este artículo académico.  Enumere y resuma las referencias importantes citadas en este  artículo académico.  Resalte  las  contribuciones  novedosas  realizadas  por  este  artículo académico.  Identifique las limitaciones y sugerencias para trabajos futuros  mencionados en este artículo académico.  Resuma  las  secciones  de  introducción  y  conclusión  de  este  artículo académico.  Desglose  y  explique  las  figuras  y  tablas  complejas  de  este  artículo académico.  Proporcione  un  análisis  crítico  de  este  artículo  académico,  incluidas las fortalezas y debilidades.  A continuación, presentamos algunos ejemplos.  414 \n415 \nSeguramente,  se  preguntarán  ¿qué  tipo  de  contenido  digital  se  generan con las anteriores indicaciones? La respuesta es  el texto ,  pues tal como lo dice el filósofo Dennett \"el texto es un artefacto\" y,  como tal, es un contenido digital.  Iniciemos, entonces, con un artículo de filosofía de Diego Parente,  que presentamos a continuación:  La primera indicación es \"Extraiga los puntos y argumentos clave de  este artículo académico\".  416 \nChatGPT, entre otros aspectos clave, destaca:  Dennett propone una analogía entre la interpretación de textos y la de  artefactos técnicos, sugiriendo que los principios de interpretación que  aplicamos a los textos pueden extenderse a los artefactos.  Esta propuesta está centrada en la idea de que los artefactos, al igual  que los textos, están abiertos a múltiples interpretaciones debido a la  intervención humana en su creación.  La discusión se centra también en cómo Dennett usa indistintamente los  conceptos de función, propósito y diseño del artefacto, lo que puede  llevar a confusiones al tratar de interpretar los artefactos de la misma  manera que los textos.  Ahora, preguntaremos sobre un artículo de astrofísica en inglés:  417 \nPara  este  artículo,  usamos  Gemini  1.5  Flash  con  la  siguiente  indicación: \"Desglosa y explica las figuras y tablas complejas de este  artículo académico\", obteniendo:  418 \nExisten herramientas de IA dedicadas a leer y analizar artículos en  formato PDF o Word, que puedes consultar en el libro  Inteligencias  artificiales generativas 2024 , entre ellas:  PDF.ai  chatpdf.com  ChatDoc  Ask your PDF  Ask OpenRead  SciSpace  Consensus  Tanto  SciSpace  como  Consensus,  permiten  incluir  preguntas  de  investigación,  presentando  varios  artículos  relacionados  para  el  análisis; sin embargo, al subir el anterior artículo a SciSpace y darle la  misma  indicación,  fue  incapaz  de  leer  las  tablas  y  figuras.  Con  la  indicación  \"Resuma  los  principales  hallazgos  de  este  artículo  académico\", nos respondió:  Resumen de los principales hallazgos  Los guisantes verdes, galaxias de baja masa, muestran detecciones de  rayos X que indican la presencia de AGN de baja luminosidad con masas  de agujeros negros que van desde 10^4 a 10^6 masas solares.  La emisión de rayos X sugiere la necesidad de un LLAGN en las galaxias,  con la amplia línea H α  indicando masas de agujeros negros de 10^4 a  10^6 masas solares  La  emisión  de  estas  fuentes  podría  deberse  a  fuentes  de  rayos  X  ultraluminosas, acretores súper Eddington o agujeros negros de masa  intermedia.  419 \nEl AGN potencialmente contribuyó significativamente a la reionización  cósmica,  apoyado  por  el  estatus  de  las  Galaxias  como  filtradores  de  Lyman Continuum.  Una  herramienta  interesante  es    Conected  Papers ,  que  permite  explorar documentos conectados en un gráfico visual.  Sin embargo, las interacciones que podemos hacer con ChatGPT-4o,  Gemini 1.5 y Claude 3.5 Sonnet con documentos académicos arrojan  muy  buenos  resultados,  que  podemos  prescindir  del  uso  de  las  anteriores  herramientas.  Por  ejemplo,  la  misma  indicación  que  le  dimos  a  SciSpace  se  la  dimos  a  ChatGPT-4o,  obteniendo  siete  hallazgos (tres más que SciSpace), entre ellos:  Detección de Rayos X : De 29 fuentes observadas, 9 muestran detección  de rayos X con una confianza superior a 3 σ . Dos de estas fuentes tienen  una luminosidad de rayos X en el rango de 2-10 keV que excede los 10 41  erg s -1 , lo que las convierte en fuertes candidatas a agujeros negros de  masa intermedia (IMBH).  Relaciones de Líneas de Emisión:  Las proporciones de líneas de emisión  como [O III]/H β  y [N II]/H α  en estas fuentes son consistentes con la  región de líneas estrechas de AGN de baja metalicidad.  Luminosidad de Rayos X Normalizada : La luminosidad normalizada de  rayos  X  de  0.5-8  keV  en  cinco  fuentes  detectadas  en  rayos  X  es  consistente con la firma de binarias de rayos X de alta masa (HMXB). Sin  embargo,  la  luminosidad  de  rayos  X  podría  ser  producida  por  un  acreedor  super-Eddington  o  un  IMBH/AGN  de  baja  luminosidad  (LLAGN).  Presencia  de  LLAGN :  Los  datos  sugieren  la  existencia  de  LLAGN  en  estas galaxias \"Green Peas\", con masas de agujeros negros en el rango de   a     masas solares.  que da cuenta de la calidad de la información obtenida.  1 0 4   1 0 6  420 \n421 \n6.5.3  Leer  y  analizar  varios  artículos  académicos  simultáneamente  En las actividades de investigación, es inevitable el tener que leer dos  o más artículos académicos sobre un tema en particular, lo que hace  bastante  dispendiosa  la  tarea  del  investigador.  Algunas  IA  como  ChatGPT-4o o Claude, admiten más de un archivo en su ventana de  contexto, lo cual permite hacer preguntas como:  ¿Existen sesgos detectables en alguno de estos artículos? Si es  así, ¿cómo se manifiestan?  ¿Qué información nueva o contradictoria presenta el artículo  [A] en relación al artículo [B]?  Sintetiza los hallazgos clave de ambos artículos, destacando las  áreas de acuerdo y desacuerdo.  Si  tuvieras  que  escribir  un  tercer  artículo  basándote  en  los  artículos dados, ¿cuál sería tu argumento principal y qué puntos  clave abordarías?  ¿En  qué  se  parecen  y  en  qué  se  diferencian  los  artículos  en  cuanto a su argumento principal?  ¿Qué perspectivas diferentes presentan los artículos sobre el  mismo tema?  ¿Qué nuevas preguntas o áreas de investigación surgen de estos  artículos?  Para nuestro ejercicio, hemos seleccionado tres artículos en inglés  (descargados de  https://arxiv.org/ ), relacionados con la  generación  con recuperación aumentada  (RAG, por sus siglas en inglés) y los  modelos grandes de lenguaje (LLM).  422 \n423 \nLos tres artículos, publicados entre abril y junio de 2024, los puedes  consultar, haciendo clic en las siguientes imágenes:  424 \nUsamos  la  indicación  \"Sintetiza  los  hallazgos  clave  de  los  tres  artículos, destacando las áreas de acuerdo y desacuerdo\", en tres IA:  Claude 3.5 - Sonnet no admitió los tres artículos, por ello recurrimos  a Claude 3 en sus modelos Haiku y Sonnet.  425 \n6.6 Lectura de imágenes - Visión artificial  La visión artificial es un campo de la IA que permite que  las computadoras y los sistemas obtengan información  significativa  de  imágenes  digitales,  videos  y  otras  entradas  visuales,  y  tomen  acciones  o  hagan  recomendaciones basadas en esa información ( IBM ).  Veamos el nivel de detalle que tienen las IA, para leer y describir la  siguiente imagen:  Figura 6.6 . Lady Sora en el video generado por Sora de  OpenAI .  Lady Sora es generada a partir del siguiente prompt:  Una mujer elegante camina por una calle de Tokio llena de luces de neón  brillantes y carteles animados de la ciudad. Lleva una chaqueta de cuero  negra, un vestido largo rojo, botas negras y un bolso negro. Lleva gafas  de sol y lápiz labial rojo. Camina con confianza y despreocupación. La  calle está húmeda y refleja, creando un efecto espejo de las luces de  colores. Muchos peatones caminan por allí.  426 \nA  continuación,  presentamos  la  descripción  que  hacen  cuatro  IA  diferentes, entre ella LLaVA 1.6:  427 \nUsamos ChatGPT-4o para que observe la siguiente imagen:  Figura 6.7 . Cruce peatonal (Imagen tomada de  NOESIS .  Pregunta a ChatGPT-4o . Vas en un auto y observas esta imagen ¿qué  le recomendarías al conductor?  Respuesta  La imagen muestra una calle con un semáforo en luz verde. Si estás en un  auto, le recomendaría al conductor lo siguiente:  1.  Continúa con precaución: Ya que el semáforo está en verde, se  permite  avanzar.  Sin  embargo,  es  importante  estar  atento  a  peatones y otros vehículos.  2.  Revisa los cruces peatonales: Aunque el semáforo está en verde,  asegúrate de que no haya peatones cruzando la calle.  3.  Obedece las señales de tránsito: Mantente atento a cualquier otra  señal  de  tránsito  o  semáforo  adicional  que  pueda  estar  más  adelante.  4.  Velocidad  adecuada:  Mantén  una  velocidad  adecuada  y  segura,  acorde a las normas de tránsito de la zona.  428 \nEn la fiesta de las flores en la ciudad de Medellín - Colombia, un  evento tradicional es el desfile de silleteros. Subimos a Claude 3.5  Sonnet la silleta que muestra la siguiente foto:  Figura 6.8 . Silletero en las fiestas de 2017 (Foto tomada de  ACI - Medellín .  Pregunta  ¿Cuántas flores identificas y cuáles son sus nombres?  Respuesta  La imagen muestra una impresionante y colorida exhibición de flores.  Aunque no puedo identificar individuos específicos, veo a una persona  vestida de blanco con un sombrero parada junto a un enorme arreglo  floral. En cuanto a las flores que puedo identificar en este exuberante  arreglo:  429 \n1.  Rosas - Se ven rosas de varios colores, incluyendo rojo, amarillo y  rosa.  2.  Lirios - Hay lirios de color naranja y posiblemente blanco.  3.  Orquídeas - Se aprecian algunas orquídeas de color púrpura.  4.  Margaritas - Parece haber margaritas blancas.  5.  Crisantemos - Se ven algunos crisantemos de varios colores.  6.  Tulipanes - Hay tulipanes de color rojo y amarillo.  7.  Girasoles - Se pueden ver algunos girasoles amarillos.  Además, hay una gran variedad de flores de diversos colores que no  puedo  identificar  con  certeza,  incluyendo  flores  azules,  moradas,  naranjas y blancas. El arreglo es realmente espectacular en su diversidad  y vivacidad de colores.  Otro ejercicio lo hicimos con Gemini 1.5 pro, al cual le subimos la  imagen  con  la  canasta  de  frutas,  que  se  muestra  en  la  siguiente  página.  Pregunta . Si se tiene la siguiente información sobre el costo de las  frutas en un almacén:  Guayaba:  $200 la unidad  Fruta de la pasión:  $800 la unidad  Pitaya roja:  $1200 la unidad  Pitaya amarilla:  $1500 la unidad  Physalis:  $2000 la unidad  Mango:  $800 la unidad  Papaya:  $3500 la unidad  Maracuyá:  $400 la unidad  ¿Cuánto cuestan las frutas de la imagen?, describe tus cálculos.  430 \nFigura 6.9 . Canasta de frutas (Foto tomada de  amMARKET .  Respuesta  Para calcular el precio de las frutas en la imagen, necesitamos identificar  cada tipo de fruta y contar cuántas hay de cada una.  Asumiendo que la caja contiene:  Guayaba: 7 unidades (verdes, pequeñas y redondas)  Fruta de la pasión: 5 unidades (moradas y redondas)  Pitaya roja: 1 unidad (roja con escamas verdes)  Pitaya amarilla: 1 unidad (amarilla con escamas verdes)  Mango: 5 unidades (rojas, amarillas y verdes, forma ovalada)  Papaya: 1 unidad (amarilla, grande y ovalada en red)  Maracuyá: 5 unidades (amarillas, redondas y pequeñas)  No presentamos los cálculos, pues es claro que Gemini no identificó  bien las frutas y su cantidad.  431 \nLeyendo carátulas de libros , ChatGPT-4o lo hace mejor.  432 \nTraduciendo , nuevamente ChatGPT-4o lo hace mejor.  433 \nLeyendo tablas en una imagen  Utilizamos una tabla correspondiente a la valoración del alumnado  de  una  actividad  de  gamificación  llevada  a  cabo  en  el  aula.  A  continuación,  vamos  a  presentar  las  conclusiones  del  análisis  de  dicha tabla por diferentes IA.  434 \nLeyendo gráficas en una imagen  Partiendo de una gráfica que recoge el análisis de resultados de una  actividad de gamificación educativa, solicitamos a varias IA que nos  presentasen unas breves conclusiones:  435 \n6.7 Diseñando páginas Web  Las IA generativas están transformando la forma en que se crean y  desarrollan sitios web, ofreciendo nuevas posibilidades y eficiencias  nunca antes vistas.  Aplicaciones en el diseño web  1.  Generación de layouts:  Las IA pueden crear múltiples diseños  de  página  basados  en  principios  de  diseño  y  tendencias  actuales.  2.  Personalización:     Pueden    adaptar    diseños    según    las  preferencias del usuario o la marca.  3.  Optimización para dispositivos:  Generan diseños responsivos  que se adaptan a diferentes tamaños de pantalla.  4.  Creación  de  contenido:   Pueden  generar  textos,  imágenes  y  otros elementos visuales para poblar el sitio web.  5.  Prototipado  rápido:   Facilitan  la  creación  de  prototipos  en  cuestión de minutos, acelerando el proceso de diseño.  Hemos  recurrido  a  Claude  3.5  -  Sonnet,    Gemini    1.5    Pro    y  ChatGPT-4o,  para  diseñar  una  página  web  sobre  los  grandes  felinos,  incluyendo  el  león,  el  tigre,  el  puma,  etc.  Le  dimos  algunas  indicaciones  de  diseño,  cuyos resultados se muestran en  la siguiente página.  Algunos textos e imágenes fueron  tomados de Wikipedia.  436 \nA continuación, mostramos las páginas obtenidas con Claude 3.5 -  Sonnet y Gemini 1.5 Pro:  437 \nPágina web diseñada por Claude 3.5 - Sonnet  438 \nPágina web diseñada por Gemini 1.5 Pro  439 \n6.8 Las matemáticas con Solín y ChatGPT  Consolación Ruiz Gil (Solín) es  una profesora de matemáticas  del  IES  José  María  Pereda  de  Santander y miembro de la Red  Educativa  Digital  Descartes.  Solín  ha  producido  una  gran  cantidad    de    objetos  interactivos  sobre  diversos  temas    de    matemáticas,  diseñados    con    el    editor  Descartes. En 2024, Solín es \"atrapada por ChatGPT\", iniciando una  serie  de  interacciones  con  este  chatbot,  cuyos  resultados  ha  compartido con sus colegas cartesianos en el grupo de WhatsApp  \"Cartesianos en Red\".  En este apartado, presentamos algunas de estas interacciones y los  resultados obtenidos 9 .  6.8.1 Matemáticas con ChatGPT 3.5  Las primeras interacciones de Solín fueron realizadas con la versión  gratuita de OpenAI, de las cuales presentamos:  Colorear rectángulo  Le he pedido al chat GPT que me haga código js, yo no tengo ni idea de  programar en JS, y ha salido... Me animé y... gráfico.  Así inicia Solín sus interacciones con ChatGPT, obteniendo:  Solín ha publicado estos resultados en el sitio web  matsolin . 9  440 \n441 \nTres planos  solo voy a ser así de pesada los lunes, los otros días me cortaré, pero es  que estoy asombrada, ahora le dije un 3d y aquí está:
