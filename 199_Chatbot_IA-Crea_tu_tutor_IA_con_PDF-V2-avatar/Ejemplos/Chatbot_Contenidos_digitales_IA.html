  videos  o  canales, inclusión en videos y presentación artísticas, divulgativas,  científicas, publicitarias, culturales, etc.  Inicialmente,  realizaremos  una  relación  de  las  diferentes  características que pueden ofrecen estas aplicaciones al respecto:  Posibilidad de utilizar imágenes propias además de los modelos  ofrecidos por la aplicación.  Permitir  emplear  voz  externa,  mediante  grabación  por  micrófono  o  subida  de  audio  pregrabado,  aparte  de  las  que  puede generar la propia IA.  Inclusión de subtítulos opcionales.  Sincronización del audio y del movimiento de los labios.  Calidad de los movimientos del avatar.  Capacidad de realizar ajustes en el audio: elección de tipo de  voz,  idioma,  tono,  velocidad,  volumen,  pausas,  clonación  de  voz...  Ajuste de tamaño y características básicas de la imagen.  Posibilidad de editar y modificar imágenes.  Facultad  de  añadir  elementos  adicionales:  textos,  imágenes,  formas, videos, fondos...  Opción de incluir el avatar en un video o presentación.  Capacidad  de  introducir  más  de  un  avatar  parlante  simultáneamente.  Duración máxima permitida del video.  164 \nA  continuación,  mostraremos  algunos  ejemplos  de  avatares  parlantes, comentando las IA que los ha generado y sus principales  cualidades.  Hay  muchas  aplicaciones  diferentes,  comentaremos  algunas que tengan elementos diferenciadores entre sí.  No todas las aplicaciones permiten utilizar una imagen externa como  avatar  y  tenemos  que  ceñirnos  a  los  modelos  que  ofrece.  Sin  embargo, se puede hacer un pequeño truco, consistente en crear el  avatar  parlante  con  alguno  de  los  modelos  que  ofrece  y  después  realizar un intercambio de cara o FaceSwap video. En el siguiente  ejemplo hemos cambiado la cara de la reina por la de otra chica.  165 \nHedra  Hedra  es una IA muy reciente, de hecho, a la fecha de la publicación  de este libro está en fase beta. Sin embargo, es la aplicación gratuita  que mejor realiza los avatares parlantes, en calidad de movimiento,  énfasis y sincronización labial.  Una opción consiste en subir el audio y la imagen y automáticamente  genera el video, como se ha realizado en el siguiente ejemplo.  166 \nOtra opción es introducir un texto y elegir uno de los tipos de voces  que ofrece la aplicación. A continuación, se introduce la imagen y se  solicita la generación del video.  Vamos a realizar dos ejemplos, utilizando una misma imagen, pero  seleccionando  voces  diferentes.  Se  puede  apreciar  que  ambas  animaciones  son  diferentes,  tanto  en  sus  gestos  como  en  la  sincronización de sus labios.  167 \nEsta aplicación nos ofrece una opción adicional, consistente en que  podemos pedirle que nos genere una imagen a partir de un prompt de  texto. La imagen que nos facilite será adecuada para animarla y darle  voz.  Presentamos  un  video  cuya  imagen  ha  sido  generada  por  Hedra.  Queríamos  la  imagen  de  una  chica  detective,  para  lo  cual  introdujimos el siguiente prompt:  168 \nChica joven y guapa, detective al estilo Sherlock Holmes. Siglo XIX. Debe  llevar gorra de detective. Color del pelo rojo y ojos azules.  Sólo con lo expuesto hasta ahora esta IA es la que mejores resultados  ofrece  a  la  hora  de  realizar  avatares  parlantes.  Pues,  además,  es  capaz de realizar videos utilizando como imágenes de partida a seres  que tengan rasgos humanos pero que no lo sean. Vamos a presentar  varios ejemplos al respecto.  169 \nPartimos de una chica con apariencia animal y le pedimos que realice  la correspondiente animación. Este fue el resultado;  Ahora pedimos a Hedra que nos generase una imagen de C3PO el  famoso robot de \"La Guerra de las Galaxias\" (Star Wars), dimos un  texto a la aplicación para que generase el audio. Mostramos el video  del excelente producto obtenido:  170 \nQuisimos ir un paso más allá y comprobar si era capaz de realizar su  función a partir de un dibujo animado. Realizamos varias pruebas con  dibujos clásicos, algunos tipo animal y otros humanos, pero al subir la  correspondiente  imagen  nos  dio  el  mensaje  de  \"Rostro  no  reconocido\".  Por ello, buscamos dibujos tipo manga, cuyas facciones humanas son  mucho más reconocibles, obteniendo lo siguiente:  171 \nPuede verse que el resultado es excelente. Nos cabía la duda de si  utilizando una imagen tipo manga en color, pero con los rasgos menos  definidos, sería capaz de realizar la animación.  En  el  siguiente  video  vemos  que  el  resultado  obtenido  es  bueno,  aunque el movimiento de los labios es algo peor que en las imágenes  con los rasgos humanos más definidos.  172 \nHemos realizado pruebas con esculturas, frutas con cara humana,  objetos  con  rasgos  de  personas,  etc.  Los  resultados  han  sido  satisfactorios cuando la apariencia a un rostro humano es mayor.  Cuando hemos pedido a la aplicación que nos genere imagen, ésta lo  hace teniendo en cuenta que debe aparecer la cara de una persona,  de forma que sea compatible con la generación del video.  173 \nVidnoz AI  Vidnoz  AI   ofrece  multitud  de  herramientas.  Una  de  ellas  es  la  creación de avatares parlantes personalizados y ofrece la práctica  totalidad de las características comentadas. Veamos un ejemplo.  Vamos a ver una pequeña conversación entre dos avatares.  174 \nD-iD  D-iD  es una IA especializada en la realización de avatares parlantes,  permitiendo    la    utilización    de    muchas    opciones    para    la  personalización  de  los  mismos.  Uno  de  los  aspectos  en  los  que  destaca es en la buena sincronización vocal y en la calidad de los  movimientos del avatar.  175 \nVirbo Wondershare  Virbo Wondershare  es una aplicación centrada en la presentación  con avatares. En este caso mostramos cómo se pueden introducir  distintos  elementos  (texto,  música  de  fondo,  sticker,  subtítulos...)  acompañando al avatar.  176 \nHeygen  Heygen     permite    crear    avatares    e    introducir    elementos  complementarios en los mismos. Además, permite elegir entre dos  posibles  formas  de  animación  del  avatar  y  de  la  expresión  de  su  rostro.  En el siguiente ejemplo hemos empleado lo siguiente:  Estilo expresivo de animación.  Aspecto de cara sonriente.  Mejora de resolución.  Inclusión de música de fondo.  Introducción de texto.  Retoques de edición del video y audio.  Animación de entrada y salida en texto y avatar.  Cambio del fondo de la imagen.  177 \nTokkinghead  Tokkinghead  da la opción de crear en tres sencillos pasos avatares  que reproduzcan a un determinado video. Aquí tenemos un par de  ejemplos con Einstein y La Gioconda.  178 \nAdobe Express  En esta ocasión utilizamos  Adobe Express  para utilizar de forma muy  sencilla avatares animados.  179 \nLALAMU STUDIO  LALAMU  STUDIO   permite  generar  avatares  parlantes,  introducir  elementos adicionales y lo que es más novedoso, dar movimiento al  avatar.  180 \nDIGEN  DIGEN  es una IA que permite trabajar con avatares, pero tiene una  serie de características peculiares que pasamos a relacionar:  Permite subir un video propio o de la web de unas determinadas  dimensiones.  En  dicho  video  debe  haber  una  persona.  La  IA  convertirá el video en un modelo que podrá ser convertido en  un avatar parlante.  Tiene integrada IA generadora de música.  Dispone de ChatGPT-3.5 incorporado.  Permite introducir textos, imágenes y música de fondo.  Admite diseños apaisados y verticales.  Dispone de una serie de modelos libres para ser utilizados.  Incluye voces masculinas y femeninas en diferentes idiomas.  La generación de modelos nuevos es lenta, puede tardar de uno  a tres días.  181 \n182 \n3.6 Edición de videos IA  Otra  de  las  cosas  que  ha  cambiado  gracias  a  las  inteligencias  artificiales generativas es la edición de videos.  Consideraremos  un  editor  de  videos  como  aquella  aplicación  dedicada específicamente a la manipulación y montaje de videos a  partir de diferentes elementos multimedia (imágenes, videos, sonido,  transiciones, efectos...)  CapCut  CapCut  es uno de los editores de videos on-line más utilizados. Con el  tiempo  ha  ido  incorporando  un  apartado  que  denomina  \"herramientas mágicas\", que permite la realización de muchas y muy  variadas modificaciones tanto de video como de imagen, muchas de  ellas gratuitas. Además de poder usarse on-line, tiene una aplicación  de escritorio, más cómoda, rápida y con más opciones.  Destacaremos algunas de sus principales características:  Contiene  librerías  de  recursos  (imágenes,  videos,  sticker,  efectos, audios, etc.)  Tiene  incorporadas  herramientas  de  IA,  por  ejemplo:  eliminación de fondo, efectos especiales, estabilización, mejora  de  la  imagen,  mejora  del  sonido,  recorte,  chroma,  máscaras,  reducción del ruido, aislamiento vocal...  Incluye múltiples efectos de animación.  Posee gran cantidad de transiciones.  Aloja una amplia variedad de filtros.  Dispone de plantillas de texto, algunas de ellas animadas.  Potentes herramientas de edición.  Múltiples opciones de configuración.  183 \nEn la siguiente imagen mostramos el panel general de la aplicación de  escritorio.  Mostramos a continuación un video montado con esta aplicación en  la que se pueden apreciar algunas de sus muchas posibilidades.  184 \nClipchamp  Clipchamp  es una buena herramienta de edición de video on-line,  pero no tiene la potencia de CapCut.  Hemos  editado  este  video  con  esta  aplicación  poniendo  filtro  del  oeste y añadiendo algunos efectos y textos.  185 \nFlexClip  FlexClip  es otro editor de videos que aúna sencillez con gran cantidad  de posibilidades, incluidas herramientas basadas en IA.  Mostramos como ejemplo un video al le hemos añadido diferentes  elementos y efectos.  186 \nKrea  Krea   permite  generar  videos  mediante  el  concepto  de  fotograma  clave o keyframe. Es una mezcla entre editor y generador.  En él podemos generar nuestras imágenes como fotogramas clave y  mediante un prompt establecer la animación que queremos darle al  conjunto  de  esos  fotogramas.  En  el  ejemplo  se  han  generado  5  imágenes y después le hemos indicado como queríamos animarla.  187 \nFusion Brain  Fusion Brain  es una aplicación que permite generar fotogramas clave  mediante texto o imagen. Después puede montar un video a partir de  estos fotogramas.  En el siguiente ejemplo, usamos dos fotogramas clave generados con  los dos siguientes prompts:  Chica cantando en karaoke.  Chico cantando en karaoke.  188 \nDa la opción de elegir el estilo de animación y el formato del video.  En el siguiente ejemplo, utilizamos los mismos prompts que en el  anterior, pero cambiamos el estilo de animación y el formato.  También  funciona  como  generador  de  imágenes,  con  buenos  resultados, permitiendo incluir estilos y prompt negativo.  189 \n3.7 Modificación de videos  Trataremos  aplicaciones  basadas  en  IA  que  permite  modificar  o  cambiar algunos de los aspectos de un video. En este capítulo ya  vimos un ejemplo, el intercambio de cara o faceswap. Ahora veremos  algunos más, aunque la variedad es enorme y va en aumento.  3.7.1 Eliminación o intercambio de fondos  Existen  muchas  herramientas  capaces  de  realizar  está  función.  Media.io  una de ellas.  Para realizar esta eliminación, simplemente hay que subir el video y la  aplicación hace el resto.  También permite cambiar el fondo por otro diferente. Si el fondo que  se utiliza es de un color liso, por ejemplo, verde o azul, también se  puede usar el efecto chroma para eliminar el fondo. Dicho efecto se  puede con aplicaciones que no usan IA.  190 \nEn las siguientes comparaciones mostramos dos posibles cambios de  fondos de un video. En el primer caso un fondo liso y en el segundo  no. Incluso se pueden introducir fondos animados.  191 \n3.7.2 Estilizador de videos  Mediante  Media.io  se puede partir de un video darle un estilo. En los  siguientes ejemplos hemos partido del video del águila y le hemos  dado los estilos \"prehistórico\" y \"lindo\".  192 \n3.7.3 Cámara superlenta  Runway  puede reducir de forma regulable la velocidad hasta en 10  veces. También permite la edición de videos. Veamos dos ejemplos:  193 \n194 \n195 \n3.7.4 Mejoras de calidad de videos  Media.io  permite escalar videos, aplicar corrección de color, eliminar  ruido o aumentar su fluidez.  Fotor   es  otra  aplicación  que  permite  aumentar  la  calidad  de  los  videos.  Moravi  es una aplicación de escritorio, que además de mejorar la  calidad de los videos, permite editarlos, y realizar múltiples efectos  sobre ellos.  Una  cuestión  que  se  debe  tener  en  cuenta  es  el  considerable  aumento de tamaño que suelen experimentar los videos al aplicarse  estas mejoras. Por ello, se debe realizar un balance entre la necesidad  de mejora del video aplicada y su aumento de peso, especialmente si  son videos de mayor duración o son muchos videos.  196 \n3.7.5 Caras borrosas  En ocasiones puede ser necesario tener que difuminar las caras de un  video. Mostramos otro ejemplo realizado con  Runway .  3.7.6 Filtros con texto  Simplemente mediante el prompt \"filtro sepia\"  Runway  añadió dicho  filtro al video.  197 \n3.7.7 Mapa de profundidad  Otra herramienta que se puede aplicar a un video es la realización de  un mapa de profundidad ( Runway ).  3.7.8 Efecto Bokeh  El efecto Bokeh es una técnica que consiste en resaltar una parte  concreta de la imagen haciendo que el resto sea borroso ( Runway ).  198 \n3.7.9 Eliminación de objetos  Media.io  y  Runway , entre otras muchas, permiten eliminar objetos de  videos, utilizando un pincel sobre el objeto a eliminar.  3.7.10 Animación de fotos  Vidnoz  es capaz de poner a bailar de diferentes formas a una imagen.  Simplemente se sube la foto, se le indica el estilo de movimientos que  se desea que tenga y se le da a ejecutar.  Viggle  va un poco más lejos. Primero se sube la foto que se quiere  hacer bailar, después se sube el video con los movimientos del baile o  se utiliza una de las plantillas predefinidas que posee. La IA hace el  resto, incluyendo la música si el video que se ha introducido la posee.  Mostramos un par de ejemplos en los que se han utilizado imágenes  generadas por IA y plantillas de video para los movimientos.  199 \n200 \n201 \n3.7.11 Traducción de videos  Vidnoz , traduce videos, sincroniza los labios y opcionalmente añade  subtítulos. Mostramos una traducción al inglés y otra a español de  Argentina.  202 \nHemos  realizado  dos  ejemplos  más,  quitando  los  subtítulos,  pero  manteniendo la sincronización labial, uno al español de Colombia,  para mostrar los diferentes acentos y otro al italiano, una lengua con  mucha sonoridad.  203 \n3.7.12 Efecto dibujo animado  Media.io , permite pasar un video a dibujo animado.  204 \nExisten múltiples estilos de dibujos animados para elegir. Funciona  correctamente cuando en el video hay una sola persona, estilo avatar  parlante,  como  puede  verse  en  el  video  animado  de  la  reina.  Sin  embargo, si en el video hay muchas personas o muchos cambios de  planos,  el  resultado  no  es  tan  bueno,  como  puede  verse  en  el  siguiente video, aunque sus fotogramas si pueden ser adecuados.  205 \n3.7.13 Efectos de video  Media.io  da la opción de realizar fácilmente la aplicación diferentes  efectos como cuerpo en llamas, clonación, efectos de contorno, trazo  RGB, ojos parpadeantes, fantasma...  206 \n3.7.14 Cambio de formato  Media.io   puede  cambiar  el  formato  de  horizontal  a  vertical,  realizando los ajustes correspondientes.  207 \n3.7.15 Uso de plantillas  Pika   ofrece  múltiples  plantillas  de  videos  con  diferentes  estilos  y  formatos  sobre  las  cuales,  añadiendo  una  imagen,  un  video  o  modificando el prompt de texto se obtiene un video basado en dicha  plantilla. Además, tiene parámetros de configuración del movimiento  de la cámara y permite la introducción de efectos sonoros de forma  automática.  208 \nEn los ejemplos presentados, seguimos los siguientes pasos:  Seleccionamos la plantilla con los movimientos y gestos que nos  interesan.  Introdujimos la imagen o video en el que íbamos a incluir la  animación de la plantilla.  Configuramos los parámetros (sonido, movimiento de cámara,  fuerza del prompt...)  209 \n3.7.16 Video inverso  Kapwing   es  un  editor  de  videos  que  tiene  una  herramienta  que  permite reproducir un video en orden inverso, es decir, de delante  hacia atrás.  Mostramos una captura de pantalla del citado editor\".  210 \n3.7.17 Velocidad de cámara  Kapwing  permite la utilización de cámara rápida, como podemos ver  a  continuación.  También  permite  la  cámara  lenta.  Mostramos  dos  ejemplos en los que hemos incluido además otros efectos.  211 \n3.7.18 Introducción de una foto en un video  BGREM  ofrece la posibilidad de introducir una foto en un video o  hacer un video rápido a partir de una imagen.  En el siguiente ejemplo partimos de la imagen de la reina, elegimos un  video,  en  este  caso  un  cielo  cuyas  nubes  se  están  movimiento,  introducimos una música de fondo, le ponemos un texto a modo de  título y también hemos incluido la imagen de un gatito. Con esto ya  tenemos un video creado.  212 \n3.7.19 Transformación de videos  Kaiber  permite transformar un video en otro diferente, indicando el  estilo y el prompt con las instrucciones.  213 \nUtilizando el video de la reina, pedimos que la transformase en una  guerrera Jedi al estilo de la saga de  La guerra de las galaxias (Star Wars) .  Utilizando el mismo prompt y estilo que en el caso anterior, tomamos  como video de partida el de la canción de José Mota y Rut Lorenzo,  obteniendo  el  siguiente  resultado.  Sólo  obtenemos  una  pequeña  fracción del video por falta de créditos para tenerlo completo. Los  créditos gastados van en función de la duración del video.  3.7.20 Cambio de estilo  LensGo  puede transformar el estilo de un video en otro diferente,  manteniendo el contenido del mismo.  Vamos a partir de nuevo del video de José Mota y Rut Lorenzo y  vamos  a  solicitar  que  lo  transforme  en  estilo  Lego.  Mostramos  el  resultado a continuación, aunque no presenta el fragmento entero ya  que es una limitación de la versión gratuita.  214 \nTomando  el  mismo  video  como  punto  de  partida,  pedimos  a  esta  inteligencia artificial que dé al citado video estilo Van Gogh.  Los resultados obtenidos son bastante aceptables en ambos casos.  215 \n\nCapítulo IV Capítulo IV  Audios y música con Audios y música con  ayuda de IA ayuda de IA \n\nFigura 4.1 . Imagen generada por Designer  de Copilot con tecnología DALL-E 3.  4.1 Introducción  En  la  intersección  del  arte  y  la  tecnología,  la  inteligencia  artificial  generativa  está  redefiniendo  las  fronteras  de  la  creatividad.  Este  capítulo  se  sumerge  en  el  fascinante  mundo  del  audio  y  la  música  impulsados por IA, una esfera donde los algoritmos no solo aprenden  de  las  composiciones  humanas,  sino  que  también  contribuyen  con  melodías y armonías únicas que amplían nuestro repertorio cultural.  Acompáñanos en este viaje auditivo mientras descubrimos cómo la IA  está  tocando  nuevas  notas  en  la  sinfonía  del  diseño  de  libros  interactivos (Copilot con tecnología GPT4).  4.2 Audio  Un  libro  interactivo,  por  lo  general,  presenta  abundancia  de  imágenes    (fotos,    dibujos,  animaciones,  gráficos,  esquemas,  planos,  etc.)  y,  particularmente,  objetos interactivos. Sin embargo,  se  ha  evidenciado  que  existen  personas que aprenden más con el  uso de audios que, en términos de  Gardner, podría ser una especie de  inteligencia auditiva 3 .  Surgen,  entonces,  modelos  de  aprendizaje  auditivo  y,  como  recurso digital, los audio-libros.  Recordemos  que  los  formatos  de  audio  para  HTML  son  mp3,  wav  Gardner  defiende  la  que  él  llama  Inteligencia  lingüística  o  verbal,  donde  somos  hábiles  haciéndonos entender y entendiendo lo que se nos dice.  3  219 \ny ogg, donde mp3 es el formato mejor soportado por la mayoría de los  navegadores (véase  https://www.caniuse.com ). El código a usar es de  la forma:   <audio controls>   <source src=\"audios/mario.mp3\" type=\"audio/mp3\">  </audio>  Donde  mario.mp3  es el nombre y formato del archivo de audio.  Por defecto, en el navegador se presenta así:  4.2.1 Cambiando los colores del panel de control  El estilo y color del panel de control de audio, generalmente, es una  combinación de grises. Pero, es posible cambiar los colores del panel  de control ¿Cómo? Le preguntemos a Gemini con este prompt:  Dame un código CSS para que el panel de control de la etiqueta audio  con colores llamativos y su ancho se pueda configurar.  Respuesta : Gemini genera este  código , advirtiendo que se inserte en  la  etiqueta    <style>   del  HTML  o  en  un  archivo  CSS  externo.  Los  prefijos    ::-webkit-   son  específicos  de  navegadores  basados  en  WebKit, como Safari y Chrome. Para otros navegadores, se pueden  utilizar otros prefijos o propiedades sin prefijos.  Esta última advertencia, significa que el cambio de colores no será  visible  en  otros  navegadores,  en  especial  Firefox.  Así  fueron  los  cambios:  220 \nLos  colores  son  llamativos  sólo  en  los  botones  de  audio  y  reproducción, a los cuales les puso forma cuadrada. Intentamos con  ChatGPT, usando este prompt:  Dame un código CSS para que el panel de control de la etiqueta audio  aparezca con colores llamativos y elegantes, bordes redondeados, ancho  configurable y centrado.  ChatGPT nos dio este  código , obteniendo:  Finalmente,  optamos  por  intervenir  este    código   a  nuestro  gusto,  incluyendo, además, el código de centrado que usamos en la primera  parte de este curso de diseño de libros interactivos, obteniendo:  4.2.2 Cambiando el estilo del panel de control  Para este ejercicio, generamos un audio musical con la herramienta  de IA  Stable Audio , luego le pedimos a ChatGPT:  Dame el código HTML5 (HTML + CSS + JS) para que una etiqueta audio  muestre el pánel de controls de la siguiente manera:  1.  El tiempo transcurrido al inicio de la línea de tiempo  2.  La duración del audio al final de la línea de tiempo  221 \n3.  El botón play y pause a la izquierda de la duración del audio  4.  La barra de progreso debe mostrar, con líneas verticales, la altura  de los tonos de audio, similar a un sintetizador  5.  El avance del audio se marca con una línea vertical de color rojo  ChatGPT nos generó este  código , que nos permitió el siguiente estilo  para el audio:  Obviamente, el sintetizador no es el que esperábamos. Intentamos  con GPT-4 turbo, obteniendo este  código  y un estilo diferente:  GPT nos advierte que:  Visualización de audio : La visualización de audio en el canvas es solo un  ejemplo simplificado. Para una visualización real basada en la frecuencia  del audio, tendrías que usar la Web Audio API para analizar el audio en  tiempo real y dibujar las formas de onda o picos correspondientes en el  canvas.  Advertencia  que  nos  hace  caer  en  cuenta  que  nuestra  meta  es  demasiado  ambiciosa.  Una  versión  diferente,  también  con  visualización de audio simplificada, es la siguiente:  222 \n4.2.3 Imagen con audio  En  la  primera  parte  del  curso  \"diseño  de  libros  interactivos\",  nos  interesaba poner una imagen que al hacerle clic se oyera un audio, sin  mostrar el panel de control. Algo que nos ha solucionado GPT-4o, con  este  código CSS  y este  código HTML :  Figura 4.2 . Imagen de  InspiredImages  en  Pixabay  Habría que modificarlo para que el audio se detenga con otro clic.  223 \n4.3 Text to speech  La  herramienta  AI  Text  to  Speech  (TTS),  o  Texto a Voz, es una tecnología que convierte  texto  escrito  en  discurso  hablado.  Utiliza  inteligencia artificial y técnicas avanzadas de  procesamiento  del  lenguaje  natural  (NLP)  para generar una voz artificial que puede leer  en  voz  alta  cualquier  texto  ingresado.  Esta  herramienta  se  basa  en  modelos  de  aprendizaje    profundo    que    han    sido  entrenados con grandes cantidades de datos  de voz y texto para crear una síntesis de voz  que suena natural y fluida.  Componentes Clave  Entrada de Texto: El usuario introduce el  texto que desea convertir en voz. Esto  puede ser cualquier cosa, desde párrafos  de un libro hasta instrucciones para un  dispositivo.  Procesamiento  del  Lenguaje  Natural  (NLP):  La  tecnología  NLP  analiza  y  comprende    el    texto    ingresado,  determinando    aspectos    como    la  entonación, la puntuación, y el contexto  del discurso. Este análisis es crucial para  producir  una  salida  de  voz  que  sea  coherente y natural.  Síntesis  de  Voz:  El  texto  procesado  es  convertido  en  audio  mediante  técnicas  de  síntesis  de  voz.  Existen  varios  224 \nImagen generada por Designer de Copilot con tecnología DALL-E 3.  225 \nmétodos para esto, incluyendo la concatenación de segmentos  de voz pregrabada y la síntesis paramétrica, pero los modelos  modernos a menudo utilizan redes neuronales profundas, como  las basadas en WaveNet o   Salida de Audio: El resultado final es un archivo de audio que  puede  ser  reproducido  en  cualquier  dispositivo  compatible.  Este  audio  puede  ser  utilizado  en  una  amplia  gama  de  aplicaciones, desde asistentes virtuales y lectores de pantalla,  hasta videojuegos y anuncios comerciales.  Aplicaciones  Accesibilidad: Ayuda a personas con discapacidades visuales o  dificultades de lectura a acceder a contenido escrito.  Asistentes Virtuales: Utilizado en dispositivos como Alexa de  Amazon, Google Assistant y Siri de Apple.  Educación: Facilita el aprendizaje de idiomas y la educación a  distancia mediante la lectura en voz alta de textos educativos.  Entretenimiento:  Creación  de  audiolibros,  personajes  de  videojuegos y narraciones en películas animadas.  Comercio  y  Marketing:  Generación  de  mensajes  de  voz  personalizados para atención al cliente y publicidad.  La tecnología  AI Text to Speech  sigue avanzando, con investigaciones  continuas  que  mejoran  la  naturalidad  y  expresividad  de  las  voces  generadas,  haciéndolas  cada  vez  más  indistinguibles  de  las  voces  humanas reales (introducción generada por Copilot con tecnología  GPT4).  A  continuación,  presentamos  varias  herramientas  txt2speech,  usando el primer párrafo de esta introducción.  Tacotron  226 \n4.3.1 TTSMaker  TTSMaker  es una herramienta gratuita de conversión de texto a voz  que brinda servicios de síntesis de voz y admite múltiples idiomas,  incluidos  inglés,  francés,  alemán,  español,  árabe,  chino,  japonés,  coreano,  vietnamita,  etc.,  así  como  varios  estilos  de  voz.  Puedes  usarlo para leer textos y libros electrónicos en voz alta, o descargar  archivos  de  audio  para  uso  comercial  (es  completamente  gratis).  Como  excelente  herramienta  TTS  gratuita,  TTSMaker  puede  convertir fácilmente texto a voz en línea.  Una vez copiado el texto, seleccionado el idioma y la voz, obtuvimos:  4.3.2 ElevenLabs  ElevenLabs  convierte texto a voz en línea de forma gratuita con un  generador de voz con IA. Crea voces naturales de IA al instante en  cualquier idioma, perfecto para creadores de videos, desarrolladores  y empresas.  227 \nEste modelo de síntesis de voz multilingüe de última generación, es  capaz de generar un habla realista en 29 idiomas.  Con el párrafo de la introducción y la voz de Brian, obtuvimos:  4.3.3 Free text to speech  Text to speech  usa la poderosa biblioteca de voz de Microsoft AI para  sintetizar  audio  de  lectura  único  que  se  parece  a  la  voz  de  una  persona real.  Nos ha sorprendido Text to speech, no sólo por ser 100% gratuito  sino, también, porque ingresamos el texto \"introducción\" en español,  y al seleccionar otro idioma, hace la traducción inmediata (con más de  330 voces de redes neuronales en 129 idiomas y variantes). He aquí  el texto en italiano:  Un  ejercicio  interesante  es  la  transcripción  de  audios,  usando  herramientas de inteligencia artificial; es decir, un proceso inverso al  que hicimos en este apartado. Si bien existen aplicaciones y algunas  API para esto, vamos a intentar hacerlo con una IA.  228 \n4.3.4 Genny  Genny  permite dar voz a los textos, eligiendo el idioma, género, tipo  de voz, etc. Además, permite la importación de textos de ficheros, el  realce de voz y disponer de un espacio en su repositorio.  Sin embargo, la descarga de ficheros de audio, necesita del plan de  pago.  Ello  se  puede  evitar  utilizando  un  capturador  de  audios  o  videos. También, se puede utilizar el editor gratuito Audacity.  A continuación, presentamos un audio leído en español de Colombia  sobre dos preguntas de un test.  Ahora incluimos el texto en el que la voz es leída en lengua inglesa.  4.3.5 Narakeet  Narakeet   ofrece  la  posibilidad  de  grabar  audios  y  descargarlos  directamente.  Da  la  opción  de  configurar  el  idioma,  volumen,  velocidad  de  reproducción y formato de salida.  La forma de entrada del texto puede ser mediante; archivo, dictado o  texto escrito.  Presentamos un ejemplo con voz masculina en español.  229 \nOtro ejemplo con voz femenina en inglés.  4.3.6 Murf  Murf   es  otra  aplicación  para  dar  voz  a  los  textos.  Permite  la  importación de textos a partir de ficheros, añadir música de fondo y  lo que es más especial, permite la edición de los audios. También  ofrece enlaces para compartir y embeber los audios.  En  la  segunda  generación  de  esta  aplicación  permite  también  la  edición de videos.  La descarga de ficheros de audio, necesita del plan de pago, pero tal y  como se ha comentado antes se puede capturar y guardar, tal y como  hemos realizado con los dos siguientes ejemplos.  En el primer caso incluimos la voz sin música de fondo.  En el segundo caso la incluimos con música de fondo.  230 \n4.3.7 Veed  Veed  es un editor de videos que entre otras aplicaciones permite dar  voz en diferentes estilos a textos escritos en múltiples idiomas. Lo  cual  es  muy  interesante  para  introducir  audios  en  videos,  pero  también  permite  crear  sólo  audios  e  incluso  mostrar  la  representación del sonido.  231 \n4.3.8 Runway  Runway  crea audio generativo a partir de texto. Después, si se desea  se puede introducir dicho audio en un avatar parlante.  232 \n4.3.9 Speechify  Speechify   entre  otras  muchas  utilidades,  permite  introducir  un  documento,  por  ejemplo  pdf  y  la  aplicación  realiza  su  lectura,  ofreciendo diferentes voces para los distintos idiomas. Otra opción  que es regulable es la velocidad de lectura.  En el siguiente ejemplo se muestra la lectura de la letra de la canción  \"Romance de Rosabella y Domingo\" de Celtas Cortos.  Como puede observarse la lectura es correcta y fluida. Es importante  que se introduzcan correctamente los signos de puntuación.  233 \n4.4 Speech to text  En  este  ejercicio,  probamos  con  varias  IA  enviando  la  siguiente  indicación:  Genera un código HTML5 que reproduzca un audio dado en formato  mp3 y vaya escribiendo lo que está diciendo el audio  La mayoría de las IA manifestaron no poder generar este código en  HTML, aduciendo que se requieren de otro tipo de librerías para ello.  Sin  embargo,  logramos  obtener  de  las  IA  ChatGPT  y  Gemini,  dos  opciones interesantes.  ChatGPT nos generó este  código , que logra transcribir el audio:  Lo curioso es que debemos activar el micrófono, pues es a través de  este medio es que se realiza la transcripción; para ello, se debe hacer  silencio, para que se capture el audio mp3 desde el micrófono.  234 \nPor su parte, Gemini (como otras IA), genera un  código  que define  una constante JS (transcript), a la cual le debemos asignar el texto  correspondiente al audio; es decir, no transcribe, pero simula que lo  hace:  Pese a que no es un transcriptor, es una buena alternativa para audio  libros o apartados en los que incluimos audios, tal como lo haremos  en el apartado 4.6.  Es importante configurar bien la variable  transcript.substring ,  que para el ejemplo pusimos 17 palabras por segundo.  235 \n4.4.1 Whisper  Whisper   es  una  aplicación  de  OpenAI  que  transcribe  a  texto  el  contenido de un fichero de audio o video o de una dirección web en  múltiples idiomas.  Mostramos  un  primer  ejemplo  mediante  la  canción    A  cantaros   de  Pablo Guerrero. Para ello indicamos el idioma español y damos el  valor de 0,5 a la temperatura.  Copiamos  literalmente  a  continuación  el  resultado  obtenido.  Podemos observar que es muy bueno, incluyendo incluso los signos  de puntuación.  Tu y yo muchacha estamos hechos de nubes, pero quien nos ata, pero  quien  nos  ata.  Dame  la  mano  y  vamos  a  sentarnos  bajo  cualquier  estatua, bajo cualquier estatua. Que es tiempo de vivir y de soñar y de  creer, que tiene que llover, tiene que llover, tiene que llover, que tiene  que llover a cántaros. Que tiene que llover, tiene que llover, tiene que  llover, que tiene que llover a cántaros. Estamos amasados con libertad  muchacha, pero ¿quién nos ata? Ten tu barro dispuesto, elegido tu sitio,  preparada tu marcha. Hay que doler de la vida hasta creer que tiene que  llover, tiene que llover, tiene que llover, que tiene que llover a cántaros.  Que tiene que llover, tiene que llover, tiene que llover, que tiene que  llover a cántaros. Ellos seguirán dormidos en sus cuentas corrientes de  seguridad. Planearán vender la vida y la muerte y la paz, les pongo diez  metros en cómodos plazos de felicidad. Pero tú y yo sabemos que hay  señales que anuncian que la siesta se acaba, que la siesta se acaba. Y que  una lluvia fuerte sin vio encima es claro, limpiará nuestra casa, limpiará  nuestra casa. Hay que doler de la vida hasta creer que tiene que llover,  tiene que llover, tiene que llover. Que tiene que llover a cántaros. Que  tiene que llover, tiene que llover, tiene que llover. Que tiene que llover a  cántaros.  236 \nEl segundo ejemplo lo realizamos con otra canción que presenta más  dificultad a la hora de realizar la transcripción. Se trata del  Romance  de Rosabella y Domingo  del grupo musical Celtas Cortos  Modificando  varios  parámetros  y  realizando  varios  intentos  conseguimos la siguiente transcripción:  Entre todas la más bella una flor de mi jardín Más bella que un querubín  y se llama Rosa Bella Rosa Bella sube y baja por las calles de la aldea Y su  cadera menea y enloquece a quien la ama Pero ella tiene un problema  que a fácil estará remata Y es que nunca confesaron que en verdad es un  muchachín Ay, ay, ay, tú me matas Ay, tu me matas Con tu mulata ¡No no  no! No sabe llevar la plaza a los viernes en el mercado Y solo compra  manzanas en el puesto de un mulato Él dedica sus sonrisas, él dedica sus  miradas Y se besan a escondidas y se aman al roca Este mulato tan  guapo se llama Domingo Pérez Es el más chulo del barrio, aquí vienen las  mujeres Ay, ay, ay, tú me matas, sí Con tu mulato Ay, ay, ay, tú me matas,  sí con tu volador Los papás de Rosabella la han casado con Domingo es  hijo de campesino, es un muchachito muy lindo nadie sabe que domingo  en verdad es una morada que vestida de chiquillo ha dado a todos la lata  y ya los padres felices respiran por fin tranquilos han encontrado salida  hasta el cruce de caminos ¡Ay, ay, ay! ¡Tú me matas! ¡Sí! ¡Con tu mulata!  ¡Ay, ay, ay! ¡Tú me matas! ¡Sí! ¡Con tu mulata! ¡Suscríbete al canal!  Podemos observar que hay menos signos de puntuación y algunas  diferencias con la letra correcta que mostramos a continuación:  Entre todas la más bella, una flor de mi jardín. Más bella que un querubín  y se llama Rosabella. Rosabella sube y baja por las calles de la aldea y su  cadera menea y enloquece a quien la ama. Pero ella tiene un problema  que a ojos vista la remata, y es que nunca ha confesado que en verdad es  un muchachín. ¡Ay ay ay tú me matas, sí, con tu mulata! ¡Ay ay ay tú me  matas, sí, con tu mulata! Rosabella va a la plaza los viernes en el mercado  237 \ny  sólo  compra  manzanas  en  el  puesto  de  un  mulato  A  él  dedica  sus  sonrisas, a él dedica sus miradas. Y se besan a escondidas y se aman en  luna clara. Este mulato tan guapo se llama Domingo Pérez. Es el más  chulo del barrio al que quieren las mujeres. ¡Ay ay ay tú me matas, sí, con  tu  mulata!  ¡Ay  ay  ay  tú  me  matas,  sí,  con  tu  mulata!  Los  papás  de  Rosabella  la  han  casado  con  Domingo.  Es  hijo  de  campesinos  un  muchachito  muy  lindo.  Nadie  sabe  que  Domingo  en  verdad  es  una  mulata que, vestida de chiquillo, ha dado a todos la lata. Y ya los padres  felices respiran por fin tranquilos: han encontrado salida a este cruce de  caminos.  4.4.2 Whisper-large de Hugging Face  Whisper-large  de  Hugging  Face .  Se  trata  del  mismo  modelo  comentado en el apartado anterior. Presenta la diferencia de que  permite la utilización del micrófono para introducir los audios.  Presentamos  un  ejemplo  de  una  pequeña  grabación  de  prueba  a  través del micrófono.  Sin  necesidad  de  ajustar  ningún  parámetro  de  configuración,  obtenemos la siguiente transcripción:  Vamos a hacer una pequeña prueba de grabación de audio para ver cuál  es su transcripción.  4.4.3 Transcripción de audios para subtítulos  Muchos  editores  de  video  y  creadores  de  avatares  que  tienen  integrada IA permiten la entrada de ficheros de sonido o la grabación  directa de voz a través del micrófono para la inclusión de subtítulos  en sus producciones audiovisuales.  238 \nEn el siguiente ejemplo, realizado con  CapCut , simplemente se añade  el video y automáticamente detecta el idioma y añade los subtítulos,  los cuales pueden ser editados y modificados si se desea.  A continuación, mostramos un avatar parlante realizado con  Vidnoz ,  en el que la propia aplicación ha creado los subtítulos a partir del  audio introducido.  239 \nIncluso podemos pedir a Vidnoz que se realice la traducción de un  determinado video al idioma deseado y el subtitulado del mismo de  forma simultánea.  Por ejemplo, partimos del video anterior del  Amo del Calabozo  con voz  en  español  y  subtítulos  en  castellano.  Pedimos  que  se  realice  la  traducción  al  inglés  americano,  incluyendo  los  subtítulos  en  este  idioma y añadiendo la sincronización labial para la nueva lengua.  De forma paralela, pedimos que realizara el mismo procedimiento,  pero  en  este  caso  realizando  la  traducción  y  el  subtitulado  en  portugués.  El resultado se presenta en los siguientes videos, en los que, en un  solo  paso,  automáticamente  han  generado  sendas  voces  y  sus  correspondientes subtítulos.  Hay  que  tener  en  cuenta  que  el  proceso  tarda  un  tiempo  y  éste  depende de la duración del video y de la cantidad de mensajes a  traducir.   240 \n241 \n4.5 Creando pistas musicales  Las herramientas de IA para la creación de pistas musicales son una  innovación emocionante en el mundo de la producción musical. Estas  herramientas    utilizan    algoritmos    avanzados    y    aprendizaje  automático para analizar grandes cantidades de datos musicales y  aprender patrones de composición. Con esta información, pueden  generar música nueva que puede ser tan variada y compleja como la  creada por humanos.  Una aplicación de estas herramientas, es la creación de pistas para  videos de YouTube, evitando problemas de derechos de autor que  pueden generar la cancelación del video.  Una primera herramienta es  Stable Audio , usada en el apartado 4.2.2:  Stable Audio permite crear pistas hasta de 3 minutos de duración.  242 \nEn  la  red,  además  de  Stable  Audio,  existen  varias  herramientas  creadoras de pistas musicales; sin embargo, la mayoría son de pago o  en su plan libre no habilitan la opción de descarga. A continuación,  presentamos  cuatro  opciones  que  puedes  usar,  crear  y  descargar  pistas musicales.  Haz clic sobre las imágenes para escuchar la pista musical.  soundverse  ofrece 1000 tokens en el plan libre.  Medios.io   (AI  Music  Studio)  es  un  generador  de  música  con  IA  gratuito   que  emplea  redes  neuronales  profundas  y  extensos  conjuntos  de  datos  musicales  para  crear  composiciones  originales  que abarcan varios géneros y estilos.  AIVA , en su plan libre, permite tres descargas mensuales.  Soundful ,  en  su  plan  libre,  permite  generaciones  ilimitadas  y  una  descarga mensual.  243 \n4.6 Clonación de voces  La clonación de voz se refiere al proceso de creación de una réplica  digital de la voz de una persona utilizando inteligencia artificial (IA) y  técnicas de aprendizaje automático. Esta tecnología puede analizar  grabaciones  de  una  persona  hablando  y  luego  generar  un  nuevo  discurso que suene como la persona, a menudo denominado discurso  sintético o síntesis de texto a voz (TTS). Es una herramienta útil para  fines educativos o de entretenimiento en las redes sociales, además  de generar audiolibros, locuciones o podcasts ( Podcastle ).  Al igual que las herramientas para creación de pistas musicales, son  muchas las aplicaciones de clonación de voz que son de pago o que en  su  plan  libre  deshabilitan  la  descarga.  Presentamos  tres  herramientas, con las cuales podrás practicar esta clonación.  4.6.1 PlayHT  Con  PlayHT  hemos clonado la voz de uno de los autores de este libro,  para reproducir un texto en español y otro en inglés.  244 \nUna  vez  obtenidos  los  archivos  de  audio,  usamos  el  modelo  de  Gemini  para  reproducirlos  e  irlos  transcribiendo.  Escucha  y  lee  el  primer audio:  Habrás notado que modificamos el estilo del transcriptor de audio,  algo sencillo que puedes hacer con lo aprendido de CSS en la primera  parte  del  libro  \"diseño  de  libros  interactivos\".  Observa  que,  en  el  código , hicimos modificaciones para centrar y ponerle borde al panel  de  control  del  audio,  cambiamos  colores  en  el  panel  de  texto  y  variamos la velocidad de transcripción del texto.  También,  habrás  notado  que  el  acento  en  el  audio  es  de  una  voz  inglesa, pues esta herramienta admite otros idiomas solo en el plan  de pago. Ahora, escucha el segundo audio con un texto en inglés.  245 \n4.6.2 Speechify  Speechify   incluye  detección  automática  del  idioma,  lo  cual  aprovechamos para realizar el mismo ejercicio anterior. En el plan de  prueba, entrega 10 créditos, de los cuales seis fueron usados para el  ejercicio. El plan de pago tiene un costo de 10 dólares mensuales,  incluyendo derechos de uso comercial y 100.000 caracteres por mes.  Escucha y lee el resultado obtenido:  246 \n4.6.3 Musicfy V2  Esta herramienta solo permite clonar nuestra voz o cualquiera otra,  que  no  esté  en  su  biblioteca,  con  un  plan  de  pago.  No  obstante,  podemos hacer un ejercicio usando una voz seleccionada entre más  de un centenar de voces que presenta  Musicfy V2 , tales como Travis  Scott, Taylor Swift, Ariana Grande o, para nuestro ejercicio, Donald  Trump. En el plan gratuito podemos hacer tres generaciones.  En la siguiente página, puedes escuchar a Donald Trump haciendo  una introducción a la herramienta \"Text to speech\".  247 \n248 \n4.7 Creando canciones con IA  Una  de  las  grandes  sorpresas,  en  el  mundo  musical,  son  las  IA  creadoras de canciones, de las cuales presentamos a Suno, udio y  Noisee,  esta  última  creadora  de  videos  de  canciones  con  letra  y  música de Suno.  4.7.1 Suno  Suno está construyendo un futuro en el que cualquiera  puede hacer buena música. Ya seas un cantante de ducha o  un artista de listas, rompemos barreras entre tú y la canción  que sueñas hacer. No se necesita ningún instrumento, sólo  imaginación. De tu mente a la música ( Suno ) .  Suno v3  El 21 de marzo de 2024, Suno lanza su tercera versión, modelo capaz  de producir música con calidad de radio, que permite crear canciones  completas hasta dos minutos de duración.  Suno está construyendo un futuro en el que cualquiera  puede crear música excelente. Ya sea que seas un cantante  de ducha o un artista de éxito, eliminamos las barreras entre  tú y la canción que sueñas con hacer. No se necesita ningún  instrumento, solo imaginación ( Toolify.ai ) .  Hay  dos  formas  de  crear  canciones.  La  primera  es  dando  una  descripción de la canción; la segunda forma, es activando el control  Custom Mode , permitiendo que ingresemos la letra, lo cual hicimos  con una letra generada por ChatGPT sobre IA musicales, incluyendo  como género musical el \"Salsa\", obteniendo la siguiente canción:  249 \n250 \nSorprende,  también,  el  video  generado  por  Suno,  pues  hace  la  transcripción de la canción, tal como lo tratamos de conseguir en el  apartado 4.4.  Suno v3.5  El 30 de mayo de 2024, Suno lanza la versión 3.5 para todos sus  usuarios:  Un  gran  agradecimiento  a  todos  los  miembros  Pro  y  Premier  que  utilizaron la versión 3.5 durante la última semana. ¡Hoy nos complace  anunciar que lanzaremos la versión 3.5 para todos! Ahora todos pueden:  Generar  canciones  de    4  minutos .  ¡Ahora  puedes  obtener  tu  canción completa en una sola generación! La cantidad de créditos  necesarios para crear una canción permanece sin cambios.  Crear extensiones de canciones de 2 minutos como máximo.  Experimente una estructura de canción y un flujo vocal mejorados.  Por defecto, las nuevas generaciones de canciones usan Suno v3.5, pero  en caso de que quieras usar otro modelo, recordaremos tu selección  para canciones futuras.  El 7 de junio lanza la herramienta  Song Radio :  ¡Presentamos Radio Canción! Ahora, con sólo hacer clic en...  de cualquier canción, puedes iniciar una Song Radio que  reproduce un flujo continuo de pistas similares. Sumérgete  en una experiencia auditiva perfecta adaptada a tus gustos.  En esta nueva versión, ingresamos la letra generada por ChatGPT  sobre IA musicales en género \"Salsa\", obteniendo la siguiente canción  de 4 minutos de duración:  251 \n252 \n4.7.2 Udio  El 10 de abril de 2024 es lanzada la herramienta de IA  udio  en  reddit :  ¡Hola del equipo de Udio!  ¡Nuestra  aplicación  de  creación  musical  acaba  de  lanzarse!  Mira  el  anuncio oficial aquí:  https://x.com/udiomusic/  Estamos ansiosos por escuchar lo que creas.  ¿Qué puedes hacer aquí  Comparte  tus  pistas:  ¿Tienes  una  canción  de  la  que  estás  orgulloso?  ¡Este  es  tu  escenario!  Publica  tus  últimas  creaciones  y  recibe  comentarios de otros entusiastas de Udio.  Discutir  características:  ¿Te  encanta  una  característica?  ¿Deseas  algo  nuevo? Hablemos de cómo funciona Udio para usted y cómo puede ser  aún mejor.  Consejos y trucos de audio: ¿Encontraste un buen truco o una solución  alternativa? Comparte tu sabiduría con la comunidad.  Ingresamos la letra generada por ChatGPT, pero Udio solo admitió el  primer  verso  y  el  estribillo,  pues  no  se  puede  exceder  de  350  caracteres. Usamos género country, obteniendo dos canciones de 32  segundos de duración cada una:  253 \n4.7.3 Noisee  noisee.ai ,  en  el  plan  libre,  permite  100  segundos  diarios  de  generación. Su uso es muy simple, basta con subir el archivo o enlace  de la canción. Subimos la primera canción de Suno, obteniendo:  En la versión web, solo genera un máximo de 30 segundos. La versión  en  Discord , admite hasta dos minutos y el cambio de la relación de  aspecto.  Ingresamos,  en  Discord,  el  enlace  a  una  canción  que  generamos con Suno, así:  music url: https://suno.com/song/... (bots cantores)  keywords: bots, music and audio  music segment: 00:00-01:00  aspect ratio: 9:16  Obteniendo el video que mostramos en la siguiente página:  254 \n255 \n256 \n4.8 Efectos de sonido  Otra de las posibilidades que ofrecen las IA es la creación de efectos  sonoros. En este apartado trataremos algunos de ellos, pero antes  presentaremos la galería de sonidos que utilizaremos, creadas a la  limón, con las IA ChatGPT-4o y Claude 3.5 Sonnet.  Esta  galería  permite  reproducir  un  número  ilimitado  de  audios,  indicando sus datos, incluyendo variados botones de navegación. Su  código se puede obtener a través del siguiente enlace:  código .  257 \n4.8.1 Generación de efectos  Mediante  IA  podemos  generar  multitud  de  efectos  diferentes  simplemente a través de un prompt. Probamos con el generador de  MyEdit .  En la siguiente galería sonora incluimos los prompts utilizados y los  audios generados. En esta aplicación por cada prompts genera tres  audios  de  salida.  Hemos  escogido  algunos  de  ellos  para  su  presentación.  258 \n4.8.2 Eliminación de voces  Otra  herramienta  de  audio  que  posee    MyEdit   consiste  en  la  eliminación de voces de una canción.  En  la  siguiente  serie  incluimos  las  mismas  tres  canciones  que  utilizamos en la presentación de la galería sonora, a las que hemos  eliminado la parte vocal.  Puede  oírse  que  el  resultado  es  bastante  bueno,  se  eliminan  totalmente las voces, aunque afecta ligeramente a la música.  259 \n4.8.3 Aislamiento vocal  Ahora veremos como  MyEdit  también puede eliminar la música y  aislar la voz.  Mostramos la correspondiente galería, utilizando como modelo las  mismas canciones anteriores, pero eliminando la música y dejando  sólo la voz.  El producto obtenido es bastante aceptable, aunque tiene margen de  mejora.  260 \n4.8.4 Separación de voz y música  Vocal Remover  permite aislar en una canción la música por un lado y  la voz por otro con una muy buena calidad.  Para ello, simplemente hay que subir el fichero con la canción con la  que  se  quiere  trabajar  y  pedir  que  se  procese.  Automáticamente  ofrecerá  dos  audios:  uno  con  parte  musical  y  otro  con  la  vocal.  Podremos escuchar uno, otro o los dos, regulando el volumen de cada  uno. Además, podremos descargar en formato mp3 los archivos de  cada uno de los audios generados.  A partir de la canción  A cántaros  de Pablo Guerrero, vamos a obtener  su música por un lado y su voz por otro.  Canción completa, música y voz:  Parte musical:  Parte vocal:  En la versión gratuita tiene una limitación de número de canciones  por dirección IP y tiempo.  261 \n4.8.5 Karaoke  Con    Vocal  Remover   puedes  hacer  un  karaoke  de  forma  sencilla,  partiendo de la música de una canción y tu propia voz.  Para ello, simplemente hay que subir el fichero con la música de la  canción  deseada  (previamente,  pudimos  haberle  quitado  la  voz  o  reducido  la  voz  del  cantante  original),  después  se  activará  la  grabación a través del micrófono y la canción sonará. Se irá grabando  tanto el sonido de la canción como de la voz.  Una vez finalizada la grabación, se abrirá un panel de edición que  permite modificar ciertas características de la canción de la canción  grabada, tal y como se presenta en la siguiente imagen:  Tras  la  finalización  de  la  edición,  se  nos  permite  descargar  el  correspondiente archivo. El resultado de nuestras pruebas se recoge  en el siguiente fichero de sonido:  262 \n4.8.6 Grabación y edición rápida  Vocal  Remover   ofrece  la  posibilidad  de  realizar  una  grabación  de  forma  rápida  y  sencilla  a  través  del  micrófono  y  después  editar  propiedades del sonido como su reverberación, ecualización y eco.  El  procedimiento  consiste  en  activar  el  micrófono  y  grabar.  Al  detener la grabación se pasa al menú de edición. Una vez finalizada la  grabación, se abrirá un panel de edición que permite modificar las  características antes mencionadas.  Tras  la  finalización  de  la  edición,  se  nos  permite  descargar  el  correspondiente archivo.  263 \n4.8.7 Cambio de velocidad y tono  Vocal Remover  también permite cambiar de forma instantánea y si se  desea simultáneamente el cambio de velocidad de reproducción y el  tono de nciación en diferentes  idiomas.  268 \n4.8.11 Cambio de cantante  LALAL.AI  puede cambiar al cantante de una determinada canción o  de una voz por otro de una relación.  Partimos de la canción  A cántaros  de Pablo Guerrero y realizamos  pruebas cambiando al solista por diferentes vocalistas.  Se  ha  tomado  una  canción  en  español  y  toda  la  lista  de  posibles  cambios que hay disponibles en la aplicación hasta ahora es en lengua  inglesa.  269 \n4.8.12 Distorsionador de voz  MyEdit  ofrece la posibilidad de dsistorsionar la voz de una persona  de diferentes formas.  En el ejemplo distorsionamos la voz del Amo del Calabozo de tres  formas  diferentes:  como  la  de  un  robot,  estilo  de  ardilla  y  efecto  astronauta.  Los efectos conseguidos son bastante buenos.  270 \n4.8.13 Eliminador de ruido y mejora de audio  MyEdit  puede eliminar el ruido de un audio, quitar el viento o mejorar  la calidad del sonido.  Mostramos un ejemplo en el que se presenta un audio con un claro  ruido de fondo y el audio resultante tras ser eliminado dicho ruido a  través de la aplicación.  La eliminación del ruido fue satisfactoria.  271 \n4.8.14 Transcripción  Runway  realiza transcripciones de audio o videos de manera sencilla,  realizando la correspondiente indicación temporal e incluso con la  posibilidad de traducirla a otros idiomas.  Presentamos un ejemplo en el que se presenta un audio con la voz del  Amo del Calabozo (también hemos probado con el video equivalente)  y mostramos el resultado de la transcripción.  272 \n4.9 Editores de audio  FlexClip  dispone de un editor de audios con múltiples funciones tales  como:  Grabar audio del sistema o del micrófono.  Recortador de audios.  Fusionador de audios.  Desvanecedor de sonido.  Control de la velocidad de reproducción.  Amplificación del sonido.  Inclusión del audio en un video.  Subtitulado del audio.  Biblioteca de sonidos.  Efectos sonoros.  En general, la mayoría de los editores de videos que cuentan con  inteligencia artificial, permiten la edición de audios y la aplicación de  efectos  sobre  los  mismos.  En  cuanto  a  su  exportación,  pueden  exportar el resultado en formato video o en formato audio.  273 \n\nCapítulo V Capítulo V  Juegos con ayuda de IA Juegos con ayuda de IA \n\n5.1 Introducción  Existe  un  gran  consenso  en  la  comunidad  científica  en  particular,  y  la  sociedad  en  general,  en  afirmar  que  la  aplicación  de  elementos  y  estructuras de juegos en entornos no lúdicos, utilizando metodologías de  aprendizaje  basado  en  juegos  (ABJ)  o  gamificación,  puede  resultar  beneficiosa  en  numerosas  áreas,  tales  como  la  educación,  la  salud,  la  mejora productiva de una organización, el ocio, etc. Prueba de esto es la  gran  cantidad  de  plataformas  y  recursos  de  esta  naturaleza  que  han  proliferado en los últimos tiempos ( Juegos didácticos. Proyecto AJDA ).  Introducir  un  juego  en  un  libro  interactivo  puede  transformar  la  experiencia de lectura al hacerla más participativa y entretenida. Los  juegos  pueden  aumentar  el  compromiso  del  lector,  facilitar  el  aprendizaje activo, y ofrecer diversión mientras refuerzan conceptos  clave. Además, fomentan el desarrollo de habilidades, profundizan la  inmersión en la historia, y aportan variedad, motivando a los lectores a  completar el libro. Por estos motivos, entre otros, en este capítulo  abordamos cómo integrar estos elementos en los libros interactivos  con la ayuda de la inteligencia artificial y de nuestra creatividad.  Como guía para este proceso proponemos seguir los siguientes pasos:  1.  Determinar  el  juego  y  su  mecánica.   Primero,  es  importante  definir  qué  tipo  de  juego  deseamos  y  cómo  queremos  que  funcione.  Si  se  trata  de  un  juego  nuevo,  necesitaremos  proporcionar más detalles que si se trata de un juego existente y  conocido.  La  inteligencia  artificial  nos  proporcionará  el  código  completo del juego solicitado.  2.  Escribir un prompt claro y completo.  La calidad de este prompt  tiene un impacto directo en la precisión y relevancia del código  generado.  Por  lo  tanto,  es  crucial  expresar  de  manera  clara  y  detallada qué se espera del código resultante. De esta manera, se  maximiza la probabilidad de obtener un código que satisfaga las  necesidades específicas del desarrollo web.  277 \n3.  Realizar pruebas del juego.  Debemos realizar pruebas del juego  en  un  navegador  web  para  verificar  su  funcionamiento  y  asegurarnos de que se ajusta a nuestras necesidades.  4.  Introducir  nuevas  sugerencias.   Basándonos  en  las  pruebas  realizadas, podemos introducir nuevos prompts para corregir y  mejorar el juego. La IA nos ofrecerá el código modificado, total o  parcialmente.  5.  Iterar hasta lograr el resultado deseado.  Repetir los pasos de  prueba y corrección hasta que el resultado satisfaga nuestras  expectativas. Dependiendo de la complejidad del juego y de la  calidad  de  la  IA,  este  proceso  puede  requerir  más  o  menos  trabajo. Es posible que la IA genere el juego deseado de forma  precisa  desde  el  principio,  o  que  necesitemos  realizar  varias  iteraciones  de  correcciones  y  ajustes  hasta  alcanzar  nuestro  objetivo.  Cuando el juego que se quiere realizar es sencillo, las IA suelen dar un  buen resultado de forma rápida. Sin embargo, cuando el proyecto es  más complejo o requiere añadir y ajustar detalles de manera gradual,  la  quinta  etapa  del  proceso  mencionado  puede  prolongarse  y,  en  ocasiones, volverse complicada. Por ello, partiendo de una versión  funcional  del  juego,  aquí  hay  una  serie  de  recomendaciones  que  pueden facilitar este proceso a veces laborioso:  Es  más  eficiente  proporcionar  instrucciones  cortas,  claras  y  concisas de forma secuencial, y verificar su efectividad a medida  que avanzamos.  Es recomendable guardar las diferentes versiones operativas  que se vayan creando, por si es necesario recurrir a ellas en  algún momento.  Si el código generado por la IA es muy extenso, puede ser útil  solicitarle que indique únicamente las modificaciones a realizar,  especialmente si son breves.  278 \nSi el cambio que se desea realizar es mínimo, como cambiar un  texto, un color, un tamaño, un margen o una posición, puede  resultar  más  rápido  modificar  el  código  manualmente  que  pedirle a la IA que lo haga.  Es  posible  que  al  solicitarle  modificaciones  a  la  IA,  algunas  funcionalidades dejen de operar correctamente o se produzcan  cambios no deseados. En ocasiones, es mejor retroceder a una  versión anterior que intentar corregir los errores.  Si una IA no logra resolver un problema en el código, podemos  recurrir a otra.  En la mayoría de los casos, la clave para resolver problemas  reside  en  la  correcta  formulación  de  los  prompts.  Existen  técnicas  para  generar  prompts  más  adecuados  utilizando  las  propias IA.  Para empezar, es crucial establecer el contexto o entorno en el  que estamos trabajando. Una vez que hayamos delimitado este  marco, la IA operará dentro de esos parámetros establecidos.  5.2 Del Pong de Atari al Pong de la IA  Iniciamos  con  este  popular  juego  por  lo  que  ha  significado  en  la  historia de los video juegos.  Según los historiadores, el primer juego electrónico se remonta a 1952,  fecha en la que Alexander Shafto Douglas, estudiante de doctorado de la  universidad de Cambridge, creó un 'tres en raya' ( Noughts and Crosses )  para la enorme computadora EDSAC2 ( Atari: La historia continúa ) 4 .  En 1958, William Higginbotham usó la pantalla de un osciloscopio,  para crear un juego que llamó  Tennis for two , sin lugar a dudas, se lleva  el  título  del  primer  videojuego  de  la  historia.  El  siguiente  video,  evidencia nuestra afirmación.  Véase en  https://www.dcs.warwick.ac.uk/~edsac/  un simulador de la EDSAC. 4  279 \nFigura 5.1 . Rudolf Heinrich Baer, foto de  Michael Schilling  en Wikimedia, CC BY-  SA 3.0).  Video 5.1 .  Tennis for Two - The Original Video Game , tomado del canal  The Dot Eaters  en  YouTube, Licencia Atribución de Creative Commons.  En 1966, Ralph Baer, reconocido  como    \"el    padre    de    los  videojuegos\",  estaba  convencido  de    darle    una    utilización  interactiva  a  los  televisores,  a  través de juegos como ping pong,  tenis y damas. En 1968 construye  una    consola    de    juegos    de  demostración, la Brown Box, que  se comercializa en 1972 a través  de un trato con el fabricante de  televisores,    Magnavox.    Nace,  entonces,  la  primera  consola  comercial  Maganavox  Odyssey  con  una  venta  cercana  a  las  100,000 unidades. En la siguiente  imagen animada, podemos observar parte de la publicidad de esta  consola. Se aprecia el uso de acetatos sobre el televisor para mostrar  el tipo de juego.  280 \nFigura 5.2 . Imagen creada a partir de un video de promoción de la Maganavox  Odyssey.  Nolan Bushnell asociado con Ted Dabney fundan una de las empresas  pioneras del sector: Atari, iniciando con el lanzamiento al mercado de  su primer gran éxito \"Pong\", juego diseñado por el ingeniero Al Alcorn  y  modificado  para  operar  con  monedas,  que  fue  probado  en  la  taberna de Andy Capp en Sunnyvale, CA.  \"La máquina está rota\"  Ese escueto mensaje convocó a Al Alcorn al  bar  de  Andy  Capp  en  Sunnyvale  dos  semanas después de que Alcorn instalara el  juego  de  arcade  Pong.  Su  receptor  de  monedas  de  cartón  de  leche  estaba  atascado  con  monedas  de  25  centavos  ( Computer History Museum ).  281 \nFigura 5.3 . Unidad original puesta en el bar de Andy Capp en Sunnyvale en 1972  ( Computer History Museum) .  El  tiempo  invertido  por  Al  Alcorn,  para  diseñar  Pong,  según  los  historiadores, fue de tres meses. Veamos, ahora, cómo una IA como  GPT-4o, en menos de un minuto, nos genera el código para un juego  tipo Pong.  Prompt : Dame el código HTML5 para un juego tipo pong, donde un  jugador es el computador y el otro el usuario del juego. El juego termina  cuando el ganador obtiene 5 puntos. Incluye un botón para iniciar el  juego.  Con  esta  indicación,  obtuvimos  el  juego  que  puedes  ver  en  este  enlace . Igual que Bushnell, notábamos que faltaba algo... ¡El sonido!,  así que le pedimos a la IA:  Prompt : Incluye sonido en las colisiones  Con  el  nuevo  código,  audios  descargados  de    https://universal-  soundbank.com  y un poco de ayuda del editor DescartesJS (escalado  282 \ndel juego), obtuvimos el juego que se aprecia en el siguiente objeto  interactivo:  El usuario juega moviendo la raqueta con el mouse.  5.3 Steve Jobs, Steve Wozniak y el Breakout  Obviamente, el Pong no podría permanecer para siempre en las salas  arcade, pues el gamer setentero ya empezaba a exigir nuevos juegos.  Pese a los esfuerzos de Atari al lanzar nuevos éxitos como Space Race  y Gotcha en 1973; Quadrapong y Tank en 1974, los consumidores  esperaban más... y surge el  Breakout  ( Atari: La historia continúa ).  Nolan  Bushnell  había  contratado  a  un  joven  hippie  “que  se  283 \npreocupaba  constantemente  por  demostrar  que  era  el  más  inteligente de la compañía” y por juntar dinero para llegar a la India  en un viaje iniciático, el cual no le caía bien a casi nadie en Atari, pero  a  Bushnell  sí.  Se  trataba  de  un  jovencísimo  Steve  Jobs,  un  temperamental, poco aseado y problemático nuevo talento de Atari  ( (https://codigoespagueti.com/ ).  Cuando Steve Jobs trabajaba en Atari, la empresa estaba  trabajando en la creación del juego de arcade Breakout , que  requería  80  circuitos  integrados  (CI).  Cuantos  menos  circuitos integrados hubiera, más barato sería producir los  juegos, por lo que Nolan Bushnell, presidente de Atari, le  ofreció a Jobs 750 para idear un diseño, con una bonificación  de 100 por cada circuito integrado que pudiera eliminarse  del diseño. Jobs le pidió ayuda a su amigo Steve Wozniak con  el desafío y se ofreció a dividir el 750, y durante cuatro días y  noches armaron un diseño que solo requería 30 circuitos  integrados. Bushnell le dio a Jobs su bono de 5000, que Jobs  \"dividió\" con Wozniak diciéndole que era un bono de 700,  dándole \"la mitad\", o 350. Woz estaba encantado, pero años  después descubrió la verdad.  Tal como estaban las cosas, el diseño de Wozniak redujo el  número de chips TTL a 42, pero los métodos de fabricación  de  Atari  no  pudieron  recrear  el  diseño  de  esa  manera,  y  finalmente  optaron  por  su  propio  diseño  que  incluía  alrededor de 100 chips TTL. La jugabilidad real parecía ser la  misma que la del diseño de Wozniak ( International Arcade  Museum ).  284 \nFigura 5.4 . Imagen animada del juego original Breakout (ver video en  https://www.arcade-museum.com/) .  Veamos cómo nos responde la IA con un juego tipo \"breakout\". A  ChatGPT le dimos la siguiente indicación:  Prompt:  Dame un JS para un juego tipo breakout que al terminar ponga  un botón que diga \"Otra vez\" y permita reiniciar el juego, los bloques del  breakout deben ser de diferentes colores y el número de vidas es cinco.  La IA nos dio el siguiente  código  y el resultado que presentamos a  continuación.  285 \nSin embargo, nuestro objetivo era desarrollar un juego con una serie  de características específicas que incluían la posibilidad de elegir el  número  de  vidas,  la  implementación  de  fases  con  dificultad  progresiva, la opción de obtener vidas adicionales, así como mejoras  tanto estéticas como de jugabilidad. Para lograr esto, llevamos a cabo  un proceso iterativo de ampliación, corrección y perfeccionamiento.  Este proceso nos permitió obtener el  código final  y el juego deseado.  286 \n5.4 Uso del  canvas  en HTML5  Habrás  notado,  en  los  códigos  anteriores,  la  presencia  de  la  etiqueta  <canvas> , que en cursos  de  diseño  de  libros  interactivos  no habíamos usado.  El  canvas  es  un  contenedor  o  lienzo  en el que podemos dibujar  gráficos  a  través  de  JavaScript.  Cada  canvas  tiene  un  ‘contexto’,  que es el objeto que realmente se  utiliza para dibujar. Los contextos  pueden  ser  bidimensionales  o  tridimensionales.  Pero,  que  sea  ChatGPT,  quien  nos  describa  y  explique esta etiqueta:  El    <canvas>   de  HTML5  es  un  contenedor  gráfico  que  permite  dibujar gráficos con JavaScript. Es  un lienzo donde puedes renderizar  gráficos bidimensionales (2D) y tridimensionales (3D).  Descripción del elemento  <canvas> .  El  <canvas>  es parte de HTML5 es muy versátil y se puede utilizar para  crear desde gráficos simples hasta complejas animaciones y juegos.  Estructura Básica  <canvas   id = \"myCanvas\"   width = \"300\"   height = \"150\" > </canvas>  287 \nid :  Un  identificador  único  para  el  elemento,  que  se  usa  para  referenciarlo en el script.  width : El ancho del canvas. Si no se especifica, el valor por defecto  es 300 píxeles.  height : La altura del canvas. Si no se especifica, el valor por defecto  es 150 píxeles.  Uso de  <canvas>  El    <canvas>   por  sí  solo  no  hace  nada.  Necesita  ser  manipulado  con  JavaScript para dibujar en él. Aquí tienes los pasos básicos:  1.  Referenciar el Elemento Canvas  Primero, se obtiene una referencia al elemento    <canvas>  en el  DOM:  const   canvas = document . getElementById ( 'myCanvas' );  2.  Obtener el Contexto de Renderizado  El contexto es el objeto que tiene los métodos y propiedades para  dibujar en el canvas. Para gráficos 2D:  const   context = canvas. getContext ( '2d' );  Una vez que tienes el contexto, puedes comenzar a dibujar. Por ejemplo,  para dibujar un Rectángulo:  context.fillStyle =  'green' ;  context. fillRect ( 10 ,   10 ,   100 ,   100   );  Podemos, además, dibujar, líneas, círculos, textos, o incluir imágenes,  rotaciones,  escalados,  gradientes,  etc.  Con  el  siguiente    código ,  se  obtiene el siguiente objeto:  288 \nUso en Aplicaciones  El  <canvas>  es una herramienta potente para desarrolladores web. Aquí  algunos de sus usos:  Gráficos  y  Visualizaciones :  Se  puede  usar  para  crear  gráficos  interactivos y visualizaciones de datos.  Juegos :  Muchos  juegos  2D  y  3D  se  crean  utilizando    <canvas>  debido a su flexibilidad y rendimiento.  Animaciones :  Se  pueden  crear  animaciones  fluidas,  incluyendo  movimientos y efectos visuales complejos.  Edición  de  Imágenes :  Herramientas  de  edición  de  imágenes  en  línea utilizan  <canvas>  para manipular y procesar imágenes.  Le  pedimos  a  ChatGPT  que  nos  generara  el  código  para  un  dodecaedro,  el  cual  lo  hizo  usando  contexto    2d   y,  además,  nada  parecido  a  un  dodecaedro  (ver  ejemplo  1  en  el  siguiente  objeto  interactivo.  289 \nPara el segundo ejemplo, le pedimos que cambiara el contexto a  3d ,  que generó usando la librería  three.min.js , pero tampoco parecía  un  dodecaedro.  Para  no  discutir  más  con  la  IA,  le  pedimos  un  octaedro (ver ejemplo 3).  290 \n5.5 Creando puzles con IA  Vamos  a  ilustrar  de  forma  práctica  los  pasos  comentados  en  la  introducción sobre el proceso de generación de un juego mediante  IA, utilizando específicamente Gemini 1.5 Pro.  1.  Determinar el juego y su mecánica.  Queremos un puzle de 25  piezas cuadradas (5x5) que se genere automáticamente a partir  de  una  imagen  dada.  Inicialmente,  el  puzle  debe  estar  desordenado.  2.  Escribir un prompt claro y completo.  En nuestro ejemplo el  prompt inicial introducido fue el siguiente:  Prompt:  Dame el código HTML5 para crear un puzle de 25 piezas  dada  una  imagen  de  1024x1024  pixeles,  el  puzle  debe  ser  funcional, es decir que las piezas se puedan arrastrar para armar el  puzle.  3.  Realizar  pruebas  del  juego.   Al  abrir  el  archivo  generado  index.html   observamos  que  el  puzle  está  perfectamente  ordenado,  lo  cual  no  tiene  sentido,  ya  que  el  juego  estaría  finalizado antes de empezar.  4.  Introducir  nuevas  sugerencias .  Por  ello,  proporcionamos  nuevas instrucciones a Gemini con el objetivo de solucionar los  problemas y mejorar el juego.  5.  Iterar hasta lograr el resultado deseado.  Repetimos los pasos 3  y 4 hasta que el juego quedó a nuestro gusto. Este proceso se  detalla en el interactivo que presentamos a continuación. En él,  se  indica  la  secuencia  de  interacciones  con  Gemini  y  los  resultados parciales obtenidos. Podemos apreciar las diferentes  dificultades que se presentan y las decisiones que se adoptan  para  solucionarlas,  alcanzando  así  nuestro  objetivo  final  (haz  clic en el botón que indica el fichero, para ver el resultado en  una pestaña aparte).  291 \n292 \nPodemos reutilizar este puzle cambiando la imagen por otra de las  mismas dimensiones, para obtener puzles diferentes. Con la ayuda  del editor DescartesJS, presentamos varios puzles:  293 \nVamos  a  dar  un  paso  más  y  aprovecharemos  el  modelo  de  puzle  creado  para  realizar  dos  variantes  más.  La  primera  consiste  en  utilizar  imágenes  de  diferentes  dimensiones.  La  segunda  es  que  dichas imágenes sean animadas.  En  el  siguiente  video  se  muestra  el  sencillo  procedimiento  para  realizar dicha adaptación, desarrollándose las siguientes cuestiones.  Forma de indicar el tamaño de la imagen en el código del puzle.  Actuación  para  indicar  el  tamaño  de  las  piezas  en  el  citado  código.  Indicación  de  la  imagen,  en  este  caso  animada,  que  se  va  a  utilizar para la realización del puzle.  Empleo de DescartesJS para que el puzle quede responsivo y  escalable.  A  continuación,  presentamos  una  galería  de  puzles  animados  con  imágenes de diferentes dimensiones.  294 \nPartiendo  del  código  generado  para  el  puzle  por  intercambio  de  piezas, se pide a la IA que realice una modificación para obtener una  variante de puzle por rotación de piezas.  295 \nAhora, pon las piezas ordenadas pero rotadas 90, 180 o 270 grados. Al  hacer clic sobre las piezas, están rotarán 90 grados por cada clic, hasta  que en la posición correcta.  296 \n297 \nEn el interactivo de la página anterior se resume el periplo para crear  un puzle con piezas móviles contra reloj. En el siguiente interactivo se  muestran variantes del mismo.  298 \n5.6 Juego  Escape Room  Por Juan Jorge Becerra Rodríguez  Llevo  algunos  años  haciendo  escape  room  educativos,  de  manera  presencial, en la biblioteca y en la radio del instituto; aunque siempre  he deseado hacer algo que sea mezcla de físico y virtual, le llamo  escape room híbrido.  He  visto  una  oportunidad  de  utilizar  la  inteligencia  artificial  para  intentar crear ese escape room híbrido, de manera que las personas  que  participen  tengan  un  juego  en  el  que  busquen  pistas  en  una  habitación,  y  tengan  que  introducir  las  posibles  respuestas  en  un  ordenador,  móvil  o  Tablet,  cada  introducción  correcta  le  dará  un  mensaje o sugerencias para el siguiente puzle, hasta que se alcanza la  salida o el objetivo marcado.  El objetivo de un escape room es escapar de un lugar en el que estás  encerrado por algún motivo. Para poder salir tienes que resolver los  retos que te proponen, conseguir la clave o la contraseña de la puerta  o candado y lograr salir. El juego está ambientado en algún lugar,  como un laboratorio de química, una biblioteca o un museo.  Después de probar Gemini, Copilot y ChatGPT, me he decantado por  ChatGPT, que es la que más se ha acercado a lo que yo quería.  Prompt 1  Para empezar, usé el siguiente prompt:  Dame  el  código  CSS,  JS,  HTML  de  un  juego  de  escape  room  con  5  habitaciones, cuenta regresiva puntuación.  La  respuesta  fueron  tres  archivos:  index.html,  style.css  y  script.js,  299 \nEscape Room \"Der Henker\" en  Anbieter House of Tales  en Berlín (imagen de von  Freeden & Oberbeck GmbH en  Wikimedia , CC BY-SA 4.0). \ncon  estos  archivos  implementados  obtuve  un  juego  con  una  sola  página en inglés y los botones al tocarlos se repetían y la cuenta  regresiva estaba solo en segundos y no ocurría nada.  Código Código        Juego Juego  Prompt 2  El siguiente prompt fue:  Por favor poner la cuenta regresiva en minutos, el texto y puzles en  español  Con  la  respuesta  obtenida,  conseguí  que  la  cuenta  regresiva  estuviera en minutos y segundos y el juego en español; pero solo eso.  Código Código        Juego Juego  Prompt 3  Decidí  ir  primero  al  colorido  de  cada  habitación  para  después  arreglar el funcionamiento. Escribí el siguiente prompt:  301 \nPuedes poner de fondo tonos marrones, poner algún ejemplo de puzles.  La respuesta: ¡Claro! A continuación, he actualizado el código para  incluir un fondo con tonos marrones y he añadido ejemplos de puzles  para cada habitación.  Quedó muy bonito, pero no tenía funcionalidad y las preguntas no se  visualizaban.  Código Código        Juego Juego  Prompt 4  El siguiente prompt:  No se sabe cuál es la pregunta en los puzles  La respuesta: ¡Entendido! Para que las preguntas de los puzles sean  claras, he ajustado el código para mostrar las preguntas directamente  en  la  página  y  permitir  al  usuario  ingresar  sus  respuestas  en  un  campo de texto.  Aquí  el  escape  room  quedó  funcionando,  sin  necesidad  de  que  expusiera  un  prompt  específico  para  la  funcionalidad,  pero  las  302 \npreguntas en cada habitación, se visualizaban en la misma pantalla  dos veces.  Código Código        Juego Juego  Prompt 5  Decidí  insistir  con  el  tono  marrón  del  escape  room.  Para  ello  el  siguiente prompt:  Puede ambientar el escape con tonos marrones  La respuesta: ¡Claro! Vamos a ambientar el escape room con tonos  marrones para darle una sensación más acogedora y temática.  Código Código        Juego Juego  Prompt 6  Por variar un poco, me metí con las preguntas de los puzles (en los  escape room a los retos le llaman puzles); para ello, el prompt:  que la primera pregunta sea ¿Dónde nació Miguel de Cervantes, siendo  la respuesta Alcalá de Henares  La  respuesta:  ¡Claro!  Vamos  a  actualizar  la  primera  pregunta  del  juego de Escape Room para que sea sobre el lugar de nacimiento de  Miguel  de  Cervantes.  También  ajustaremos  la  respuesta  correspondiente.  La primera pregunta cambió a la que yo sugerí, pero seguía viéndose  dos veces cada pregunta.  Código Código        Juego Juego  303 \nUna sala de escape en vivo en 4A Colliergate, York (foto de Malcolmxl5 en  Wikimedia , CC BY-SA 4.0). \nPrompt 7  Quise ambientar el escape room en un laboratorio de química; para  ello, el prompt:  Ha quedado muy bien, pero le falta el escenario, que es un laboratorio de  química.  La respuesta: Para ambientar el escape room en un laboratorio de  química, podemos añadir algunos elementos visuales en el CSS, así  como imágenes de fondo y detalles que den la impresión de estar en  dicho entorno. Aquí te dejo el código actualizado.  Código Código        Juego Juego  Prompt 8  Todavía  se  repetían  las  preguntas,  y  el  final  era  un  poco  soso  si  ganabas y conseguías escapar, así que escribí lo siguiente:  Necesito que se note más que ha escapado el jugador  La  respuesta:  Para  hacer  que  se  note  más  cuando  el  jugador  ha  305 \nescapado,  podemos  añadir  efectos  visuales  y  un  mensaje  más  destacado. Vamos a modificar el CSS y el JavaScript para mostrar una  animación  y  un  mensaje  grande  y  colorido  cuando  el  jugador  complete el juego.  Código Código        Juego Juego  Figura 5.5 . Enygma, juegos de escape en Bruselas, Bélgica (foto de Erik.kueng en  Wikimedia , CC BY-SA 4.0).  Prompt 9  El juego seguía con las preguntas repetidas en cada puzle, aunque al  final si ganabas salía un texto animado felicitándote.  Una vez comenzado el juego debería desaparecer el botón comenzar el  juego  Respuesta: para ocultar el botón de \"Comenzar Juego\" una vez que el  juego  ha  comenzado,  podemos  añadir  una  línea  de  código  en  la  306 \nfunción  startGame  que cambie el estilo del botón para que no se  muestre. También haremos que el botón vuelva a aparecer si el juego  termina (ya sea por victoria o por agotamiento del tiempo).  Código Código        Juego Juego  Prompt 10  El botón desaparecía cuando empezaba el juego, pero las preguntas  seguían repetidas. Así que propuse otro prompt:  la pregunta se repite  Respuesta: para asegurarnos de que el mensaje de la habitación no se  repita, corregiremos el código en la función  updateRoom . Vamos a  asegurarnos  de  que  el  mensaje  \"¡Has  escapado!\"  solo  se  muestre  cuando el jugador haya completado todas las habitaciones.  No solucionó el problema de las preguntas repetidas, creo que el  prompt no estaba claro.  Código Código        Juego Juego  Prompt 11  Decidí un prompt más claro:  No  se  ha  solucionado,  las  preguntas  de  cada  habitación  se  repiten,  puedes ponerla solo una vez.  La  respuesta:  para  asegurarnos  de  que  las  preguntas  de  cada  habitación no se repitan en la visualización, debemos modificar la  estructura HTML y la lógica en JavaScript para manejar las preguntas  correctamente. Aquí está la versión actualizada del código con los  cambios necesarios.  307 \nAhora si que funcionó, las preguntas ya no se repetían.  Código Código        Juego Juego  Figura 5.6 . Un rompecabezas en  Escape Quest  (Bethesda), Estados Unidos, 2019 (foto  de Hudson Bloom en  Wikimedia , CC BY-SA 4.0).  Prompt 12  Una vez solucionado el problema, le pedí un fondo musical:  Va de maravilla, puedes poner música de fondo, cuando comienza el  juego.  La respuesta: ¡Claro! Para agregar música de fondo que comience a  reproducirse cuando inicie el juego, puedes seguir estos pasos:  1.  **Añadir el archivo de música**: Asegúrate de tener un archivo  de música (por ejemplo, 'background.mp3') en tu proyecto.  308 \n2.  **Agregar  un  elemento  de  audio  en  HTML**:  Incluye  un  elemento de audio en el HT
