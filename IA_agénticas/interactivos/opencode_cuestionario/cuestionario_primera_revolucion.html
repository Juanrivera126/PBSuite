<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuestionario: La Primera Revolución Industrial</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; background:#f5f5f5; color:#222; }
  h1 { text-align:center; }
  .card { background:#fff; border-radius:10px; padding:1.2rem 1.5rem; margin-bottom:1.2rem; box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .question { font-weight:600; margin-bottom:.8rem; }
  .opt { display:block; margin:.35rem 0; padding:.55rem .8rem; border:1px solid #ccc; border-radius:8px; cursor:pointer; }
  .opt:hover { background:#eef; }
  .opt.correct { background:#d4f8d4; border-color:#5cb85c; }
  .opt.wrong { background:#f8d4d4; border-color:#d9534f; }
  button { display:block; margin:1.5rem auto; padding:.7rem 1.6rem; font-size:1rem; border:none; border-radius:8px; background:#3367d6; color:#fff; cursor:pointer; }
  #result { text-align:center; font-size:1.3rem; font-weight:700; margin-top:1rem; }
</style>
</head>
<body>
<h1>La Primera Revolución Industrial</h1>
<div id="quiz"></div>
<button id="check">Comprobar respuestas</button>
<div id="result"></div>

<script>
const questions = [
  {
    q: "¿En qué país comenzó la Primera Revolución Industrial?",
    options: ["Francia", "Reino Unido (Gran Bretaña)", "Alemania", "Estados Unidos"],
    answer: 1
  },
  {
    q: "¿En qué siglo aproximadamente tuvo lugar la Primera Revolución Industrial?",
    options: ["Siglo XV", "Siglo XVII", "Siglo XVIII (finales)", "Siglo XX"],
    answer: 2
  },
  {
    q: "¿Cuál fue el principal combustible que impulsó la nueva maquinaria?",
    options: ["Petróleo", "Carbón", "Gas natural", "Electricidad"],
    answer: 1
  },
  {
    q: "La máquina de vapor fue perfeccionada por...",
    options: ["James Watt", "Henry Ford", "Thomas Edison", "Isaac Newton"],
    answer: 0
  },
  {
    q: "¿Qué invento revolucionó la industria textil al hilar algodón mecánicamente?",
    options: ["La imprenta", "La spinning jenny (hiladora Jenny)", "El telar manual", "La locomotora"],
    answer: 1
  },
  {
    q: "¿Cuál fue una consecuencia social principal de la industrialización?",
    options: ["El fin de las ciudades", "El surgimiento de la clase obrera (proletariado)", "La desaparición de la agricultura", "La igualdad de salarios"],
    answer: 1
  },
  {
    q: "El primer ferrocarril de pasajeros importante se desarrolló en...",
    options: ["Francia", "Estados Unidos", "Reino Unido", "Italia"],
    answer: 2
  },
  {
    q: "¿Qué revolución acompañó a la industrial (en la agricultura)?",
    options: ["Revolución digital", "Revolución agrícola", "Revolución francesa", "Revolución rusa"],
    answer: 1
  },
  {
    q: "El paso de la producción artesanal a...",
    options: ["La producción en masa en fábricas", "La producción doméstica", "La economía de trueque", "La ganadería nómada"],
    answer: 0
  },
  {
    q: "¿Qué factor fue clave para que Gran Bretaña liderara la revolución?",
    options: ["Falta de colonias", "Abundancia de carbón y capital, y colonias para mercados", "Clima tropical", "Aislamiento comercial"],
    answer: 1
  }
];

const quiz = document.getElementById('quiz');
questions.forEach((item, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="question">${i+1}. ${item.q}</div>`;
  item.options.forEach((opt, j) => {
    const label = document.createElement('label');
    label.className = 'opt';
    label.innerHTML = `<input type="radio" name="q${i}" value="${j}"> ${opt}`;
    card.appendChild(label);
  });
  quiz.appendChild(card);
});

document.getElementById('check').addEventListener('click', () => {
  let score = 0;
  questions.forEach((item, i) => {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    const opts = document.querySelectorAll(`input[name="q${i}"]`);
    opts.forEach((inp) => {
      const lab = inp.parentElement;
      lab.classList.remove('correct','wrong');
      if (+inp.value === item.answer) lab.classList.add('correct');
    });
    if (selected && +selected.value === item.answer) {
      score++;
    } else if (selected) {
      selected.parentElement.classList.add('wrong');
    }
  });
  document.getElementById('result').textContent = `Puntuación: ${score} / ${questions.length}`;
});
</script>
</body>
</html>
