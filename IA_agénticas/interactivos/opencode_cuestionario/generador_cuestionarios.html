<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Cuestionarios (OpenRouter)</title>
<style>
  :root { --bg:#0f1220; --card:#1b2036; --accent:#6c8cff; --ok:#37d67a; --err:#ff5d5d; }
  body { font-family:system-ui,Segoe UI,sans-serif; background:var(--bg); color:#e8ebf5; max-width:760px; margin:2rem auto; padding:0 1rem; }
  h1 { text-align:center; }
  .card { background:var(--card); border-radius:12px; padding:1.2rem 1.4rem; margin-bottom:1.2rem; box-shadow:0 4px 14px rgba(0,0,0,.3); }
  label { display:block; margin:.7rem 0 .3rem; font-weight:600; }
  input, select, textarea { width:100%; padding:.6rem .7rem; border-radius:8px; border:1px solid #2c3358; background:#11152a; color:#e8ebf5; box-sizing:border-box; }
  button { margin-top:1rem; width:100%; padding:.8rem; font-size:1rem; font-weight:700; border:none; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .opt { display:block; margin:.3rem 0; padding:.55rem .8rem; border:1px solid #2c3358; border-radius:8px; cursor:pointer; }
  .opt:hover { background:#232a4d; }
  .opt.correct { background:#1f4d33; border-color:var(--ok); }
  .opt.wrong { background:#4d1f1f; border-color:var(--err); }
  #status { text-align:center; margin-top:1rem; min-height:1.4rem; }
  #result { text-align:center; font-size:1.3rem; font-weight:700; margin-top:1rem; }
  pre { background:#0a0d1c; padding:.8rem; border-radius:8px; overflow:auto; font-size:.8rem; }
</style>
</head>
<body>
<h1>Generador de Cuestionarios</h1>

<div class="card">
  <label for="apikey">API Key de OpenRouter</label>
  <input type="password" id="apikey" placeholder="sk-or-...">

  <label for="tema">Tema del cuestionario</label>
  <input type="text" id="tema" placeholder="Ej: La primera revolución industrial">

  <label for="model">Modelo</label>
  <select id="model">
    <option value="deepseek/deepseek-v4-flash-0731">deepseek/deepseek-v4-flash-0731</option>
    <option value="google/gemini-3.5-flash-lite">google/gemini-3.5-flash-lite</option>
    <option value="tencent/hy3">tencent/hy3</option>
  </select>

  <label for="num">Número de preguntas (4–10)</label>
  <select id="num">
    <option>4</option><option>5</option><option>6</option><option>7</option>
    <option>8</option><option>9</option><option>10</option>
  </select>

  <button id="generar">Generar cuestionario</button>
  <div id="status"></div>
</div>

<div id="quiz"></div>
<div id="result"></div>

<script>
const $ = (id) => document.getElementById(id);

function extraerJSON(texto) {
  const m = texto.match(/```(?:json)?\s*([\s\S]*?)```/);
  const raw = m ? m[1] : texto;
  const inicio = raw.indexOf('[');
  const fin = raw.lastIndexOf(']');
  if (inicio !== -1 && fin !== -1) return raw.slice(inicio, fin + 1);
  const i2 = raw.indexOf('{');
  const f2 = raw.lastIndexOf('}');
  if (i2 !== -1 && f2 !== -1) return raw.slice(i2, f2 + 1);
  return raw;
}

function construirPrompt(tema, num) {
  return `Genera un cuestionario de ${num} preguntas de selección múltiple sobre el tema: "${tema}".
Responde ÚNICAMENTE con un arreglo JSON válido, sin texto adicional, con este formato:
[
  {
    "q": "Texto de la pregunta",
    "options": ["Opción A","Opción B","Opción C","Opción D"],
    "answer": 0
  }
]
Donde "answer" es el índice (0-3) de la opción correcta. Las preguntas y opciones deben estar en español.`;
}

async function llamarOpenRouter(apiKey, model, prompt) {
  const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + apiKey
    },
    body: JSON.stringify({
      model: model,
      messages: [
        { role: 'user', content: prompt }
      ]
    })
  });
  if (!res.ok) {
    const detalle = await res.text();
    throw new Error('HTTP ' + res.status + ': ' + detalle);
  }
  const data = await res.json();
  return data.choices[0].message.content;
}

function renderizarCuestionario(questions) {
  const quiz = $('quiz');
  quiz.innerHTML = '';
  questions.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="question" style="font-weight:600;margin-bottom:.6rem">${i+1}. ${item.q}</div>`;
    item.options.forEach((opt, j) => {
      const label = document.createElement('label');
      label.className = 'opt';
      label.innerHTML = `<input type="radio" name="q${i}" value="${j}"> ${opt}`;
      card.appendChild(label);
    });
    quiz.appendChild(card);
  });

  const btn = document.createElement('button');
  btn.textContent = 'Comprobar respuestas';
  btn.addEventListener('click', () => {
    let score = 0;
    questions.forEach((item, i) => {
      const selected = document.querySelector(`input[name="q${i}"]:checked`);
      const opts = document.querySelectorAll(`input[name="q${i}"]`);
      opts.forEach((inp) => {
        const lab = inp.parentElement;
        lab.classList.remove('correct','wrong');
        if (+inp.value === item.answer) lab.classList.add('correct');
      });
      if (selected && +selected.value === item.answer) score++;
      else if (selected) selected.parentElement.classList.add('wrong');
    });
    $('result').textContent = `Puntuación: ${score} / ${questions.length}`;
  });
  quiz.appendChild(btn);
}

$('generar').addEventListener('click', async () => {
  const apiKey = $('apikey').value.trim();
  const tema = $('tema').value.trim();
  const model = $('model').value;
  const num = parseInt($('num').value, 10);

  if (!apiKey) { $('status').textContent = '⚠ Introduce tu API Key.'; return; }
  if (!tema) { $('status').textContent = '⚠ Introduce un tema.'; return; }

  $('generar').disabled = true;
  $('status').textContent = 'Generando...';
  $('result').textContent = '';
  try {
    const prompt = construirPrompt(tema, num);
    const contenido = await llamarOpenRouter(apiKey, model, prompt);
    const json = extraerJSON(contenido);
    const questions = JSON.parse(json);
    if (!Array.isArray(questions) || questions.length === 0) throw new Error('El modelo no devolvió preguntas válidas.');
    renderizarCuestionario(questions);
    $('status').textContent = '✅ Cuestionario generado.';
  } catch (e) {
    $('status').textContent = '❌ Error: ' + e.message;
  } finally {
    $('generar').disabled = false;
  }
});
</script>
</body>
</html>
